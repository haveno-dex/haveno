payment.blik.info.account=Para usar BLIK necesita una cuenta bancaria en Polonia con una aplicación de banca móvil compatible con BLIK.\n\nEl comprador de XMR paga generando un código BLIK y enviándolo al vendedor de XMR a través del chat de intercambio, por lo que ambas partes deben estar en línea para completar el pago.
payment.blik.info.buyer=Para pagar, genere un código BLIK en su aplicación de banca móvil y envíelo al vendedor de XMR a través del chat de intercambio.\n\nLos códigos BLIK solo son válidos durante 2 minutos, así que asegúrese de que el vendedor responde en el chat de intercambio antes de generar el código.
payment.blik.info.seller=El comprador de XMR le enviará un código BLIK a través del chat de intercambio.\n\nLos códigos BLIK solo son válidos durante 2 minutos, así que use el código para cobrar el pago en cuanto lo reciba.

payment.vippsMobilePay.info.account=Para usar Vipps MobilePay necesita una cuenta registrada con su número de móvil en Noruega, Dinamarca o Finlandia.\n\nNo se pueden enviar pagos entre países, por lo que ambas partes deben tener cuentas en el mismo país. La moneda del intercambio depende del país de su cuenta.
payment.vippsMobilePay.info.buyer=Envíe el pago únicamente al número de móvil indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.vippsMobilePay.info.seller=Compruebe que el pago recibido en su aplicación de Vipps o MobilePay coincide con el número de móvil y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.twint.info.account=Para usar TWINT necesita una cuenta registrada con su número de móvil en Suiza.\n\nLos pagos con TWINT solo se pueden enviar entre cuentas TWINT suizas, por lo que ambas partes deben usar TWINT. La moneda del intercambio es CHF.
payment.twint.info.buyer=Envíe el pago únicamente al número de móvil indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.twint.info.seller=Compruebe que el pago recibido en su aplicación de TWINT coincide con el número de móvil y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.nip.info.account=Para usar NIP necesita una cuenta bancaria nigeriana o un monedero de dinero móvil como OPay o PalmPay.\n\nLos pagos se envían por transferencia bancaria instantánea NIP al número de cuenta de 10 dígitos del destinatario en su banco o proveedor de monedero. La moneda del intercambio es NGN.
payment.nip.info.buyer=Envíe el pago únicamente al número de cuenta y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la comprobación del nombre de la transferencia coincide con el nombre del titular de la cuenta del vendedor.
payment.nip.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero coincide con el número de cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.pagoMovil.info.account=Para usar Pago Móvil necesita una cuenta bancaria venezolana con Pago Móvil activado, registrada con su número de móvil, cédula y banco.\n\nLos pagos se envían por transferencia interbancaria al número de móvil, la cédula y el banco indicados. La moneda del intercambio es VES.
payment.pagoMovil.info.buyer=Envíe el pago únicamente al número de móvil, la cédula y el banco indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su banco coincide con el nombre del titular de la cuenta del vendedor.
payment.pagoMovil.info.seller=Compruebe que el pago recibido en su aplicación bancaria coincide con el número de móvil, la cédula y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.qris.info.account=Para usar QRIS / BI-FAST necesita una cuenta bancaria indonesia o un monedero electrónico que pueda recibir transferencias instantáneas.\n\nLos pagos se envían por transferencia instantánea BI-FAST al número de cuenta del destinatario en su banco o monedero electrónico, o escaneando el código QRIS del destinatario. La moneda del intercambio es IDR.
payment.qris.info.buyer=Envíe el pago únicamente al número de cuenta y al banco o monedero electrónico indicados en la cuenta del vendedor de XMR, o a un código QRIS que el vendedor comparta con usted en el chat de intercambio, y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.qris.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero electrónico coincide con el número de cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.papara.info.account=Para usar Papara / FAST necesita una cuenta de Papara o una cuenta bancaria turca que pueda recibir transferencias instantáneas.\n\nLos pagos se envían al número de Papara, al IBAN turco o al número de móvil de dirección fácil FAST (Kolay Adres) del destinatario. La moneda del intercambio es TRY.
payment.papara.info.buyer=Envíe el pago únicamente al número de cuenta o IBAN y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.papara.info.seller=Compruebe que el pago recibido en su aplicación de Papara o bancaria coincide con los datos de la cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.raast.info.account=Para usar Raast / Easypaisa / JazzCash necesita una cuenta bancaria o un monedero móvil pakistaní que pueda recibir transferencias instantáneas.\n\nLos pagos se envían al ID de Raast (número de móvil registrado), al número de móvil del monedero o al IBAN pakistaní del destinatario. La moneda del intercambio es PKR.
payment.raast.info.buyer=Envíe el pago únicamente al número de móvil o IBAN y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.raast.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero coincide con los datos de la cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.paynow.info.account=Para usar PayNow / FAST necesita una cuenta bancaria o un monedero electrónico de Singapur que pueda recibir transferencias instantáneas.\n\nLos pagos se envían al identificador PayNow del destinatario: un número de móvil registrado o su NRIC/FIN. La moneda del intercambio es SGD.
payment.paynow.info.buyer=Envíe el pago únicamente al número de móvil o NRIC/FIN y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.paynow.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero coincide con los datos de la cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.wero.info.account=Para usar Wero necesita la aplicación de Wero o la de un banco participante con su número de móvil registrado en Alemania, Francia o Bélgica.\n\nLos pagos se envían al número de móvil registrado del destinatario, introducido en formato internacional (p. ej. +49). La moneda del intercambio es EUR.
payment.wero.info.buyer=Envíe el pago únicamente al número de móvil indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.wero.info.seller=Compruebe que el pago recibido en su aplicación de Wero o bancaria coincide con el número de móvil y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.fps.info.account=Para usar FPS (Faster Payment System) necesita una cuenta bancaria de Hong Kong o un monedero electrónico como AlipayHK o WeChat Pay HK.\n\nLos pagos se envían al identificador FPS del destinatario: un número de móvil registrado, un ID de FPS o una dirección de correo electrónico. La moneda del intercambio es HKD.
payment.fps.info.buyer=Envíe el pago únicamente al número de móvil, ID de FPS o correo electrónico y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.fps.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero coincide con los datos de la cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.duitnow.info.account=Para usar DuitNow necesita una cuenta bancaria malasia o un monedero electrónico como Touch 'n Go, GrabPay o Boost.\n\nLos pagos se envían al identificador DuitNow del destinatario: un número de móvil registrado o su NRIC. La moneda del intercambio es MYR.
payment.duitnow.info.buyer=Envíe el pago únicamente al número de móvil o NRIC y al banco o monedero indicados en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.duitnow.info.seller=Compruebe que el pago recibido en su aplicación bancaria o de monedero coincide con los datos de la cuenta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.mbway.info.account=Para usar MB WAY necesita la aplicación MB WAY activada con su número de móvil portugués.\n\nLos pagos se envían al número de móvil registrado del destinatario. La moneda del intercambio es EUR.
payment.mbway.info.buyer=Envíe el pago únicamente al número de móvil indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.mbway.info.seller=Compruebe que el pago recibido en su aplicación MB WAY coincide con el número de móvil y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.paypay.accountId=Número de móvil o ID de PayPay
payment.paypay.info.account=Para usar PayPay necesita una cuenta de PayPay registrada en Japón.\n\nLos pagos con PayPay solo se pueden enviar entre usuarios de PayPay, por lo que ambas partes deben usar PayPay. Los pagos se envían al número de móvil registrado o al ID de PayPay del destinatario. La moneda del intercambio es JPY.
payment.paypay.info.buyer=Envíe el pago únicamente al número de móvil o ID de PayPay indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.paypay.info.seller=Compruebe que el pago recibido en su aplicación de PayPay coincide con el número de móvil o ID de PayPay y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.sbp.info.account=Asegúrese de incluir el número de teléfono vinculado a su cuenta bancaria para transferencias SBP (Sistema de Pagos Rápidos).
payment.sbp.info.buyer=Envíe el pago por SBP únicamente al número de teléfono indicado en la cuenta de Haveno del vendedor de XMR.
payment.sbp.info.seller=Compruebe que el pago recibido por SBP coincide con el número de teléfono indicado en la cuenta de Haveno del comprador de XMR.

payment.mir.info.account=Para usar la transferencia a tarjeta Mir necesita una tarjeta bancaria rusa que pueda recibir transferencias de tarjeta a tarjeta.\n\nLos pagos se envían al número de tarjeta del destinatario. La moneda del intercambio es RUB.
payment.mir.info.buyer=Envíe el pago únicamente al número de tarjeta indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación bancaria coincide con el nombre del titular de la cuenta del vendedor.
payment.mir.info.seller=Compruebe que el pago recibido en su aplicación bancaria coincide con el número de tarjeta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.yoomoney.info.account=Para usar YooMoney necesita un monedero de YooMoney registrado en Rusia.\n\nLos pagos se envían al número de monedero del destinatario. La moneda del intercambio es RUB.
payment.yoomoney.info.buyer=Envíe el pago únicamente al número de monedero indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.yoomoney.info.seller=Compruebe que el pago recibido en su monedero de YooMoney coincide con el número de monedero y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.ukraineCard.info.account=Para usar la transferencia de tarjeta a tarjeta necesita una tarjeta bancaria ucraniana (p. ej. PrivatBank o Monobank) que pueda recibir transferencias.\n\nLos pagos se envían al número de tarjeta del destinatario. La moneda del intercambio es UAH.
payment.ukraineCard.info.buyer=Envíe el pago únicamente al número de tarjeta indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra su aplicación bancaria coincide con el nombre del titular de la cuenta del vendedor.
payment.ukraineCard.info.seller=Compruebe que el pago recibido en su aplicación bancaria coincide con el número de tarjeta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.kaspi.accountId=Número de móvil o de tarjeta
payment.kaspi.info.account=Para usar Kaspi necesita una cuenta de Kaspi registrada en Kazajistán.\n\nLos pagos se envían al número de móvil registrado o al número de tarjeta Kaspi Gold del destinatario. La moneda del intercambio es KZT.
payment.kaspi.info.buyer=Envíe el pago únicamente al número de móvil o de tarjeta indicado en la cuenta del vendedor de XMR y, antes de confirmar, verifique que el nombre del destinatario que muestra la aplicación coincide con el nombre del titular de la cuenta del vendedor.
payment.kaspi.info.seller=Compruebe que el pago recibido en su aplicación de Kaspi coincide con el número de móvil o de tarjeta y el nombre del titular indicados en la cuenta del comprador de XMR.

payment.usPostalMoneyOrder.info=Los intercambios usando US Postal Money Orders (USPMO) en Haveno requiere que entienda lo siguiente:\n\n- Los compradores de XMR deben escribir la dirección del vendedor en los campos de "Payer" y "Payee" y tomar una foto en alta resolución de la USPMO y del sobre con la prueba de seguimiento antes de enviar.\n- Los compradores de XMR deben enviar la USPMO con confirmación de entrega.\n\nEn caso de que sea necesaria la mediación, se requerirá al comprador que entregue las fotos al mediador o agente de devolución de fondos, junto con el número de serie de la USPMO, número de oficina postal, y la cantidad de USD, para que puedan verificar los detalles en la web de US Post Office.\n\nNo entregar la información requerida al Mediador o Árbitro resultará en pérdida del caso de disputa. \n\nEn todos los casos de disputa, el emisor de la USPMO tiene el 100% de responsabilidad en aportar la evidencia al Mediador o Árbitro.\n\nSi no entiende estos requerimientos, no comercie usando USPMO en Haveno.

payment.payByMail.info=Comerciar utilizando Pay by Mail en Haveno requiere que comprendas lo siguiente:\n\
\n\
● El comprador de XMR debe empaquetar el efectivo en una bolsa de efectivo a prueba de manipulaciones.\n\
● El comprador de XMR debe filmar o tomar fotos de alta resolución del proceso de empaquetado del efectivo con la dirección y el número de seguimiento ya colocados en el paquete.\n\
● El comprador de XMR debe enviar el paquete de efectivo al vendedor de XMR con Confirmación de Entrega y el seguro adecuado.\n\
● El vendedor de XMR debe filmar la apertura del paquete, asegurándose de que el número de seguimiento proporcionado por el remitente sea visible en el video.\n\
● El creador de la oferta debe indicar cualquier término o condición especial en el campo 'Información Adicional' de la cuenta de pago.\n\
● El tomador de la oferta acepta los términos y condiciones del creador de la oferta al aceptar la oferta.\n\
\n\
Las transacciones Pay by Mail colocan la responsabilidad de actuar honestamente directamente en ambos participantes.\n\
\n\
● Las transacciones Pay by Mail tienen acciones menos verificables que otros intercambios tradicionales. Esto dificulta mucho más la gestión de disputas.\n\
● Intenta resolver las disputas directamente con tu par utilizando el chat de trader. Esta es tu ruta más prometedora para resolver cualquier disputa de Pay by Mail.\n\
● Los árbitros pueden considerar tu caso y hacer una sugerencia, pero NO están garantizados para ayudar.\n\
● Los árbitros tomarán una decisión basada en la evidencia proporcionada. Por lo tanto, sigue y documenta los procesos anteriores para contar con evidencia en caso de disputa.\n\
● Las solicitudes de reembolso por fondos perdidos como resultado de intercambios Pay By Mail en Haveno NO serán consideradas.\n\
\n\
Si no comprendes estos requisitos, no realices intercambios utilizando Pay by Mail en Haveno.

