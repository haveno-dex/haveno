portfolio.pending.mediationResult.popup.info=The mediator has suggested the following payout:\nYou receive: {0}\nYour trading peer receives: {1}\n\nYou can accept or reject this suggested payout.\n\nBy accepting, you sign the proposed payout transaction. If your trading peer also accepts and signs, the payout will be completed, and the trade will be closed.\n\nIf one or both of you reject the suggestion, you will have to wait until {2} (block {3}) to open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nThe arbitrator may charge a small fee (fee maximum: the trader's security deposit) as compensation for their work. Both traders agreeing to the mediator's suggestion is the happy path—requesting arbitration is meant for exceptional circumstances, such as if a trader is sure the mediator did not make a fair payout suggestion (or if the other peer is unresponsive).\n\nMore details about the new arbitration model: [HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.selfAccepted.lockTimeOver=You have accepted the mediator's suggested payout but it seems that your trading peer has not accepted it.\n\nOnce the lock time is over on {0} (block {1}), you can open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nYou can find more details about the arbitration model at:[HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.openArbitration=Rejeitar e solicitar arbitramento
portfolio.pending.mediationResult.popup.alreadyAccepted=Você já aceitou

portfolio.pending.failedTrade.missingDepositTx=Uma transação de depósito está faltando.\n\nEssa transação é necessária para concluir a negociação. Por favor, certifique-se de que sua carteira esteja totalmente sincronizada com a blockchain do Monero.\n\nVocê pode mover esta negociação para a seção "Negociações Falhas" para desativá-la.
portfolio.pending.failedTrade.errorMsgSet=Ocorreu um erro durante a execução do protocolo de negociação.\n\nErro: {0}\n\nÉ possível que este erro não seja crítico e que a negociação possa ser concluída normalmente. Se não tiver certeza, abra um ticket de mediação para obter orientação dos mediadores do Haveno. \n\nSe o erro foi crítico e a negociação não puder ser concluída, você pode ter perdido sua taxa de negociação. Solicite o reembolso de taxas de negociação perdidas aqui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=O contrato da negociação não está definido.\n\nA negociação não pode ser concluída e você pode ter perdido sua taxa de negociação. Se for o caso, você pode solicitar o reembolso de taxas de negociação perdidas aqui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.info.popup=O protocolo de negociação encontrou alguns problemas.\n\n{0}
portfolio.pending.failedTrade.txChainInvalid.moveToFailed=O protocolo de negociação encontrou um problema grave.\n\n{0}\n\nDeseja mover a negociação para negociações falhas?\n\nNão é possível abrir mediação ou arbitragem a partir da tela de negociações falhas, mas você pode mover uma negociação falha de volta para negociações em aberto a qualquer momento.
portfolio.pending.failedTrade.txChainValid.moveToFailed=O protocolo de negociação encontrou alguns problemas.\n\n{0}\n\nAs transações da negociação foram publicadas e os fundos estão travados. Só mova a negociação para negociações falhas se tiver certeza. Isso pode impedir opções de resolver o problema.\n\nDeseja mover a negociação para negociações falhas?\n\nNão é possível abrir mediação ou arbitragem a partir da tela de negociações falhas, mas você pode mover uma negociação falha de volta para negociações em aberto a qualquer momento.
portfolio.pending.failedTrade.moveTradeToFailedIcon.tooltip=Mover negociação para negociações falhas
portfolio.pending.failedTrade.warningIcon.tooltip=Clique para ver detalhes sobre os problemas desta negociação
