payment.zelle.info=Zelle é um serviço de transferência de dinheiro que funciona melhor *através* de outro banco.\n\n1. Verifique nesta página se (e como) o seu banco funciona com o Zelle: [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. Preste atenção especial aos seus limites de transferência: os limites de envio variam por banco, e os bancos costumam definir limites diários, semanais e mensais separados.\n\n3. Se o seu banco não funcionar com o Zelle, você ainda pode usá-lo pelo aplicativo do Zelle, mas seus limites de transferência serão muito menores.\n\n4. O nome informado na sua conta Haveno DEVE ser igual ao nome na sua conta Zelle/bancária. \n\nSe você não conseguir concluir uma transação Zelle conforme especificado no contrato da negociação, poderá perder parte (ou todo) o seu depósito de segurança.\n\nDevido ao risco um pouco maior de estorno do Zelle, recomenda-se que vendedores contatem compradores não assinados por e-mail ou SMS para verificar se o comprador realmente é o dono da conta Zelle informada no Haveno.
payment.fasterPayments.newRequirements.info=Alguns bancos começaram a verificar o nome completo do destinatário em transferências Faster Payments. Sua conta Faster Payments atual não informa um nome completo.\n\nConsidere recriar sua conta Faster Payments no Haveno para fornecer o nome completo a futuros compradores de {0}.\n\nAo recriar a conta, copie exatamente o sort code, o número da conta e o salt de verificação de idade da conta antiga para a nova. Isso garante que a idade e o status de assinatura da sua conta atual sejam preservados.
payment.fasterPayments.ukSortCode=Sort code do Reino Unido
payment.moneyGram.info=Ao usar MoneyGram, o comprador de XMR precisa enviar o número de autorização e uma foto do comprovante por e-mail para o vendedor de XMR. O comprovante deve mostrar claramente o nome completo do vendedor, o país, o estado e a quantia. O e-mail do vendedor será exibido ao comprador durante o processo de negociação.
payment.westernUnion.info=Ao usar Western Union, o comprador de XMR precisa enviar o MTCN (número de rastreamento) e uma foto do comprovante por e-mail para o vendedor de XMR. O comprovante deve mostrar claramente o nome completo do vendedor, a cidade, o país e a quantia. O e-mail do vendedor será exibido ao comprador durante o processo de negociação.
payment.halCash.info=Ao usar o HalCash, o comprador de XMR precisa enviar ao vendedor de XMR o código HalCash através de uma mensagem de texto do seu telefone.\n\nPor favor, certifique-se de não exceder a quantia máxima que seu banco lhe permite enviar com o HalCash. O valor mínimo de saque é de 10 euros e valor máximo é de 600 EUR. Para saques repetidos é de 3000 euros por destinatário por dia e 6000 euros por destinatário por mês. Por favor confirme esses limites com seu banco para ter certeza de que eles usam os mesmos limites mencionados aqui.\n\nO valor de saque deve ser um múltiplo de 10 euros, pois você não pode sacar notas diferentes de uma ATM. Esse valor em XMR será ajustado na telas de criar e aceitar ofertas para que a quantia de EUR esteja correta. Você não pode usar o preço com base no mercado, pois o valor do EUR estaria mudando com a variação dos preços.\n\nEm caso de disputa, o comprador de XMR precisa fornecer a prova de que enviou o EUR.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Saiba que todas as transferências bancárias têm algum risco de estorno. Para reduzir esse risco, o Haveno define limites por negociação com base no nível estimado de risco de estorno do método de pagamento usado.\n\nPara este método de pagamento, seu limite por negociação para compra e venda é {2}.\n\nEsse limite se aplica apenas ao tamanho de uma única negociação; você pode fazer quantas negociações quiser.\n\nVeja mais detalhes na wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Para limitar o risco de estorno, o Haveno define limites por negociação para este tipo de conta de pagamento com base nos 2 fatores a seguir:\n\n1. Risco geral de estorno do método de pagamento\n2. Status de assinatura da conta\n\nEsta conta de pagamento ainda não foi assinada, então está limitada a comprar {0} por negociação. Após a assinatura, os limites de compra aumentarão da seguinte forma:\n\n● Antes da assinatura, e por 30 dias após a assinatura, seu limite de compra por negociação será {0}\n● 30 dias após a assinatura, seu limite de compra por negociação será {1}\n● 60 dias após a assinatura, seu limite de compra por negociação será {2}\n\nOs limites de venda não são afetados pela assinatura da conta. Você pode vender {2} em uma única negociação imediatamente.\n\nEsses limites se aplicam apenas ao tamanho de uma única negociação; você pode fazer quantas negociações quiser. \n\nVeja mais detalhes na wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

payment.cashDeposit.info=Certifique-se de que o seu banco permite a realização de depósitos em espécie na conta de terceiros.

payment.revolut.info=O Revolut exige o 'Nome de usuário' como ID da conta, e não o número de telefone ou e-mail como era antes.
payment.account.revolut.addUserNameInfo={0}\nSua conta Revolut existente ({1}) não tem um 'Nome de usuário'.\nInforme seu 'Nome de usuário' do Revolut para atualizar os dados da sua conta.\nIsso não afetará o status de assinatura da idade da sua conta.
payment.revolut.addUserNameInfo.headLine=Atualizar conta Revolut

payment.cashapp.info=Por favor, esteja ciente de que o Cash App tem um risco maior de estorno do que a maioria das transferências bancárias.
payment.venmo.info=Por favor, esteja ciente de que o Venmo tem um risco maior de estorno do que a maioria das transferências bancárias.
payment.paypal.info=Por favor, esteja ciente de que o PayPal tem um risco maior de estorno do que a maioria das transferências bancárias.

payment.amazonGiftCard.upgrade=O método de pagamento Amazon gift card exige que o país seja informado.
payment.account.amazonGiftCard.addCountryInfo={0}\nSua conta Amazon Gift Card existente ({1}) não tem um país informado.\nInforme o país do seu Amazon Gift Card para atualizar os dados da sua conta.\nIsso não afetará o status de idade da sua conta.
payment.amazonGiftCard.upgrade.headLine=Atualizar conta Amazon Gift Card
payment.swift.info.account=Revise com atenção as orientações principais para usar SWIFT no Haveno:\n\n- preencha todos os campos de forma completa e precisa \n- o comprador deve enviar o pagamento na moeda especificada pelo ofertante \n- o comprador deve usar o modelo de taxa compartilhada (SHA) \n- comprador e vendedor podem ter custos, então devem verificar as tarifas do banco antes \n\nSWIFT é mais complexo que outros métodos de pagamento, então reserve um momento para ler as orientações completas na wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=Para comprar monero com SWIFT, você deve:\n\n- enviar o pagamento na moeda especificada pelo ofertante \n- usar o modelo de taxa compartilhada (SHA) ao enviar o pagamento\n\nLeia as orientações adicionais na wiki para evitar penalidades e garantir negociações tranquilas [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=Remetentes SWIFT são obrigados a usar o modelo de taxa compartilhada (SHA) ao enviar pagamentos.\n\nSe você receber um pagamento SWIFT que não use SHA, abra um ticket de mediação.\n\nLeia as orientações adicionais na wiki para evitar penalidades e garantir negociações tranquilas [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=Certifique-se de incluir:\n\n● Nome completo do titular da conta\n● Número da conta\n● Número IFSC\n\nEsses dados devem corresponder à conta bancária que você usará para enviar / receber pagamentos.\n\nSaiba que o máximo que pode ser enviado por transação é Rs. 200.000. Se você negociar acima desse valor, serão necessárias várias transações. Porém, saiba que há um limite máximo de Rs. 1.000.000 que pode ser enviado por dia.\n\nAlguns bancos têm limites diferentes para seus clientes.
payment.imps.info.buyer=Envie o pagamento apenas para os dados da conta informados no Haveno.\n\nO tamanho máximo da negociação é Rs. 200.000 por transação.\n\nSe a sua negociação for acima de Rs. 200.000, você terá que fazer várias transferências. Porém, saiba que há um limite máximo de Rs. 1.000.000 que pode ser enviado por dia.\n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.imps.info.seller=Se você pretende receber acima de Rs. 200.000 por negociação, espere que o comprador precise fazer várias transferências. Porém, saiba que há um limite máximo de Rs. 1.000.000 que pode ser enviado por dia.\n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.neft.info.account=Certifique-se de incluir:\n\n● Nome completo do titular da conta\n● Número da conta\n● Número IFSC\n\nEsses dados devem corresponder à conta bancária que você usará para enviar / receber pagamentos.\n\nSaiba que o máximo que pode ser enviado por transação é Rs. 50.000. Se você negociar acima desse valor, serão necessárias várias transações.\n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.neft.info.buyer=Envie o pagamento apenas para os dados da conta informados no Haveno.\n\nO tamanho máximo da negociação é Rs. 50.000 por transação.\n\nSe a sua negociação for acima de Rs. 50.000, você terá que fazer várias transferências.\n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.neft.info.seller=Se você pretende receber acima de Rs. 50.000 por negociação, espere que o comprador precise fazer várias transferências.\n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.paytm.info.account=Certifique-se de incluir o e-mail ou número de telefone que corresponde ao e-mail ou telefone da sua conta PayTM. \n\nQuando os usuários configuram uma conta PayTM sem KYC, ficam limitados a: \n\n● Máximo de Rs. 5.000 enviados por transação.\n● Máximo de Rs. 10.000 mantidos na carteira PayTM.\n\nSe você pretende negociar acima de 5.000 por negociação, precisará completar o KYC na PayTM. Com KYC, os usuários ficam limitados a:\n\n● Máximo de Rs. 100.000 enviados por transação.\n● Máximo de Rs. 100.000 mantidos na carteira PayTM.\n\nOs usuários também devem estar cientes dos limites da conta. Negociações acima dos limites da conta PayTM provavelmente precisarão ocorrer ao longo de mais de um dia, ou ser canceladas.
payment.paytm.info.buyer=Envie o pagamento apenas para o endereço de e-mail ou número de telefone informado.\n\nSe você pretende negociar acima de Rs. 5.000 por negociação, precisará completar o KYC na PayTM.\n\nSem KYC, podem ser enviados Rs. 5.000 por transação.\n\nCom KYC, os usuários podem enviar Rs. 100.000 por transação.
payment.paytm.info.seller=Se você pretende negociar acima de Rs. 5.000 por negociação, precisará completar o KYC na PayTM. Com KYC, os usuários ficam limitados a:\n\n● Máximo de Rs. 100.000 enviados por transação.\n● Máximo de Rs. 100.000 mantidos na sua carteira PayTM .\n\nOs usuários também devem estar cientes dos limites da conta. Como o máximo que pode ser mantido na sua carteira PayTM é Rs. 100.000, transfira suas rúpias regularmente.
payment.rtgs.info.account=RTGS é para pagamentos de negociações grandes, de Rs. 200.000 ou mais.\n\nAo configurar sua conta de pagamento RTGS, certifique-se de incluir:\n\n● Nome completo do titular da conta\n● Número da conta\n● Número IFSC\n\nEsses dados devem corresponder à conta bancária que você usará para enviar / receber pagamentos.\n\nSaiba que há uma quantia mínima de negociação de Rs. 200.000 que pode ser enviada por transação. Se você negociar abaixo desse valor, a negociação será cancelada ou ambos os negociadores terão que concordar com outro método de pagamento (ex.: IMPS ou UPI).
payment.rtgs.info.buyer=Envie o pagamento apenas para os dados da conta informados no Haveno.\n\nSaiba que há uma quantia mínima de negociação de Rs. 200.000 que pode ser enviada por transação. Se você negociar abaixo desse valor, a negociação será cancelada ou ambos os negociadores terão que concordar com outro método de pagamento (ex.: IMPS ou UPI).
payment.rtgs.info.seller=Saiba que há uma quantia mínima de negociação de Rs. 200.000 que pode ser enviada por transação. Se você negociar abaixo desse valor, a negociação será cancelada ou ambos os negociadores terão que concordar com outro método de pagamento (ex.: IMPS ou UPI).
payment.upi.info.account=Certifique-se de incluir seu Endereço de Pagamento Virtual (VPA), também chamado de UPI ID. O formato é parecido com um e-mail: com o sinal “@” no meio. Por exemplo, seu UPI ID pode ser “nome_do_destinatário@nome_do_banco” ou “número_de_telefone@nome_do_banco”. \n\nPara UPI, há um limite máximo de Rs. 100.000 que pode ser enviado por transação. \n\nSe você pretende negociar acima de Rs. 100.000 por negociação, é provável que as negociações precisem ocorrer em várias transferências. \n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.upi.info.buyer=Envie o pagamento apenas para o VPA / UPI ID informado no Haveno. \n\nO tamanho máximo da negociação é Rs. 100.000 por transação. \n\nSe a sua negociação for acima de Rs. 100.000, você terá que fazer várias transferências. \n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.upi.info.seller=Se você pretende receber acima de Rs. 100.000 por negociação, espere que o comprador precise fazer várias transferências. \n\nObserve que alguns bancos têm limites diferentes para seus clientes.
payment.celpay.info.account=Certifique-se de incluir o e-mail com o qual sua conta Celsius está registrada. Isso garante que, ao enviar fundos, eles apareçam vindos da conta correta e, ao receber fundos, sejam creditados na sua conta.\n\nUsuários do CelPay estão limitados a enviar $ 2.500 (ou o equivalente em outra moeda/cripto) em 24 horas.\n\nNegociações acima dos limites da conta CelPay provavelmente precisarão ocorrer ao longo de mais de um dia, ou ser canceladas.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nCompradores de XMR podem enviar qualquer stablecoin da moeda correspondente ao vendedor de XMR.
payment.celpay.info.buyer=Envie o pagamento apenas para o endereço de e-mail informado pelo vendedor de XMR, por meio de um link de pagamento.\n\nO CelPay está limitado a enviar $ 2.500 (ou o equivalente em outra moeda/cripto) em 24 horas.\n\nNegociações acima dos limites da conta CelPay provavelmente precisarão ocorrer ao longo de mais de um dia, ou ser canceladas.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nCompradores de XMR podem enviar qualquer stablecoin da moeda correspondente ao vendedor de XMR.
payment.celpay.info.seller=Vendedores de XMR devem esperar receber o pagamento por um link de pagamento seguro. Certifique-se de que o link de pagamento por e-mail contém o endereço de e-mail informado pelo comprador de XMR.\n\nUsuários do CelPay estão limitados a enviar $ 2.500 (ou o equivalente em outra moeda/cripto) em 24 horas.\n\nNegociações acima dos limites da conta CelPay provavelmente precisarão ocorrer ao longo de mais de um dia, ou ser canceladas.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nVendedores de XMR devem esperar receber qualquer stablecoin da moeda correspondente do comprador de XMR. O comprador de XMR pode enviar qualquer stablecoin da moeda correspondente.
payment.celpay.supportedCurrenciesForReceiver=Moedas suportadas (observação: todas as moedas abaixo são stablecoins suportadas no aplicativo Celsius. As negociações são de stablecoins, não de fiat.)
payment.nequi.info.account=Certifique-se de incluir o número de telefone associado à sua conta Nequi.\n\nQuando os usuários configuram uma conta Nequi, os limites de pagamento ficam em no máximo ~ 7.000.000 COP enviados por mês.\n\nSe você pretende negociar acima de 7.000.000 COP por negociação, precisará completar o KYC no Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações terão um imposto de 0,4%. Certifique-se de conhecer os impostos mais recentes.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.nequi.info.buyer=Envie o pagamento apenas para o número de telefone informado na conta Haveno do vendedor de XMR.\n\nQuando os usuários configuram uma conta Nequi, os limites de pagamento ficam em no máximo ~ 7.000.000 COP enviados por mês.\n\nSe você pretende negociar acima de 7.000.000 COP por negociação, precisará completar o KYC no Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações terão um imposto de 0,4%. Certifique-se de conhecer os impostos mais recentes.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.nequi.info.seller=Verifique se o pagamento recebido corresponde ao número de telefone informado na conta Haveno do comprador de XMR.\n\nQuando os usuários configuram uma conta Nequi, os limites de pagamento ficam em no máximo ~ 7.000.000 COP enviados por mês.\n\nSe você pretende negociar acima de 7.000.000 COP por negociação, precisará completar o KYC no Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações terão um imposto de 0,4%. Certifique-se de conhecer os impostos mais recentes.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.mpesa.info.account=Certifique-se de incluir o número de telefone registrado em sua conta M-Pesa.
payment.mpesa.info.buyer=Envie o pagamento apenas para o número de telefone informado na conta Haveno do vendedor de XMR, usando M-Pesa.
payment.mpesa.info.seller=Verifique se o pagamento M-Pesa recebido corresponde ao número de telefone informado na conta Haveno do comprador de XMR.
payment.mercadoPago.info.account=Certifique-se de incluir o e-mail ou número de telefone registrado em sua conta Mercado Pago.
payment.mercadoPago.info.buyer=Envie o pagamento apenas para o e-mail ou número de telefone informado na conta Haveno do vendedor de XMR, usando Mercado Pago.
payment.mercadoPago.info.seller=Verifique se o pagamento Mercado Pago recebido corresponde ao e-mail ou número de telefone informado na conta Haveno do comprador de XMR.
payment.gcash.info.account=Certifique-se de incluir o número de telefone registrado em sua conta GCash.
payment.gcash.info.buyer=Envie o pagamento apenas para o número de telefone informado na conta Haveno do vendedor de XMR, usando GCash.
payment.gcash.info.seller=Verifique se o pagamento GCash recebido corresponde ao número de telefone informado na conta Haveno do comprador de XMR.
payment.momo.info.account=Certifique-se de incluir o número de telefone registrado em sua conta MoMo.
payment.momo.info.buyer=Envie o pagamento apenas para o número de telefone informado na conta Haveno do vendedor de XMR, usando MoMo.
payment.momo.info.seller=Verifique se o pagamento MoMo recebido corresponde ao número de telefone informado na conta Haveno do comprador de XMR.
payment.spei.info.account=Certifique-se de incluir a CLABE (número de conta interbancária de 18 dígitos) registrada em sua conta bancária para transferências SPEI.
payment.spei.info.buyer=Envie o pagamento via SPEI apenas para a CLABE informada na conta Haveno do vendedor de XMR.
payment.spei.info.seller=Verifique se o pagamento SPEI recebido corresponde à CLABE informada na conta Haveno do comprador de XMR.
payment.bizum.info.account=Para usar o Bizum, você precisa de uma conta bancária (IBAN) na Espanha e estar registrado no serviço.\n\nO Bizum pode ser usado para negociações entre € 0.50 e € 1.000.\n\nA quantia máxima de transações que você pode enviar/receber usando o Bizum é € 2.000 por dia.\n\nUsuários do Bizum podem fazer no máximo 150 operações por mês.\n\nCada banco, porém, pode estabelecer seus próprios limites para seus clientes, dentro dos limites acima.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.bizum.info.buyer=Envie o pagamento apenas para o número de celular do vendedor de XMR informado no Haveno.\n\nO tamanho máximo da negociação é € 1.000 por pagamento. A quantia máxima de transações que você pode enviar usando o Bizum é € 2.000 por dia.\n\nSe você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.bizum.info.seller=Certifique-se de que o pagamento foi recebido do número de celular do comprador de XMR informado no Haveno.\n\nO tamanho máximo da negociação é € 1.000 por pagamento. A quantia máxima de transações que você pode receber usando o Bizum é € 2.000 por dia.\n\nSe você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.

payment.blik.info.account=Para usar o BLIK, você precisa de uma conta bancária na Polônia com um aplicativo de banco que suporte BLIK.\n\nO comprador de XMR paga gerando um código BLIK e enviando-o ao vendedor de XMR pelo chat de negociação, então ambos os negociantes precisam estar online para concluir o pagamento.
payment.blik.info.buyer=Para pagar, gere um código BLIK no aplicativo do seu banco e envie-o ao vendedor de XMR pelo chat de negociação.\n\nCódigos BLIK são válidos por apenas 2 minutos, então confira se o vendedor está respondendo no chat de negociação antes de gerar o código.
payment.blik.info.seller=O comprador de XMR enviará um código BLIK a você pelo chat de negociação.\n\nCódigos BLIK são válidos por apenas 2 minutos, então use o código para receber o pagamento logo após o envio.

payment.vippsMobilePay.info.account=Para usar o Vipps MobilePay, você precisa de uma conta registrada com seu número de celular na Noruega, Dinamarca ou Finlândia.\n\nPagamentos não podem ser enviados entre países, então ambos os negociantes precisam ter contas no mesmo país. A moeda da negociação é definida pelo país da sua conta.
payment.vippsMobilePay.info.buyer=Envie o pagamento apenas para o número de celular informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.vippsMobilePay.info.seller=Verifique se o pagamento recebido em seu aplicativo Vipps ou MobilePay corresponde ao número de celular e ao nome do titular informados na conta do comprador de XMR.

payment.twint.info.account=Para usar o TWINT, você precisa de uma conta registrada com seu número de celular na Suíça.\n\nPagamentos TWINT só podem ser enviados entre contas TWINT suíças, então ambos os negociantes precisam usar o TWINT. A moeda da negociação é CHF.
payment.twint.info.buyer=Envie o pagamento apenas para o número de celular informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.twint.info.seller=Verifique se o pagamento recebido em seu aplicativo TWINT corresponde ao número de celular e ao nome do titular informados na conta do comprador de XMR.

payment.nip.info.account=Para usar o NIP, você precisa de uma conta bancária nigeriana ou de uma carteira digital como OPay ou PalmPay.\n\nOs pagamentos são enviados por transferência bancária instantânea NIP para o número de conta de 10 dígitos do destinatário em seu banco ou provedor de carteira. A moeda da negociação é NGN.
payment.nip.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido na verificação de nome da transferência corresponde ao nome do titular da conta do vendedor.
payment.nip.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira corresponde ao número de conta e ao nome do titular informados na conta do comprador de XMR.

payment.pagoMovil.info.account=Para usar o Pago Móvil, você precisa de uma conta bancária venezuelana com Pago Móvil ativado, registrada com seu número de celular, cédula e banco.\n\nOs pagamentos são enviados por transferência interbancária para o número de celular, a cédula e o banco informados. A moeda da negociação é VES.
payment.pagoMovil.info.buyer=Envie o pagamento apenas para o número de celular, a cédula e o banco informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu banco corresponde ao nome do titular da conta do vendedor.
payment.pagoMovil.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário corresponde ao número de celular, à cédula e ao nome do titular informados na conta do comprador de XMR.

payment.qris.info.account=Para usar o QRIS / BI-FAST, você precisa de uma conta bancária indonésia ou de uma carteira digital que possa receber transferências instantâneas.\n\nOs pagamentos são enviados por transferência instantânea BI-FAST para o número de conta do destinatário em seu banco ou carteira digital, ou pela leitura do código QRIS do destinatário. A moeda da negociação é IDR.
payment.qris.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira digital informados na conta do vendedor de XMR, ou para um código QRIS que o vendedor compartilhe com você no chat de negociação, e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.qris.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira digital corresponde ao número de conta e ao nome do titular informados na conta do comprador de XMR.

payment.papara.info.account=Para usar o Papara / FAST, você precisa de uma conta Papara ou de uma conta bancária turca que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o número Papara, o IBAN turco ou o número de celular do FAST Easy Address (Kolay Adres) do destinatário. A moeda da negociação é TRY.
payment.papara.info.buyer=Envie o pagamento apenas para o número de conta ou IBAN e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.papara.info.seller=Verifique se o pagamento recebido em seu aplicativo Papara ou bancário corresponde aos dados da conta e ao nome do titular informados na conta do comprador de XMR.

payment.raast.info.account=Para usar o Raast / Easypaisa / JazzCash, você precisa de uma conta bancária ou carteira digital paquistanesa que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o Raast ID (número de celular registrado), o número de celular da carteira ou o IBAN paquistanês do destinatário. A moeda da negociação é PKR.
payment.raast.info.buyer=Envie o pagamento apenas para o número de celular ou IBAN e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.raast.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira corresponde aos dados da conta e ao nome do titular informados na conta do comprador de XMR.

payment.paynow.info.account=Para usar o PayNow / FAST, você precisa de uma conta bancária ou carteira digital de Singapura que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o proxy PayNow do destinatário: um número de celular registrado ou NRIC/FIN. A moeda da negociação é SGD.
payment.paynow.info.buyer=Envie o pagamento apenas para o número de celular ou NRIC/FIN e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.paynow.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira corresponde aos dados da conta e ao nome do titular informados na conta do comprador de XMR.

payment.wero.info.account=Para usar o Wero, você precisa do aplicativo Wero ou do aplicativo de um banco participante, com seu número de celular registrado na Alemanha, França ou Bélgica.\n\nOs pagamentos são enviados para o número de celular registrado do destinatário, digitado no formato internacional (ex.: +49). A moeda da negociação é EUR.
payment.wero.info.buyer=Envie o pagamento apenas para o número de celular informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.wero.info.seller=Verifique se o pagamento recebido em seu aplicativo Wero ou bancário corresponde ao número de celular e ao nome do titular informados na conta do comprador de XMR.

payment.fps.info.account=Para usar o FPS (Faster Payment System), você precisa de uma conta bancária de Hong Kong ou de uma carteira digital como AlipayHK ou WeChat Pay HK.\n\nOs pagamentos são enviados para o proxy FPS do destinatário: um número de celular registrado, FPS ID ou endereço de e-mail. A moeda da negociação é HKD.
payment.fps.info.buyer=Envie o pagamento apenas para o número de celular, FPS ID ou e-mail e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.fps.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira corresponde aos dados da conta e ao nome do titular informados na conta do comprador de XMR.

payment.duitnow.info.account=Para usar o DuitNow, você precisa de uma conta bancária malaia ou de uma carteira digital como Touch 'n Go, GrabPay ou Boost.\n\nOs pagamentos são enviados para o proxy DuitNow do destinatário: um número de celular registrado ou NRIC. A moeda da negociação é MYR.
payment.duitnow.info.buyer=Envie o pagamento apenas para o número de celular ou NRIC e o banco ou carteira informados na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo corresponde ao nome do titular da conta do vendedor.
payment.duitnow.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário ou de carteira corresponde aos dados da conta e ao nome do titular informados na conta do comprador de XMR.

payment.mbway.info.account=Para usar o MB WAY, você precisa do aplicativo MB WAY ativado com seu número de celular português.\n\nOs pagamentos são enviados para o número de celular registrado do destinatário. A moeda da negociação é EUR.
payment.mbway.info.buyer=Envie o pagamento apenas para o número de celular informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.mbway.info.seller=Verifique se o pagamento recebido em seu aplicativo MB WAY corresponde ao número de celular e ao nome do titular informados na conta do comprador de XMR.

payment.paypay.accountId=Número de celular ou PayPay ID
payment.paypay.info.account=Para usar o PayPay, você precisa de uma conta PayPay registrada no Japão.\n\nPagamentos PayPay só podem ser enviados entre usuários do PayPay, então ambos os negociantes precisam usar o PayPay. Os pagamentos são enviados para o número de celular registrado ou o PayPay ID do destinatário. A moeda da negociação é JPY.
payment.paypay.info.buyer=Envie o pagamento apenas para o número de celular ou PayPay ID informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.paypay.info.seller=Verifique se o pagamento recebido em seu aplicativo PayPay corresponde ao número de celular ou PayPay ID e ao nome do titular informados na conta do comprador de XMR.

payment.sbp.info.account=Certifique-se de incluir o número de telefone vinculado à sua conta bancária para transferências SBP (Faster Payments).
payment.sbp.info.buyer=Envie o pagamento via SBP apenas para o número de telefone informado na conta Haveno do vendedor de XMR.
payment.sbp.info.seller=Verifique se o pagamento SBP recebido corresponde ao número de telefone informado na conta Haveno do comprador de XMR.

payment.mir.info.account=Para usar a transferência com cartão Mir, você precisa de um cartão bancário russo que possa receber transferências de cartão para cartão.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda da negociação é RUB.
payment.mir.info.buyer=Envie o pagamento apenas para o número do cartão informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo bancário corresponde ao nome do titular da conta do vendedor.
payment.mir.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário corresponde ao número do cartão e ao nome do titular informados na conta do comprador de XMR.

payment.yoomoney.info.account=Para usar o YooMoney, você precisa de uma carteira YooMoney registrada na Rússia.\n\nOs pagamentos são enviados para o número da carteira do destinatário. A moeda da negociação é RUB.
payment.yoomoney.info.buyer=Envie o pagamento apenas para o número da carteira informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.yoomoney.info.seller=Verifique se o pagamento recebido em sua carteira YooMoney corresponde ao número da carteira e ao nome do titular informados na conta do comprador de XMR.

payment.ukraineCard.info.account=Para usar a transferência de cartão para cartão, você precisa de um cartão bancário ucraniano (ex.: PrivatBank ou Monobank) que possa receber transferências.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda da negociação é UAH.
payment.ukraineCard.info.buyer=Envie o pagamento apenas para o número do cartão informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido pelo seu aplicativo bancário corresponde ao nome do titular da conta do vendedor.
payment.ukraineCard.info.seller=Verifique se o pagamento recebido em seu aplicativo bancário corresponde ao número do cartão e ao nome do titular informados na conta do comprador de XMR.

payment.kaspi.accountId=Número de celular ou número do cartão
payment.kaspi.info.account=Para usar o Kaspi, você precisa de uma conta Kaspi registrada no Cazaquistão.\n\nOs pagamentos são enviados para o número de celular registrado ou o número do cartão Kaspi Gold do destinatário. A moeda da negociação é KZT.
payment.kaspi.info.buyer=Envie o pagamento apenas para o número de celular ou número do cartão informado na conta do vendedor de XMR e, antes de confirmar, verifique se o nome do destinatário exibido no aplicativo corresponde ao nome do titular da conta do vendedor.
payment.kaspi.info.seller=Verifique se o pagamento recebido em seu aplicativo Kaspi corresponde ao número de celular ou número do cartão e ao nome do titular informados na conta do comprador de XMR.
payment.pix.info.account=Certifique-se de incluir a chave Pix escolhida. Existem quatro tipos de chave: CPF ou CNPJ, endereço de e-mail, número de telefone ou uma chave aleatória gerada pelo sistema (UUID). Uma chave diferente deve ser usada para cada conta Pix que você tiver. Pessoas físicas podem criar até cinco chaves para cada conta.\n\nAo negociar no Haveno, compradores de XMR devem usar sua chave Pix como descrição do pagamento, para que o vendedor de XMR identifique facilmente que o pagamento veio deles.
payment.pix.info.buyer=Envie o pagamento apenas para a chave Pix informada na conta Haveno do vendedor de XMR.\n\nUse sua chave Pix como descrição do pagamento, para que o vendedor de XMR identifique facilmente que o pagamento veio de você.
payment.pix.info.seller=Verifique se a descrição do pagamento recebido corresponde à chave Pix informada na conta Haveno do comprador de XMR.
payment.pix.key=Chave Pix (CPF, CNPJ, e-mail, telefone ou UUID)
payment.monese.info.account=Monese é um aplicativo bancário para usuários de GBP, EUR e RON*. O Monese permite enviar dinheiro para outras contas Monese instantaneamente e sem custo em qualquer moeda suportada.\n\n*Para abrir uma conta em RON no Monese, você precisa morar na Romênia ou ter cidadania romena.\n\nAo configurar sua conta Monese no Haveno, certifique-se de incluir o nome e o número de telefone que correspondem à sua conta Monese. Isso garante que, ao enviar fundos, eles apareçam vindos da conta correta e, ao receber fundos, sejam creditados na sua conta.
payment.monese.info.buyer=Envie o pagamento apenas para o número de telefone informado pelo vendedor de XMR na conta Haveno dele. Deixe a descrição do pagamento em branco.
payment.monese.info.seller=Vendedores de XMR devem esperar receber o pagamento do número de telefone / nome mostrado na conta Haveno do comprador de XMR.
payment.satispay.info.account=Para usar o Satispay, você precisa de uma conta bancária (IBAN) na Itália e estar registrado no serviço.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, precisará contatar o suporte do Satispay para aumentar seus limites. Os usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.satispay.info.buyer=Envie o pagamento apenas para o número de celular do vendedor de XMR informado no Haveno.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, precisará contatar o suporte do Satispay para aumentar seus limites. Os usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.satispay.info.seller=Certifique-se de que o pagamento foi recebido do número de celular / nome do comprador de XMR informado no Haveno.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, precisará contatar o suporte do Satispay para aumentar seus limites. Os usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.tikkie.info.account=Para usar o Tikkie, você precisa de uma conta bancária (IBAN) na Holanda e estar registrado no serviço.\n\nAo enviar uma solicitação de pagamento Tikkie a uma pessoa física, você pode pedir no máximo € 750 por solicitação Tikkie. A quantia máxima que você pode solicitar em 24 horas é € 2.500 por conta Tikkie.\n\nCada banco, porém, pode estabelecer seus próprios limites para seus clientes, dentro desses limites.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.tikkie.info.buyer=Solicite um link de pagamento ao vendedor de XMR no chat de negociação. Assim que o vendedor de XMR enviar um link de pagamento com a quantia correta da negociação, faça o pagamento.\n\nQuando o vendedor de XMR solicita um pagamento Tikkie, o máximo que ele pode pedir é € 750 por solicitação Tikkie. Se a negociação for acima desse valor, o vendedor de XMR terá que enviar várias solicitações até completar a quantia da negociação. O máximo que se pode solicitar por dia é € 2.500.\n\nCada banco, porém, pode estabelecer seus próprios limites para seus clientes, dentro desses limites.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.tikkie.info.seller=Envie um link de pagamento ao comprador de XMR no chat de negociação. Assim que o comprador de XMR enviar o pagamento, verifique se os dados do IBAN dele correspondem aos dados que ele tem no Haveno.\n\nQuando o vendedor de XMR solicita um pagamento Tikkie, o máximo que ele pode pedir é € 750 por solicitação Tikkie. Se a negociação for acima desse valor, o vendedor de XMR terá que enviar várias solicitações até completar a quantia da negociação. O máximo que se pode solicitar por dia é € 2.500.\n\nCada banco, porém, pode estabelecer seus próprios limites para seus clientes, dentro desses limites.\n\nOs usuários também devem estar cientes dos limites da conta. Se você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.verse.info.account=Verse é um método de pagamento multimoeda que pode enviar e receber pagamentos em EUR, SEK, HUF, DKK, PLN.\n\nAo configurar sua conta Verse no Haveno, certifique-se de incluir o nome de usuário que corresponde ao da sua conta Verse. Isso garante que, ao enviar fundos, eles apareçam vindos da conta correta e, ao receber fundos, sejam creditados na sua conta.\n\nUsuários do Verse estão limitados a enviar ou receber € 10.000 por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos ou recebidos na sua conta de pagamento. Isso pode ser aumentado pelo Verse mediante solicitação.
payment.verse.info.buyer=Envie o pagamento apenas para o nome de usuário informado pelo vendedor de XMR na conta Haveno dele. Deixe a descrição do pagamento em branco.\n\nUsuários do Verse estão limitados a enviar ou receber € 10.000 por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos ou recebidos na sua conta de pagamento. Isso pode ser aumentado pelo Verse mediante solicitação.
payment.verse.info.seller=Vendedores de XMR devem esperar receber o pagamento do nome de usuário mostrado na conta Haveno do comprador de XMR.\n\nUsuários do Verse estão limitados a enviar ou receber € 10.000 por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos ou recebidos na sua conta de pagamento. Isso pode ser aumentado pelo Verse mediante solicitação.
payment.achTransfer.info.account=Ao adicionar ACH como método de pagamento no Haveno, os usuários devem saber quanto custará enviar e receber uma transferência ACH.
payment.achTransfer.info.buyer=Certifique-se de saber quanto custará enviar uma transferência ACH.\n\nAo pagar, envie apenas para os dados de pagamento informados na conta do vendedor de XMR usando transferência ACH.
payment.achTransfer.info.seller=Certifique-se de saber quanto custará receber uma transferência ACH.\n\nAo receber o pagamento, verifique se ele foi recebido da conta do comprador de XMR como transferência ACH.
payment.domesticWire.info.account=Ao adicionar transferência nacional (Wire) como método de pagamento no Haveno, os usuários devem saber quanto custará enviar e receber uma transferência bancária.
payment.domesticWire.info.buyer=Certifique-se de saber quanto custará enviar uma transferência bancária.\n\nAo pagar, envie apenas para os dados de pagamento informados na conta do vendedor de XMR.
payment.domesticWire.info.seller=Certifique-se de saber quanto custará receber uma transferência bancária.\n\nAo receber o pagamento, verifique se ele foi recebido da conta do comprador de XMR.
payment.strike.info.account=Certifique-se de incluir seu nome de usuário do Strike.\n\nNo Haveno, o Strike é usado apenas para pagamentos de fiat para fiat.\n\nCertifique-se de conhecer os limites do Strike:\n\nUsuários registrados apenas com e-mail, nome e número de telefone têm os seguintes limites:\n\n● $ 100 no máximo por depósito\n● $ 1.000 no máximo em depósitos por semana\n● $ 100 no máximo por pagamento\n\nOs usuários podem aumentar seus limites fornecendo mais informações ao Strike. Esses usuários têm os seguintes limites:\n\n● $ 1.000 no máximo por depósito\n● $ 1.000 no máximo em depósitos por semana\n● $ 1.000 no máximo por pagamento\n\nSe você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.strike.info.buyer=Envie o pagamento apenas para o nome de usuário do Strike do vendedor de XMR informado no Haveno.\n\nO tamanho máximo da negociação é $ 1.000 por pagamento.\n\nSe você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.strike.info.seller=Certifique-se de que o pagamento foi recebido do nome de usuário do Strike do comprador de XMR informado no Haveno.\n\nO tamanho máximo da negociação é $ 1.000 por pagamento.\n\nSe você negociar acima dos limites, a negociação pode ser cancelada e pode haver uma penalidade.
payment.transferwiseUsd.info.account=Devido à regulamentação bancária dos EUA, enviar e receber pagamentos em USD tem mais restrições do que na maioria das outras moedas. Por isso, o USD não foi adicionado ao método de pagamento Wise do Haveno.\n\nO método de pagamento Wise-USD permite que usuários do Haveno negociem em USD.\n\nQualquer pessoa com uma conta Wise pode adicionar Wise-USD como método de pagamento no Haveno. Isso permite comprar e vender XMR com USD.\n\nAo negociar no Haveno, compradores de XMR não devem usar nenhuma referência ou motivo de pagamento. Se o motivo do pagamento for obrigatório, devem usar apenas o nome completo do titular da conta Wise-USD.
payment.transferwiseUsd.info.buyer=Envie o pagamento apenas para o endereço de e-mail da conta Wise-USD do vendedor de XMR no Haveno.
payment.transferwiseUsd.info.seller=Verifique se o pagamento recebido corresponde ao nome do comprador de XMR na conta Wise-USD no Haveno.
payment.usPostalMoneyOrder.info=Negociar usando US Postal Money Orders (USPMO) no Haveno exige que você entenda o seguinte:\n\n- Compradores de XMR devem escrever o nome do vendedor de XMR nos campos Pagador e Beneficiário e tirar uma foto em alta resolução do USPMO e do envelope com o comprovante de rastreamento antes de enviar.\n- Compradores de XMR devem enviar o USPMO ao vendedor de XMR com confirmação de entrega.\n\nCaso seja necessária mediação, ou se houver uma disputa na negociação, você deverá enviar as fotos ao mediador ou árbitro do Haveno, junto com o número de série do USPMO, o número da agência postal e a quantia em dólares, para que possam verificar os dados no site dos Correios dos EUA.\n\nNão fornecer as informações exigidas ao árbitro resultará na perda da disputa.\n\nEm todos os casos de disputa, o remetente do USPMO tem 100% da responsabilidade de fornecer evidências/provas ao árbitro.\n\nSe você não entende esses requisitos, não negocie usando USPMO no Haveno.
payment.payByMail.info=Negociar usando Pay by Mail no Haveno exige que você entenda o seguinte:\n\n● O comprador de XMR deve embalar o dinheiro em um saco lacrado com evidência de violação.\n● O comprador de XMR deve filmar ou tirar fotos em alta resolução do processo de embalagem do dinheiro, já com o endereço e o número de rastreamento afixados na embalagem.\n● O comprador de XMR deve enviar o pacote com o dinheiro ao vendedor de XMR com confirmação de entrega e seguro adequado.\n● O vendedor de XMR deve filmar a abertura do pacote, garantindo que o número de rastreamento fornecido pelo remetente esteja visível no vídeo.\n● O ofertante deve informar quaisquer termos ou condições especiais no campo 'Informações adicionais' da conta de pagamento.\n● O aceitador concorda com os termos e condições do ofertante ao aceitar a oferta.\n\nNegociações Pay by Mail colocam a responsabilidade de agir com honestidade diretamente sobre ambos os pares.\n\n● Negociações Pay by Mail têm menos ações verificáveis do que outras negociações tradicionais. Isso torna a resolução de disputas muito mais difícil.\n● Tente resolver disputas diretamente com seu par usando o chat de negociação. Esse é o caminho mais promissor para resolver qualquer disputa de Pay by Mail.\n● Árbitros podem analisar seu caso e fazer uma sugestão, mas NÃO há garantia de que ajudarão.\n● Árbitros decidirão com base nas evidências fornecidas. Portanto, siga e documente os processos acima para ter evidências em caso de disputa.\n● Pedidos de reembolso ao Haveno por fundos perdidos em negociações Pay by Mail NÃO serão considerados.\n\nSe você não entende esses requisitos, não negocie usando Pay by Mail no Haveno.

payment.payByMail.contact=Informações para contato
payment.payByMail.contact.prompt=Nome ou pseudônimo para o qual o envelope deve ser endereçado
payment.payByMail.extraInfo.prompt=Informe nas suas ofertas: \n\nO país onde você está (ex.: França); \nPaíses / regiões de onde você aceita negociações (ex.: França, UE ou qualquer país europeu); \nQuaisquer termos/condições especiais; \nQuaisquer outros detalhes.
payment.tradingRestrictions=Revise os termos e condições do ofertante.\nSe você não atender aos requisitos, não aceite esta negociação.
payment.cashAtAtm.info=Saque sem cartão: saque em caixa eletrônico usando um código\n\nPara usar este método de pagamento:\n\n1. Crie uma conta de pagamento Saque sem cartão, listando os bancos aceitos, regiões ou outros termos a serem mostrados com a oferta.\n\n2. Crie ou aceite uma oferta com essa conta de pagamento.\n\n3. Quando a oferta for aceita, converse com seu par pelo chat para combinar um horário para concluir o pagamento e compartilhar os dados de pagamento.\n\nSe a quantia da negociação for maior que o limite de saque, os negociadores devem dividi-la em várias transações.\n\nNegociações de saque em caixa eletrônico devem ser em múltiplos de 10. Recomenda-se usar ofertas com faixa de valores para que a quantia de XMR possa se ajustar ao preço exato.\n\nSe você não conseguir concluir a transação conforme especificado no contrato da negociação, poderá perder parte (ou todo) o seu depósito de segurança.
payment.cashAtAtm.extraInfo.prompt=Informe nas suas ofertas: \n\nSeus bancos / locais aceitos; \nQuaisquer termos/condições especiais; \nQuaisquer outros detalhes.
