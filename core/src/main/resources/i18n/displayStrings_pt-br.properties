# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=Negociar XMR no Haveno exige que você entenda o seguinte requisito.\n\nAo vender XMR, você deve ser capaz de fornecer as seguintes informações a um mediador ou árbitro em caso de disputa:\n- a chave da transação (Tx Key, Tx Secret Key ou Tx Private Key)\n- o ID da transação (Tx ID ou Tx Hash)\n- o endereço de destino (endereço do destinatário)\n\nConsulte a wiki para saber onde encontrar essas informações nas carteiras Monero mais populares [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nNão fornecer os dados da transação exigidos resultará na perda das disputas.\n\nObserve também que o Haveno agora oferece confirmação automática de transações XMR para agilizar as negociações, mas você precisa ativá-la em Configurações.\n\nConsulte a wiki para mais informações sobre a confirmação automática: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


