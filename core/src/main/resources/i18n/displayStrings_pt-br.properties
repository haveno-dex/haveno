payment.f2f.info=Negociações 'Face a face' têm regras diferentes e envolvem riscos diferentes das transações online.\n\nAs principais diferenças são:\n● Os parceiros de negociação precisam trocar informações sobre o local e o horário do encontro usando os dados de contato fornecidos.\n● Os parceiros de negociação precisam levar seus notebooks e fazer a confirmação de 'pagamento enviado' e 'pagamento recebido' no local do encontro.\n● Se um ofertante tiver 'termos e condições' especiais, deve informá-los no campo de texto 'Informações adicionais' da conta.\n● Ao aceitar uma oferta, o aceitador concorda com os 'termos e condições' informados pelo ofertante.\n● Em caso de disputa, o árbitro não poderá ajudar muito, pois geralmente é difícil obter evidências à prova de fraude do que aconteceu no encontro. Nesses casos, os fundos em XMR podem ficar travados indefinidamente ou até que os parceiros de negociação cheguem a um acordo.\n\nPara garantir que você entende completamente as diferenças das negociações 'Face a face', leia as instruções e recomendações em: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
