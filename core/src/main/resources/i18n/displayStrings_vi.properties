offerbook.warning.newVersionAnnouncement=With this version of the software, trading peers can verify and sign each others' payment accounts to create a network of trusted payment accounts.\n\nAfter successfully trading with a peer with a verified payment account, your payment account will be signed and trading limits will be lifted after a certain time interval (length of this interval is based on the verification method).\n\nFor more information on account signing, please see the documentation at [HYPERLINK:https://docs.haveno.exchange/payment-methods#account-signing].

popup.warning.tradeLimitDueAccountAgeRestriction.seller=Số tiền giao dịch được phép bị giới hạn ở {0} vì các hạn chế bảo mật dựa trên các tiêu chí sau:\n- Tài khoản của người mua chưa được trọng tài hoặc đối tác ký\n- Thời gian kể từ khi ký tài khoản của người mua chưa đủ 30 ngày\n- Phương thức thanh toán của chào giá này được coi là có rủi ro bồi hoàn ngân hàng\n\n{1}
popup.warning.tradeLimitDueAccountAgeRestriction.buyer=Số tiền giao dịch được phép bị giới hạn ở {0} vì các hạn chế bảo mật dựa trên các tiêu chí sau:\n- Tài khoản của bạn chưa được trọng tài hoặc đối tác ký\n- Thời gian kể từ khi ký tài khoản của bạn chưa đủ 30 ngày\n- Phương thức thanh toán của chào giá này được coi là có rủi ro bồi hoàn ngân hàng\n\n{1}
popup.warning.tradeLimitDueAccountAgeRestriction.seller.releaseLimit=Phương thức thanh toán này tạm thời chỉ được giới hạn đến {0} cho đến {1} vì tất cả các người mua đều có tài khoản mới.\n\n{2}
popup.warning.tradeLimitDueAccountAgeRestriction.seller.exceedsUnsignedBuyLimit=Đề nghị của bạn sẽ bị giới hạn chỉ đối với các người mua có tài khoản đã ký và có tuổi vì nó vượt quá {0}.\n\n{1}

offerbook.warning.wrongTradeProtocol=Lệnh này cần phiên bản giao thức khác với được sử dụng trong phiên bản phần mềm của bạn.\n\nHãy kiểm tra xem bạn đã cài đặt phiên bản mới nhất chưa, nếu không người dùng đã tạo lệnh đã sử dụng phiên bản cũ.\n\nNgười dùng không thể giao dịch với phiên bản giao thức giao dịch không tương thích.
offerbook.warning.userIgnored=Bạn đã thêm địa chỉ onion của người dùng vào danh sách bỏ qua.
offerbook.warning.offerBlocked=Báo giá này bị chặn bởi các lập trình viên Haveno.\nCó thể có sự cố chưa được xử lý dẫn tới vấn đề khi nhận lệnh này.
offerbook.warning.currencyBanned=Loại tiền sử dụng trong báo giá này bị chặn bởi các lập trình viên Haveno.\nTruy cập diễn đàn Haveno để biết thêm thông tin.
offerbook.warning.paymentMethodBanned=Phương thức thanh toán sử dụng trong báo giá này bị chặn bởi các lập trình viên Haveno.\nTruy cập diễn đàn Haveno để biết thêm thông tin.
offerbook.warning.nodeBlocked=Địa chỉ onion của Thương gia bị chặn bởi các lập trình viên Haveno.\nCó thể có sự cố chưa được xử lý dẫn tới vấn đề khi nhận báo giá từ Thương gia này.
offerbook.warning.requireUpdateToNewVersion=Phiên bản Haveno của bạn không còn tương thích để giao dịch.\nVui lòng cập nhật lên phiên bản Haveno mới nhất.
offerbook.warning.offerWasAlreadyUsedInTrade=Bạn không thể nhận chào giá này vì bạn đã nhận nó trước đó. Có thể lần nhận chào giá trước của bạn đã dẫn đến một giao dịch thất bại.
