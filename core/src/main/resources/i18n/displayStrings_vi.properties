account.menu.walletInfo.balance.info=Đây là số dư ví nội bộ, bao gồm cả các giao dịch chưa xác nhận.\nVới XMR, số dư ví nội bộ bên dưới phải bằng tổng số dư 'Hiện có' và 'Bảo lưu' hiển thị ở góc trên bên phải cửa sổ này.
