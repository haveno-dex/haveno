portfolio.pending.failedTrade.missingDepositTx=Một giao dịch ký quỹ đang bị thiếu.\n\nGiao dịch này là bắt buộc để hoàn tất giao dịch. Vui lòng đảm bảo ví của bạn được đồng bộ hoàn toàn với blockchain Monero.\n\nBạn có thể chuyển giao dịch này đến mục "Giao dịch thất bại" để vô hiệu hóa nó.
portfolio.pending.failedTrade.errorMsgSet=Có lỗi trong quá trình thực hiện giao thức giao dịch.\n\nLỗi: {0}\n\nCó thể lỗi này không nghiêm trọng và giao dịch vẫn hoàn tất bình thường. Nếu không chắc, hãy mở đơn hòa giải để được người hòa giải Haveno tư vấn. \n\nNếu lỗi nghiêm trọng và giao dịch không thể hoàn tất, bạn có thể đã mất phí giao dịch. Yêu cầu hoàn lại phí giao dịch đã mất tại: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=Hợp đồng giao dịch chưa được thiết lập.\n\nGiao dịch không thể hoàn tất và bạn có thể đã mất phí giao dịch. Nếu vậy, bạn có thể yêu cầu hoàn lại phí giao dịch đã mất tại: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.info.popup=Giao thức giao dịch gặp một số vấn đề.\n\n{0}
portfolio.pending.failedTrade.txChainInvalid.moveToFailed=Giao thức giao dịch gặp vấn đề nghiêm trọng.\n\n{0}\n\nBạn có muốn chuyển giao dịch sang mục giao dịch thất bại không?\n\nBạn không thể mở hòa giải hay trọng tài từ mục giao dịch thất bại, nhưng có thể chuyển giao dịch thất bại về màn hình giao dịch mở bất cứ lúc nào.
portfolio.pending.failedTrade.txChainValid.moveToFailed=Giao thức giao dịch gặp một số vấn đề.\n\n{0}\n\nCác giao dịch đã được công bố và tiền đang bị khóa. Chỉ chuyển sang mục giao dịch thất bại nếu bạn thực sự chắc chắn. Việc này có thể làm mất các lựa chọn để giải quyết vấn đề.\n\nBạn có muốn chuyển giao dịch sang mục giao dịch thất bại không?\n\nBạn không thể mở hòa giải hay trọng tài từ mục giao dịch thất bại, nhưng có thể chuyển giao dịch thất bại về màn hình giao dịch mở bất cứ lúc nào.
