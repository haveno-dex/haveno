seed.warn.emptyRestoreHeight=Bạn chưa chỉ định chiều cao khôi phục, nên Haveno sẽ quét chuỗi khối từ đầu.\n\nViệc này có thể mất rất nhiều thời gian. Để tiết kiệm thời gian, hãy chỉ định chiều cao khối hoặc ngày tạo ví của bạn.\n\nTiếp tục mà không có chiều cao khôi phục?
