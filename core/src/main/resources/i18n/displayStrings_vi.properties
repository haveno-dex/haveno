payment.momo.info.account=Vui lòng đảm bảo nhập số điện thoại đã đăng ký với tài khoản MoMo của bạn.
payment.momo.info.buyer=Vui lòng chỉ gửi thanh toán bằng MoMo đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.momo.info.seller=Vui lòng kiểm tra thanh toán MoMo nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.spei.info.account=Vui lòng đảm bảo nhập CLABE (số tài khoản liên ngân hàng 18 chữ số) đã đăng ký với tài khoản ngân hàng của bạn để chuyển khoản SPEI.
payment.spei.info.buyer=Vui lòng chỉ gửi thanh toán qua SPEI đến CLABE được cung cấp trong tài khoản Haveno của người bán XMR.
payment.spei.info.seller=Vui lòng kiểm tra thanh toán SPEI nhận được có khớp với CLABE được cung cấp trong tài khoản Haveno của người mua XMR hay không.

payment.blik.info.account=Để dùng BLIK, bạn cần có tài khoản ngân hàng tại Ba Lan với ứng dụng ngân hàng di động hỗ trợ BLIK.\n\nNgười mua XMR thanh toán bằng cách tạo mã BLIK và gửi cho người bán XMR qua chat giao dịch, nên cả hai bên phải trực tuyến để hoàn tất thanh toán.
payment.blik.info.buyer=Để thanh toán, hãy tạo mã BLIK trong ứng dụng ngân hàng di động của bạn và gửi cho người bán XMR qua chat giao dịch.\n\nMã BLIK chỉ có hiệu lực trong 2 phút, nên hãy chắc chắn người bán đang phản hồi trong chat giao dịch trước khi tạo mã.
payment.blik.info.seller=Người mua XMR sẽ gửi cho bạn mã BLIK qua chat giao dịch.\n\nMã BLIK chỉ có hiệu lực trong 2 phút, nên hãy dùng mã để nhận thanh toán ngay sau khi mã được gửi.

payment.vippsMobilePay.info.account=Để dùng Vipps MobilePay, bạn cần có tài khoản đăng ký với số điện thoại tại Na Uy, Đan Mạch hoặc Phần Lan.\n\nKhông thể gửi thanh toán giữa các quốc gia, nên cả hai bên phải có tài khoản ở cùng một quốc gia. Tiền tệ giao dịch được xác định theo quốc gia của tài khoản bạn.
payment.vippsMobilePay.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.vippsMobilePay.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Vipps hoặc MobilePay của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.twint.info.account=Để dùng TWINT, bạn cần có tài khoản đăng ký với số điện thoại tại Thụy Sĩ.\n\nThanh toán TWINT chỉ có thể gửi giữa các tài khoản TWINT Thụy Sĩ, nên cả hai bên phải dùng TWINT. Tiền tệ giao dịch là CHF.
payment.twint.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.twint.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng TWINT của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.nip.info.account=Để dùng NIP, bạn cần có tài khoản ngân hàng Nigeria hoặc ví tiền di động như OPay hoặc PalmPay.\n\nThanh toán được gửi bằng chuyển khoản tức thì NIP đến số tài khoản 10 chữ số của người nhận tại ngân hàng hoặc nhà cung cấp ví của họ. Tiền tệ giao dịch là NGN.
payment.nip.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị khi kiểm tra tên chuyển khoản khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.nip.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với số tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.pagoMovil.info.account=Để dùng Pago Móvil, bạn cần có tài khoản ngân hàng Venezuela đã bật Pago Móvil, đăng ký với số điện thoại, cédula và ngân hàng của bạn.\n\nThanh toán được gửi bằng chuyển khoản liên ngân hàng đến số điện thoại, cédula và ngân hàng được cung cấp. Tiền tệ giao dịch là VES.
payment.pagoMovil.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại, cédula và ngân hàng được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.pagoMovil.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số điện thoại, cédula và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.qris.info.account=Để dùng QRIS / BI-FAST, bạn cần có tài khoản ngân hàng Indonesia hoặc ví điện tử có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi bằng chuyển khoản tức thì BI-FAST đến số tài khoản của người nhận tại ngân hàng hoặc ví điện tử của họ, hoặc bằng cách quét mã QRIS của người nhận. Tiền tệ giao dịch là IDR.
payment.qris.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản và ngân hàng hoặc ví điện tử được cung cấp trong tài khoản của người bán XMR, hoặc mã QRIS mà người bán chia sẻ với bạn trong chat giao dịch, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.qris.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví điện tử của bạn có khớp với số tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.papara.info.account=Để dùng Papara / FAST, bạn cần có tài khoản Papara hoặc tài khoản ngân hàng Thổ Nhĩ Kỳ có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến số Papara, IBAN Thổ Nhĩ Kỳ hoặc số điện thoại địa chỉ dễ nhớ FAST (Kolay Adres) của người nhận. Tiền tệ giao dịch là TRY.
payment.papara.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản hoặc IBAN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.papara.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Papara hoặc ngân hàng của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.raast.info.account=Để dùng Raast / Easypaisa / JazzCash, bạn cần có tài khoản ngân hàng Pakistan hoặc ví di động có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến Raast ID (số điện thoại đã đăng ký), số điện thoại ví hoặc IBAN Pakistan của người nhận. Tiền tệ giao dịch là PKR.
payment.raast.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc IBAN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.raast.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.paynow.info.account=Để dùng PayNow / FAST, bạn cần có tài khoản ngân hàng Singapore hoặc ví điện tử có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến định danh PayNow của người nhận: số điện thoại đã đăng ký hoặc NRIC/FIN. Tiền tệ giao dịch là SGD.
payment.paynow.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc NRIC/FIN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.paynow.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.wero.info.account=Để dùng Wero, bạn cần có ứng dụng Wero hoặc ứng dụng của ngân hàng tham gia, với số điện thoại đăng ký tại Đức, Pháp hoặc Bỉ.\n\nThanh toán được gửi đến số điện thoại đã đăng ký của người nhận, nhập theo định dạng quốc tế (ví dụ +49). Tiền tệ giao dịch là EUR.
payment.wero.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.wero.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Wero hoặc ngân hàng của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.fps.info.account=Để dùng FPS (Faster Payment System), bạn cần có tài khoản ngân hàng Hồng Kông hoặc ví điện tử như AlipayHK hoặc WeChat Pay HK.\n\nThanh toán được gửi đến định danh FPS của người nhận: số điện thoại đã đăng ký, FPS ID hoặc địa chỉ email. Tiền tệ giao dịch là HKD.
payment.fps.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại, FPS ID hoặc email và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.fps.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.duitnow.info.account=Để dùng DuitNow, bạn cần có tài khoản ngân hàng Malaysia hoặc ví điện tử như Touch 'n Go, GrabPay hoặc Boost.\n\nThanh toán được gửi đến định danh DuitNow của người nhận: số điện thoại đã đăng ký hoặc NRIC. Tiền tệ giao dịch là MYR.
payment.duitnow.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc NRIC và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.duitnow.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.mbway.info.account=Để dùng MB WAY, bạn cần có ứng dụng MB WAY đã kích hoạt với số điện thoại Bồ Đào Nha của bạn.\n\nThanh toán được gửi đến số điện thoại đã đăng ký của người nhận. Tiền tệ giao dịch là EUR.
payment.mbway.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.mbway.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng MB WAY của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.paypay.accountId=Số điện thoại hoặc PayPay ID
payment.paypay.info.account=Để dùng PayPay, bạn cần có tài khoản PayPay đăng ký tại Nhật Bản.\n\nThanh toán PayPay chỉ có thể gửi giữa những người dùng PayPay, nên cả hai bên phải dùng PayPay. Thanh toán được gửi đến số điện thoại đã đăng ký hoặc PayPay ID của người nhận. Tiền tệ giao dịch là JPY.
payment.paypay.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc PayPay ID được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.paypay.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng PayPay của bạn có khớp với số điện thoại hoặc PayPay ID và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.sbp.info.account=Vui lòng đảm bảo nhập số điện thoại liên kết với tài khoản ngân hàng của bạn để chuyển khoản SBP (Hệ thống thanh toán nhanh).
payment.sbp.info.buyer=Vui lòng chỉ gửi thanh toán qua SBP đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.sbp.info.seller=Vui lòng kiểm tra thanh toán SBP nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.

payment.mir.info.account=Để dùng chuyển khoản thẻ Mir, bạn cần có thẻ ngân hàng Nga có thể nhận chuyển khoản từ thẻ sang thẻ.\n\nThanh toán được gửi đến số thẻ của người nhận. Tiền tệ giao dịch là RUB.
payment.mir.info.buyer=Vui lòng chỉ gửi thanh toán đến số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.mir.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.yoomoney.info.account=Để dùng YooMoney, bạn cần có ví YooMoney đăng ký tại Nga.\n\nThanh toán được gửi đến số ví của người nhận. Tiền tệ giao dịch là RUB.
payment.yoomoney.info.buyer=Vui lòng chỉ gửi thanh toán đến số ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.yoomoney.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ví YooMoney của bạn có khớp với số ví và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.ukraineCard.info.account=Để dùng chuyển khoản từ thẻ sang thẻ, bạn cần có thẻ ngân hàng Ukraine (ví dụ PrivatBank hoặc Monobank) có thể nhận chuyển khoản.\n\nThanh toán được gửi đến số thẻ của người nhận. Tiền tệ giao dịch là UAH.
payment.ukraineCard.info.buyer=Vui lòng chỉ gửi thanh toán đến số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.ukraineCard.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.kaspi.accountId=Số điện thoại hoặc số thẻ
payment.kaspi.info.account=Để dùng Kaspi, bạn cần có tài khoản Kaspi đăng ký tại Kazakhstan.\n\nThanh toán được gửi đến số điện thoại đã đăng ký hoặc số thẻ Kaspi Gold của người nhận. Tiền tệ giao dịch là KZT.
payment.kaspi.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.kaspi.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Kaspi của bạn có khớp với số điện thoại hoặc số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

