account.menu.walletInfo.path.info=Nếu bạn nhập seed words vào ví khác (như Electrum), bạn sẽ cần chỉ định đường dẫn. Chỉ nên làm vậy trong trường hợp khẩn cấp khi bạn mất quyền truy cập vào ví và thư mục dữ liệu Haveno.\nLưu ý rằng chi tiêu từ ví không phải Haveno có thể làm hỏng cấu trúc dữ liệu nội bộ của Haveno gắn với dữ liệu ví, dẫn đến giao dịch thất bại.\n\nKHÔNG BAO GIỜ gửi BSQ từ ví không phải Haveno, vì rất có thể sẽ tạo ra giao dịch BSQ không hợp lệ và làm mất BSQ của bạn.

