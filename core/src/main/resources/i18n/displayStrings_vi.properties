settings.net.warn.useCustomNodes.B2XWarning=Vui lòng chắc chắn rằng nút Monero của bạn là nút Monero đáng tin cậy!\n\nKết nối với nút không tuân thủ nguyên tắc đồng thuận Monero có thể làm hỏng ví của bạn và gây ra các vấn đề trong quá trình giao dịch.\n\nNgười dùng kết nối với nút vi phạm nguyên tắc đồng thuận chịu trách nhiệm đối với các thiệt hại mà việc này gây ra. Các khiếu nại do điều này gây ra sẽ được quyết định theo hướng có lợi cho đối tác bên kia. Sẽ không có hỗ trợ về mặt kỹ thuật nào cho người dùng không tuân thủ cơ chế cảnh báo và bảo vệ của chúng tôi!
