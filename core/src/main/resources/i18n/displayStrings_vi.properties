account.seed.enterPw=Nhập mật khẩu để xem seed words
account.seed.restore.info=Vui lòng sao lưu trước khi khôi phục từ seed words. Khôi phục sẽ thay thế ví hiện tại của bạn. Việc này không khôi phục bản sao lưu. Để khôi phục trạng thái trước đó của ứng dụng, hãy dùng bản sao lưu của thư mục dữ liệu ứng dụng.\n\nSau khi khôi phục, ứng dụng sẽ tự động tắt. Khi bạn khởi động lại, ví sẽ đồng bộ lại với mạng Monero từ chiều cao khôi phục, việc này có thể mất một lúc.
