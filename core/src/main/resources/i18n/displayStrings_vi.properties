offerbook.clonedOffer.info=Nhân bản chào giá sẽ tạo một bản sao mà không cần bảo lưu thêm tiền.\n\nCách này giúp giảm số tiền bị khóa, nên bạn dễ dàng đăng cùng một chào giá trên nhiều thị trường hoặc phương thức thanh toán.\n\nNếu một trong các chào giá nhân bản được nhận, các chào giá còn lại sẽ tự động đóng, vì tất cả dùng chung một khoản tiền bảo lưu.\n\nCác chào giá nhân bản phải có cùng số tiền giao dịch và tiền đặt cọc, nhưng dùng phương thức thanh toán hoặc tiền tệ khác nhau.\n\nXem thêm về nhân bản chào giá tại: [HYPERLINK:https://docs.haveno.exchange/users/haveno-ui/cloning-an-offer/]

