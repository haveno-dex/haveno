payment.zelle.info=Zelle là dịch vụ chuyển tiền hoạt động tốt nhất *thông qua* một ngân hàng khác.\n\n1. Xem trang này để biết ngân hàng của bạn có hỗ trợ Zelle không (và như thế nào): [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. Đặc biệt lưu ý hạn mức chuyển tiền: hạn mức gửi khác nhau tùy ngân hàng, và các ngân hàng thường có hạn mức riêng theo ngày, tuần và tháng.\n\n3. Nếu ngân hàng của bạn không hỗ trợ Zelle, bạn vẫn có thể dùng qua ứng dụng di động Zelle, nhưng hạn mức sẽ thấp hơn nhiều.\n\n4. Tên trên tài khoản Haveno của bạn PHẢI khớp với tên trên tài khoản Zelle/ngân hàng. \n\nNếu bạn không thể hoàn tất giao dịch Zelle như quy định trong hợp đồng giao dịch, bạn có thể mất một phần (hoặc toàn bộ) tiền đặt cọc.\n\nDo Zelle có rủi ro bồi hoàn cao hơn, người bán nên liên hệ người mua chưa ký qua email hoặc SMS để xác minh người mua thực sự sở hữu tài khoản Zelle đã khai trong Haveno.
payment.fasterPayments.newRequirements.info=Một số ngân hàng đã bắt đầu xác minh họ tên đầy đủ của người nhận cho chuyển khoản Faster Payments. Tài khoản Faster Payments hiện tại của bạn chưa có họ tên đầy đủ.\n\nHãy cân nhắc tạo lại tài khoản Faster Payments trong Haveno để cung cấp họ tên đầy đủ cho người mua {0} sau này.\n\nKhi tạo lại tài khoản, hãy sao chép chính xác sort code, số tài khoản và salt xác minh tuổi tài khoản từ tài khoản cũ sang tài khoản mới. Như vậy tuổi và trạng thái ký của tài khoản hiện tại sẽ được giữ nguyên.
payment.fasterPayments.ukSortCode=Sort code (Anh)
payment.moneyGram.info=Khi dùng MoneyGram, người mua XMR phải gửi Số xác thực và ảnh biên nhận qua email cho người bán XMR. Biên nhận phải ghi rõ họ tên đầy đủ, quốc gia, tiểu bang của người bán và số tiền. Email của người bán sẽ hiển thị cho người mua trong quá trình giao dịch.
payment.westernUnion.info=Khi dùng Western Union, người mua XMR phải gửi MTCN (số theo dõi) và ảnh biên nhận qua email cho người bán XMR. Biên nhận phải ghi rõ họ tên đầy đủ, thành phố, quốc gia của người bán và số tiền. Email của người bán sẽ hiển thị cho người mua trong quá trình giao dịch.
payment.halCash.info=Khi sử dụng HalCash người mua XMR cần phải gửi cho người bán XMR mã HalCash bằng tin nhắn điện thoại.\n\nVui lòng đảm bảo là lượng tiền này không vượt quá số lượng tối đa mà ngân hàng của bạn cho phép gửi khi dùng HalCash. Số lượng rút tối thiểu là 10 EUR và tối đa là 600 EUR. Nếu rút nhiều lần thì giới hạn sẽ là 3000 EUR/người nhận/ngày và 6000 EUR/người nhận/tháng. Vui lòng kiểm tra chéo những giới hạn này với ngân hàng của bạn để chắc chắn là họ cũng dùng những giới hạn như ghi ở đây.\n\nSố tiền rút phải là bội số của 10 EUR vì bạn không thể rút các mệnh giá khác từ ATM. Giao diện người dùng ở phần 'tạo chào giá' và 'chấp nhận chào giá' sẽ điều chỉnh lượng XMR sao cho lượng EUR tương ứng sẽ chính xác. Bạn không thể dùng giá thị trường vì lượng EUR sẽ thay đổi khi giá thay đổi.\n\nTrường hợp tranh chấp, người mua XMR cần phải cung cấp bằng chứng chứng minh mình đã gửi EUR.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Lưu ý rằng mọi chuyển khoản ngân hàng đều có một mức rủi ro bồi hoàn nhất định. Để giảm rủi ro này, Haveno đặt giới hạn cho mỗi giao dịch dựa trên mức rủi ro bồi hoàn ước tính của phương thức thanh toán được dùng.\n\nVới phương thức thanh toán này, giới hạn mua và bán mỗi giao dịch của bạn là {2}.\n\nGiới hạn này chỉ áp dụng cho quy mô của một giao dịch; bạn có thể thực hiện bao nhiêu giao dịch tùy ý.\n\nXem chi tiết trên wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Để hạn chế rủi ro bồi hoàn, Haveno đặt giới hạn mỗi giao dịch cho loại tài khoản thanh toán này dựa trên 2 yếu tố sau:\n\n1. Rủi ro bồi hoàn chung của phương thức thanh toán\n2. Trạng thái ký tài khoản\n\nTài khoản thanh toán này chưa được ký, nên bị giới hạn mua {0} mỗi giao dịch. Sau khi ký, giới hạn mua sẽ tăng như sau:\n\n● Trước khi ký và trong 30 ngày sau khi ký, giới hạn mua mỗi giao dịch của bạn là {0}\n● 30 ngày sau khi ký, giới hạn mua mỗi giao dịch của bạn là {1}\n● 60 ngày sau khi ký, giới hạn mua mỗi giao dịch của bạn là {2}\n\nGiới hạn bán không bị ảnh hưởng bởi việc ký tài khoản. Bạn có thể bán {2} trong một giao dịch ngay lập tức.\n\nCác giới hạn này chỉ áp dụng cho quy mô của một giao dịch; bạn có thể thực hiện bao nhiêu giao dịch tùy ý. \n\nXem chi tiết trên wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

payment.cashDeposit.info=Vui lòng xác nhận rằng ngân hàng của bạn cho phép nạp tiền mặt vào tài khoản của người khác. Chẳng hạn, Ngân Hàng Mỹ và Wells Fargo không còn cho phép nạp tiền như vậy nữa.

payment.revolut.info=Revolut yêu cầu 'Tên người dùng' làm ID tài khoản, không phải số điện thoại hay email như trước đây.
payment.account.revolut.addUserNameInfo={0}\nTài khoản Revolut hiện tại của bạn ({1}) chưa có 'Tên người dùng'.\nVui lòng nhập 'Tên người dùng' Revolut để cập nhật dữ liệu tài khoản.\nViệc này không ảnh hưởng đến trạng thái ký tuổi tài khoản của bạn.
payment.revolut.addUserNameInfo.headLine=Cập nhật tài khoản Revolut

payment.cashapp.info=Vui lòng lưu ý rằng Cash App có rủi ro bồi hoàn cao hơn so với hầu hết các chuyển khoản ngân hàng.
payment.venmo.info=Vui lòng lưu ý rằng Venmo có rủi ro bồi hoàn cao hơn so với hầu hết các chuyển khoản ngân hàng.
payment.paypal.info=Vui lòng lưu ý rằng PayPal có rủi ro bồi hoàn cao hơn so với hầu hết các chuyển khoản ngân hàng.

payment.amazonGiftCard.upgrade=Phương thức thanh toán thẻ quà tặng Amazon yêu cầu chỉ định quốc gia.
payment.account.amazonGiftCard.addCountryInfo={0}\nTài khoản Amazon Gift Card hiện tại của bạn ({1}) chưa chỉ định quốc gia.\nVui lòng nhập quốc gia của Amazon Gift Card để cập nhật dữ liệu tài khoản.\nViệc này không ảnh hưởng đến trạng thái tuổi tài khoản của bạn.
payment.amazonGiftCard.upgrade.headLine=Cập nhật tài khoản Amazon Gift Card
payment.swift.info.account=Hãy xem kỹ các hướng dẫn cốt lõi khi dùng SWIFT trên Haveno:\n\n- điền đầy đủ và chính xác tất cả các trường \n- người mua phải gửi thanh toán bằng loại tiền tệ do người tạo chào giá chỉ định \n- người mua phải dùng mô hình chia sẻ phí (SHA) \n- người mua và người bán có thể phải chịu phí, nên hãy kiểm tra biểu phí ngân hàng trước \n\nSWIFT phức tạp hơn các phương thức thanh toán khác, vui lòng dành chút thời gian xem hướng dẫn đầy đủ trên wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=Để mua monero bằng SWIFT, bạn phải:\n\n- gửi thanh toán bằng loại tiền tệ do người tạo chào giá chỉ định \n- dùng mô hình chia sẻ phí (SHA) khi gửi thanh toán\n\nVui lòng xem thêm hướng dẫn trên wiki để tránh bị phạt và đảm bảo giao dịch suôn sẻ [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=Người gửi SWIFT bắt buộc dùng mô hình chia sẻ phí (SHA) khi gửi thanh toán.\n\nNếu bạn nhận được thanh toán SWIFT không dùng SHA, hãy mở đơn hòa giải.\n\nVui lòng xem thêm hướng dẫn trên wiki để tránh bị phạt và đảm bảo giao dịch suôn sẻ [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=Hãy chắc chắn bạn cung cấp:\n\n● Họ tên đầy đủ chủ tài khoản\n● Số tài khoản\n● Số IFSC\n\nCác thông tin này phải khớp với tài khoản ngân hàng bạn dùng để gửi / nhận thanh toán.\n\nLưu ý mỗi giao dịch chỉ gửi được tối đa Rs. 200.000. Nếu giao dịch vượt số tiền này, cần thực hiện nhiều lần chuyển. Tuy nhiên, lưu ý giới hạn tối đa mỗi ngày là Rs. 1.000.000.\n\nMột số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.imps.info.buyer=Vui lòng chỉ gửi thanh toán tới thông tin tài khoản cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là Rs. 200.000 mỗi giao dịch.\n\nNếu giao dịch của bạn vượt Rs. 200.000, bạn sẽ phải chuyển nhiều lần. Tuy nhiên, lưu ý giới hạn tối đa mỗi ngày là Rs. 1.000.000.\n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.imps.info.seller=Nếu bạn dự định nhận trên Rs. 200.000 mỗi giao dịch, hãy chuẩn bị cho việc người mua phải chuyển nhiều lần. Tuy nhiên, lưu ý giới hạn tối đa mỗi ngày là Rs. 1.000.000.\n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.neft.info.account=Hãy chắc chắn bạn cung cấp:\n\n● Họ tên đầy đủ chủ tài khoản\n● Số tài khoản\n● Số IFSC\n\nCác thông tin này phải khớp với tài khoản ngân hàng bạn dùng để gửi / nhận thanh toán.\n\nLưu ý mỗi giao dịch chỉ gửi được tối đa Rs. 50.000. Nếu giao dịch vượt số tiền này, cần thực hiện nhiều lần chuyển.\n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.neft.info.buyer=Vui lòng chỉ gửi thanh toán tới thông tin tài khoản cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là Rs. 50.000 mỗi giao dịch.\n\nNếu giao dịch của bạn vượt Rs. 50.000, bạn sẽ phải chuyển nhiều lần.\n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.neft.info.seller=Nếu bạn dự định nhận trên Rs. 50.000 mỗi giao dịch, hãy chuẩn bị cho việc người mua phải chuyển nhiều lần.\n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.paytm.info.account=Hãy chắc chắn bạn cung cấp email hoặc số điện thoại khớp với email hoặc số điện thoại trong tài khoản PayTM của bạn. \n\nKhi lập tài khoản PayTM không có KYC, người dùng bị giới hạn: \n\n● Gửi tối đa Rs. 5.000 mỗi giao dịch.\n● Giữ tối đa Rs. 10.000 trong ví PayTM.\n\nNếu bạn dự định giao dịch trên 5.000 mỗi giao dịch, bạn cần hoàn tất KYC với PayTM. Với KYC, người dùng bị giới hạn:\n\n● Gửi tối đa Rs. 100.000 mỗi giao dịch.\n● Giữ tối đa Rs. 100.000 trong ví PayTM.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Giao dịch vượt giới hạn tài khoản PayTM có thể phải thực hiện trong nhiều ngày hoặc bị hủy.
payment.paytm.info.buyer=Vui lòng chỉ gửi thanh toán tới địa chỉ email hoặc số điện thoại được cung cấp.\n\nNếu bạn dự định giao dịch trên Rs. 5.000 mỗi giao dịch, bạn cần hoàn tất KYC với PayTM.\n\nKhông có KYC, gửi được Rs. 5.000 mỗi giao dịch.\n\nCó KYC, gửi được Rs. 100.000 mỗi giao dịch.
payment.paytm.info.seller=Nếu bạn dự định giao dịch trên Rs. 5.000 mỗi giao dịch, bạn cần hoàn tất KYC với PayTM. Với KYC, người dùng bị giới hạn:\n\n● Gửi tối đa Rs. 100.000 mỗi giao dịch.\n● Giữ tối đa Rs. 100.000 trong ví PayTM.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Vì ví PayTM chỉ giữ được tối đa Rs. 100.000, hãy nhớ chuyển rupee ra ngoài thường xuyên.
payment.rtgs.info.account=RTGS dành cho các giao dịch lớn từ Rs. 200.000 trở lên.\n\nKhi thiết lập tài khoản thanh toán RTGS, hãy chắc chắn bạn cung cấp:\n\n● Họ tên đầy đủ chủ tài khoản\n● Số tài khoản\n● Số IFSC\n\nCác thông tin này phải khớp với tài khoản ngân hàng bạn dùng để gửi / nhận thanh toán.\n\nLưu ý số tiền giao dịch tối thiểu mỗi lần gửi là Rs. 200.000. Nếu giao dịch dưới mức này, giao dịch có thể bị hủy hoặc cả hai thương gia phải thỏa thuận phương thức thanh toán khác (ví dụ IMPS hoặc UPI).
payment.rtgs.info.buyer=Vui lòng chỉ gửi thanh toán tới thông tin tài khoản cung cấp trong Haveno.\n\nLưu ý số tiền giao dịch tối thiểu mỗi lần gửi là Rs. 200.000. Nếu giao dịch dưới mức này, giao dịch có thể bị hủy hoặc cả hai thương gia phải thỏa thuận phương thức thanh toán khác (ví dụ IMPS hoặc UPI).
payment.rtgs.info.seller=Lưu ý số tiền giao dịch tối thiểu mỗi lần gửi là Rs. 200.000. Nếu giao dịch dưới mức này, giao dịch có thể bị hủy hoặc cả hai thương gia phải thỏa thuận phương thức thanh toán khác (ví dụ IMPS hoặc UPI).
payment.upi.info.account=Hãy chắc chắn bạn cung cấp Địa chỉ thanh toán ảo (VPA), còn gọi là UPI ID. Định dạng giống như một địa chỉ email: có ký hiệu “@” ở giữa. Ví dụ, UPI ID của bạn có thể là “tên_người_nhận@tên_ngân_hàng” hoặc “số_điện_thoại@tên_ngân_hàng.” \n\nVới UPI, giới hạn gửi tối đa là Rs. 100.000 mỗi giao dịch. \n\nNếu bạn dự định giao dịch trên Rs. 100.000 mỗi giao dịch, nhiều khả năng sẽ phải chuyển nhiều lần. \n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.upi.info.buyer=Vui lòng chỉ gửi thanh toán tới VPA / UPI ID cung cấp trong Haveno. \n\nQuy mô giao dịch tối đa là Rs. 100.000 mỗi giao dịch. \n\nNếu giao dịch của bạn vượt Rs. 100.000, bạn sẽ phải chuyển nhiều lần. \n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.upi.info.seller=Nếu bạn dự định nhận trên Rs. 100.000 mỗi giao dịch, hãy chuẩn bị cho việc người mua phải chuyển nhiều lần. \n\nLưu ý một số ngân hàng có giới hạn khác cho khách hàng của họ.
payment.celpay.info.account=Hãy chắc chắn bạn cung cấp email đã đăng ký với tài khoản Celsius của bạn. Như vậy khi gửi tiền sẽ hiển thị đúng tài khoản gửi, và khi nhận tiền sẽ được ghi có vào tài khoản của bạn.\n\nNgười dùng CelPay bị giới hạn gửi 2.500 $ (hoặc tương đương bằng tiền tệ/crypto khác) trong 24 giờ.\n\nGiao dịch vượt giới hạn tài khoản CelPay có thể phải thực hiện trong nhiều ngày hoặc bị hủy.\n\nCelPay hỗ trợ nhiều stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nNgười mua XMR có thể gửi bất kỳ stablecoin nào cùng loại tiền tệ cho người bán XMR.
payment.celpay.info.buyer=Vui lòng chỉ gửi thanh toán tới địa chỉ email do người bán XMR cung cấp bằng cách gửi liên kết thanh toán.\n\nCelPay bị giới hạn gửi 2.500 $ (hoặc tương đương bằng tiền tệ/crypto khác) trong 24 giờ.\n\nGiao dịch vượt giới hạn tài khoản CelPay có thể phải thực hiện trong nhiều ngày hoặc bị hủy.\n\nCelPay hỗ trợ nhiều stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nNgười mua XMR có thể gửi bất kỳ stablecoin nào cùng loại tiền tệ cho người bán XMR.
payment.celpay.info.seller=Người bán XMR sẽ nhận thanh toán qua một liên kết thanh toán bảo mật. Hãy chắc chắn liên kết thanh toán qua email chứa địa chỉ email do người mua XMR cung cấp.\n\nNgười dùng CelPay bị giới hạn gửi 2.500 $ (hoặc tương đương bằng tiền tệ/crypto khác) trong 24 giờ.\n\nGiao dịch vượt giới hạn tài khoản CelPay có thể phải thực hiện trong nhiều ngày hoặc bị hủy.\n\nCelPay hỗ trợ nhiều stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nNgười bán XMR sẽ nhận bất kỳ stablecoin nào cùng loại tiền tệ từ người mua XMR. Người mua XMR có thể gửi bất kỳ stablecoin nào cùng loại tiền tệ.
payment.celpay.supportedCurrenciesForReceiver=Tiền tệ được hỗ trợ (lưu ý: tất cả các tiền tệ bên dưới là stablecoin được hỗ trợ trong ứng dụng Celsius. Giao dịch bằng stablecoin, không phải tiền pháp định.)
payment.nequi.info.account=Hãy chắc chắn bạn cung cấp số điện thoại gắn với tài khoản Nequi của bạn.\n\nKhi lập tài khoản Nequi, hạn mức thanh toán tối đa khoảng 7.000.000 COP gửi mỗi tháng.\n\nNếu bạn dự định giao dịch trên 7.000.000 COP mỗi giao dịch, bạn cần hoàn tất KYC với Bancolombia và trả phí khoảng 15.000 COP. Sau đó mọi giao dịch sẽ chịu thuế 0.4%. Hãy nắm rõ các mức thuế mới nhất.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.nequi.info.buyer=Vui lòng chỉ gửi thanh toán tới số điện thoại ghi trong tài khoản Haveno của người bán XMR.\n\nKhi lập tài khoản Nequi, hạn mức thanh toán tối đa khoảng 7.000.000 COP gửi mỗi tháng.\n\nNếu bạn dự định giao dịch trên 7.000.000 COP mỗi giao dịch, bạn cần hoàn tất KYC với Bancolombia và trả phí khoảng 15.000 COP. Sau đó mọi giao dịch sẽ chịu thuế 0.4%. Hãy nắm rõ các mức thuế mới nhất.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.nequi.info.seller=Vui lòng kiểm tra thanh toán nhận được khớp với số điện thoại ghi trong tài khoản Haveno của người mua XMR.\n\nKhi lập tài khoản Nequi, hạn mức thanh toán tối đa khoảng 7.000.000 COP gửi mỗi tháng.\n\nNếu bạn dự định giao dịch trên 7.000.000 COP mỗi giao dịch, bạn cần hoàn tất KYC với Bancolombia và trả phí khoảng 15.000 COP. Sau đó mọi giao dịch sẽ chịu thuế 0.4%. Hãy nắm rõ các mức thuế mới nhất.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.mpesa.info.account=Vui lòng đảm bảo nhập số điện thoại đã đăng ký với tài khoản M-Pesa của bạn.
payment.mpesa.info.buyer=Vui lòng chỉ gửi thanh toán bằng M-Pesa đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.mpesa.info.seller=Vui lòng kiểm tra thanh toán M-Pesa nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.mercadoPago.info.account=Vui lòng đảm bảo nhập email hoặc số điện thoại đã đăng ký với tài khoản Mercado Pago của bạn.
payment.mercadoPago.info.buyer=Vui lòng chỉ gửi thanh toán bằng Mercado Pago đến email hoặc số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.mercadoPago.info.seller=Vui lòng kiểm tra thanh toán Mercado Pago nhận được có khớp với email hoặc số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.gcash.info.account=Vui lòng đảm bảo nhập số điện thoại đã đăng ký với tài khoản GCash của bạn.
payment.gcash.info.buyer=Vui lòng chỉ gửi thanh toán bằng GCash đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.gcash.info.seller=Vui lòng kiểm tra thanh toán GCash nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.momo.info.account=Vui lòng đảm bảo nhập số điện thoại đã đăng ký với tài khoản MoMo của bạn.
payment.momo.info.buyer=Vui lòng chỉ gửi thanh toán bằng MoMo đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.momo.info.seller=Vui lòng kiểm tra thanh toán MoMo nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.spei.info.account=Vui lòng đảm bảo nhập CLABE (số tài khoản liên ngân hàng 18 chữ số) đã đăng ký với tài khoản ngân hàng của bạn để chuyển khoản SPEI.
payment.spei.info.buyer=Vui lòng chỉ gửi thanh toán qua SPEI đến CLABE được cung cấp trong tài khoản Haveno của người bán XMR.
payment.spei.info.seller=Vui lòng kiểm tra thanh toán SPEI nhận được có khớp với CLABE được cung cấp trong tài khoản Haveno của người mua XMR hay không.
payment.bizum.info.account=Để dùng Bizum, bạn cần có tài khoản ngân hàng (IBAN) tại Tây Ban Nha và đã đăng ký dịch vụ.\n\nBizum dùng được cho giao dịch từ 0.50 € đến 1.000 €.\n\nSố tiền giao dịch tối đa bạn có thể gửi/nhận qua Bizum là 2.000 € mỗi ngày.\n\nNgười dùng Bizum có tối đa 150 lần giao dịch mỗi tháng.\n\nTuy nhiên, mỗi ngân hàng có thể đặt giới hạn riêng cho khách hàng trong phạm vi các giới hạn trên.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.bizum.info.buyer=Vui lòng chỉ gửi thanh toán tới số điện thoại di động của người bán XMR như cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là 1.000 € mỗi lần thanh toán. Số tiền tối đa bạn có thể gửi qua Bizum là 2.000 € mỗi ngày.\n\nNếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.bizum.info.seller=Hãy chắc chắn thanh toán được nhận từ số điện thoại di động của người mua XMR như cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là 1.000 € mỗi lần thanh toán. Số tiền tối đa bạn có thể nhận qua Bizum là 2.000 € mỗi ngày.\n\nNếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.

payment.blik.info.account=Để dùng BLIK, bạn cần có tài khoản ngân hàng tại Ba Lan với ứng dụng ngân hàng di động hỗ trợ BLIK.\n\nNgười mua XMR thanh toán bằng cách tạo mã BLIK và gửi cho người bán XMR qua chat giao dịch, nên cả hai bên phải trực tuyến để hoàn tất thanh toán.
payment.blik.info.buyer=Để thanh toán, hãy tạo mã BLIK trong ứng dụng ngân hàng di động của bạn và gửi cho người bán XMR qua chat giao dịch.\n\nMã BLIK chỉ có hiệu lực trong 2 phút, nên hãy chắc chắn người bán đang phản hồi trong chat giao dịch trước khi tạo mã.
payment.blik.info.seller=Người mua XMR sẽ gửi cho bạn mã BLIK qua chat giao dịch.\n\nMã BLIK chỉ có hiệu lực trong 2 phút, nên hãy dùng mã để nhận thanh toán ngay sau khi mã được gửi.

payment.vippsMobilePay.info.account=Để dùng Vipps MobilePay, bạn cần có tài khoản đăng ký với số điện thoại tại Na Uy, Đan Mạch hoặc Phần Lan.\n\nKhông thể gửi thanh toán giữa các quốc gia, nên cả hai bên phải có tài khoản ở cùng một quốc gia. Tiền tệ giao dịch được xác định theo quốc gia của tài khoản bạn.
payment.vippsMobilePay.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.vippsMobilePay.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Vipps hoặc MobilePay của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.twint.info.account=Để dùng TWINT, bạn cần có tài khoản đăng ký với số điện thoại tại Thụy Sĩ.\n\nThanh toán TWINT chỉ có thể gửi giữa các tài khoản TWINT Thụy Sĩ, nên cả hai bên phải dùng TWINT. Tiền tệ giao dịch là CHF.
payment.twint.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.twint.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng TWINT của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.nip.info.account=Để dùng NIP, bạn cần có tài khoản ngân hàng Nigeria hoặc ví tiền di động như OPay hoặc PalmPay.\n\nThanh toán được gửi bằng chuyển khoản tức thì NIP đến số tài khoản 10 chữ số của người nhận tại ngân hàng hoặc nhà cung cấp ví của họ. Tiền tệ giao dịch là NGN.
payment.nip.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị khi kiểm tra tên chuyển khoản khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.nip.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với số tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.pagoMovil.info.account=Để dùng Pago Móvil, bạn cần có tài khoản ngân hàng Venezuela đã bật Pago Móvil, đăng ký với số điện thoại, cédula và ngân hàng của bạn.\n\nThanh toán được gửi bằng chuyển khoản liên ngân hàng đến số điện thoại, cédula và ngân hàng được cung cấp. Tiền tệ giao dịch là VES.
payment.pagoMovil.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại, cédula và ngân hàng được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.pagoMovil.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số điện thoại, cédula và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.qris.info.account=Để dùng QRIS / BI-FAST, bạn cần có tài khoản ngân hàng Indonesia hoặc ví điện tử có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi bằng chuyển khoản tức thì BI-FAST đến số tài khoản của người nhận tại ngân hàng hoặc ví điện tử của họ, hoặc bằng cách quét mã QRIS của người nhận. Tiền tệ giao dịch là IDR.
payment.qris.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản và ngân hàng hoặc ví điện tử được cung cấp trong tài khoản của người bán XMR, hoặc mã QRIS mà người bán chia sẻ với bạn trong chat giao dịch, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.qris.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví điện tử của bạn có khớp với số tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.papara.info.account=Để dùng Papara / FAST, bạn cần có tài khoản Papara hoặc tài khoản ngân hàng Thổ Nhĩ Kỳ có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến số Papara, IBAN Thổ Nhĩ Kỳ hoặc số điện thoại địa chỉ dễ nhớ FAST (Kolay Adres) của người nhận. Tiền tệ giao dịch là TRY.
payment.papara.info.buyer=Vui lòng chỉ gửi thanh toán đến số tài khoản hoặc IBAN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.papara.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Papara hoặc ngân hàng của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.raast.info.account=Để dùng Raast / Easypaisa / JazzCash, bạn cần có tài khoản ngân hàng Pakistan hoặc ví di động có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến Raast ID (số điện thoại đã đăng ký), số điện thoại ví hoặc IBAN Pakistan của người nhận. Tiền tệ giao dịch là PKR.
payment.raast.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc IBAN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.raast.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.paynow.info.account=Để dùng PayNow / FAST, bạn cần có tài khoản ngân hàng Singapore hoặc ví điện tử có thể nhận chuyển khoản tức thì.\n\nThanh toán được gửi đến định danh PayNow của người nhận: số điện thoại đã đăng ký hoặc NRIC/FIN. Tiền tệ giao dịch là SGD.
payment.paynow.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc NRIC/FIN và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.paynow.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.wero.info.account=Để dùng Wero, bạn cần có ứng dụng Wero hoặc ứng dụng của ngân hàng tham gia, với số điện thoại đăng ký tại Đức, Pháp hoặc Bỉ.\n\nThanh toán được gửi đến số điện thoại đã đăng ký của người nhận, nhập theo định dạng quốc tế (ví dụ +49). Tiền tệ giao dịch là EUR.
payment.wero.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.wero.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Wero hoặc ngân hàng của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.fps.info.account=Để dùng FPS (Faster Payment System), bạn cần có tài khoản ngân hàng Hồng Kông hoặc ví điện tử như AlipayHK hoặc WeChat Pay HK.\n\nThanh toán được gửi đến định danh FPS của người nhận: số điện thoại đã đăng ký, FPS ID hoặc địa chỉ email. Tiền tệ giao dịch là HKD.
payment.fps.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại, FPS ID hoặc email và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.fps.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.duitnow.info.account=Để dùng DuitNow, bạn cần có tài khoản ngân hàng Malaysia hoặc ví điện tử như Touch 'n Go, GrabPay hoặc Boost.\n\nThanh toán được gửi đến định danh DuitNow của người nhận: số điện thoại đã đăng ký hoặc NRIC. Tiền tệ giao dịch là MYR.
payment.duitnow.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc NRIC và ngân hàng hoặc ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.duitnow.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng hoặc ví của bạn có khớp với thông tin tài khoản và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.mbway.info.account=Để dùng MB WAY, bạn cần có ứng dụng MB WAY đã kích hoạt với số điện thoại Bồ Đào Nha của bạn.\n\nThanh toán được gửi đến số điện thoại đã đăng ký của người nhận. Tiền tệ giao dịch là EUR.
payment.mbway.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.mbway.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng MB WAY của bạn có khớp với số điện thoại và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.paypay.accountId=Số điện thoại hoặc PayPay ID
payment.paypay.info.account=Để dùng PayPay, bạn cần có tài khoản PayPay đăng ký tại Nhật Bản.\n\nThanh toán PayPay chỉ có thể gửi giữa những người dùng PayPay, nên cả hai bên phải dùng PayPay. Thanh toán được gửi đến số điện thoại đã đăng ký hoặc PayPay ID của người nhận. Tiền tệ giao dịch là JPY.
payment.paypay.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc PayPay ID được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.paypay.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng PayPay của bạn có khớp với số điện thoại hoặc PayPay ID và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.sbp.info.account=Vui lòng đảm bảo nhập số điện thoại liên kết với tài khoản ngân hàng của bạn để chuyển khoản SBP (Hệ thống thanh toán nhanh).
payment.sbp.info.buyer=Vui lòng chỉ gửi thanh toán qua SBP đến số điện thoại được cung cấp trong tài khoản Haveno của người bán XMR.
payment.sbp.info.seller=Vui lòng kiểm tra thanh toán SBP nhận được có khớp với số điện thoại được cung cấp trong tài khoản Haveno của người mua XMR hay không.

payment.mir.info.account=Để dùng chuyển khoản thẻ Mir, bạn cần có thẻ ngân hàng Nga có thể nhận chuyển khoản từ thẻ sang thẻ.\n\nThanh toán được gửi đến số thẻ của người nhận. Tiền tệ giao dịch là RUB.
payment.mir.info.buyer=Vui lòng chỉ gửi thanh toán đến số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.mir.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.yoomoney.info.account=Để dùng YooMoney, bạn cần có ví YooMoney đăng ký tại Nga.\n\nThanh toán được gửi đến số ví của người nhận. Tiền tệ giao dịch là RUB.
payment.yoomoney.info.buyer=Vui lòng chỉ gửi thanh toán đến số ví được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.yoomoney.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ví YooMoney của bạn có khớp với số ví và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.ukraineCard.info.account=Để dùng chuyển khoản từ thẻ sang thẻ, bạn cần có thẻ ngân hàng Ukraine (ví dụ PrivatBank hoặc Monobank) có thể nhận chuyển khoản.\n\nThanh toán được gửi đến số thẻ của người nhận. Tiền tệ giao dịch là UAH.
payment.ukraineCard.info.buyer=Vui lòng chỉ gửi thanh toán đến số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận do ứng dụng ngân hàng của bạn hiển thị khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.ukraineCard.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng ngân hàng của bạn có khớp với số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.

payment.kaspi.accountId=Số điện thoại hoặc số thẻ
payment.kaspi.info.account=Để dùng Kaspi, bạn cần có tài khoản Kaspi đăng ký tại Kazakhstan.\n\nThanh toán được gửi đến số điện thoại đã đăng ký hoặc số thẻ Kaspi Gold của người nhận. Tiền tệ giao dịch là KZT.
payment.kaspi.info.buyer=Vui lòng chỉ gửi thanh toán đến số điện thoại hoặc số thẻ được cung cấp trong tài khoản của người bán XMR, và đảm bảo tên người nhận hiển thị trong ứng dụng khớp với tên chủ tài khoản của người bán trước khi xác nhận.
payment.kaspi.info.seller=Vui lòng kiểm tra thanh toán nhận được trong ứng dụng Kaspi của bạn có khớp với số điện thoại hoặc số thẻ và tên chủ tài khoản được cung cấp trong tài khoản của người mua XMR hay không.
payment.pix.info.account=Hãy chắc chắn bạn cung cấp Khóa Pix đã chọn. Có bốn loại khóa: CPF (mã số cá nhân) hoặc CNPJ (mã số pháp nhân), địa chỉ e-mail, số điện thoại, hoặc một khóa ngẫu nhiên do hệ thống tạo gọi là UUID. Mỗi tài khoản Pix phải dùng một khóa khác nhau. Cá nhân có thể tạo tối đa năm khóa cho mỗi tài khoản của mình.\n\nKhi giao dịch trên Haveno, người mua XMR nên dùng Khóa Pix của mình làm nội dung thanh toán để người bán XMR dễ nhận ra thanh toán đến từ họ.
payment.pix.info.buyer=Vui lòng chỉ gửi thanh toán tới Khóa Pix ghi trong tài khoản Haveno của người bán XMR.\n\nHãy dùng Khóa Pix của bạn làm nội dung thanh toán để người bán XMR dễ nhận ra thanh toán đến từ bạn.
payment.pix.info.seller=Vui lòng kiểm tra nội dung thanh toán nhận được khớp với Khóa Pix ghi trong tài khoản Haveno của người mua XMR.
payment.pix.key=Khóa Pix (CPF, CNPJ, Email, Số điện thoại hoặc UUID)
payment.monese.info.account=Monese là ứng dụng ngân hàng cho người dùng GBP, EUR và RON*. Monese cho phép gửi tiền tới các tài khoản Monese khác ngay lập tức và miễn phí bằng bất kỳ tiền tệ nào được hỗ trợ.\n\n*Để mở tài khoản RON trên Monese, bạn cần sống ở Romania hoặc có quốc tịch Romania.\n\nKhi thiết lập tài khoản Monese trong Haveno, hãy chắc chắn bạn cung cấp tên và số điện thoại khớp với tài khoản Monese. Như vậy khi gửi tiền sẽ hiển thị đúng tài khoản gửi, và khi nhận tiền sẽ được ghi có vào tài khoản của bạn.
payment.monese.info.buyer=Vui lòng chỉ gửi thanh toán tới số điện thoại do người bán XMR cung cấp trong tài khoản Haveno của họ. Hãy để trống nội dung thanh toán.
payment.monese.info.seller=Người bán XMR sẽ nhận thanh toán từ số điện thoại / tên hiển thị trong tài khoản Haveno của người mua XMR.
payment.satispay.info.account=Để dùng Satispay, bạn cần có tài khoản ngân hàng (IBAN) tại Ý và đã đăng ký dịch vụ.\n\nGiới hạn tài khoản Satispay được đặt riêng cho từng người. Nếu muốn giao dịch số tiền lớn hơn, bạn cần liên hệ hỗ trợ Satispay để tăng giới hạn. Người dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.satispay.info.buyer=Vui lòng chỉ gửi thanh toán tới số điện thoại di động của người bán XMR như cung cấp trong Haveno.\n\nGiới hạn tài khoản Satispay được đặt riêng cho từng người. Nếu muốn giao dịch số tiền lớn hơn, bạn cần liên hệ hỗ trợ Satispay để tăng giới hạn. Người dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.satispay.info.seller=Hãy chắc chắn thanh toán được nhận từ số điện thoại di động / tên của người mua XMR như cung cấp trong Haveno.\n\nGiới hạn tài khoản Satispay được đặt riêng cho từng người. Nếu muốn giao dịch số tiền lớn hơn, bạn cần liên hệ hỗ trợ Satispay để tăng giới hạn. Người dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.tikkie.info.account=Để dùng Tikkie, bạn cần có tài khoản ngân hàng (IBAN) tại Hà Lan và đã đăng ký dịch vụ.\n\nKhi gửi yêu cầu thanh toán Tikkie tới một cá nhân, bạn có thể yêu cầu nhận tối đa 750 € mỗi yêu cầu Tikkie. Số tiền tối đa bạn có thể yêu cầu trong 24 giờ là 2.500 € mỗi tài khoản Tikkie.\n\nTuy nhiên, mỗi ngân hàng có thể đặt giới hạn riêng cho khách hàng trong phạm vi các giới hạn này.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.tikkie.info.buyer=Vui lòng yêu cầu người bán XMR gửi liên kết thanh toán trong chat thương gia. Khi người bán XMR đã gửi liên kết thanh toán đúng số tiền giao dịch, hãy tiến hành thanh toán.\n\nKhi người bán XMR yêu cầu thanh toán Tikkie, số tiền tối đa họ có thể yêu cầu là 750 € mỗi yêu cầu Tikkie. Nếu giao dịch vượt số tiền đó, người bán XMR sẽ phải gửi nhiều yêu cầu cho đủ số tiền giao dịch. Số tiền tối đa có thể yêu cầu trong một ngày là 2.500 €.\n\nTuy nhiên, mỗi ngân hàng có thể đặt giới hạn riêng cho khách hàng trong phạm vi các giới hạn này.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.tikkie.info.seller=Vui lòng gửi liên kết thanh toán cho người mua XMR trong chat thương gia. Khi người mua XMR đã gửi thanh toán, hãy kiểm tra thông tin IBAN của họ khớp với thông tin trong Haveno.\n\nKhi người bán XMR yêu cầu thanh toán Tikkie, số tiền tối đa họ có thể yêu cầu là 750 € mỗi yêu cầu Tikkie. Nếu giao dịch vượt số tiền đó, người bán XMR sẽ phải gửi nhiều yêu cầu cho đủ số tiền giao dịch. Số tiền tối đa có thể yêu cầu trong một ngày là 2.500 €.\n\nTuy nhiên, mỗi ngân hàng có thể đặt giới hạn riêng cho khách hàng trong phạm vi các giới hạn này.\n\nNgười dùng cũng cần lưu ý giới hạn tài khoản. Nếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.verse.info.account=Verse là phương thức thanh toán đa tiền tệ, có thể gửi và nhận thanh toán bằng EUR, SEK, HUF, DKK, PLN.\n\nKhi thiết lập tài khoản Verse trong Haveno, hãy chắc chắn bạn cung cấp tên người dùng khớp với tên người dùng trong tài khoản Verse. Như vậy khi gửi tiền sẽ hiển thị đúng tài khoản gửi, và khi nhận tiền sẽ được ghi có vào tài khoản của bạn.\n\nNgười dùng Verse bị giới hạn gửi hoặc nhận 10.000 € mỗi năm (hoặc tương đương bằng ngoại tệ) tính trên tổng thanh toán gửi từ hoặc nhận vào tài khoản thanh toán của họ. Verse có thể tăng giới hạn này theo yêu cầu.
payment.verse.info.buyer=Vui lòng chỉ gửi thanh toán tới tên người dùng do người bán XMR cung cấp trong tài khoản Haveno của họ. Hãy để trống nội dung thanh toán.\n\nNgười dùng Verse bị giới hạn gửi hoặc nhận 10.000 € mỗi năm (hoặc tương đương bằng ngoại tệ) tính trên tổng thanh toán gửi từ hoặc nhận vào tài khoản thanh toán của họ. Verse có thể tăng giới hạn này theo yêu cầu.
payment.verse.info.seller=Người bán XMR sẽ nhận thanh toán từ tên người dùng hiển thị trong tài khoản Haveno của người mua XMR.\n\nNgười dùng Verse bị giới hạn gửi hoặc nhận 10.000 € mỗi năm (hoặc tương đương bằng ngoại tệ) tính trên tổng thanh toán gửi từ hoặc nhận vào tài khoản thanh toán của họ. Verse có thể tăng giới hạn này theo yêu cầu.
payment.achTransfer.info.account=Khi thêm ACH làm phương thức thanh toán trong Haveno, người dùng nên nắm rõ chi phí gửi và nhận chuyển khoản ACH.
payment.achTransfer.info.buyer=Hãy chắc chắn bạn nắm rõ chi phí gửi chuyển khoản ACH.\n\nKhi thanh toán, chỉ gửi tới thông tin thanh toán ghi trong tài khoản của người bán XMR bằng chuyển khoản ACH.
payment.achTransfer.info.seller=Hãy chắc chắn bạn nắm rõ chi phí nhận chuyển khoản ACH.\n\nKhi nhận thanh toán, hãy kiểm tra thanh toán được nhận từ tài khoản của người mua XMR bằng chuyển khoản ACH.
payment.domesticWire.info.account=Khi thêm Chuyển khoản nội địa làm phương thức thanh toán trong Haveno, người dùng nên nắm rõ chi phí gửi và nhận chuyển khoản.
payment.domesticWire.info.buyer=Hãy chắc chắn bạn nắm rõ chi phí gửi chuyển khoản.\n\nKhi thanh toán, chỉ gửi tới thông tin thanh toán ghi trong tài khoản của người bán XMR.
payment.domesticWire.info.seller=Hãy chắc chắn bạn nắm rõ chi phí nhận chuyển khoản.\n\nKhi nhận thanh toán, hãy kiểm tra thanh toán được nhận từ tài khoản của người mua XMR.
payment.strike.info.account=Hãy chắc chắn bạn cung cấp tên người dùng Strike.\n\nTrong Haveno, Strike chỉ dùng cho thanh toán tiền pháp định sang tiền pháp định.\n\nHãy chắc chắn bạn nắm rõ các giới hạn của Strike:\n\nNgười dùng chỉ đăng ký bằng email, tên và số điện thoại có các giới hạn sau:\n\n● Tối đa 100 $ mỗi lần nạp\n● Tối đa 1.000 $ tổng nạp mỗi tuần\n● Tối đa 100 $ mỗi lần thanh toán\n\nNgười dùng có thể tăng giới hạn bằng cách cung cấp thêm thông tin cho Strike. Những người dùng này có các giới hạn sau:\n\n● Tối đa 1.000 $ mỗi lần nạp\n● Tối đa 1.000 $ tổng nạp mỗi tuần\n● Tối đa 1.000 $ mỗi lần thanh toán\n\nNếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.strike.info.buyer=Vui lòng chỉ gửi thanh toán tới tên người dùng Strike của người bán XMR như cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là 1.000 $ mỗi lần thanh toán.\n\nNếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.strike.info.seller=Hãy chắc chắn thanh toán được nhận từ tên người dùng Strike của người mua XMR như cung cấp trong Haveno.\n\nQuy mô giao dịch tối đa là 1.000 $ mỗi lần thanh toán.\n\nNếu giao dịch vượt các giới hạn trên, giao dịch có thể bị hủy và có thể bị phạt.
payment.transferwiseUsd.info.account=Do quy định ngân hàng của Mỹ, gửi và nhận thanh toán USD có nhiều hạn chế hơn hầu hết các tiền tệ khác. Vì vậy USD không được thêm vào phương thức thanh toán Wise của Haveno.\n\nPhương thức thanh toán Wise-USD cho phép người dùng Haveno giao dịch bằng USD.\n\nBất kỳ ai có tài khoản Wise đều có thể thêm Wise-USD làm phương thức thanh toán trong Haveno. Như vậy họ có thể mua và bán XMR bằng USD.\n\nKhi giao dịch trên Haveno, người mua XMR không nên ghi bất kỳ nội dung nào trong lý do thanh toán. Nếu bắt buộc phải ghi lý do thanh toán, chỉ dùng họ tên đầy đủ của chủ tài khoản Wise-USD.
payment.transferwiseUsd.info.buyer=Vui lòng chỉ gửi thanh toán tới địa chỉ email trong tài khoản Wise-USD trên Haveno của người bán XMR.
payment.transferwiseUsd.info.seller=Vui lòng kiểm tra thanh toán nhận được khớp với tên tài khoản Wise-USD của người mua XMR trong Haveno.
payment.usPostalMoneyOrder.info=Giao dịch bằng US Postal Money Order (USPMO) trên Haveno yêu cầu bạn hiểu điều sau:\n\n- Người mua XMR phải ghi tên người bán XMR vào cả trường Người trả và Người nhận, và chụp ảnh độ phân giải cao của USPMO cùng phong bì có bằng chứng theo dõi trước khi gửi.\n- Người mua XMR phải gửi USPMO cho người bán XMR kèm Xác nhận giao hàng.\n\nNếu cần hòa giải hoặc có tranh chấp giao dịch, bạn sẽ phải gửi các ảnh cho người hòa giải hoặc đại lý hoàn tiền của Haveno, cùng với Số sê-ri USPMO, Số bưu cục và số tiền, để họ xác minh thông tin trên trang web của Bưu điện Mỹ.\n\nKhông cung cấp được thông tin cần thiết cho trọng tài sẽ dẫn đến thua tranh chấp.\n\nTrong mọi tranh chấp, người gửi USPMO chịu 100% trách nhiệm cung cấp bằng chứng cho trọng tài.\n\nNếu bạn không hiểu các yêu cầu này, đừng giao dịch bằng USPMO trên Haveno.
payment.payByMail.info=Giao dịch bằng Pay by Mail trên Haveno yêu cầu bạn hiểu điều sau:\n\n● Người mua XMR nên đóng gói tiền mặt trong túi tiền chống giả mạo.\n● Người mua XMR nên quay phim hoặc chụp ảnh độ phân giải cao quá trình đóng gói tiền, với địa chỉ & mã theo dõi đã dán sẵn trên gói.\n● Người mua XMR nên gửi gói tiền cho người bán XMR kèm Xác nhận giao hàng và bảo hiểm phù hợp.\n● Người bán XMR nên quay phim quá trình mở gói, đảm bảo mã theo dõi do người gửi cung cấp hiện rõ trong video.\n● Người tạo chào giá phải nêu mọi điều khoản hoặc điều kiện đặc biệt trong trường 'Thông tin bổ sung' của tài khoản thanh toán.\n● Người nhận chào giá đồng ý với các điều khoản và điều kiện của người tạo khi nhận chào giá.\n\nGiao dịch Pay by Mail đặt trách nhiệm hành động trung thực lên cả hai bên.\n\n● Giao dịch Pay by Mail có ít hành động kiểm chứng được hơn các giao dịch truyền thống khác. Điều này khiến việc xử lý tranh chấp khó hơn nhiều.\n● Hãy cố gắng giải quyết tranh chấp trực tiếp với đối tác qua chat thương gia. Đây là cách khả thi nhất để giải quyết bất kỳ tranh chấp Pay by Mail nào.\n● Trọng tài có thể xem xét vụ việc và đưa ra đề xuất, nhưng KHÔNG đảm bảo sẽ giúp được.\n● Trọng tài sẽ quyết định dựa trên bằng chứng được cung cấp. Vì vậy, hãy tuân thủ và ghi lại các quy trình trên để có bằng chứng khi xảy ra tranh chấp.\n● Yêu cầu Haveno bồi thường cho bất kỳ khoản tiền nào mất do giao dịch Pay by Mail sẽ KHÔNG được xem xét.\n\nNếu bạn không hiểu các yêu cầu này, đừng giao dịch bằng Pay by Mail trên Haveno.

payment.payByMail.contact=thông tin liên hệ
payment.payByMail.contact.prompt=Tên hoặc biệt danh người nhận ghi trên phong bì
payment.payByMail.extraInfo.prompt=Vui lòng nêu trong chào giá của bạn: \n\nQuốc gia bạn đang ở (ví dụ Pháp); \nCác quốc gia / khu vực bạn chấp nhận giao dịch (ví dụ Pháp, EU, hoặc bất kỳ nước châu Âu nào); \nCác điều khoản/điều kiện đặc biệt; \nCác chi tiết khác.
payment.tradingRestrictions=Vui lòng xem kỹ các điều khoản và điều kiện của người tạo.\nNếu bạn không đáp ứng yêu cầu, đừng nhận giao dịch này.
payment.cashAtAtm.info=Rút tiền không thẻ: Rút tiền mặt tại ATM bằng mã\n\nĐể dùng phương thức thanh toán này:\n\n1. Tạo tài khoản thanh toán Rút tiền không thẻ, liệt kê các ngân hàng, khu vực bạn chấp nhận hoặc các điều khoản khác sẽ hiển thị cùng chào giá.\n\n2. Tạo hoặc nhận chào giá bằng tài khoản thanh toán đó.\n\n3. Khi chào giá được nhận, hãy chat với đối tác để hẹn thời gian hoàn tất thanh toán và chia sẻ thông tin thanh toán.\n\nNếu số tiền giao dịch vượt hạn mức rút tiền mặt, các thương gia nên chia thành nhiều lần giao dịch.\n\nGiao dịch tiền mặt tại ATM phải là bội số của 10. Nên dùng chào giá theo khoảng để số XMR có thể điều chỉnh khớp với giá chính xác.\n\nNếu bạn không thể hoàn tất giao dịch như quy định trong hợp đồng giao dịch, bạn có thể mất một phần (hoặc toàn bộ) tiền đặt cọc.
payment.cashAtAtm.extraInfo.prompt=Vui lòng nêu trong chào giá của bạn: \n\nCác ngân hàng / địa điểm bạn chấp nhận; \nCác điều khoản/điều kiện đặc biệt; \nCác chi tiết khác.
payment.f2f.contact=thông tin liên hệ
payment.f2f.contact.prompt=Bạn muốn đối tác giao dịch liên hệ với bạn bằng cách nào? (địa chỉ email, số điện thoại,...)
payment.f2f.city=Thành phố để gặp mặt trực tiếp
payment.f2f.city.prompt=Thành phố sẽ được hiển thị cùng báo giá
payment.shared.optionalExtra=Thông tin thêm tuỳ chọn.
payment.shared.extraInfo=thông tin thêm
payment.shared.extraInfo.offer=Thông tin bổ sung về ưu đãi
payment.shared.extraInfo.prompt.paymentAccount=Xác định bất kỳ điều khoản, điều kiện hoặc chi tiết đặc biệt nào bạn muốn hiển thị cùng với các ưu đãi của mình cho tài khoản thanh toán này (người dùng sẽ thấy thông tin này trước khi chấp nhận các ưu đãi).
payment.shared.extraInfo.prompt.offer=Xác định bất kỳ thuật ngữ, điều kiện hoặc chi tiết đặc biệt nào bạn muốn hiển thị cùng với đề nghị của mình.
payment.shared.extraInfo.noDeposit=Chi tiết liên hệ và điều khoản ưu đãi
payment.f2f.info=Giao dịch 'Gặp mặt trực tiếp' có quy tắc và rủi ro khác với giao dịch trực tuyến.\n\nCác khác biệt chính:\n● Các đối tác giao dịch cần trao đổi thông tin về địa điểm và thời gian gặp bằng thông tin liên hệ đã cung cấp.\n● Các đối tác giao dịch cần mang theo laptop và xác nhận 'đã gửi thanh toán' và 'đã nhận thanh toán' tại nơi gặp.\n● Nếu người tạo có 'điều khoản và điều kiện' đặc biệt, họ phải nêu trong trường 'Thông tin bổ sung' của tài khoản.\n● Khi nhận chào giá, người nhận đồng ý với 'điều khoản và điều kiện' mà người tạo đã nêu.\n● Khi có tranh chấp, trọng tài khó có thể giúp nhiều vì thường khó có bằng chứng không thể giả mạo về những gì đã xảy ra tại buổi gặp. Trong trường hợp đó, số XMR có thể bị khóa vô thời hạn hoặc cho đến khi các đối tác giao dịch đạt được thỏa thuận.\n\nĐể chắc chắn bạn hiểu rõ các khác biệt của giao dịch 'Gặp mặt trực tiếp', vui lòng đọc hướng dẫn và khuyến nghị tại: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
