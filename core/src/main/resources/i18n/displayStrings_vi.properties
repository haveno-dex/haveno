account.crypto.yourCryptoAccounts=Tài khoản crypto của bạn
account.crypto.popup.wallet.msg=Hãy chắc chắn bạn tuân thủ các yêu cầu khi dùng ví {0} như mô tả trên trang web {1}.\nDùng ví của các sàn tập trung, nơi (a) bạn không kiểm soát khóa của mình hoặc (b) không dùng phần mềm ví tương thích, là rủi ro: có thể dẫn đến mất tiền giao dịch!\nNgười hòa giải hoặc trọng tài không phải chuyên gia về {2} và không thể giúp trong những trường hợp này.
account.crypto.popup.wallet.confirm=Tôi hiểu và xác nhận rằng tôi đã biết loại ví mình cần sử dụng.
# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=Giao dịch XMR trên Haveno yêu cầu bạn hiểu điều sau.\n\nNếu bán XMR, bạn phải có thể cung cấp các thông tin sau cho người hòa giải hoặc trọng tài khi có tranh chấp:\n- khóa giao dịch (Tx Key, Tx Secret Key hoặc Tx Private Key)\n- ID giao dịch (Tx ID hoặc Tx Hash)\n- địa chỉ đích (địa chỉ người nhận)\n\nXem wiki để biết cách tìm các thông tin này trên các ví Monero phổ biến [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nKhông cung cấp được dữ liệu giao dịch cần thiết sẽ dẫn đến thua tranh chấp.\n\nCũng lưu ý rằng Haveno hiện có tính năng tự động xác nhận giao dịch XMR để giao dịch nhanh hơn, nhưng bạn cần bật nó trong Cài đặt.\n\nXem wiki để biết thêm về tính năng tự động xác nhận: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


