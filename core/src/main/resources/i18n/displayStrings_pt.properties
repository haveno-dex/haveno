payment.zelle.info=O Zelle é um serviço de transferência de dinheiro que funciona melhor *através* de outro banco.\n\n1. Consulte esta página para ver se (e como) o seu banco funciona com o Zelle: [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. Tenha especial atenção aos seus limites de transferência: os limites de envio variam de banco para banco, e os bancos costumam definir limites diários, semanais e mensais separados.\n\n3. Se o seu banco não funcionar com o Zelle, pode usá-lo na mesma através da aplicação móvel do Zelle, mas os seus limites de transferência serão muito mais baixos.\n\n4. O nome indicado na sua conta Haveno TEM de corresponder ao nome da sua conta Zelle/bancária. \n\nSe não conseguir concluir uma transação Zelle conforme especificado no contrato do negócio, pode perder parte (ou a totalidade) do seu depósito de segurança.\n\nDevido ao risco de estorno algo mais elevado do Zelle, os vendedores são aconselhados a contactar compradores não assinados por email ou SMS para verificar que o comprador é realmente o dono da conta Zelle indicada no Haveno.
payment.fasterPayments.newRequirements.info=Alguns bancos começaram a verificar o nome completo do destinatário nas transferências Faster Payments. A sua conta Faster Payments atual não indica um nome completo.\n\nConsidere recriar a sua conta Faster Payments no Haveno para fornecer um nome completo aos futuros compradores de {0}.\n\nAo recriar a conta, certifique-se de que copia exatamente o sort code, o número de conta e o salt de verificação da idade da conta da sua conta antiga para a nova. Isto garante que a idade e o estado de assinatura da sua conta existente são preservados.
payment.fasterPayments.ukSortCode=Sort code do Reino Unido
payment.moneyGram.info=Ao usar o MoneyGram, o comprador de XMR tem de enviar por email ao vendedor de XMR o número de autorização e uma foto do recibo. O recibo tem de mostrar claramente o nome completo do vendedor, o país, o estado e a quantia. O email do vendedor será mostrado ao comprador durante o negócio.
payment.westernUnion.info=Ao usar a Western Union, o comprador de XMR tem de enviar por email ao vendedor de XMR o MTCN (número de rastreio) e uma foto do recibo. O recibo tem de mostrar claramente o nome completo do vendedor, a cidade, o país e a quantia. O email do vendedor será mostrado ao comprador durante o negócio.
payment.halCash.info=Ao usar o HalCash, o comprador de XMR precisa enviar ao vendedor de XMR o código HalCash através de uma mensagem de texto do seu telemóvel.\n\nPor favor, certifique-se de não exceder a quantia máxima que seu banco lhe permite enviar com o HalCash. A quantia mín. de levantamento é de 10 euros e a quantia máx. é de 600 EUR. Para levantamentos repetidos é de 3000 euros por recipiente por dia e 6000 euros por recipiente por mês. Por favor confirme esses limites com seu banco para ter certeza de que eles usam os mesmos limites mencionados aqui.\n\nA quantia de levantamento deve ser um múltiplo de 10 euros, pois você não pode levantar outras quantias de uma ATM. A interface do utilizador no ecrã para criar oferta e aceitar ofertas ajustará a quantia de XMR para que a quantia de EUR esteja correta. Você não pode usar o preço com base no mercado, pois o valor do EUR estaria mudando com a variação dos preços.\n\nEm caso de disputa, o comprador de XMR precisa fornecer a prova de que enviou o EUR.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Tenha em atenção que todas as transferências bancárias envolvem algum risco de estorno. Para reduzir esse risco, o Haveno define limites por negócio com base no nível estimado de risco de estorno do método de pagamento usado.\n\nPara este método de pagamento, o seu limite por negócio para comprar e vender é {2}.\n\nEste limite aplica-se apenas ao tamanho de cada negócio individual: pode fazer tantos negócios quantos quiser.\n\nVeja mais detalhes na wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Para limitar o risco de estorno, o Haveno define limites por negócio para este tipo de conta de pagamento com base nos seguintes 2 fatores:\n\n1. Risco geral de estorno do método de pagamento\n2. Estado de assinatura da conta\n\nEsta conta de pagamento ainda não está assinada, por isso está limitada a comprar {0} por negócio. Após a assinatura, os limites de compra aumentam da seguinte forma:\n\n● Antes da assinatura, e durante 30 dias após a assinatura, o seu limite de compra por negócio será {0}\n● 30 dias após a assinatura, o seu limite de compra por negócio será {1}\n● 60 dias após a assinatura, o seu limite de compra por negócio será {2}\n\nOs limites de venda não são afetados pela assinatura da conta. Pode vender {2} num único negócio de imediato.\n\nEstes limites aplicam-se apenas ao tamanho de cada negócio individual: pode fazer tantos negócios quantos quiser. \n\nVeja mais detalhes na wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

payment.cashDeposit.info=Por favor, confirme que seu banco permite-lhe enviar depósitos em dinheiro para contas de outras pessoas. Por exemplo, o Bank of America e o Wells Fargo não permitem mais esses depósitos.

payment.revolut.info=O Revolut requer o 'Nome de utilizador' como ID da conta, e não o número de telefone ou o email como acontecia antigamente.
payment.account.revolut.addUserNameInfo={0}\nA sua conta Revolut existente ({1}) não tem um 'Nome de utilizador'.\nPor favor introduza o seu 'Nome de utilizador' do Revolut para atualizar os dados da conta.\nIsto não afeta o estado de assinatura da idade da sua conta.
payment.revolut.addUserNameInfo.headLine=Atualizar conta Revolut

payment.cashapp.info=Esteja ciente de que o Cash App tem um risco de estorno maior do que a maioria das transferências bancárias.
payment.venmo.info=Esteja ciente de que o Venmo tem um risco de estorno maior do que a maioria das transferências bancárias.
payment.paypal.info=Esteja ciente de que o PayPal tem um risco de estorno maior do que a maioria das transferências bancárias.

payment.amazonGiftCard.upgrade=O método de pagamento por cartões-oferta Amazon requer que o país seja indicado.
payment.account.amazonGiftCard.addCountryInfo={0}\nA sua conta Amazon Gift Card existente ({1}) não tem um país indicado.\nPor favor introduza o país da sua conta Amazon Gift Card para atualizar os dados da conta.\nIsto não afeta o estado da idade da sua conta.
payment.amazonGiftCard.upgrade.headLine=Atualizar conta Amazon Gift Card
payment.swift.info.account=Reveja com atenção as regras principais para usar SWIFT no Haveno:\n\n- preencha todos os campos de forma completa e correta \n- o comprador tem de enviar o pagamento na moeda indicada pelo ofertante \n- o comprador tem de usar o modelo de taxas partilhadas (SHA) \n- comprador e vendedor podem incorrer em taxas, por isso devem consultar antes o tarifário do seu banco \n\nO SWIFT é mais complexo do que outros métodos de pagamento, por isso reserve um momento para rever as orientações completas na wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=Para comprar monero com SWIFT, tem de:\n\n- enviar o pagamento na moeda indicada pelo ofertante \n- usar o modelo de taxas partilhadas (SHA) para enviar o pagamento\n\nReveja as orientações adicionais na wiki para evitar penalizações e garantir negócios sem problemas [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=Quem envia por SWIFT é obrigado a usar o modelo de taxas partilhadas (SHA) para enviar pagamentos.\n\nSe receber um pagamento SWIFT que não use SHA, abra um bilhete de mediação.\n\nReveja as orientações adicionais na wiki para evitar penalizações e garantir negócios sem problemas [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=Certifique-se de que inclui:\n\n● Nome completo do titular da conta\n● Número de conta\n● Número IFSC\n\nEstes dados devem corresponder à conta bancária que vai usar para enviar / receber pagamentos.\n\nTenha em atenção que existe um máximo de Rs. 200.000 por transação. Se negociar acima desta quantia, serão necessárias várias transações. No entanto, tenha em atenção que existe um limite máximo de Rs. 1.000.000 por dia.\n\nAlguns bancos têm limites diferentes para os seus clientes.
payment.imps.info.buyer=Envie o pagamento apenas para os dados da conta fornecidos no Haveno.\n\nO tamanho máximo do negócio é de Rs. 200.000 por transação.\n\nSe o seu negócio for superior a Rs. 200.000, terá de fazer várias transferências. No entanto, tenha em atenção que existe um limite máximo de Rs. 1.000.000 por dia.\n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.imps.info.seller=Se pretende receber mais de Rs. 200.000 por negócio, é de esperar que o comprador tenha de fazer várias transferências. No entanto, tenha em atenção que existe um limite máximo de Rs. 1.000.000 por dia.\n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.neft.info.account=Certifique-se de que inclui:\n\n● Nome completo do titular da conta\n● Número de conta\n● Número IFSC\n\nEstes dados devem corresponder à conta bancária que vai usar para enviar / receber pagamentos.\n\nTenha em atenção que existe um máximo de Rs. 50.000 por transação. Se negociar acima desta quantia, serão necessárias várias transações.\n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.neft.info.buyer=Envie o pagamento apenas para os dados da conta fornecidos no Haveno.\n\nO tamanho máximo do negócio é de Rs. 50.000 por transação.\n\nSe o seu negócio for superior a Rs. 50.000, terá de fazer várias transferências.\n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.neft.info.seller=Se pretende receber mais de Rs. 50.000 por negócio, é de esperar que o comprador tenha de fazer várias transferências.\n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.paytm.info.account=Certifique-se de que inclui o email ou número de telefone que corresponde ao email ou número de telefone da sua conta PayTM. \n\nQuando os utilizadores criam uma conta PayTM sem KYC, ficam limitados a: \n\n● Máximo de Rs. 5.000 por transação.\n● Máximo de Rs. 10.000 guardados na carteira PayTM de cada pessoa.\n\nSe pretende negociar quantias superiores a 5.000 por negócio, terá de completar o KYC com a PayTM. Com KYC, os utilizadores ficam limitados a:\n\n● Máximo de Rs. 100.000 por transação.\n● Máximo de Rs. 100.000 guardados na carteira PayTM de cada pessoa.\n\nOs utilizadores também devem ter em atenção os limites da conta. Negócios acima dos limites da conta PayTM terão provavelmente de decorrer ao longo de mais de um dia ou ser cancelados.
payment.paytm.info.buyer=Envie o pagamento apenas para o endereço de email ou número de telefone fornecido.\n\nSe pretende negociar quantias superiores a Rs. 5.000 por negócio, terá de completar o KYC com a PayTM.\n\nSem KYC, podem ser enviados Rs. 5.000 por transação.\n\nCom KYC, os utilizadores podem enviar Rs. 100.000 por transação.
payment.paytm.info.seller=Se pretende negociar quantias superiores a Rs. 5.000 por negócio, terá de completar o KYC com a PayTM. Com KYC, os utilizadores ficam limitados a:\n\n● Máximo de Rs. 100.000 por transação.\n● Máximo de Rs. 100.000 guardados na sua carteira PayTM .\n\nOs utilizadores também devem ter em atenção os limites da conta. Como só pode guardar um máximo de Rs. 100.000 na sua carteira PayTM, certifique-se de que transfere as suas rupias regularmente.
payment.rtgs.info.account=O RTGS destina-se a pagamentos de negócios grandes, de Rs. 200.000 ou mais.\n\nAo configurar a sua conta de pagamento RTGS, certifique-se de que inclui:\n\n● Nome completo do titular da conta\n● Número de conta\n● Número IFSC\n\nEstes dados devem corresponder à conta bancária que vai usar para enviar / receber pagamentos.\n\nTenha em atenção que existe uma quantia mínima de negócio de Rs. 200.000 por transação. Se negociar abaixo desta quantia, ou o negócio é cancelado ou ambos os negociadores têm de acordar outro método de pagamento (por exemplo, IMPS ou UPI).
payment.rtgs.info.buyer=Envie o pagamento apenas para os dados da conta fornecidos no Haveno.\n\nTenha em atenção que existe uma quantia mínima de negócio de Rs. 200.000 por transação. Se negociar abaixo desta quantia, ou o negócio é cancelado ou ambos os negociadores têm de acordar outro método de pagamento (por exemplo, IMPS ou UPI).
payment.rtgs.info.seller=Tenha em atenção que existe uma quantia mínima de negócio de Rs. 200.000 por transação. Se negociar abaixo desta quantia, ou o negócio é cancelado ou ambos os negociadores têm de acordar outro método de pagamento (por exemplo, IMPS ou UPI).
payment.upi.info.account=Certifique-se de que inclui o seu endereço de pagamento virtual (VPA), também chamado UPI ID. O formato é semelhante a um endereço de email, com o sinal “@” no meio. Por exemplo, o seu UPI ID pode ser “nome_do_destinatário@nome_do_banco” ou “número_de_telefone@nome_do_banco”. \n\nNo UPI existe um limite máximo de Rs. 100.000 por transação. \n\nSe pretende negociar quantias superiores a Rs. 100.000 por negócio, é provável que os negócios tenham de decorrer em várias transferências. \n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.upi.info.buyer=Envie o pagamento apenas para o VPA / UPI ID fornecido no Haveno. \n\nO tamanho máximo do negócio é de Rs. 100.000 por transação. \n\nSe o seu negócio for superior a Rs. 100.000, terá de fazer várias transferências. \n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.upi.info.seller=Se pretende receber mais de Rs. 100.000 por negócio, é de esperar que o comprador tenha de fazer várias transferências. \n\nNote que alguns bancos têm limites diferentes para os seus clientes.
payment.celpay.info.account=Certifique-se de que inclui o email com que a sua conta Celsius está registada. Isto garante que, quando envia fundos, eles aparecem como vindos da conta correta e que, quando recebe fundos, são creditados na sua conta.\n\nOs utilizadores do CelPay estão limitados a enviar 2.500 $ (ou o equivalente noutra moeda/cripto) em 24 horas.\n\nNegócios acima dos limites da conta CelPay terão provavelmente de decorrer ao longo de mais de um dia ou ser cancelados.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nOs compradores de XMR podem enviar qualquer stablecoin da moeda correspondente ao vendedor de XMR.
payment.celpay.info.buyer=Envie o pagamento apenas para o endereço de email fornecido pelo vendedor de XMR, através de um link de pagamento.\n\nO CelPay está limitado a enviar 2.500 $ (ou o equivalente noutra moeda/cripto) em 24 horas.\n\nNegócios acima dos limites da conta CelPay terão provavelmente de decorrer ao longo de mais de um dia ou ser cancelados.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nOs compradores de XMR podem enviar qualquer stablecoin da moeda correspondente ao vendedor de XMR.
payment.celpay.info.seller=Os vendedores de XMR devem esperar receber o pagamento através de um link de pagamento seguro. Certifique-se de que o link de pagamento por email contém o endereço de email fornecido pelo comprador de XMR.\n\nOs utilizadores do CelPay estão limitados a enviar 2.500 $ (ou o equivalente noutra moeda/cripto) em 24 horas.\n\nNegócios acima dos limites da conta CelPay terão provavelmente de decorrer ao longo de mais de um dia ou ser cancelados.\n\nO CelPay suporta várias stablecoins:\n\n● Stablecoins de USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoins de CAD; TrueCAD\n● Stablecoins de GBP; TrueGBP\n● Stablecoins de HKD; TrueHKD\n● Stablecoins de AUD; TrueAUD\n\nOs vendedores de XMR devem esperar receber qualquer stablecoin da moeda correspondente do comprador de XMR. O comprador de XMR pode enviar qualquer stablecoin da moeda correspondente.
payment.celpay.supportedCurrenciesForReceiver=Moedas suportadas (nota: todas as moedas abaixo são stablecoins suportadas na aplicação Celsius. Os negócios são em stablecoins, não em moeda fiduciária.)
payment.nequi.info.account=Certifique-se de que inclui o número de telefone associado à sua conta Nequi.\n\nQuando os utilizadores criam uma conta Nequi, os limites de pagamento ficam definidos num máximo de ~ 7.000.000 COP por mês.\n\nSe pretende negociar quantias superiores a 7.000.000 COP por negócio, terá de completar o KYC com o Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações ficam sujeitas a um imposto de 0,4%. Certifique-se de que conhece os impostos mais recentes.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.nequi.info.buyer=Envie o pagamento apenas para o número de telefone indicado na conta Haveno do vendedor de XMR.\n\nQuando os utilizadores criam uma conta Nequi, os limites de pagamento ficam definidos num máximo de ~ 7.000.000 COP por mês.\n\nSe pretende negociar quantias superiores a 7.000.000 COP por negócio, terá de completar o KYC com o Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações ficam sujeitas a um imposto de 0,4%. Certifique-se de que conhece os impostos mais recentes.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.nequi.info.seller=Verifique se o pagamento recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.\n\nQuando os utilizadores criam uma conta Nequi, os limites de pagamento ficam definidos num máximo de ~ 7.000.000 COP por mês.\n\nSe pretende negociar quantias superiores a 7.000.000 COP por negócio, terá de completar o KYC com o Bancolombia e pagar uma taxa de cerca de 15.000 COP. Depois disso, todas as transações ficam sujeitas a um imposto de 0,4%. Certifique-se de que conhece os impostos mais recentes.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.mpesa.info.account=Certifique-se de que inclui o número de telefone registado na sua conta M-Pesa.
payment.mpesa.info.buyer=Envie o pagamento apenas para o número de telefone indicado na conta Haveno do vendedor de XMR, através do M-Pesa.
payment.mpesa.info.seller=Verifique se o pagamento M-Pesa recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.
payment.mercadoPago.info.account=Certifique-se de que inclui o email ou o número de telefone registado na sua conta Mercado Pago.
payment.mercadoPago.info.buyer=Envie o pagamento apenas para o email ou número de telefone indicado na conta Haveno do vendedor de XMR, através do Mercado Pago.
payment.mercadoPago.info.seller=Verifique se o pagamento Mercado Pago recebido corresponde ao email ou número de telefone indicado na conta Haveno do comprador de XMR.
payment.gcash.info.account=Certifique-se de que inclui o número de telefone registado na sua conta GCash.
payment.gcash.info.buyer=Envie o pagamento apenas para o número de telefone indicado na conta Haveno do vendedor de XMR, através do GCash.
payment.gcash.info.seller=Verifique se o pagamento GCash recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.
payment.momo.info.account=Certifique-se de que inclui o número de telefone registado na sua conta MoMo.
payment.momo.info.buyer=Envie o pagamento apenas para o número de telefone indicado na conta Haveno do vendedor de XMR, através do MoMo.
payment.momo.info.seller=Verifique se o pagamento MoMo recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.
payment.spei.info.account=Certifique-se de que inclui a CLABE (número de conta interbancária de 18 dígitos) associada à sua conta bancária para transferências SPEI.
payment.spei.info.buyer=Envie o pagamento por SPEI apenas para a CLABE indicada na conta Haveno do vendedor de XMR.
payment.spei.info.seller=Verifique se o pagamento SPEI recebido corresponde à CLABE indicada na conta Haveno do comprador de XMR.
payment.bizum.info.account=Para usar o Bizum precisa de uma conta bancária (IBAN) em Espanha e de estar registado no serviço.\n\nO Bizum pode ser usado para negócios entre 0 €,50 e 1.000 €.\n\nO montante máximo de transações que pode enviar/receber com o Bizum é de 2.000 € por dia.\n\nOs utilizadores do Bizum podem fazer no máximo 150 operações por mês.\n\nCada banco pode, no entanto, definir os seus próprios limites para os seus clientes, dentro dos limites acima.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.bizum.info.buyer=Envie o pagamento apenas para o número de telemóvel do vendedor de XMR indicado no Haveno.\n\nO tamanho máximo do negócio é de 1.000 € por pagamento. O montante máximo de transações que pode enviar com o Bizum é de 2.000 € por dia.\n\nSe negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.bizum.info.seller=Certifique-se de que o pagamento é recebido do número de telemóvel do comprador de XMR indicado no Haveno.\n\nO tamanho máximo do negócio é de 1.000 € por pagamento. O montante máximo de transações que pode receber com o Bizum é de 2.000 € por dia.\n\nSe negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.

payment.blik.info.account=Para usar o BLIK, precisa de uma conta bancária na Polónia com uma aplicação de banca móvel que suporte BLIK.\n\nO comprador de XMR paga gerando um código BLIK e enviando-o ao vendedor de XMR pelo chat do negócio, pelo que ambos os negociadores têm de estar online para concluir o pagamento.
payment.blik.info.buyer=Para pagar, gere um código BLIK na sua aplicação de banca móvel e envie-o ao vendedor de XMR pelo chat do negócio.\n\nOs códigos BLIK só são válidos durante 2 minutos, por isso certifique-se de que o vendedor está a responder no chat do negócio antes de gerar o código.
payment.blik.info.seller=O comprador de XMR vai enviar-lhe um código BLIK pelo chat do negócio.\n\nOs códigos BLIK só são válidos durante 2 minutos, por isso use o código para receber o pagamento logo após o envio.

payment.vippsMobilePay.info.account=Para usar o Vipps MobilePay, precisa de uma conta registada com o seu número de telemóvel na Noruega, Dinamarca ou Finlândia.\n\nOs pagamentos não podem ser enviados entre países, pelo que ambos os negociadores têm de ter conta no mesmo país. A moeda de negociação é determinada pelo país da sua conta.
payment.vippsMobilePay.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.vippsMobilePay.info.seller=Verifique se o pagamento recebido na sua aplicação Vipps ou MobilePay corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.twint.info.account=Para usar o TWINT, precisa de uma conta registada com o seu número de telemóvel na Suíça.\n\nOs pagamentos TWINT só podem ser enviados entre contas TWINT suíças, pelo que ambos os negociadores têm de usar o TWINT. A moeda de negociação é CHF.
payment.twint.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.twint.info.seller=Verifique se o pagamento recebido na sua aplicação TWINT corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.nip.info.account=Para usar o NIP, precisa de uma conta bancária nigeriana ou de uma carteira de dinheiro móvel como OPay ou PalmPay.\n\nOs pagamentos são enviados por transferência bancária instantânea NIP para o número de conta de 10 dígitos do destinatário no seu banco ou fornecedor de carteira. A moeda de negociação é NGN.
payment.nip.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela verificação de nome da transferência corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.nip.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde ao número de conta e ao nome do titular indicados na conta do comprador de XMR.

payment.pagoMovil.info.account=Para usar o Pago Móvil, precisa de uma conta bancária venezuelana com Pago Móvil ativado, registada com o seu número de telemóvel, cédula e banco.\n\nOs pagamentos são enviados por transferência interbancária para o número de telemóvel, cédula e banco indicados. A moeda de negociação é VES.
payment.pagoMovil.info.buyer=Envie o pagamento apenas para o número de telemóvel, cédula e banco indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pelo seu banco corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.pagoMovil.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número de telemóvel, cédula e nome do titular indicados na conta do comprador de XMR.

payment.qris.info.account=Para usar o QRIS / BI-FAST, precisa de uma conta bancária indonésia ou de uma carteira eletrónica que possa receber transferências instantâneas.\n\nOs pagamentos são enviados por transferência instantânea BI-FAST para o número de conta do destinatário no seu banco ou carteira eletrónica, ou lendo o código QRIS do destinatário. A moeda de negociação é IDR.
payment.qris.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira eletrónica indicados na conta do vendedor de XMR, ou para um código QRIS que o vendedor partilhe consigo no chat do negócio, e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.qris.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira eletrónica corresponde ao número de conta e ao nome do titular indicados na conta do comprador de XMR.

payment.papara.info.account=Para usar o Papara / FAST, precisa de uma conta Papara ou de uma conta bancária turca que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o número Papara, o IBAN turco ou o número de telemóvel FAST Easy Address (Kolay Adres) do destinatário. A moeda de negociação é TRY.
payment.papara.info.buyer=Envie o pagamento apenas para o número de conta ou IBAN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.papara.info.seller=Verifique se o pagamento recebido na sua aplicação Papara ou bancária corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.raast.info.account=Para usar o Raast / Easypaisa / JazzCash, precisa de uma conta bancária ou carteira móvel paquistanesa que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o Raast ID (número de telemóvel registado), o número de telemóvel da carteira ou o IBAN paquistanês do destinatário. A moeda de negociação é PKR.
payment.raast.info.buyer=Envie o pagamento apenas para o número de telemóvel ou IBAN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.raast.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.paynow.info.account=Para usar o PayNow / FAST, precisa de uma conta bancária ou carteira eletrónica de Singapura que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o proxy PayNow do destinatário: um número de telemóvel registado ou NRIC/FIN. A moeda de negociação é SGD.
payment.paynow.info.buyer=Envie o pagamento apenas para o número de telemóvel ou NRIC/FIN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.paynow.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.wero.info.account=Para usar o Wero, precisa da aplicação Wero ou da aplicação de um banco aderente, com o seu número de telemóvel registado na Alemanha, França ou Bélgica.\n\nOs pagamentos são enviados para o número de telemóvel registado do destinatário, inserido em formato internacional (p. ex. +49). A moeda de negociação é EUR.
payment.wero.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.wero.info.seller=Verifique se o pagamento recebido na sua aplicação Wero ou bancária corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.fps.info.account=Para usar o FPS (Faster Payment System), precisa de uma conta bancária de Hong Kong ou de uma carteira eletrónica como AlipayHK ou WeChat Pay HK.\n\nOs pagamentos são enviados para o proxy FPS do destinatário: um número de telemóvel registado, um FPS ID ou um endereço de email. A moeda de negociação é HKD.
payment.fps.info.buyer=Envie o pagamento apenas para o número de telemóvel, FPS ID ou email e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.fps.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.duitnow.info.account=Para usar o DuitNow, precisa de uma conta bancária malaia ou de uma carteira eletrónica como Touch 'n Go, GrabPay ou Boost.\n\nOs pagamentos são enviados para o proxy DuitNow do destinatário: um número de telemóvel registado ou NRIC. A moeda de negociação é MYR.
payment.duitnow.info.buyer=Envie o pagamento apenas para o número de telemóvel ou NRIC e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.duitnow.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.mbway.info.account=Para usar o MB WAY, precisa da aplicação MB WAY ativada com o seu número de telemóvel português.\n\nOs pagamentos são enviados para o número de telemóvel registado do destinatário. A moeda de negociação é EUR.
payment.mbway.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.mbway.info.seller=Verifique se o pagamento recebido na sua aplicação MB WAY corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.paypay.accountId=Número de telemóvel ou PayPay ID
payment.paypay.info.account=Para usar o PayPay, precisa de uma conta PayPay registada no Japão.\n\nOs pagamentos PayPay só podem ser enviados entre utilizadores PayPay, pelo que ambos os negociadores têm de usar o PayPay. Os pagamentos são enviados para o número de telemóvel registado ou PayPay ID do destinatário. A moeda de negociação é JPY.
payment.paypay.info.buyer=Envie o pagamento apenas para o número de telemóvel ou PayPay ID indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.paypay.info.seller=Verifique se o pagamento recebido na sua aplicação PayPay corresponde ao número de telemóvel ou PayPay ID e ao nome do titular indicados na conta do comprador de XMR.

payment.sbp.info.account=Certifique-se de que inclui o número de telefone associado à sua conta bancária para transferências SBP (Faster Payments).
payment.sbp.info.buyer=Envie o pagamento por SBP apenas para o número de telefone indicado na conta Haveno do vendedor de XMR.
payment.sbp.info.seller=Verifique se o pagamento SBP recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.

payment.mir.info.account=Para usar a transferência por cartão Mir, precisa de um cartão bancário russo que possa receber transferências cartão a cartão.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda de negociação é RUB.
payment.mir.info.buyer=Envie o pagamento apenas para o número do cartão indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação bancária corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.mir.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número do cartão e ao nome do titular indicados na conta do comprador de XMR.

payment.yoomoney.info.account=Para usar o YooMoney, precisa de uma carteira YooMoney registada na Rússia.\n\nOs pagamentos são enviados para o número da carteira do destinatário. A moeda de negociação é RUB.
payment.yoomoney.info.buyer=Envie o pagamento apenas para o número da carteira indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.yoomoney.info.seller=Verifique se o pagamento recebido na sua carteira YooMoney corresponde ao número da carteira e ao nome do titular indicados na conta do comprador de XMR.

payment.ukraineCard.info.account=Para usar a transferência cartão a cartão, precisa de um cartão bancário ucraniano (p. ex. PrivatBank ou Monobank) que possa receber transferências.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda de negociação é UAH.
payment.ukraineCard.info.buyer=Envie o pagamento apenas para o número do cartão indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação bancária corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.ukraineCard.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número do cartão e ao nome do titular indicados na conta do comprador de XMR.

payment.kaspi.accountId=Número de telemóvel ou número do cartão
payment.kaspi.info.account=Para usar o Kaspi, precisa de uma conta Kaspi registada no Cazaquistão.\n\nOs pagamentos são enviados para o número de telemóvel registado ou o número do cartão Kaspi Gold do destinatário. A moeda de negociação é KZT.
payment.kaspi.info.buyer=Envie o pagamento apenas para o número de telemóvel ou número do cartão indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.kaspi.info.seller=Verifique se o pagamento recebido na sua aplicação Kaspi corresponde ao número de telemóvel ou número do cartão e ao nome do titular indicados na conta do comprador de XMR.
payment.pix.info.account=Certifique-se de que inclui a chave Pix que escolheu. Existem quatro tipos de chave: CPF (Cadastro de Pessoas Físicas) ou CNPJ (Cadastro Nacional de Pessoas Jurídicas), endereço de email, número de telefone ou uma chave aleatória gerada pelo sistema, chamada identificador único universal (UUID). Tem de ser usada uma chave diferente para cada conta Pix que tiver. Cada pessoa pode criar até cinco chaves por conta.\n\nAo negociar no Haveno, os compradores de XMR devem usar a sua chave Pix como descrição do pagamento, para que seja fácil para o vendedor de XMR identificar que o pagamento veio deles.
payment.pix.info.buyer=Envie o pagamento apenas para a chave Pix indicada na conta Haveno do vendedor de XMR.\n\nUse a sua chave Pix como referência do pagamento, para que seja fácil para o vendedor de XMR identificar que o pagamento veio de si.
payment.pix.info.seller=Verifique se a descrição do pagamento recebido corresponde à chave Pix indicada na conta Haveno do comprador de XMR.
payment.pix.key=Chave Pix (CPF, CNPJ, email, número de telefone ou UUID)
payment.monese.info.account=O Monese é uma aplicação bancária para utilizadores de GBP, EUR e RON*. O Monese permite enviar dinheiro para outras contas Monese de forma instantânea e gratuita em qualquer moeda suportada.\n\n*Para abrir uma conta em RON no Monese, precisa de viver na Roménia ou de ter nacionalidade romena.\n\nAo configurar a sua conta Monese no Haveno, certifique-se de que inclui o nome e o número de telefone que correspondem à sua conta Monese. Isto garante que, quando envia fundos, eles aparecem como vindos da conta correta e que, quando recebe fundos, são creditados na sua conta.
payment.monese.info.buyer=Envie o pagamento apenas para o número de telefone indicado pelo vendedor de XMR na sua conta Haveno. Deixe a descrição do pagamento em branco.
payment.monese.info.seller=Os vendedores de XMR devem esperar receber o pagamento do número de telefone / nome mostrado na conta Haveno do comprador de XMR.
payment.satispay.info.account=Para usar o Satispay precisa de uma conta bancária (IBAN) em Itália e de estar registado no serviço.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, terá de contactar o apoio do Satispay para aumentar os seus limites. Os utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.satispay.info.buyer=Envie o pagamento apenas para o número de telemóvel do vendedor de XMR indicado no Haveno.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, terá de contactar o apoio do Satispay para aumentar os seus limites. Os utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.satispay.info.seller=Certifique-se de que o pagamento é recebido do número de telemóvel / nome do comprador de XMR indicado no Haveno.\n\nOs limites da conta Satispay são definidos individualmente. Se quiser negociar quantias maiores, terá de contactar o apoio do Satispay para aumentar os seus limites. Os utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.tikkie.info.account=Para usar o Tikkie precisa de uma conta bancária (IBAN) nos Países Baixos e de estar registado no serviço.\n\nQuando envia um pedido de pagamento Tikkie a um particular, pode pedir para receber no máximo 750 € por pedido Tikkie. O montante máximo que pode pedir em 24 horas é de 2.500 € por conta Tikkie.\n\nCada banco pode, no entanto, definir os seus próprios limites para os seus clientes, dentro destes limites.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.tikkie.info.buyer=Peça um link de pagamento ao vendedor de XMR no chat do negócio. Quando o vendedor de XMR lhe enviar um link de pagamento com a quantia correta do negócio, avance para o pagamento.\n\nQuando o vendedor de XMR pede um pagamento Tikkie, o máximo que pode pedir é 750 € por pedido Tikkie. Se o negócio for superior a essa quantia, o vendedor de XMR terá de enviar vários pedidos até perfazer a quantia do negócio. O máximo que se pode pedir num dia é 2.500 €.\n\nCada banco pode, no entanto, definir os seus próprios limites para os seus clientes, dentro destes limites.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.tikkie.info.seller=Envie um link de pagamento ao comprador de XMR no chat do negócio. Quando o comprador de XMR lhe enviar o pagamento, verifique se os dados do IBAN correspondem aos dados que tem no Haveno.\n\nQuando o vendedor de XMR pede um pagamento Tikkie, o máximo que pode pedir é 750 € por pedido Tikkie. Se o negócio for superior a essa quantia, o vendedor de XMR terá de enviar vários pedidos até perfazer a quantia do negócio. O máximo que se pode pedir num dia é 2.500 €.\n\nCada banco pode, no entanto, definir os seus próprios limites para os seus clientes, dentro destes limites.\n\nOs utilizadores também devem ter em atenção os limites da conta. Se negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.verse.info.account=O Verse é um método de pagamento multimoeda que permite enviar e receber pagamentos em EUR, SEK, HUF, DKK e PLN.\n\nAo configurar a sua conta Verse no Haveno, certifique-se de que inclui o nome de utilizador que corresponde ao da sua conta Verse. Isto garante que, quando envia fundos, eles aparecem como vindos da conta correta e que, quando recebe fundos, são creditados na sua conta.\n\nOs utilizadores do Verse estão limitados a enviar ou receber 10.000 € por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos a partir da sua conta de pagamento ou recebidos nela. Este limite pode ser aumentado pelo Verse a pedido.
payment.verse.info.buyer=Envie o pagamento apenas para o nome de utilizador indicado pelo vendedor de XMR na sua conta Haveno. Deixe a descrição do pagamento em branco.\n\nOs utilizadores do Verse estão limitados a enviar ou receber 10.000 € por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos a partir da sua conta de pagamento ou recebidos nela. Este limite pode ser aumentado pelo Verse a pedido.
payment.verse.info.seller=Os vendedores de XMR devem esperar receber o pagamento do nome de utilizador mostrado na conta Haveno do comprador de XMR.\n\nOs utilizadores do Verse estão limitados a enviar ou receber 10.000 € por ano (ou o equivalente em moeda estrangeira) em pagamentos acumulados feitos a partir da sua conta de pagamento ou recebidos nela. Este limite pode ser aumentado pelo Verse a pedido.
payment.achTransfer.info.account=Ao adicionar ACH como método de pagamento no Haveno, os utilizadores devem certificar-se de que sabem quanto custa enviar e receber uma transferência ACH.
payment.achTransfer.info.buyer=Certifique-se de que sabe quanto lhe custa enviar uma transferência ACH.\n\nAo pagar, envie apenas para os dados de pagamento indicados na conta do vendedor de XMR, por transferência ACH.
payment.achTransfer.info.seller=Certifique-se de que sabe quanto lhe custa receber uma transferência ACH.\n\nAo receber o pagamento, verifique se foi recebido da conta do comprador de XMR como transferência ACH.
payment.domesticWire.info.account=Ao adicionar transferência nacional (Wire) como método de pagamento no Haveno, os utilizadores devem certificar-se de que sabem quanto custa enviar e receber uma transferência bancária.
payment.domesticWire.info.buyer=Certifique-se de que sabe quanto lhe custa enviar uma transferência bancária.\n\nAo pagar, envie apenas para os dados de pagamento indicados na conta do vendedor de XMR.
payment.domesticWire.info.seller=Certifique-se de que sabe quanto lhe custa receber uma transferência bancária.\n\nAo receber o pagamento, verifique se foi recebido da conta do comprador de XMR.
payment.strike.info.account=Certifique-se de que inclui o seu nome de utilizador do Strike.\n\nNo Haveno, o Strike é usado apenas para pagamentos de moeda fiduciária para moeda fiduciária.\n\nCertifique-se de que conhece os limites do Strike:\n\nOs utilizadores registados apenas com email, nome e número de telefone têm os seguintes limites:\n\n● 100 $ no máximo por depósito\n● 1.000 $ no máximo em depósitos por semana\n● 100 $ no máximo por pagamento\n\nOs utilizadores podem aumentar os seus limites fornecendo mais informações ao Strike. Esses utilizadores têm os seguintes limites:\n\n● 1.000 $ no máximo por depósito\n● 1.000 $ no máximo em depósitos por semana\n● 1.000 $ no máximo por pagamento\n\nSe negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.strike.info.buyer=Envie o pagamento apenas para o nome de utilizador do Strike do vendedor de XMR indicado no Haveno.\n\nO tamanho máximo do negócio é de 1.000 $ por pagamento.\n\nSe negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.strike.info.seller=Certifique-se de que o pagamento é recebido do nome de utilizador do Strike do comprador de XMR indicado no Haveno.\n\nO tamanho máximo do negócio é de 1.000 $ por pagamento.\n\nSe negociar acima dos limites indicados, o seu negócio pode ser cancelado e pode haver uma penalização.
payment.transferwiseUsd.info.account=Devido à regulamentação bancária dos EUA, enviar e receber pagamentos em USD tem mais restrições do que na maioria das outras moedas. Por esse motivo, o USD não foi adicionado ao método de pagamento Wise do Haveno.\n\nO método de pagamento Wise-USD permite aos utilizadores do Haveno negociar em USD.\n\nQualquer pessoa com uma conta Wise pode adicionar Wise-USD como método de pagamento no Haveno. Isso permite-lhe comprar e vender XMR com USD.\n\nAo negociar no Haveno, os compradores de XMR não devem usar qualquer referência ou motivo de pagamento. Se o motivo do pagamento for obrigatório, devem usar apenas o nome completo do titular da conta Wise-USD.
payment.transferwiseUsd.info.buyer=Envie o pagamento apenas para o endereço de email da conta Wise-USD do vendedor de XMR no Haveno.
payment.transferwiseUsd.info.seller=Verifique se o pagamento recebido corresponde ao nome do comprador de XMR na conta Wise-USD no Haveno.
payment.usPostalMoneyOrder.info=Negociar com US Postal Money Orders (USPMO) no Haveno requer que compreenda o seguinte:\n\n- Os compradores de XMR têm de escrever o nome do vendedor de XMR nos campos do pagador e do beneficiário e tirar uma fotografia de alta resolução do USPMO e do envelope, com prova de rastreio, antes de enviar.\n- Os compradores de XMR têm de enviar o USPMO ao vendedor de XMR com confirmação de entrega.\n\nCaso seja necessária mediação, ou se houver uma disputa no negócio, ser-lhe-á pedido que envie as fotografias ao mediador ou agente de reembolso do Haveno, juntamente com o número de série do USPMO, o número da estação de correios e a quantia em dólares, para que possam verificar os dados no site dos correios dos EUA.\n\nSe não fornecer ao árbitro as informações necessárias, perderá a disputa.\n\nEm todas as disputas, quem envia o USPMO assume 100% da responsabilidade de fornecer evidências/provas ao árbitro.\n\nSe não compreender estes requisitos, não negoceie com USPMO no Haveno.
payment.payByMail.info=Negociar com Pay by Mail no Haveno requer que compreenda o seguinte:\n\n● O comprador de XMR deve embalar o dinheiro num saco de dinheiro com selo inviolável.\n● O comprador de XMR deve filmar ou tirar fotografias de alta resolução do processo de embalagem do dinheiro, já com o endereço e o número de rastreio afixados na embalagem.\n● O comprador de XMR deve enviar a embalagem com o dinheiro ao vendedor de XMR com confirmação de entrega e seguro adequado.\n● O vendedor de XMR deve filmar a abertura da embalagem, garantindo que o número de rastreio fornecido pelo remetente fica visível no vídeo.\n● O ofertante tem de indicar quaisquer termos ou condições especiais no campo 'Informações adicionais' da conta de pagamento.\n● Ao aceitar a oferta, o aceitador concorda com os termos e condições do ofertante.\n\nOs negócios Pay by Mail colocam a responsabilidade de agir honestamente inteiramente em ambos os pares.\n\n● Os negócios Pay by Mail têm menos ações verificáveis do que outros negócios tradicionais. Isto torna a resolução de disputas muito mais difícil.\n● Tente resolver as disputas diretamente com o seu par através do chat do negócio. Esta é a via mais promissora para resolver qualquer disputa de Pay by Mail.\n● Os árbitros podem analisar o seu caso e fazer uma sugestão, mas NÃO há garantia de que possam ajudar.\n● Os árbitros tomam uma decisão com base nas evidências que lhes forem fornecidas. Por isso, siga e documente os processos acima para ter evidências em caso de disputa.\n● Pedidos de reembolso ao Haveno por fundos perdidos em negócios Pay By Mail NÃO serão considerados.\n\nSe não compreender estes requisitos, não negoceie com Pay by Mail no Haveno.

payment.payByMail.contact=Informação de contacto
payment.payByMail.contact.prompt=Nome ou pseudónimo a que o envelope deve ser dirigido
payment.payByMail.extraInfo.prompt=Indique nas suas ofertas: \n\nO país onde se encontra (por exemplo, França); \nOs países / regiões de onde aceita negócios (por exemplo, França, UE ou qualquer país europeu); \nQuaisquer termos/condições especiais; \nQuaisquer outros detalhes.
payment.tradingRestrictions=Reveja os termos e condições do ofertante.\nSe não cumprir os requisitos, não aceite este negócio.
payment.cashAtAtm.info=Levantamento sem cartão: levantamento de dinheiro num ATM usando um código\n\nPara usar este método de pagamento:\n\n1. Crie uma conta de pagamento de levantamento sem cartão, indicando os bancos, regiões ou outros termos que aceita, para serem mostrados com a oferta.\n\n2. Crie ou aceite uma oferta com essa conta de pagamento.\n\n3. Quando a oferta for aceite, combine com o seu par pelo chat uma hora para concluir o pagamento e partilhe os dados de pagamento.\n\nSe a quantia do negócio for superior ao limite de levantamento, os negociadores devem dividi-la em várias transações.\n\nOs negócios de dinheiro em ATM têm de ser em múltiplos de 10. Recomenda-se usar ofertas com intervalo, para que a quantia de XMR se possa ajustar ao preço exato.\n\nSe não conseguir concluir a transação conforme especificado no contrato do negócio, pode perder parte (ou a totalidade) do seu depósito de segurança.
payment.cashAtAtm.extraInfo.prompt=Indique nas suas ofertas: \n\nOs bancos / locais que aceita; \nQuaisquer termos/condições especiais; \nQuaisquer outros detalhes.
