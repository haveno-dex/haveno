payment.f2f.contact.prompt=Como quer ser contactado pelo parceiro de negociação? (endereço de email, número de telefone,...)
payment.f2f.city=Cidade para o encontro 'Face à face'
payment.f2f.city.prompt=A cidade será exibida com a oferta
payment.shared.optionalExtra=Informação adicional opcional
payment.shared.extraInfo=Informação adicional
payment.shared.extraInfo.offer=Informações adicionais sobre a oferta
payment.shared.extraInfo.prompt.paymentAccount=Defina quaisquer termos especiais, condições ou detalhes que você gostaria de exibir com suas ofertas para esta conta de pagamento (os usuários verão essas informações antes de aceitar as ofertas).
payment.shared.extraInfo.prompt.offer=Defina quaisquer termos, condições ou detalhes especiais que você gostaria de exibir com sua oferta.
payment.shared.extraInfo.noDeposit=Detalhes de contato e termos da oferta
payment.f2f.info=Os negócios 'presenciais' têm regras diferentes e envolvem riscos diferentes das transações online.\n\nAs principais diferenças são:\n● Os parceiros de negociação têm de trocar informações sobre o local e a hora do encontro usando os contactos fornecidos.\n● Os parceiros de negociação têm de levar os seus portáteis e fazer a confirmação de 'pagamento enviado' e 'pagamento recebido' no local do encontro.\n● Se um ofertante tiver 'termos e condições' especiais, tem de os indicar no campo de texto 'Informações adicionais' da conta.\n● Ao aceitar uma oferta, o aceitador concorda com os 'termos e condições' indicados pelo ofertante.\n● Em caso de disputa, o árbitro pouco pode ajudar, pois normalmente é difícil obter provas inequívocas do que aconteceu no encontro. Nesses casos, os fundos em XMR podem ficar bloqueados indefinidamente ou até os parceiros de negociação chegarem a acordo.\n\nPara ter a certeza de que compreende bem as diferenças dos negócios 'presenciais', leia as instruções e recomendações em: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
