portfolio.pending.mediationResult.popup.info=The mediator has suggested the following payout:\nYou receive: {0}\nYour trading peer receives: {1}\n\nYou can accept or reject this suggested payout.\n\nBy accepting, you sign the proposed payout transaction. If your trading peer also accepts and signs, the payout will be completed, and the trade will be closed.\n\nIf one or both of you reject the suggestion, you will have to wait until {2} (block {3}) to open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nThe arbitrator may charge a small fee (fee maximum: the trader's security deposit) as compensation for their work. Both traders agreeing to the mediator's suggestion is the happy path—requesting arbitration is meant for exceptional circumstances, such as if a trader is sure the mediator did not make a fair payout suggestion (or if the other peer is unresponsive).\n\nMore details about the new arbitration model: [HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.selfAccepted.lockTimeOver=You have accepted the mediator's suggested payout but it seems that your trading peer has not accepted it.\n\nOnce the lock time is over on {0} (block {1}), you can open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nYou can find more details about the arbitration model at:[HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.openArbitration=Rejeitar e solicitar arbitragem
portfolio.pending.mediationResult.popup.alreadyAccepted=Você já aceitou

portfolio.pending.failedTrade.missingDepositTx=Uma transação de depósito está faltando.\n\nEssa transação é necessária para concluir a negociação. Certifique-se de que sua carteira esteja totalmente sincronizada com a blockchain do Monero.\n\nVocê pode mover esta negociação para a seção "Negociações com Falha" para desativá-la.
portfolio.pending.failedTrade.errorMsgSet=Ocorreu um erro durante a execução do protocolo de negócio.\n\nErro: {0}\n\nÉ possível que este erro não seja crítico e que o negócio possa ser concluído normalmente. Se tiver dúvidas, abra um bilhete de mediação para obter aconselhamento dos mediadores do Haveno. \n\nSe o erro for crítico e o negócio não puder ser concluído, pode ter perdido a sua taxa de negócio. Peça o reembolso de taxas de negócio perdidas aqui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=O contrato do negócio não está definido.\n\nO negócio não pode ser concluído e pode ter perdido a sua taxa de negócio. Se for o caso, pode pedir o reembolso de taxas de negócio perdidas aqui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.info.popup=O protocolo de negócio encontrou alguns problemas.\n\n{0}
portfolio.pending.failedTrade.txChainInvalid.moveToFailed=O protocolo de negócio encontrou um problema grave.\n\n{0}\n\nQuer mover o negócio para os negócios falhados?\n\nNão pode abrir mediação ou arbitragem a partir da vista de negócios falhados, mas pode mover um negócio falhado de volta para os negócios abertos a qualquer momento.
portfolio.pending.failedTrade.txChainValid.moveToFailed=O protocolo de negócio encontrou alguns problemas.\n\n{0}\n\nAs transações do negócio foram publicadas e os fundos estão bloqueados. Só mova o negócio para os negócios falhados se tiver mesmo a certeza. Isso pode eliminar opções para resolver o problema.\n\nQuer mover o negócio para os negócios falhados?\n\nNão pode abrir mediação ou arbitragem a partir da vista de negócios falhados, mas pode mover um negócio falhado de volta para os negócios abertos a qualquer momento.
portfolio.pending.failedTrade.moveTradeToFailedIcon.tooltip=Mover negócio para os negócios falhados
portfolio.pending.failedTrade.warningIcon.tooltip=Clique para abrir os detalhes dos problemas deste negócio
portfolio.failed.revertToPending.popup=Quer mover este negócio para os negócios abertos?
portfolio.failed.revertToPending=Mover negócio para os negócios abertos

