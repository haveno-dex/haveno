payment.spei.info.seller=Verifique se o pagamento SPEI recebido corresponde à CLABE indicada na conta Haveno do comprador de XMR.

payment.blik.info.account=Para usar o BLIK, precisa de uma conta bancária na Polónia com uma aplicação de banca móvel que suporte BLIK.\n\nO comprador de XMR paga gerando um código BLIK e enviando-o ao vendedor de XMR pelo chat do negócio, pelo que ambos os negociadores têm de estar online para concluir o pagamento.
payment.blik.info.buyer=Para pagar, gere um código BLIK na sua aplicação de banca móvel e envie-o ao vendedor de XMR pelo chat do negócio.\n\nOs códigos BLIK só são válidos durante 2 minutos, por isso certifique-se de que o vendedor está a responder no chat do negócio antes de gerar o código.
payment.blik.info.seller=O comprador de XMR vai enviar-lhe um código BLIK pelo chat do negócio.\n\nOs códigos BLIK só são válidos durante 2 minutos, por isso use o código para receber o pagamento logo após o envio.

payment.vippsMobilePay.info.account=Para usar o Vipps MobilePay, precisa de uma conta registada com o seu número de telemóvel na Noruega, Dinamarca ou Finlândia.\n\nOs pagamentos não podem ser enviados entre países, pelo que ambos os negociadores têm de ter conta no mesmo país. A moeda de negociação é determinada pelo país da sua conta.
payment.vippsMobilePay.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.vippsMobilePay.info.seller=Verifique se o pagamento recebido na sua aplicação Vipps ou MobilePay corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.twint.info.account=Para usar o TWINT, precisa de uma conta registada com o seu número de telemóvel na Suíça.\n\nOs pagamentos TWINT só podem ser enviados entre contas TWINT suíças, pelo que ambos os negociadores têm de usar o TWINT. A moeda de negociação é CHF.
payment.twint.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.twint.info.seller=Verifique se o pagamento recebido na sua aplicação TWINT corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.nip.info.account=Para usar o NIP, precisa de uma conta bancária nigeriana ou de uma carteira de dinheiro móvel como OPay ou PalmPay.\n\nOs pagamentos são enviados por transferência bancária instantânea NIP para o número de conta de 10 dígitos do destinatário no seu banco ou fornecedor de carteira. A moeda de negociação é NGN.
payment.nip.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela verificação de nome da transferência corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.nip.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde ao número de conta e ao nome do titular indicados na conta do comprador de XMR.

payment.pagoMovil.info.account=Para usar o Pago Móvil, precisa de uma conta bancária venezuelana com Pago Móvil ativado, registada com o seu número de telemóvel, cédula e banco.\n\nOs pagamentos são enviados por transferência interbancária para o número de telemóvel, cédula e banco indicados. A moeda de negociação é VES.
payment.pagoMovil.info.buyer=Envie o pagamento apenas para o número de telemóvel, cédula e banco indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pelo seu banco corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.pagoMovil.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número de telemóvel, cédula e nome do titular indicados na conta do comprador de XMR.

payment.qris.info.account=Para usar o QRIS / BI-FAST, precisa de uma conta bancária indonésia ou de uma carteira eletrónica que possa receber transferências instantâneas.\n\nOs pagamentos são enviados por transferência instantânea BI-FAST para o número de conta do destinatário no seu banco ou carteira eletrónica, ou lendo o código QRIS do destinatário. A moeda de negociação é IDR.
payment.qris.info.buyer=Envie o pagamento apenas para o número de conta e o banco ou carteira eletrónica indicados na conta do vendedor de XMR, ou para um código QRIS que o vendedor partilhe consigo no chat do negócio, e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.qris.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira eletrónica corresponde ao número de conta e ao nome do titular indicados na conta do comprador de XMR.

payment.papara.info.account=Para usar o Papara / FAST, precisa de uma conta Papara ou de uma conta bancária turca que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o número Papara, o IBAN turco ou o número de telemóvel FAST Easy Address (Kolay Adres) do destinatário. A moeda de negociação é TRY.
payment.papara.info.buyer=Envie o pagamento apenas para o número de conta ou IBAN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.papara.info.seller=Verifique se o pagamento recebido na sua aplicação Papara ou bancária corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.raast.info.account=Para usar o Raast / Easypaisa / JazzCash, precisa de uma conta bancária ou carteira móvel paquistanesa que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o Raast ID (número de telemóvel registado), o número de telemóvel da carteira ou o IBAN paquistanês do destinatário. A moeda de negociação é PKR.
payment.raast.info.buyer=Envie o pagamento apenas para o número de telemóvel ou IBAN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.raast.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.paynow.info.account=Para usar o PayNow / FAST, precisa de uma conta bancária ou carteira eletrónica de Singapura que possa receber transferências instantâneas.\n\nOs pagamentos são enviados para o proxy PayNow do destinatário: um número de telemóvel registado ou NRIC/FIN. A moeda de negociação é SGD.
payment.paynow.info.buyer=Envie o pagamento apenas para o número de telemóvel ou NRIC/FIN e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.paynow.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.wero.info.account=Para usar o Wero, precisa da aplicação Wero ou da aplicação de um banco aderente, com o seu número de telemóvel registado na Alemanha, França ou Bélgica.\n\nOs pagamentos são enviados para o número de telemóvel registado do destinatário, inserido em formato internacional (p. ex. +49). A moeda de negociação é EUR.
payment.wero.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.wero.info.seller=Verifique se o pagamento recebido na sua aplicação Wero ou bancária corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.fps.info.account=Para usar o FPS (Faster Payment System), precisa de uma conta bancária de Hong Kong ou de uma carteira eletrónica como AlipayHK ou WeChat Pay HK.\n\nOs pagamentos são enviados para o proxy FPS do destinatário: um número de telemóvel registado, um FPS ID ou um endereço de email. A moeda de negociação é HKD.
payment.fps.info.buyer=Envie o pagamento apenas para o número de telemóvel, FPS ID ou email e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.fps.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.duitnow.info.account=Para usar o DuitNow, precisa de uma conta bancária malaia ou de uma carteira eletrónica como Touch 'n Go, GrabPay ou Boost.\n\nOs pagamentos são enviados para o proxy DuitNow do destinatário: um número de telemóvel registado ou NRIC. A moeda de negociação é MYR.
payment.duitnow.info.buyer=Envie o pagamento apenas para o número de telemóvel ou NRIC e o banco ou carteira indicados na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.duitnow.info.seller=Verifique se o pagamento recebido na sua aplicação bancária ou de carteira corresponde aos dados da conta e ao nome do titular indicados na conta do comprador de XMR.

payment.mbway.info.account=Para usar o MB WAY, precisa da aplicação MB WAY ativada com o seu número de telemóvel português.\n\nOs pagamentos são enviados para o número de telemóvel registado do destinatário. A moeda de negociação é EUR.
payment.mbway.info.buyer=Envie o pagamento apenas para o número de telemóvel indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.mbway.info.seller=Verifique se o pagamento recebido na sua aplicação MB WAY corresponde ao número de telemóvel e ao nome do titular indicados na conta do comprador de XMR.

payment.paypay.accountId=Número de telemóvel ou PayPay ID
payment.paypay.info.account=Para usar o PayPay, precisa de uma conta PayPay registada no Japão.\n\nOs pagamentos PayPay só podem ser enviados entre utilizadores PayPay, pelo que ambos os negociadores têm de usar o PayPay. Os pagamentos são enviados para o número de telemóvel registado ou PayPay ID do destinatário. A moeda de negociação é JPY.
payment.paypay.info.buyer=Envie o pagamento apenas para o número de telemóvel ou PayPay ID indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.paypay.info.seller=Verifique se o pagamento recebido na sua aplicação PayPay corresponde ao número de telemóvel ou PayPay ID e ao nome do titular indicados na conta do comprador de XMR.

payment.sbp.info.account=Certifique-se de que inclui o número de telefone associado à sua conta bancária para transferências SBP (Faster Payments).
payment.sbp.info.buyer=Envie o pagamento por SBP apenas para o número de telefone indicado na conta Haveno do vendedor de XMR.
payment.sbp.info.seller=Verifique se o pagamento SBP recebido corresponde ao número de telefone indicado na conta Haveno do comprador de XMR.

payment.mir.info.account=Para usar a transferência por cartão Mir, precisa de um cartão bancário russo que possa receber transferências cartão a cartão.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda de negociação é RUB.
payment.mir.info.buyer=Envie o pagamento apenas para o número do cartão indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação bancária corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.mir.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número do cartão e ao nome do titular indicados na conta do comprador de XMR.

payment.yoomoney.info.account=Para usar o YooMoney, precisa de uma carteira YooMoney registada na Rússia.\n\nOs pagamentos são enviados para o número da carteira do destinatário. A moeda de negociação é RUB.
payment.yoomoney.info.buyer=Envie o pagamento apenas para o número da carteira indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado na aplicação corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.yoomoney.info.seller=Verifique se o pagamento recebido na sua carteira YooMoney corresponde ao número da carteira e ao nome do titular indicados na conta do comprador de XMR.

payment.ukraineCard.info.account=Para usar a transferência cartão a cartão, precisa de um cartão bancário ucraniano (p. ex. PrivatBank ou Monobank) que possa receber transferências.\n\nOs pagamentos são enviados para o número do cartão do destinatário. A moeda de negociação é UAH.
payment.ukraineCard.info.buyer=Envie o pagamento apenas para o número do cartão indicado na conta do vendedor de XMR e verifique se o nome do destinatário mostrado pela sua aplicação bancária corresponde ao nome do titular da conta do vendedor antes de confirmar.
payment.ukraineCard.info.seller=Verifique se o pagamento recebido na sua aplicação bancária corresponde ao número do cartão e ao nome do titular indicados na conta do comprador de XMR.

