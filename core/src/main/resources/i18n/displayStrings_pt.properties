# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=Negociar XMR no Haveno requer que compreenda o seguinte requisito.\n\nSe vender XMR, tem de conseguir fornecer as seguintes informações a um mediador ou árbitro em caso de disputa:\n- a chave da transação (Tx Key, Tx Secret Key ou Tx Private Key)\n- o ID da transação (Tx ID ou Tx Hash)\n- o endereço de destino (endereço do destinatário)\n\nConsulte a wiki para saber onde encontrar estas informações nas carteiras Monero mais populares [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nSe não fornecer os dados da transação necessários, perderá as disputas.\n\nNote também que o Haveno oferece agora confirmação automática de transações XMR para tornar os negócios mais rápidos, mas tem de a ativar nas Definições.\n\nConsulte a wiki para mais informações sobre a funcionalidade de confirmação automática: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


