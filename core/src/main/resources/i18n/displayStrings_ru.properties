portfolio.pending.failedTrade.missingDepositTx=Отсутствует транзакция депозита.\n\nЭта транзакция необходима для завершения сделки. Пожалуйста, убедитесь, что ваш кошелёк полностью синхронизирован с блокчейном Monero.\n\nВы можете переместить эту сделку в раздел "Неудачные сделки", чтобы деактивировать её.
portfolio.pending.failedTrade.errorMsgSet=Во время выполнения торгового протокола произошла ошибка.\n\nОшибка: {0}\n\nВозможно, ошибка не критична, и сделку можно завершить в обычном порядке. Если вы не уверены, откройте запрос на посредничество, чтобы получить совет посредников Haveno. \n\nЕсли ошибка критична и сделку нельзя завершить, вы могли потерять комиссию за сделку. Запросить возмещение потерянной комиссии можно здесь: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=Контракт сделки не задан.\n\nСделку нельзя завершить, и вы могли потерять комиссию за сделку. В этом случае запросить возмещение потерянной комиссии можно здесь: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
