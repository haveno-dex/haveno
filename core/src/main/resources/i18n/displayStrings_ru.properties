payment.zelle.info=Сервис денежных переводов Zelle лучше всего работает *через* другой банк.\n\n1. Проверьте на этой странице, работает ли ваш банк с Zelle (и как): [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. Обратите особое внимание на лимиты переводов: они зависят от банка, и банки часто задают отдельные дневные, недельные и месячные лимиты.\n\n3. Если ваш банк не работает с Zelle, вы всё равно можете пользоваться мобильным приложением Zelle, но лимиты будут намного ниже.\n\n4. Имя в вашем счёте Haveno ДОЛЖНО совпадать с именем в вашем счёте Zelle/банка. \n\nЕсли вы не сможете выполнить перевод Zelle, как указано в контракте сделки, вы можете потерять часть (или весь) залог.\n\nИз-за несколько повышенного риска возврата платежей в Zelle продавцам рекомендуется связаться с неподписанными покупателями по эл. почте или SMS, чтобы убедиться, что покупатель действительно владеет счётом Zelle, указанным в Haveno.
payment.fasterPayments.newRequirements.info=Некоторые банки начали проверять полное имя получателя при переводах Faster Payments. В вашем текущем счёте Faster Payments полное имя не указано.\n\nРекомендуем заново создать счёт Faster Payments в Haveno, чтобы будущие покупатели {0} видели полное имя.\n\nПри создании нового счёта обязательно скопируйте точные значения sort code, номера счёта и соли для проверки возраста счёта из старого счёта. Это сохранит возраст и статус подписания вашего счёта.
payment.fasterPayments.ukSortCode=Британский sort code
payment.moneyGram.info=При использовании MoneyGram покупатель XMR должен отправить продавцу XMR по эл. почте номер авторизации и фото квитанции. На квитанции должны быть чётко видны полное имя продавца, страна, штат и сумма. Эл. почта продавца будет показана покупателю во время сделки.
payment.westernUnion.info=При использовании Western Union покупатель XMR должен отправить продавцу XMR по эл. почте MTCN (номер отслеживания) и фото квитанции. На квитанции должны быть чётко видны полное имя продавца, город, страна и сумма. Эл. почта продавца будет показана покупателю во время сделки.
payment.halCash.info=Используя HalCash, покупатель XMR обязуется отправить продавцу XMR код HalCash через СМС с мобильного телефона.\n\nУбедитесь, что не вы не превысили максимальную сумму, которую ваш банк позволяет отправить с HalCash. Минимальная сумма на вывод средств составляет 10 EUR, а и максимальная — 600 EUR. При повторном выводе средств лимит составляет 3000 EUR на получателя в день и 6000 EUR на получателя в месяц. Просьба сверить эти лимиты с вашим банком и убедиться, что лимиты банка соответствуют лимитам, указанным здесь.\n\nВыводимая сумма должна быть кратна 10 EUR, так как другие суммы снять из банкомата невозможно. Приложение само отрегулирует сумму XMR, чтобы она соответствовала сумме в EUR, во время создания или принятия предложения. Вы не сможете использовать текущий рыночный курс, так как сумма в EUR будет меняться с изменением курса.\n\nВ случае спора покупателю XMR необходимо предоставить доказательство отправки EUR.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Учтите, что все банковские переводы несут определённый риск возврата платежа. Чтобы снизить этот риск, Haveno устанавливает лимиты на сделку в зависимости от оценки риска возврата для используемого способа оплаты.\n\nДля этого способа оплаты ваш лимит на сделку при покупке и продаже составляет {2}.\n\nЛимит относится только к размеру одной сделки: вы можете совершать сколько угодно сделок.\n\nПодробнее в вики [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Чтобы снизить риск возврата платежей, Haveno устанавливает лимиты на сделку для этого типа платёжного счёта с учётом двух факторов:\n\n1. Общий риск возврата платежа для способа оплаты\n2. Статус подписания счёта\n\nЭтот платёжный счёт ещё не подписан, поэтому покупка ограничена {0} за сделку. После подписания лимиты на покупку будут расти так:\n\n● До подписания и в течение 30 дней после него лимит на покупку за сделку составит {0}\n● Через 30 дней после подписания лимит на покупку за сделку составит {1}\n● Через 60 дней после подписания лимит на покупку за сделку составит {2}\n\nЛимиты на продажу не зависят от подписания счёта. Вы можете сразу продать {2} за одну сделку.\n\nЛимиты относятся только к размеру одной сделки: вы можете совершать сколько угодно сделок. \n\nПодробнее в вики [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

payment.cashDeposit.info=Убедитесь, что ваш банк позволяет отправлять денежные переводы на счета других лиц. Например, Bank of America и Wells Fargo больше не разрешают такие переводы.

payment.revolut.info=Revolut требует указывать 'Имя пользователя' в качестве идентификатора счёта, а не номер телефона или эл. почту, как раньше.
payment.account.revolut.addUserNameInfo={0}\nВ вашем существующем счёте Revolut ({1}) не указано 'Имя пользователя'.\nВведите ваше 'Имя пользователя' Revolut, чтобы обновить данные счёта.\nЭто не повлияет на статус подписания возраста счёта.
payment.revolut.addUserNameInfo.headLine=Обновить счёт Revolut

payment.cashapp.info=Обратите внимание, что Cash App имеет более высокий риск возврата платежей, чем большинство банковских переводов.
payment.venmo.info=Обратите внимание, что Venmo имеет более высокий риск возврата платежей, чем большинство банковских переводов.
payment.paypal.info=Обратите внимание, что PayPal имеет более высокий риск возврата платежей, чем большинство банковских переводов.

payment.amazonGiftCard.upgrade=Для способа оплаты подарочными картами Amazon необходимо указать страну.
payment.account.amazonGiftCard.addCountryInfo={0}\nВ вашем существующем счёте Amazon Gift Card ({1}) не указана страна.\nВведите страну для Amazon Gift Card, чтобы обновить данные счёта.\nЭто не повлияет на статус возраста счёта.
payment.amazonGiftCard.upgrade.headLine=Обновить счёт Amazon Gift Card
payment.swift.info.account=Внимательно ознакомьтесь с основными правилами использования SWIFT в Haveno:\n\n- заполняйте все поля полностью и точно \n- покупатель должен отправить платёж в валюте, указанной мейкером \n- покупатель должен использовать модель разделённой комиссии (SHA) \n- у покупателя и продавца могут возникнуть комиссии, поэтому заранее уточните тарифы своего банка \n\nSWIFT сложнее других способов оплаты, поэтому ознакомьтесь с полным руководством в вики [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=Чтобы купить monero через SWIFT, вы должны:\n\n- отправить платёж в валюте, указанной мейкером \n- использовать модель разделённой комиссии (SHA)\n\nОзнакомьтесь с руководством в вики, чтобы избежать штрафов и провести сделку без проблем [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=Отправители SWIFT обязаны использовать модель разделённой комиссии (SHA).\n\nЕсли вы получили платёж SWIFT без SHA, откройте запрос на посредничество.\n\nОзнакомьтесь с руководством в вики, чтобы избежать штрафов и провести сделку без проблем [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=Обязательно укажите:\n\n● Полное имя владельца счёта\n● Номер счёта\n● Номер IFSC\n\nЭти данные должны соответствовать банковскому счёту, который вы будете использовать для отправки и получения платежей.\n\nУчтите, что за одну транзакцию можно отправить не более Rs. 200 000. Если сумма сделки больше, потребуется несколько транзакций. При этом за день можно отправить не более Rs. 1 000 000.\n\nУ некоторых банков лимиты для клиентов отличаются.
payment.imps.info.buyer=Отправляйте платёж только по реквизитам, указанным в Haveno.\n\nМакс. сумма сделки составляет Rs. 200 000 за транзакцию.\n\nЕсли сумма сделки превышает Rs. 200 000, потребуется несколько переводов. При этом за день можно отправить не более Rs. 1 000 000.\n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.imps.info.seller=Если вы планируете получать более Rs. 200 000 за сделку, покупателю придётся сделать несколько переводов. При этом за день можно отправить не более Rs. 1 000 000.\n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.neft.info.account=Обязательно укажите:\n\n● Полное имя владельца счёта\n● Номер счёта\n● Номер IFSC\n\nЭти данные должны соответствовать банковскому счёту, который вы будете использовать для отправки и получения платежей.\n\nУчтите, что за одну транзакцию можно отправить не более Rs. 50 000. Если сумма сделки больше, потребуется несколько транзакций.\n\nОбратите внимание, что у некоторых банков лимиты для клиентов отличаются.
payment.neft.info.buyer=Отправляйте платёж только по реквизитам, указанным в Haveno.\n\nМакс. сумма сделки составляет Rs. 50 000 за транзакцию.\n\nЕсли сумма сделки превышает Rs. 50 000, потребуется несколько переводов.\n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.neft.info.seller=Если вы планируете получать более Rs. 50 000 за сделку, покупателю придётся сделать несколько переводов.\n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.paytm.info.account=Обязательно укажите эл. почту или номер телефона, совпадающие с данными вашего аккаунта PayTM. \n\nДля аккаунтов PayTM без KYC действуют ограничения: \n\n● Не более Rs. 5 000 за транзакцию.\n● Не более Rs. 10 000 на кошельке PayTM.\n\nЕсли вы планируете сделки более 5 000 за раз, потребуется пройти KYC в PayTM. С KYC действуют ограничения:\n\n● Не более Rs. 100 000 за транзакцию.\n● Не более Rs. 100 000 на кошельке PayTM.\n\nТакже учитывайте лимиты аккаунта. Сделки сверх лимитов PayTM, скорее всего, придётся проводить дольше одного дня или отменять.
payment.paytm.info.buyer=Отправляйте платёж только на указанный адрес эл. почты или номер телефона.\n\nЕсли вы планируете сделки более Rs. 5 000 за раз, потребуется пройти KYC в PayTM.\n\nБез KYC можно отправить Rs. 5 000 за транзакцию.\n\nС KYC можно отправить Rs. 100 000 за транзакцию.
payment.paytm.info.seller=Если вы планируете сделки более Rs. 5 000 за раз, потребуется пройти KYC в PayTM. С KYC действуют ограничения:\n\n● Не более Rs. 100 000 за транзакцию.\n● Не более Rs. 100 000 на вашем кошельке PayTM .\n\nТакже учитывайте лимиты аккаунта. Поскольку на кошельке PayTM можно хранить не более Rs. 100 000, регулярно выводите рупии.
payment.rtgs.info.account=RTGS предназначен для крупных сделок от Rs. 200 000.\n\nПри настройке платёжного счёта RTGS обязательно укажите:\n\n● Полное имя владельца счёта\n● Номер счёта\n● Номер IFSC\n\nЭти данные должны соответствовать банковскому счёту, который вы будете использовать для отправки и получения платежей.\n\nУчтите, что минимальная сумма за транзакцию составляет Rs. 200 000. Если сумма сделки меньше, сделка будет отменена либо обоим трейдерам придётся договориться о другом способе оплаты (например, IMPS или UPI).
payment.rtgs.info.buyer=Отправляйте платёж только по реквизитам, указанным в Haveno.\n\nУчтите, что минимальная сумма за транзакцию составляет Rs. 200 000. Если сумма сделки меньше, сделка будет отменена либо обоим трейдерам придётся договориться о другом способе оплаты (например, IMPS или UPI).
payment.rtgs.info.seller=Учтите, что минимальная сумма за транзакцию составляет Rs. 200 000. Если сумма сделки меньше, сделка будет отменена либо обоим трейдерам придётся договориться о другом способе оплаты (например, IMPS или UPI).
payment.upi.info.account=Обязательно укажите ваш виртуальный платёжный адрес (VPA), также называемый UPI ID. Его формат похож на адрес эл. почты со знаком “@” посередине. Например, ваш UPI ID может выглядеть как “receiver's_name@bank_name” или “phone_number@bank_name”. \n\nДля UPI действует лимит Rs. 100 000 за транзакцию. \n\nЕсли вы планируете сделки более Rs. 100 000 за раз, скорее всего, потребуется несколько переводов. \n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.upi.info.buyer=Отправляйте платёж только на VPA / UPI ID, указанный в Haveno. \n\nМакс. сумма сделки составляет Rs. 100 000 за транзакцию. \n\nЕсли сумма сделки превышает Rs. 100 000, потребуется несколько переводов. \n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.upi.info.seller=Если вы планируете получать более Rs. 100 000 за сделку, покупателю придётся сделать несколько переводов. \n\nУчтите, что у некоторых банков лимиты для клиентов отличаются.
payment.celpay.info.account=Обязательно укажите эл. почту, на которую зарегистрирован ваш аккаунт Celsius. Так отправленные средства будут отображаться с правильного аккаунта, а полученные зачислятся на ваш аккаунт.\n\nПользователи CelPay могут отправлять не более 2 500 $ (или эквивалент в другой валюте/криптовалюте) за 24 часа.\n\nСделки сверх лимитов CelPay, скорее всего, придётся проводить дольше одного дня или отменять.\n\nCelPay поддерживает несколько стейблкоинов:\n\n● Стейблкоины USD: DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Стейблкоины CAD: TrueCAD\n● Стейблкоины GBP: TrueGBP\n● Стейблкоины HKD: TrueHKD\n● Стейблкоины AUD: TrueAUD\n\nПокупатели XMR могут отправить продавцу XMR любой стейблкоин в соответствующей валюте.
payment.celpay.info.buyer=Отправляйте платёж только на адрес эл. почты, указанный продавцом XMR, через платёжную ссылку.\n\nCelPay позволяет отправлять не более 2 500 $ (или эквивалент в другой валюте/криптовалюте) за 24 часа.\n\nСделки сверх лимитов CelPay, скорее всего, придётся проводить дольше одного дня или отменять.\n\nCelPay поддерживает несколько стейблкоинов:\n\n● Стейблкоины USD: DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Стейблкоины CAD: TrueCAD\n● Стейблкоины GBP: TrueGBP\n● Стейблкоины HKD: TrueHKD\n● Стейблкоины AUD: TrueAUD\n\nПокупатели XMR могут отправить продавцу XMR любой стейблкоин в соответствующей валюте.
payment.celpay.info.seller=Продавцы XMR получают платёж через защищённую платёжную ссылку. Убедитесь, что платёжная ссылка содержит адрес эл. почты, указанный покупателем XMR.\n\nПользователи CelPay могут отправлять не более 2 500 $ (или эквивалент в другой валюте/криптовалюте) за 24 часа.\n\nСделки сверх лимитов CelPay, скорее всего, придётся проводить дольше одного дня или отменять.\n\nCelPay поддерживает несколько стейблкоинов:\n\n● Стейблкоины USD: DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Стейблкоины CAD: TrueCAD\n● Стейблкоины GBP: TrueGBP\n● Стейблкоины HKD: TrueHKD\n● Стейблкоины AUD: TrueAUD\n\nПродавцы XMR могут получить от покупателя XMR любой стейблкоин в соответствующей валюте. Покупатель XMR вправе отправить любой стейблкоин в соответствующей валюте.
payment.celpay.supportedCurrenciesForReceiver=Поддерживаемые валюты (обратите внимание: все валюты ниже являются стейблкоинами, поддерживаемыми в приложении Celsius. Сделки проводятся в стейблкоинах, а не в фиатной валюте.)
payment.nequi.info.account=Обязательно укажите номер телефона, привязанный к вашему аккаунту Nequi.\n\nПри создании аккаунта Nequi лимит отправки составляет около 7 000 000 COP в месяц.\n\nЕсли вы планируете сделки более 7 000 000 COP за раз, потребуется пройти KYC в Bancolombia и заплатить комиссию около 15 000 COP. После этого все транзакции облагаются налогом 0,4%. Уточняйте актуальные налоги.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.nequi.info.buyer=Отправляйте платёж только на номер телефона, указанный в счёте Haveno продавца XMR.\n\nПри создании аккаунта Nequi лимит отправки составляет около 7 000 000 COP в месяц.\n\nЕсли вы планируете сделки более 7 000 000 COP за раз, потребуется пройти KYC в Bancolombia и заплатить комиссию около 15 000 COP. После этого все транзакции облагаются налогом 0,4%. Уточняйте актуальные налоги.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.nequi.info.seller=Убедитесь, что полученный платёж соответствует номеру телефона, указанному в счёте Haveno покупателя XMR.\n\nПри создании аккаунта Nequi лимит отправки составляет около 7 000 000 COP в месяц.\n\nЕсли вы планируете сделки более 7 000 000 COP за раз, потребуется пройти KYC в Bancolombia и заплатить комиссию около 15 000 COP. После этого все транзакции облагаются налогом 0,4%. Уточняйте актуальные налоги.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.mpesa.info.account=Укажите номер телефона, привязанный к вашему счёту M-Pesa.
payment.mpesa.info.buyer=Отправляйте платёж через M-Pesa только на номер телефона, указанный в счёте продавца XMR в Haveno.
payment.mpesa.info.seller=Убедитесь, что полученный платёж M-Pesa соответствует номеру телефона, указанному в счёте покупателя XMR в Haveno.
payment.mercadoPago.info.account=Укажите электронную почту или номер телефона, привязанные к вашему счёту Mercado Pago.
payment.mercadoPago.info.buyer=Отправляйте платёж через Mercado Pago только на электронную почту или номер телефона, указанные в счёте продавца XMR в Haveno.
payment.mercadoPago.info.seller=Убедитесь, что полученный платёж Mercado Pago соответствует электронной почте или номеру телефона, указанным в счёте покупателя XMR в Haveno.
payment.gcash.info.account=Укажите номер телефона, привязанный к вашему счёту GCash.
payment.gcash.info.buyer=Отправляйте платёж через GCash только на номер телефона, указанный в счёте продавца XMR в Haveno.
payment.gcash.info.seller=Убедитесь, что полученный платёж GCash соответствует номеру телефона, указанному в счёте покупателя XMR в Haveno.
payment.momo.info.account=Укажите номер телефона, привязанный к вашему счёту MoMo.
payment.momo.info.buyer=Отправляйте платёж через MoMo только на номер телефона, указанный в счёте продавца XMR в Haveno.
payment.momo.info.seller=Убедитесь, что полученный платёж MoMo соответствует номеру телефона, указанному в счёте покупателя XMR в Haveno.
payment.spei.info.account=Укажите CLABE (18-значный межбанковский номер счёта), привязанный к вашему банковскому счёту для переводов SPEI.
payment.spei.info.buyer=Отправляйте платёж через SPEI только на CLABE, указанный в счёте продавца XMR в Haveno.
payment.spei.info.seller=Убедитесь, что полученный платёж SPEI соответствует CLABE, указанному в счёте покупателя XMR в Haveno.
payment.bizum.info.account=Для использования Bizum нужен банковский счёт (IBAN) в Испании и регистрация в сервисе.\n\nBizum можно использовать для сделок от 0 €.50 до 1 000 €.\n\nМакс. сумма отправки/получения через Bizum составляет 2 000 € в день.\n\nПользователи Bizum могут совершать не более 150 операций в месяц.\n\nКаждый банк может устанавливать собственные лимиты для клиентов в пределах указанных.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.bizum.info.buyer=Отправляйте платёж только на номер мобильного телефона продавца XMR, указанный в Haveno.\n\nМакс. сумма сделки составляет 1 000 € за платёж. Макс. сумма отправки через Bizum составляет 2 000 € в день.\n\nПри превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.bizum.info.seller=Убедитесь, что платёж получен с номера мобильного телефона покупателя XMR, указанного в Haveno.\n\nМакс. сумма сделки составляет 1 000 € за платёж. Макс. сумма получения через Bizum составляет 2 000 € в день.\n\nПри превышении лимитов сделка может быть отменена, а к вам применён штраф.

payment.blik.info.account=Для использования BLIK нужен банковский счёт в Польше и мобильное банковское приложение с поддержкой BLIK.\n\nПокупатель XMR генерирует BLIK-код и отправляет его продавцу XMR в чате сделки, поэтому для завершения платежа оба трейдера должны быть в сети.
payment.blik.info.buyer=Для оплаты сгенерируйте BLIK-код в мобильном банковском приложении и отправьте его продавцу XMR в чате сделки.\n\nBLIK-коды действуют только 2 минуты, поэтому перед генерацией кода убедитесь, что продавец отвечает в чате сделки.
payment.blik.info.seller=Покупатель XMR отправит вам BLIK-код в чате сделки.\n\nBLIK-коды действуют только 2 минуты, поэтому используйте код для получения платежа сразу после его отправки.

payment.vippsMobilePay.info.account=Для использования Vipps MobilePay нужен счёт, зарегистрированный на ваш номер мобильного телефона в Норвегии, Дании или Финляндии.\n\nПлатежи между странами невозможны, поэтому у обоих трейдеров должны быть счета в одной стране. Валюта сделки определяется страной вашего счёта.
payment.vippsMobilePay.info.buyer=Отправляйте платёж только на номер мобильного телефона, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.vippsMobilePay.info.seller=Убедитесь, что платёж, полученный в приложении Vipps или MobilePay, соответствует номеру мобильного телефона и имени владельца, указанным в счёте покупателя XMR.

payment.twint.info.account=Для использования TWINT нужен счёт, зарегистрированный на ваш номер мобильного телефона в Швейцарии.\n\nПлатежи TWINT возможны только между швейцарскими счетами TWINT, поэтому оба трейдера должны использовать TWINT. Валюта сделки: CHF.
payment.twint.info.buyer=Отправляйте платёж только на номер мобильного телефона, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.twint.info.seller=Убедитесь, что платёж, полученный в приложении TWINT, соответствует номеру мобильного телефона и имени владельца, указанным в счёте покупателя XMR.

payment.nip.info.account=Для использования NIP нужен нигерийский банковский счёт или мобильный кошелёк, например OPay или PalmPay.\n\nПлатежи отправляются мгновенным банковским переводом NIP на 10-значный номер счёта получателя в его банке или кошельке. Валюта сделки: NGN.
payment.nip.info.buyer=Отправляйте платёж только на номер счёта и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя, показанное при проверке имени перевода, совпадает с именем владельца счёта продавца.
payment.nip.info.seller=Убедитесь, что платёж, полученный в банковском приложении или приложении кошелька, соответствует номеру счёта и имени владельца, указанным в счёте покупателя XMR.

payment.pagoMovil.info.account=Для использования Pago Móvil нужен венесуэльский банковский счёт с подключённым Pago Móvil, зарегистрированный на ваш номер мобильного телефона, cédula и банк.\n\nПлатежи отправляются межбанковским переводом на указанные номер мобильного телефона, cédula и банк. Валюта сделки: VES.
payment.pagoMovil.info.buyer=Отправляйте платёж только на номер мобильного телефона, cédula и банк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя, показанное вашим банком, совпадает с именем владельца счёта продавца.
payment.pagoMovil.info.seller=Убедитесь, что платёж, полученный в банковском приложении, соответствует номеру мобильного телефона, cédula и имени владельца, указанным в счёте покупателя XMR.

payment.qris.info.account=Для использования QRIS / BI-FAST нужен индонезийский банковский счёт или электронный кошелёк с поддержкой мгновенных переводов.\n\nПлатежи отправляются мгновенным переводом BI-FAST на номер счёта получателя в его банке или электронном кошельке либо сканированием QRIS-кода получателя. Валюта сделки: IDR.
payment.qris.info.buyer=Отправляйте платёж только на номер счёта и в банк или электронный кошелёк, указанные в счёте продавца XMR, либо по QRIS-коду, который продавец отправит вам в чате сделки, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.qris.info.seller=Убедитесь, что платёж, полученный в банковском приложении или электронном кошельке, соответствует номеру счёта и имени владельца, указанным в счёте покупателя XMR.

payment.papara.info.account=Для использования Papara / FAST нужен счёт Papara или турецкий банковский счёт с поддержкой мгновенных переводов.\n\nПлатежи отправляются на номер Papara, турецкий IBAN или номер мобильного телефона FAST Easy Address (Kolay Adres) получателя. Валюта сделки: TRY.
payment.papara.info.buyer=Отправляйте платёж только на номер счёта или IBAN и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.papara.info.seller=Убедитесь, что платёж, полученный в приложении Papara или банковском приложении, соответствует реквизитам и имени владельца, указанным в счёте покупателя XMR.

payment.raast.info.account=Для использования Raast / Easypaisa / JazzCash нужен пакистанский банковский счёт или мобильный кошелёк с поддержкой мгновенных переводов.\n\nПлатежи отправляются на Raast ID получателя (зарегистрированный номер мобильного телефона), номер мобильного телефона кошелька или пакистанский IBAN. Валюта сделки: PKR.
payment.raast.info.buyer=Отправляйте платёж только на номер мобильного телефона или IBAN и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.raast.info.seller=Убедитесь, что платёж, полученный в банковском приложении или приложении кошелька, соответствует реквизитам и имени владельца, указанным в счёте покупателя XMR.

payment.paynow.info.account=Для использования PayNow / FAST нужен сингапурский банковский счёт или электронный кошелёк с поддержкой мгновенных переводов.\n\nПлатежи отправляются на PayNow-идентификатор получателя: зарегистрированный номер мобильного телефона или NRIC/FIN. Валюта сделки: SGD.
payment.paynow.info.buyer=Отправляйте платёж только на номер мобильного телефона или NRIC/FIN и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.paynow.info.seller=Убедитесь, что платёж, полученный в банковском приложении или приложении кошелька, соответствует реквизитам и имени владельца, указанным в счёте покупателя XMR.

payment.wero.info.account=Для использования Wero нужно приложение Wero или приложение банка-участника с номером мобильного телефона, зарегистрированным в Германии, Франции или Бельгии.\n\nПлатежи отправляются на зарегистрированный номер мобильного телефона получателя в международном формате (напр. +49). Валюта сделки: EUR.
payment.wero.info.buyer=Отправляйте платёж только на номер мобильного телефона, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.wero.info.seller=Убедитесь, что платёж, полученный в приложении Wero или банковском приложении, соответствует номеру мобильного телефона и имени владельца, указанным в счёте покупателя XMR.

payment.fps.info.account=Для использования FPS (Faster Payment System) нужен гонконгский банковский счёт или электронный кошелёк, например AlipayHK или WeChat Pay HK.\n\nПлатежи отправляются на FPS-идентификатор получателя: зарегистрированный номер мобильного телефона, FPS ID или электронную почту. Валюта сделки: HKD.
payment.fps.info.buyer=Отправляйте платёж только на номер мобильного телефона, FPS ID или электронную почту и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.fps.info.seller=Убедитесь, что платёж, полученный в банковском приложении или приложении кошелька, соответствует реквизитам и имени владельца, указанным в счёте покупателя XMR.

payment.duitnow.info.account=Для использования DuitNow нужен малайзийский банковский счёт или электронный кошелёк, например Touch 'n Go, GrabPay или Boost.\n\nПлатежи отправляются на DuitNow-идентификатор получателя: зарегистрированный номер мобильного телефона или NRIC. Валюта сделки: MYR.
payment.duitnow.info.buyer=Отправляйте платёж только на номер мобильного телефона или NRIC и в банк или кошелёк, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем приложении совпадает с именем владельца счёта продавца.
payment.duitnow.info.seller=Убедитесь, что платёж, полученный в банковском приложении или приложении кошелька, соответствует реквизитам и имени владельца, указанным в счёте покупателя XMR.

payment.mbway.info.account=Для использования MB WAY нужно приложение MB WAY, активированное с вашим португальским номером мобильного телефона.\n\nПлатежи отправляются на зарегистрированный номер мобильного телефона получателя. Валюта сделки: EUR.
payment.mbway.info.buyer=Отправляйте платёж только на номер мобильного телефона, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.mbway.info.seller=Убедитесь, что платёж, полученный в приложении MB WAY, соответствует номеру мобильного телефона и имени владельца, указанным в счёте покупателя XMR.

payment.paypay.accountId=Номер мобильного телефона или PayPay ID
payment.paypay.info.account=Для использования PayPay нужен счёт PayPay, зарегистрированный в Японии.\n\nПлатежи PayPay возможны только между пользователями PayPay, поэтому оба трейдера должны использовать PayPay. Платежи отправляются на зарегистрированный номер мобильного телефона или PayPay ID получателя. Валюта сделки: JPY.
payment.paypay.info.buyer=Отправляйте платёж только на номер мобильного телефона или PayPay ID, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.paypay.info.seller=Убедитесь, что платёж, полученный в приложении PayPay, соответствует номеру мобильного телефона или PayPay ID и имени владельца, указанным в счёте покупателя XMR.

payment.sbp.info.account=Укажите номер телефона, привязанный к вашему банковскому счёту для переводов через SBP (Систему быстрых платежей).
payment.sbp.info.buyer=Отправляйте платёж через SBP только на номер телефона, указанный в счёте продавца XMR в Haveno.
payment.sbp.info.seller=Убедитесь, что полученный платёж SBP соответствует номеру телефона, указанному в счёте покупателя XMR в Haveno.

payment.mir.info.account=Для использования перевода на карту Mir нужна российская банковская карта с поддержкой переводов с карты на карту.\n\nПлатежи отправляются на номер карты получателя. Валюта сделки: RUB.
payment.mir.info.buyer=Отправляйте платёж только на номер карты, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем банковском приложении совпадает с именем владельца счёта продавца.
payment.mir.info.seller=Убедитесь, что платёж, полученный в банковском приложении, соответствует номеру карты и имени владельца, указанным в счёте покупателя XMR.

payment.yoomoney.info.account=Для использования YooMoney нужен кошелёк YooMoney, зарегистрированный в России.\n\nПлатежи отправляются на номер кошелька получателя. Валюта сделки: RUB.
payment.yoomoney.info.buyer=Отправляйте платёж только на номер кошелька, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.yoomoney.info.seller=Убедитесь, что платёж, полученный в кошельке YooMoney, соответствует номеру кошелька и имени владельца, указанным в счёте покупателя XMR.

payment.ukraineCard.info.account=Для использования перевода с карты на карту нужна украинская банковская карта (напр. PrivatBank или Monobank) с поддержкой переводов.\n\nПлатежи отправляются на номер карты получателя. Валюта сделки: UAH.
payment.ukraineCard.info.buyer=Отправляйте платёж только на номер карты, указанный в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в вашем банковском приложении совпадает с именем владельца счёта продавца.
payment.ukraineCard.info.seller=Убедитесь, что платёж, полученный в банковском приложении, соответствует номеру карты и имени владельца, указанным в счёте покупателя XMR.

payment.kaspi.accountId=Номер мобильного телефона или номер карты
payment.kaspi.info.account=Для использования Kaspi нужен счёт Kaspi, зарегистрированный в Казахстане.\n\nПлатежи отправляются на зарегистрированный номер мобильного телефона или номер карты Kaspi Gold получателя. Валюта сделки: KZT.
payment.kaspi.info.buyer=Отправляйте платёж только на номер мобильного телефона или номер карты, указанные в счёте продавца XMR, и перед подтверждением убедитесь, что имя получателя в приложении совпадает с именем владельца счёта продавца.
payment.kaspi.info.seller=Убедитесь, что платёж, полученный в приложении Kaspi, соответствует номеру мобильного телефона или номеру карты и имени владельца, указанным в счёте покупателя XMR.
payment.pix.info.account=Обязательно укажите выбранный ключ Pix. Есть четыре типа ключей: CPF (реестр физических лиц) или CNPJ (реестр юридических лиц), адрес эл. почты, номер телефона или случайный ключ, сгенерированный системой (UUID). Для каждого счёта Pix нужен свой ключ. Физические лица могут создать до пяти ключей для каждого своего счёта.\n\nПри торговле на Haveno покупателям XMR следует указывать свой ключ Pix в описании платежа, чтобы продавцу XMR было легко определить, что платёж пришёл именно от них.
payment.pix.info.buyer=Отправляйте платёж только на ключ Pix, указанный в счёте Haveno продавца XMR.\n\nУкажите свой ключ Pix в назначении платежа, чтобы продавцу XMR было легко определить, что платёж пришёл от вас.
payment.pix.info.seller=Убедитесь, что описание полученного платежа соответствует ключу Pix, указанному в счёте Haveno покупателя XMR.
payment.pix.key=Ключ Pix (CPF, CNPJ, эл. почта, номер телефона или UUID)
payment.monese.info.account=Monese является банковским приложением для пользователей GBP, EUR и RON*. Monese позволяет мгновенно и бесплатно отправлять деньги на другие счета Monese в любой поддерживаемой валюте.\n\n*Чтобы открыть счёт в RON в Monese, нужно жить в Румынии или иметь румынское гражданство.\n\nПри настройке счёта Monese в Haveno обязательно укажите имя и номер телефона, совпадающие с вашим аккаунтом Monese. Так отправленные средства будут отображаться с правильного счёта, а полученные зачислятся на ваш счёт.
payment.monese.info.buyer=Отправляйте платёж только на номер телефона, указанный продавцом XMR в его счёте Haveno. Оставьте описание платежа пустым.
payment.monese.info.seller=Продавцы XMR получают платёж с номера телефона / имени, указанных в счёте Haveno покупателя XMR.
payment.satispay.info.account=Для использования Satispay нужен банковский счёт (IBAN) в Италии и регистрация в сервисе.\n\nЛимиты аккаунта Satispay устанавливаются индивидуально. Чтобы торговать на большие суммы, обратитесь в поддержку Satispay для повышения лимитов. Также учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.satispay.info.buyer=Отправляйте платёж только на номер мобильного телефона продавца XMR, указанный в Haveno.\n\nЛимиты аккаунта Satispay устанавливаются индивидуально. Чтобы торговать на большие суммы, обратитесь в поддержку Satispay для повышения лимитов. Также учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.satispay.info.seller=Убедитесь, что платёж получен с номера мобильного телефона / имени покупателя XMR, указанных в Haveno.\n\nЛимиты аккаунта Satispay устанавливаются индивидуально. Чтобы торговать на большие суммы, обратитесь в поддержку Satispay для повышения лимитов. Также учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.tikkie.info.account=Для использования Tikkie нужен банковский счёт (IBAN) в Нидерландах и регистрация в сервисе.\n\nПри отправке запроса на оплату Tikkie частному лицу можно запросить не более 750 € за один запрос. Макс. сумма запросов за 24 часа составляет 2 500 € на аккаунт Tikkie.\n\nКаждый банк может устанавливать собственные лимиты для клиентов в пределах указанных.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.tikkie.info.buyer=Запросите платёжную ссылку у продавца XMR в чате сделки. Когда продавец XMR пришлёт ссылку на нужную сумму сделки, переходите к оплате.\n\nПродавец XMR может запросить через Tikkie не более 750 € за один запрос. Если сумма сделки больше, продавцу XMR придётся отправить несколько запросов на общую сумму сделки. Макс. сумма запросов в день составляет 2 500 €.\n\nКаждый банк может устанавливать собственные лимиты для клиентов в пределах указанных.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.tikkie.info.seller=Отправьте платёжную ссылку покупателю XMR в чате сделки. Когда покупатель XMR оплатит, проверьте, что его IBAN совпадает с данными в Haveno.\n\nПродавец XMR может запросить через Tikkie не более 750 € за один запрос. Если сумма сделки больше, продавцу XMR придётся отправить несколько запросов на общую сумму сделки. Макс. сумма запросов в день составляет 2 500 €.\n\nКаждый банк может устанавливать собственные лимиты для клиентов в пределах указанных.\n\nТакже учитывайте лимиты аккаунта. При превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.verse.info.account=Verse является способом оплаты с поддержкой нескольких валют: EUR, SEK, HUF, DKK, PLN.\n\nПри настройке счёта Verse в Haveno обязательно укажите имя пользователя, совпадающее с вашим аккаунтом Verse. Так отправленные средства будут отображаться с правильного счёта, а полученные зачислятся на ваш счёт.\n\nПользователи Verse могут отправлять или получать не более 10 000 € в год (или эквивалент в другой валюте) суммарно по платёжному счёту. По запросу Verse может повысить этот лимит.
payment.verse.info.buyer=Отправляйте платёж только на имя пользователя, указанное продавцом XMR в его счёте Haveno. Оставьте описание платежа пустым.\n\nПользователи Verse могут отправлять или получать не более 10 000 € в год (или эквивалент в другой валюте) суммарно по платёжному счёту. По запросу Verse может повысить этот лимит.
payment.verse.info.seller=Продавцы XMR получают платёж от имени пользователя, указанного в счёте Haveno покупателя XMR.\n\nПользователи Verse могут отправлять или получать не более 10 000 € в год (или эквивалент в другой валюте) суммарно по платёжному счёту. По запросу Verse может повысить этот лимит.
payment.achTransfer.info.account=Добавляя ACH как способ оплаты в Haveno, узнайте заранее, сколько стоит отправка и получение перевода ACH.
payment.achTransfer.info.buyer=Узнайте заранее, сколько вам будет стоить отправка перевода ACH.\n\nПри оплате отправляйте переводом ACH только по реквизитам, указанным в счёте продавца XMR.
payment.achTransfer.info.seller=Узнайте заранее, сколько вам будет стоить получение перевода ACH.\n\nПри получении платежа проверьте, что он пришёл переводом ACH со счёта покупателя XMR.
payment.domesticWire.info.account=Добавляя внутренний банковский перевод как способ оплаты в Haveno, узнайте заранее, сколько стоит отправка и получение такого перевода.
payment.domesticWire.info.buyer=Узнайте заранее, сколько вам будет стоить отправка банковского перевода.\n\nПри оплате отправляйте только по реквизитам, указанным в счёте продавца XMR.
payment.domesticWire.info.seller=Узнайте заранее, сколько вам будет стоить получение банковского перевода.\n\nПри получении платежа проверьте, что он пришёл со счёта покупателя XMR.
payment.strike.info.account=Обязательно укажите ваше имя пользователя Strike.\n\nВ Haveno Strike используется только для платежей фиат-фиат.\n\nУчитывайте лимиты Strike:\n\nДля пользователей, зарегистрировавшихся только по эл. почте, имени и номеру телефона, действуют лимиты:\n\n● не более 100 $ за пополнение\n● не более 1 000 $ пополнений в неделю\n● не более 100 $ за платёж\n\nПользователи могут повысить лимиты, предоставив Strike дополнительные данные. Для них действуют лимиты:\n\n● не более 1 000 $ за пополнение\n● не более 1 000 $ пополнений в неделю\n● не более 1 000 $ за платёж\n\nПри превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.strike.info.buyer=Отправляйте платёж только на имя пользователя Strike продавца XMR, указанное в Haveno.\n\nМакс. сумма сделки составляет 1 000 $ за платёж.\n\nПри превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.strike.info.seller=Убедитесь, что платёж получен от имени пользователя Strike покупателя XMR, указанного в Haveno.\n\nМакс. сумма сделки составляет 1 000 $ за платёж.\n\nПри превышении лимитов сделка может быть отменена, а к вам применён штраф.
payment.transferwiseUsd.info.account=Из-за банковского регулирования в США отправка и получение платежей в USD имеют больше ограничений, чем в большинстве других валют. Поэтому USD не был добавлен в способ оплаты Wise в Haveno.\n\nСпособ оплаты Wise-USD позволяет пользователям Haveno торговать в USD.\n\nЛюбой владелец аккаунта Wise может добавить Wise-USD как способ оплаты в Haveno и покупать и продавать XMR за USD.\n\nПри торговле на Haveno покупателям XMR не следует указывать назначение платежа. Если оно обязательно, укажите только полное имя владельца счёта Wise-USD.
payment.transferwiseUsd.info.buyer=Отправляйте платёж только на адрес эл. почты, указанный в счёте Wise-USD продавца XMR в Haveno.
payment.transferwiseUsd.info.seller=Проверьте, что полученный платёж соответствует имени владельца счёта Wise-USD покупателя XMR в Haveno.
payment.usPostalMoneyOrder.info=Для торговли с помощью почтовых денежных переводов США (USPMO) на Haveno вы должны понимать следующее:\n\n- Покупатель XMR должен указать имя продавца XMR в полях плательщика и получателя и перед отправкой сделать фото USPMO и конверта с подтверждением отслеживания в высоком разрешении.\n- Покупатель XMR должен отправить USPMO продавцу XMR с подтверждением доставки.\n\nЕсли потребуется посредничество или возникнет спор, вам нужно будет отправить фотографии посреднику или агенту по возвратам Haveno вместе с серийным номером USPMO, номером почтового отделения и суммой в долларах, чтобы они могли проверить данные на сайте почтовой службы США.\n\nБез требуемых данных для арбитра спор будет проигран.\n\nВо всех спорах отправитель USPMO несёт 100% ответственности за предоставление доказательств арбитру.\n\nЕсли вы не понимаете эти требования, не торгуйте через USPMO на Haveno.
payment.payByMail.info=Для торговли через Pay by Mail на Haveno вы должны понимать следующее:\n\n● Покупатель XMR должен упаковать наличные в пакет с защитой от вскрытия.\n● Покупатель XMR должен снять на видео или сфотографировать в высоком разрешении процесс упаковки наличных с уже нанесённым адресом и номером отслеживания.\n● Покупатель XMR должен отправить посылку продавцу XMR с подтверждением доставки и подходящей страховкой.\n● Продавец XMR должен снять на видео вскрытие посылки так, чтобы был виден номер отслеживания, указанный отправителем.\n● Мейкер должен указать все особые условия в поле 'Дополнительная информация' платёжного счёта.\n● Принимая предложение, тейкер соглашается с условиями мейкера.\n\nВ сделках Pay by Mail ответственность за честность целиком лежит на обоих участниках.\n\n● В сделках Pay by Mail меньше проверяемых действий, чем в других традиционных сделках. Это сильно усложняет разрешение споров.\n● Старайтесь решать споры напрямую с контрагентом в чате сделки. Это самый надёжный путь решения любого спора по Pay by Mail.\n● Арбитры могут рассмотреть ваш случай и дать рекомендацию, но НЕ гарантируют помощь.\n● Арбитры принимают решение на основе предоставленных доказательств. Поэтому следуйте описанным выше процедурам и документируйте их, чтобы иметь доказательства на случай спора.\n● Запросы на возмещение средств, потерянных в сделках Pay by Mail, Haveno НЕ рассматривает.\n\nЕсли вы не понимаете эти требования, не торгуйте через Pay by Mail на Haveno.

payment.payByMail.contact=Контактная информация
payment.payByMail.contact.prompt=Имя или псевдоним, на которые адресовать конверт
payment.payByMail.extraInfo.prompt=Укажите в своих предложениях: \n\nСтрану, где вы находитесь (напр., Франция); \nСтраны/регионы, из которых принимаете сделки (напр., Франция, ЕС или любая европейская страна); \nОсобые условия; \nЛюбые другие подробности.
payment.tradingRestrictions=Ознакомьтесь с условиями мейкера.\nЕсли вы не соответствуете требованиям, не принимайте эту сделку.
payment.cashAtAtm.info=Снятие наличных без карты: снятие наличных в банкомате по коду\n\nЧтобы использовать этот способ оплаты:\n\n1. Создайте платёжный счёт «Снятие наличных без карты», указав принимаемые банки, регионы или другие условия, которые будут показаны в предложении.\n\n2. Создайте или примите предложение с этим платёжным счётом.\n\n3. Когда предложение принято, договоритесь с контрагентом в чате о времени оплаты и обменяйтесь платёжными данными.\n\nЕсли сумма сделки превышает лимит на снятие наличных, разделите её на несколько транзакций.\n\nСуммы сделок с наличными через банкомат должны быть кратны 10. Рекомендуется использовать предложения с диапазоном, чтобы сумма XMR могла подстроиться под точную цену.\n\nЕсли вы не сможете выполнить транзакцию, как указано в контракте сделки, вы можете потерять часть (или весь) залог.
payment.cashAtAtm.extraInfo.prompt=Укажите в своих предложениях: \n\nПринимаемые банки / места; \nОсобые условия; \nЛюбые другие подробности.
