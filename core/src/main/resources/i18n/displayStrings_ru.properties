account.seed.restore.info=Перед восстановлением из мнемонической фразы создайте резервную копию. Восстановление заменяет ваш текущий кошелёк и не восстанавливает резервную копию. Чтобы вернуть предыдущее состояние приложения, используйте резервную копию каталога данных приложения.\n\nПосле восстановления приложение закроется автоматически. При следующем запуске кошелёк заново синхронизируется с сетью Monero начиная с высоты восстановления, что может занять некоторое время.
