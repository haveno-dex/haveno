portfolio.pending.failedTrade.txChainInvalid.moveToFailed=В торговом протоколе возникла серьёзная проблема.\n\n{0}\n\nПереместить сделку в неудачные сделки?\n\nИз раздела неудачных сделок нельзя запросить посредничество или арбитраж, но неудачную сделку можно в любой момент вернуть на экран текущих сделок.
portfolio.pending.failedTrade.txChainValid.moveToFailed=В торговом протоколе возникли проблемы.\n\n{0}\n\nТранзакции сделки опубликованы, и средства заблокированы. Перемещайте сделку в неудачные сделки, только если полностью уверены. Это может лишить вас возможностей решить проблему.\n\nПереместить сделку в неудачные сделки?\n\nИз раздела неудачных сделок нельзя запросить посредничество или арбитраж, но неудачную сделку можно в любой момент вернуть на экран текущих сделок.
