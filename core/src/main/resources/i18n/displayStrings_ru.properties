account.crypto.popup.wallet.msg=Убедитесь, что соблюдаете требования к использованию кошельков {0}, описанные на веб-странице {1}.\nИспользовать кошельки централизованных бирж, где (а) вы не контролируете свои ключи или (б) используется несовместимое программное обеспечение, рискованно: это может привести к потере торгуемых средств!\nПосредник или арбитр не является специалистом по {2} и не сможет помочь в таких случаях.
