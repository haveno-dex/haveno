popup.warning.incompatibleDB=Обнаружены несовместимые файлы базы данных!\n\nСледующие файлы несовместимы с текущей версией кода:\n{0}\n\nМы создали резервную копию повреждённых файлов и применили значения по умолчанию в новой версии базы данных.\n\nРезервная копия находится в:\n{1}/db/backup_of_corrupted_data.\n\nПроверьте, установлена ли у вас последняя версия Haveno.\nСкачать её можно здесь: [HYPERLINK:https://haveno.exchange/downloads].\n\nПерезапустите приложение.
