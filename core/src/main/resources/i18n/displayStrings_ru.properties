# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=Для торговли XMR на Haveno вы должны понимать следующее требование.\n\nПри продаже XMR в случае спора вы должны предоставить посреднику или арбитру следующие данные:\n- ключ транзакции (Tx Key, Tx Secret Key или Tx Private Key)\n- идентификатор транзакции (Tx ID или Tx Hash)\n- адрес назначения (адрес получателя)\n\nГде найти эти данные в популярных кошельках Monero, см. в вики [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nБез требуемых данных о транзакции спор будет проигран.\n\nТакже учтите, что Haveno теперь поддерживает автоподтверждение транзакций XMR для ускорения сделок, но его нужно включить в настройках.\n\nПодробнее об автоподтверждении см. в вики: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


