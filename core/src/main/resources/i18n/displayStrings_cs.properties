account.seed.restore.info=Před obnovením ze seed slov si vytvořte zálohu. Obnovení nahradí vaši současnou peněženku. Zálohu tím neobnovíte. K obnovení předchozího stavu aplikace použijte zálohu adresáře dat aplikace.\n\nPo obnovení se aplikace automaticky vypne. Po jejím opětovném spuštění se peněženka znovu synchronizuje se sítí Monero od výšky obnovení, což může chvíli trvat.
