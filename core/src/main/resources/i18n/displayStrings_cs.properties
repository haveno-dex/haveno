payment.paynow.info.seller=Zkontrolujte, zda platba přijatá v aplikaci vaší banky nebo peněženky odpovídá údajům o účtu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.wero.info.account=K používání Wero potřebujete aplikaci Wero nebo aplikaci zapojené banky s mobilním číslem registrovaným v Německu, Francii nebo Belgii.\n\nPlatby se posílají na registrované mobilní číslo příjemce zadané v mezinárodním formátu (např. +49). Měna obchodu je EUR.
