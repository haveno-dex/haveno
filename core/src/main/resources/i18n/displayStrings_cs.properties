payment.bizum.info.account=K využívání služby Bizum potřebujete bankovní účet (IBAN) ve Španělsku a být zaregistrováni pro tuto službu.\n\n\
Bizum lze použít pro obchody v rozmezí od 0,50 € do 1 000 €.\n\n\
Maximální částka transakcí, které můžete odeslat/přijmout prostřednictvím služby Bizum, je 2 000 eur denně.\n\n\
Uživatelé služby Bizum mohou měsíčně provést maximálně 150 operací.\n\n\
Každá banka však může pro své klienty stanovit vlastní limity v rámci výše uvedených limitů.\n\n\
Uživatelé by také měli znát limity účtu. Pokud obchodujete nad výše uvedené limity, může být váš obchod zrušen a může vám být uložena pokuta.
payment.bizum.info.buyer=Platbu prosím zasílejte pouze na mobilní telefonní číslo prodávajícího XMR uvedené v systému Haveno.\n\n\
Maximální velikost obchodu je 1 000 € na jednu platbu. Maximální objem transakcí, které můžete prostřednictvím Bizumu odeslat, je 2 000 eur za den.\n\n\
Pokud překročíte výše uvedené limity, může být váš obchod zrušen a může vám být uložena pokuta.
payment.bizum.info.seller=Ujistěte se prosím, že platba byla přijata z mobilního telefonního čísla kupujícího XMR, které je uvedeno v Haveno.\n\n\
Maximální velikost obchodu je 1 000 EUR na jednu platbu. Maximální objem transakcí, které můžete přijmout pomocí služby Bizum, je 2 000 eur za den.\n\n\
Pokud obchodujete nad výše uvedené limity, může být váš obchod zrušen a může vám být uložena pokuta.

payment.blik.info.account=K používání BLIK potřebujete bankovní účet v Polsku s aplikací mobilního bankovnictví, která BLIK podporuje.\n\nKupující XMR platí tak, že vygeneruje BLIK kód a pošle jej prodejci XMR přes obchodní chat, takže k dokončení platby musí být oba obchodníci online.
payment.blik.info.buyer=Pro zaplacení vygenerujte BLIK kód v aplikaci mobilního bankovnictví a pošlete jej prodejci XMR přes obchodní chat.\n\nBLIK kódy platí pouze 2 minuty, proto se před vygenerováním kódu ujistěte, že prodejce v obchodním chatu odpovídá.
payment.blik.info.seller=Kupující XMR vám pošle BLIK kód přes obchodní chat.\n\nBLIK kódy platí pouze 2 minuty, proto kód použijte k přijetí platby ihned po jeho odeslání.

payment.vippsMobilePay.info.account=K používání Vipps MobilePay potřebujete účet registrovaný na vaše mobilní číslo v Norsku, Dánsku nebo Finsku.\n\nPlatby nelze posílat mezi zeměmi, takže oba obchodníci musí mít účty ve stejné zemi. Měna obchodu je dána zemí vašeho účtu.
payment.vippsMobilePay.info.buyer=Platbu prosím zasílejte pouze na mobilní číslo uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené v aplikaci odpovídá jménu majitele účtu prodejce.
payment.vippsMobilePay.info.seller=Zkontrolujte, zda platba přijatá v aplikaci Vipps nebo MobilePay odpovídá mobilnímu číslu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.twint.info.account=K používání TWINT potřebujete účet registrovaný na vaše mobilní číslo ve Švýcarsku.\n\nPlatby TWINT lze posílat pouze mezi švýcarskými účty TWINT, takže oba obchodníci musí používat TWINT. Měna obchodu je CHF.
payment.twint.info.buyer=Platbu prosím zasílejte pouze na mobilní číslo uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené v aplikaci odpovídá jménu majitele účtu prodejce.
payment.twint.info.seller=Zkontrolujte, zda platba přijatá v aplikaci TWINT odpovídá mobilnímu číslu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.nip.info.account=K používání NIP potřebujete nigerijský bankovní účet nebo mobilní peněženku, jako je OPay nebo PalmPay.\n\nPlatby se posílají okamžitým bankovním převodem NIP na 10místné číslo účtu příjemce u jeho banky nebo poskytovatele peněženky. Měna obchodu je NGN.
payment.nip.info.buyer=Platbu prosím zasílejte pouze na číslo účtu a banku nebo peněženku uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené při kontrole jména u převodu odpovídá jménu majitele účtu prodejce.
payment.nip.info.seller=Zkontrolujte, zda platba přijatá v aplikaci vaší banky nebo peněženky odpovídá číslu účtu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.pagoMovil.info.account=K používání Pago Móvil potřebujete venezuelský bankovní účet s aktivní službou Pago Móvil, registrovaný na vaše mobilní číslo, cédulu a banku.\n\nPlatby se posílají mezibankovním převodem na uvedené mobilní číslo, cédulu a banku. Měna obchodu je VES.
payment.pagoMovil.info.buyer=Platbu prosím zasílejte pouze na mobilní číslo, cédulu a banku uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené vaší bankou odpovídá jménu majitele účtu prodejce.
payment.pagoMovil.info.seller=Zkontrolujte, zda platba přijatá v aplikaci vaší banky odpovídá mobilnímu číslu, cédule a jménu majitele uvedeným v účtu kupujícího XMR.

payment.qris.info.account=K používání QRIS / BI-FAST potřebujete indonéský bankovní účet nebo e-peněženku, které mohou přijímat okamžité převody.\n\nPlatby se posílají okamžitým převodem BI-FAST na číslo účtu příjemce u jeho banky nebo e-peněženky, nebo naskenováním QRIS kódu příjemce. Měna obchodu je IDR.
payment.qris.info.buyer=Platbu prosím zasílejte pouze na číslo účtu a banku nebo e-peněženku uvedené v účtu prodejce XMR, nebo na QRIS kód, který vám prodejce pošle v obchodním chatu, a před potvrzením ověřte, že jméno příjemce zobrazené vaší aplikací odpovídá jménu majitele účtu prodejce.
payment.qris.info.seller=Zkontrolujte, zda platba přijatá v aplikaci vaší banky nebo e-peněženky odpovídá číslu účtu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.papara.info.account=K používání Papara / FAST potřebujete účet Papara nebo turecký bankovní účet, který může přijímat okamžité převody.\n\nPlatby se posílají na číslo Papara příjemce, turecký IBAN nebo mobilní číslo FAST Easy Address (Kolay Adres). Měna obchodu je TRY.
payment.papara.info.buyer=Platbu prosím zasílejte pouze na číslo účtu nebo IBAN a banku nebo peněženku uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené vaší aplikací odpovídá jménu majitele účtu prodejce.
payment.papara.info.seller=Zkontrolujte, zda platba přijatá v aplikaci Papara nebo vaší banky odpovídá údajům o účtu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.raast.info.account=K používání Raast / Easypaisa / JazzCash potřebujete pákistánský bankovní účet nebo mobilní peněženku, které mohou přijímat okamžité převody.\n\nPlatby se posílají na Raast ID příjemce (registrované mobilní číslo), mobilní číslo peněženky nebo pákistánský IBAN. Měna obchodu je PKR.
payment.raast.info.buyer=Platbu prosím zasílejte pouze na mobilní číslo nebo IBAN a banku nebo peněženku uvedené v účtu prodejce XMR a před potvrzením ověřte, že jméno příjemce zobrazené vaší aplikací odpovídá jménu majitele účtu prodejce.
payment.raast.info.seller=Zkontrolujte, zda platba přijatá v aplikaci vaší banky nebo peněženky odpovídá údajům o účtu a jménu majitele uvedeným v účtu kupujícího XMR.

payment.paynow.info.account=K používání PayNow / FAST potřebujete singapurský bankovní účet nebo e-peněženku, které mohou přijímat okamžité převody.\n\nPlatby se posílají na PayNow proxy příjemce: registrované mobilní číslo nebo NRIC/FIN. Měna obchodu je SGD.
