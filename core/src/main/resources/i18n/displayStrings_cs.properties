payment.paypay.info.account=K používání PayPay potřebujete účet PayPay registrovaný v Japonsku.\n\nPlatby PayPay lze posílat pouze mezi uživateli PayPay, takže oba obchodníci musí používat PayPay. Platby se posílají na registrované mobilní číslo nebo PayPay ID příjemce. Měna obchodu je JPY.
