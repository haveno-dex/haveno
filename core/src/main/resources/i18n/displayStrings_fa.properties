payment.wero.info.account=برای استفاده از Wero به اپلیکیشن Wero یا اپلیکیشن یکی از بانک‌های عضو نیاز دارید که شماره موبایل شما در آلمان، فرانسه یا بلژیک در آن ثبت شده باشد.\n\nپرداخت‌ها به شماره موبایل ثبت‌شده گیرنده ارسال می‌شوند که با فرمت بین‌المللی (برای مثال +49) وارد می‌شود. ارز معامله EUR است.
