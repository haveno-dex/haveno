payment.fps.info.buyer=لطفاً پرداخت را فقط به شماره موبایل، FPS ID یا ایمیل و بانک یا کیف پول درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که اپلیکیشن شما نمایش می‌دهد با نام صاحب حساب فروشنده مطابقت دارد.
