portfolio.pending.step3_seller.bank=شریک معاملاتی شما تأیید کرده که پرداخت {0} را آغاز کرده است.\n\nلطفاً به صفحه بانکداری آنلاین خود بروید و بررسی کنید که آیا {1} را از خریدار XMR دریافت کرده‌اید.
portfolio.pending.step3_seller.cash=چون پرداخت از طریق سپرده‌ی نقدی انجام شده است، خریدار XMR باید عبارت \"غیر قابل استرداد\" را روی رسید کاغذی بنویسد، آن را به 2 قسمت پاره کند و از طریق ایمیل به شما یک عکس ارسال کند.\n\nبه منظور اجتناب از استرداد وجه، تنها در صورتی تایید کنید که ایمیل را دریافت کرده باشید و از صحت رسید کاغذی مطمئن باشید.\nاگر مطمئن نیستید، {0}
portfolio.pending.step3_seller.moneyGram=خریدار باید شماره مجوز و عکسی از رسید را با ایمیل برای شما ارسال کند.\nرسید باید به طور واضح نام کامل، کشور، ایالت شما و مبلغ را نشان دهد. لطفاً ایمیل خود را بررسی کنید که آیا شماره مجوز را دریافت کرده‌اید یا خیر.\n\nپس از بستن این پنجره، نام و آدرس خریدار XMR را برای برداشت پول از مانی‌گرام خواهید دید.\n\nتنها پس از برداشت موفقیت‌آمیز پول، دریافت را تأیید کنید!
portfolio.pending.step3_seller.westernUnion=خریدار باید MTCN (شماره پیگیری) و عکسی از رسید را با ایمیل برای شما ارسال کند.\nرسید باید به طور واضح نام کامل، شهر، کشور شما و مبلغ را نشان دهد. لطفاً ایمیل خود را بررسی کنید که آیا MTCN را دریافت کرده‌اید یا خیر.\n\nپس از بستن این پنجره، نام و آدرس خریدار XMR را برای برداشت پول از Western Union خواهید دید.\n\nتنها پس از برداشت موفقیت‌آمیز پول، دریافت را تأیید کنید!
portfolio.pending.step3_seller.halCash=خریدار باید کد HalCash را برای شما با پیامک بفرستد. علاوه‌ برآن شما از HalCash پیامی را محتوی اطلاعات موردنیاز برای برداشت EUR از خودپردازهای پشتیبان HalCash دریافت خواهید کرد.\n\nپس از اینکه پول را از دستگاه خودپرداز دریافت کردید، لطفا در اینجا رسید پرداخت را تایید کنید.
portfolio.pending.step3_seller.amazonGiftCard=خریدار یک کارت هدیه الکترونیکی Amazon را از طریق ایمیل یا پیامک به تلفن همراه شما فرستاده است. لطفاً اکنون آن را در حساب Amazon خود استفاده کنید و پس از پذیرفته شدن، دریافت پرداخت را تأیید کنید.
portfolio.pending.step3_seller.part.blik=خریدار XMR یک کد BLIK از طریق چت معامله‌گران فرستاده است.\n\nچت را باز کنید، کد را کپی کنید و بلافاصله برای دریافت پرداخت از آن استفاده کنید. کدهای BLIK پس از ۲ دقیقه منقضی می‌شوند.

portfolio.pending.step3_seller.bankCheck=\n\nلطفاً همچنین بررسی کنید که نام فرستنده در قرارداد معامله با نامی که در صورت‌حساب بانکی شما آمده مطابقت دارد:\nنام فرستنده طبق قرارداد معامله: {0}\n\nاگر نام‌ها دقیقاً یکسان نیستند، {1}
