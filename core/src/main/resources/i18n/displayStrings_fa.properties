offerbook.clonedOffer.info=کپی کردن یک پیشنهاد، نسخه‌ای از آن را بدون رزرو وجوه اضافی ایجاد می‌کند.\n\nاین کار سرمایه قفل‌شده را کاهش می‌دهد و درج همان پیشنهاد در چند بازار یا روش پرداخت را آسان‌تر می‌کند.\n\nاگر یکی از پیشنهادهای کپی‌شده پذیرفته شود، بقیه به‌طور خودکار بسته می‌شوند، چون همه از وجوه رزروشده یکسانی استفاده می‌کنند.\n\nپیشنهادهای کپی‌شده باید مقدار معامله و سپرده اطمینان یکسانی داشته باشند، اما از روش پرداخت یا ارز متفاوتی استفاده کنند.\n\nبرای اطلاعات بیشتر درباره کپی کردن پیشنهادها ببینید: [HYPERLINK:https://docs.haveno.exchange/users/haveno-ui/cloning-an-offer/]

