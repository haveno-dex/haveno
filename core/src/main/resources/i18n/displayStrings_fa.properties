offerbook.warning.wrongTradeProtocol=این پیشنهاد نیاز به نسخه پروتکل متفاوتی مانند پروتکل نسخه نرم‌افزار خودتان دارد.\n\nلطفا پس از نصب آخرین آپدیت نرم‌افزار دوباره تلاش کنید. در غیر این صورت، کاربری که این پیشنهاد را ایجاد کرده است، از نسخه‌ای قدیمی‌تر استفاده می‌کند.\n\nکاربران نمی توانند با نسخه‌های پروتکل معاملاتی ناسازگار، معامله کنند.
