password.startup.help.recovery=آیا تغییر رمز عبور ناتمام مانده است؟\nمی‌توانید آن را با رمزهای عبوری که از قبل می‌دانید ترمیم کنید. Haveno پیش از شروع ترمیم بسته می‌شود.
