password.recovery.confirm.help=همان رمز عبور را دوباره وارد کنید. اگر لازم باشد کلید حساب از نسخهٔ پشتیبان بازیابی شود، این رمز عبور برای حساب بازیابی‌شده استفاده خواهد شد.
password.recovery.previous=رمز عبور قبلی یا رمز عبور تلاش‌شده
password.recovery.previous.help=رمز عبور دیگرِ تغییر ناموفق را وارد کنید. رمزهای عبور تنظیم‌نشده به‌طور خودکار امتحان می‌شوند؛ اگر رمزی تنظیم نشده بود، این فیلد را خالی بگذارید.
password.recovery.additional=رمز عبور دیگری که در تغییر ناموفق استفاده شده است
password.recovery.addPassword=افزودن رمز عبور دیگر
password.recovery.backup.help=پیش از ادامه، سایر نمونه‌های Haveno و برنامه‌های کیف پول را ببندید، سپس کل پوشه داده‌های برنامه را در یک محل پشتیبان امن کپی کنید. تا زمانی که بازیابی موفق شود، همه رمزهای عبور را نگه دارید.
password.recovery.backup=سایر برنامه‌ها را بسته‌ام و از این پوشه داده‌ها پشتیبان گرفته‌ام.
password.recovery.repair=ترمیم کیف پول‌ها
password.recovery.waiting=در انتظار بسته شدن Haveno پیش از شروع بازیابی...\nاگر خاموش شدن متوقف ماند، هر دو پنجره را ببندید، Haveno را دوباره راه‌اندازی کنید و ترمیم را دوباره باز کنید.
password.recovery.waitFailed=بسته شدن Haveno تأیید نشد. این صفحه را ببندید و پس از خروج Haveno، بازیابی را دوباره آغاز کنید.
password.recovery.working=در حال ترمیم کیف پول‌ها و اتصال‌های ذخیره‌شده. این کار ممکن است چند دقیقه طول بکشد. این پنجره را باز نگه دارید.
password.recovery.success=بازیابی کامل شد. این صفحه را ببندید و Haveno را با رمز عبور فعلی حساب که وارد کردید آغاز کنید. سپس می‌توانید رمز عبور را به‌طور عادی تنظیم یا حذف کنید.
password.recovery.retainedBackups=برخی فایل‌های کیف پول نگه داشته شدند، زیرا هویت یا وضعیت محلی آن‌ها را نمی‌شد به‌طور امن جایگزین کرد. ممکن است همچنان با رمز عبور قبلی یا بدون رمز عبور قابل دسترسی باشند. همه رمزهای عبور مرتبط را نگه دارید. نام‌های پشتیبان به wallet/backup اشاره دارند؛ مسیرهایی که با wallet/ شروع می‌شوند فایل‌های موقت هستند. هر کیف پول فعالِ گم‌شده را از پشتیبان آن بازیابی کنید.
password.recovery.wrongCurrent=رمز عبور فعلی حساب نادرست است. رمز عبور دیگرِ تغییر ناموفق را در فیلد اول امتحان کنید، یا اگر حساب رمز عبور ندارد آن را خالی بگذارید.
password.recovery.failed=بازیابی به پایان نرسید.\n\n{0}\n\nممکن است برخی فایل‌ها از قبل ترمیم شده باشند. همه رمزهای عبور و پشتیبان خود را نگه دارید. با همه رمزهای عبوری که در تغییرهای ناموفق استفاده شده‌اند دوباره تلاش کنید.
password.recovery.retry=تلاش دوباره
password.recovery.launchFailed=صفحه بازیابی باز نشد. لطفاً دوباره تلاش کنید.
