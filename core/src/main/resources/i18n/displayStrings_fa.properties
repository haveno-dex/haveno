payment.f2f.contact.prompt=شریک معاملاتی چگونه با شما تماس بگیرد؟ (آدرس ایمیل، شماره تلفن، ...)
payment.f2f.city=شهر جهت ملاقات 'رو در رو'
payment.f2f.city.prompt=نام شهر به همراه پیشنهاد نمایش داده خواهد شد
payment.shared.optionalExtra=اطلاعات اضافی اختیاری
payment.shared.extraInfo=اطلاعات اضافی
payment.shared.extraInfo.offer=اطلاعات اضافی پیشنهاد
payment.shared.extraInfo.prompt.paymentAccount=هرگونه اصطلاحات، شرایط یا جزئیات خاصی که می‌خواهید همراه با پیشنهادات شما برای این حساب پرداخت نمایش داده شود را تعریف کنید (کاربران قبل از پذیرش پیشنهادات این اطلاعات را مشاهده خواهند کرد).
payment.shared.extraInfo.prompt.offer=هر اصطلاح، شرایط یا جزئیات خاصی که مایلید همراه با پیشنهاد خود نمایش داده شود را تعریف کنید.
payment.shared.extraInfo.noDeposit=جزئیات تماس و شرایط پیشنهاد
payment.f2f.info=معاملات 'حضوری' قوانین و خطرات متفاوتی نسبت به تراکنش‌های آنلاین دارند.\n\nتفاوت‌های اصلی:\n● شرکای معاملاتی باید با استفاده از اطلاعات تماس ارائه‌شده، درباره محل و زمان ملاقات تبادل اطلاعات کنند.\n● شرکای معاملاتی باید لپ‌تاپ خود را همراه بیاورند و تأیید 'پرداخت ارسال شد' و 'پرداخت دریافت شد' را در محل ملاقات انجام دهند.\n● اگر سازنده 'شرایط' خاصی دارد، باید آن را در فیلد 'اطلاعات تکمیلی' حساب ذکر کند.\n● پذیرنده با پذیرش پیشنهاد، 'شرایط' ذکرشده توسط سازنده را می‌پذیرد.\n● در صورت مناقشه، داور نمی‌تواند کمک چندانی کند، چون معمولاً به دست آوردن شواهد غیرقابل دستکاری از آنچه در ملاقات رخ داده دشوار است. در چنین مواردی وجوه XMR ممکن است به‌طور نامحدود یا تا زمان توافق شرکای معاملاتی قفل بماند.\n\nبرای اطمینان از درک کامل تفاوت‌های معاملات 'حضوری'، لطفاً دستورالعمل‌ها و توصیه‌ها را در این آدرس بخوانید: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
