payment.kaspi.info.account=برای استفاده از Kaspi به یک حساب Kaspi ثبت‌شده در قزاقستان نیاز دارید.\n\nپرداخت‌ها به شماره موبایل ثبت‌شده یا شماره کارت Kaspi Gold گیرنده ارسال می‌شوند. ارز معامله KZT است.
payment.kaspi.info.buyer=لطفاً پرداخت را فقط به شماره موبایل یا شماره کارت درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که در اپلیکیشن نمایش داده می‌شود با نام صاحب حساب فروشنده مطابقت دارد.
