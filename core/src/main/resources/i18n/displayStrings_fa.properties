payment.payid=PayID متصل به مؤسسه مالی. مانند آدرس ایمیل یا تلفن همراه.
payment.payid.info=PayID مانند شماره تلفن، آدرس ایمیل یا شماره تجاری استرالیا (ABN) است که می‌توانید آن را به‌طور امن به حساب بانک، اتحادیه اعتباری یا مؤسسه پس‌انداز و وام خود متصل کنید. باید از قبل یک PayID در مؤسسه مالی استرالیایی خود ایجاد کرده باشید. هر دو مؤسسه مالی فرستنده و گیرنده باید از PayID پشتیبانی کنند. برای اطلاعات بیشتر به [HYPERLINK:https://payid.com.au/faqs/] مراجعه کنید
payment.amazonGiftCard.info=To pay with Amazon eGift Card, you will need to send an Amazon eGift Card to the XMR seller via your Amazon account. \n\nHaveno will show the XMR seller's email address or phone number where the gift card should be sent, and you must include the trade ID in the gift card's message field. Please see the wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/Amazon-eGift-card] for further details and best practices. \n\nThree important notes:\n- try to send gift cards with amounts of 100 USD or smaller, as Amazon is known to flag larger gift cards as fraudulent\n- try to use creative, believable text for the gift card's message (e.g., "Happy birthday Susan!") along with the trade ID (and use trader chat to tell your trading peer the reference text you picked so they can verify your payment)\n- Amazon eGift Cards can only be redeemed on the Amazon website they were purchased on (e.g., a gift card purchased on amazon.it can only be redeemed on amazon.it)
payment.paysafe.info=برای حفاظت از شما، به شدت از استفاده از پین‌های Paysafecard برای پرداخت جلوگیری می‌کنیم.\n\n\
  تراکنش‌های انجام شده از طریق پین‌ها نمی‌توانند به طور مستقل برای حل اختلاف تأیید شوند. اگر مشکلی پیش آید، بازیابی وجوه ممکن است غیرممکن باشد.\n\n\
  برای اطمینان از امنیت تراکنش و حل اختلاف، همیشه از روش‌های پرداختی استفاده کنید که سوابق قابل تاییدی ارائه می‌دهند.


