offerbook.warning.nodeBlocked=آدرس onion آن معامله گر، توسط توسعه دهندگان Haveno مسدود شد.\nاحتمالاً هنگام گرفتن پیشنهاد از جانب آن معامله گر، یک اشکال ناامن موجب پدید آمدن مسائلی شده است.
