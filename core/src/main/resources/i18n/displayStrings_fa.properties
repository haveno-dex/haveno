payment.zelle.info=Zelle یک سرویس انتقال پول است که بهتر است *از طریق* یک بانک دیگر استفاده شود.\n\n۱. در این صفحه بررسی کنید که آیا (و چگونه) بانک شما با Zelle کار می‌کند: [HYPERLINK:https://www.zellepay.com/get-started]\n\n۲. به محدودیت‌های انتقال خود توجه ویژه داشته باشید؛ محدودیت ارسال در هر بانک متفاوت است و بانک‌ها معمولاً محدودیت‌های جداگانه روزانه، هفتگی و ماهانه تعیین می‌کنند.\n\n۳. اگر بانک شما با Zelle کار نمی‌کند، همچنان می‌توانید از طریق اپلیکیشن موبایل Zelle از آن استفاده کنید، اما محدودیت انتقال شما بسیار کمتر خواهد بود.\n\n۴. نامی که در حساب Haveno شما مشخص شده باید با نام حساب Zelle/بانکی شما مطابقت داشته باشد. \n\nاگر نتوانید تراکنش Zelle را طبق قرارداد معامله انجام دهید، ممکن است بخشی (یا همه) سپرده اطمینان خود را از دست بدهید.\n\nبه دلیل خطر نسبتاً بالاتر بازپس‌گیری وجه در Zelle، به فروشندگان توصیه می‌شود از طریق ایمیل یا پیامک با خریداران امضانشده تماس بگیرند تا مطمئن شوند خریدار واقعاً مالک حساب Zelle مشخص‌شده در Haveno است.
payment.fasterPayments.newRequirements.info=برخی بانک‌ها شروع به بررسی نام کامل گیرنده در انتقال‌های Faster Payments کرده‌اند. حساب Faster Payments فعلی شما نام کامل ندارد.\n\nلطفاً حساب Faster Payments خود را در Haveno دوباره ایجاد کنید تا نام کامل شما در اختیار خریداران {0} آینده قرار گیرد.\n\nهنگام ایجاد مجدد حساب، حتماً کد sort، شماره حساب و مقدار salt تأیید سن حساب را دقیقاً از حساب قدیمی به حساب جدید کپی کنید. این کار سن و وضعیت امضای حساب فعلی شما را حفظ می‌کند.
payment.fasterPayments.ukSortCode=کد sort بریتانیا
payment.moneyGram.info=هنگام استفاده از MoneyGram، خریدار XMR باید شماره مجوز و عکسی از رسید را با ایمیل به فروشنده XMR ارسال کند. رسید باید به‌طور واضح نام کامل، کشور، ایالت فروشنده و مبلغ را نشان دهد. ایمیل فروشنده در طول فرآیند معامله به خریدار نمایش داده می‌شود.
payment.westernUnion.info=هنگام استفاده از Western Union، خریدار XMR باید MTCN (شماره پیگیری) و عکسی از رسید را با ایمیل به فروشنده XMR ارسال کند. رسید باید به‌طور واضح نام کامل، شهر، کشور فروشنده و مبلغ را نشان دهد. ایمیل فروشنده در طول فرآیند معامله به خریدار نمایش داده می‌شود.
payment.halCash.info=زمانی که از HalCash استفاده می‌کنید، خریدار باید کد HalCash را از طریق پیام کوتاه موبایل به فروشنده XMR ارسال کند.\n\nلطفا مطمئن شوید که از حداکثر میزانی که بانک شما برای انتقال از طریق HalCash مجاز می‌داند تجاوز نکرده‌اید. حداقل مقداردر هر برداشت معادل 10 یورو و حداکثر مقدار 600 یورو می‌باشد. این محدودیت برای برداشت‌های تکراری برای هر گیرنده در روز 3000 یورو و در ماه 6000 یورو می‌باشد. لطفا این محدودیت‌ها را با بانک خود مطابقت دهید و مطمئن شوید که آنها هم همین محدودی‌ها را دارند.\n\nمقدار برداشت باید شریبی از 10 یورو باشد چرا که مقادیر غیر از این را نمی‌توانید از طریق ATM برداشت کنید. رابط کاربری در صفحه ساخت پینشهاد و پذیرش پیشنهاد مقدار XMR را به گونه‌ای تنظیم می‌کنند که مقدار EUR درست باشد. شما نمی‌توانید از قیمت بر مبنای بازار استفاده کنید چون مقدار یورو با تغییر قیمت‌ها عوض خواهد شد.\n\nدر صورت بروز اختلاف خریدار XMR باید شواهد مربوط به ارسال یورو را ارائه دهد.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=توجه داشته باشید که همه انتقال‌های بانکی مقداری خطر بازپس‌گیری وجه دارند. برای کاهش این خطر، Haveno بر اساس سطح تخمینی خطر بازپس‌گیری در روش پرداخت مورد استفاده، محدودیت‌هایی برای هر معامله تعیین می‌کند.\n\nبرای این روش پرداخت، محدودیت هر معامله شما برای خرید و فروش {2} است.\n\nاین محدودیت فقط به اندازه یک معامله مربوط می‌شود؛ می‌توانید هر تعداد معامله که بخواهید انجام دهید.\n\nجزئیات بیشتر در ویکی [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=برای محدود کردن خطر بازپس‌گیری وجه، Haveno بر اساس ۲ عامل زیر برای این نوع حساب پرداخت محدودیت‌هایی برای هر معامله تعیین می‌کند:\n\n۱. خطر کلی بازپس‌گیری وجه در روش پرداخت\n۲. وضعیت امضای حساب\n\nاین حساب پرداخت هنوز امضا نشده است، بنابراین خرید در هر معامله به {0} محدود است. پس از امضا، محدودیت خرید به این ترتیب افزایش می‌یابد:\n\n● پیش از امضا و تا ۳۰ روز پس از امضا، محدودیت خرید هر معامله شما {0} خواهد بود\n● ۳۰ روز پس از امضا، محدودیت خرید هر معامله شما {1} خواهد بود\n● ۶۰ روز پس از امضا، محدودیت خرید هر معامله شما {2} خواهد بود\n\nمحدودیت فروش تحت تأثیر امضای حساب نیست. می‌توانید بلافاصله {2} را در یک معامله بفروشید.\n\nاین محدودیت‌ها فقط به اندازه یک معامله مربوط می‌شوند؛ می‌توانید هر تعداد معامله که بخواهید انجام دهید. \n\nجزئیات بیشتر در ویکی [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

