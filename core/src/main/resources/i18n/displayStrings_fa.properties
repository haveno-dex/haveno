payment.paypay.info.account=برای استفاده از PayPay به یک حساب PayPay ثبت‌شده در ژاپن نیاز دارید.\n\nپرداخت‌های PayPay فقط بین کاربران PayPay ممکن است، بنابراین هر دو معامله‌گر باید از PayPay استفاده کنند. پرداخت‌ها به شماره موبایل ثبت‌شده یا شناسه PayPay گیرنده ارسال می‌شوند. ارز معامله JPY است.
