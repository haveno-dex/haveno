payment.yoomoney.info.account=برای استفاده از YooMoney به یک کیف پول YooMoney ثبت‌شده در روسیه نیاز دارید.\n\nپرداخت‌ها به شماره کیف پول گیرنده ارسال می‌شوند. ارز معامله RUB است.
