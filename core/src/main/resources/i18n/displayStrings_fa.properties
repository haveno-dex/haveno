payment.bizum.info.account=برای استفاده از Bizum به یک حساب بانکی (IBAN) در اسپانیا و ثبت‌نام در این سرویس نیاز دارید.\n\nBizum برای معاملات بین €0.50 و €1,000 قابل استفاده است.\n\nحداکثر مبلغ تراکنش‌هایی که می‌توانید با Bizum ارسال/دریافت کنید €2,000 یورو در روز است.\n\nکاربران Bizum می‌توانند حداکثر ۱۵۰ عملیات در ماه انجام دهند.\n\nهر بانک ممکن است در چارچوب محدودیت‌های بالا، محدودیت‌های خاص خود را برای مشتریانش تعیین کند.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.bizum.info.buyer=لطفاً پرداخت را فقط به شماره تلفن همراه فروشنده XMR که در Haveno ارائه شده ارسال کنید.\n\nحداکثر اندازه معامله €1,000 در هر پرداخت است. حداکثر مبلغ تراکنش‌هایی که می‌توانید با Bizum ارسال کنید €2,000 یورو در روز است.\n\nاگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.bizum.info.seller=لطفاً مطمئن شوید که پرداخت از شماره تلفن همراه خریدار XMR که در Haveno ارائه شده دریافت می‌شود.\n\nحداکثر اندازه معامله €1,000 در هر پرداخت است. حداکثر مبلغ تراکنش‌هایی که می‌توانید با Bizum دریافت کنید €2,000 یورو در روز است.\n\nاگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.

payment.blik.info.account=برای استفاده از BLIK به یک حساب بانکی در لهستان با اپلیکیشن همراه‌بانکی نیاز دارید که از BLIK پشتیبانی کند.\n\nخریدار XMR با ایجاد یک کد BLIK و ارسال آن از طریق چت معامله‌گران به فروشنده XMR پرداخت می‌کند، بنابراین برای تکمیل پرداخت هر دو معامله‌گر باید آنلاین باشند.
payment.blik.info.buyer=برای پرداخت، در اپلیکیشن همراه‌بانک خود یک کد BLIK ایجاد کنید و آن را از طریق چت معامله‌گران برای فروشنده XMR بفرستید.\n\nکدهای BLIK فقط ۲ دقیقه اعتبار دارند، بنابراین پیش از ایجاد کد مطمئن شوید فروشنده در چت معامله‌گران پاسخ می‌دهد.
payment.blik.info.seller=خریدار XMR یک کد BLIK از طریق چت معامله‌گران برای شما می‌فرستد.\n\nکدهای BLIK فقط ۲ دقیقه اعتبار دارند، بنابراین بلافاصله پس از دریافت کد، از آن برای دریافت پرداخت استفاده کنید.

payment.vippsMobilePay.info.account=برای استفاده از Vipps MobilePay به حسابی نیاز دارید که با شماره موبایل شما در نروژ، دانمارک یا فنلاند ثبت شده باشد.\n\nپرداخت بین کشورها ممکن نیست، بنابراین هر دو معامله‌گر باید در یک کشور حساب داشته باشند. ارز معامله بر اساس کشور حساب شما تعیین می‌شود.
payment.vippsMobilePay.info.buyer=لطفاً پرداخت را فقط به شماره موبایل درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که در اپلیکیشن نمایش داده می‌شود با نام صاحب حساب فروشنده مطابقت دارد.
payment.vippsMobilePay.info.seller=لطفاً بررسی کنید که پرداخت دریافتی در اپلیکیشن Vipps یا MobilePay شما با شماره موبایل و نام صاحب حساب درج‌شده در حساب خریدار XMR مطابقت داشته باشد.

payment.twint.info.account=برای استفاده از TWINT به حسابی نیاز دارید که با شماره موبایل شما در سوئیس ثبت شده باشد.\n\nپرداخت‌های TWINT فقط بین حساب‌های TWINT سوئیسی ممکن است، بنابراین هر دو معامله‌گر باید از TWINT استفاده کنند. ارز معامله CHF است.
payment.twint.info.buyer=لطفاً پرداخت را فقط به شماره موبایل درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که در اپلیکیشن نمایش داده می‌شود با نام صاحب حساب فروشنده مطابقت دارد.
payment.twint.info.seller=لطفاً بررسی کنید که پرداخت دریافتی در اپلیکیشن TWINT شما با شماره موبایل و نام صاحب حساب درج‌شده در حساب خریدار XMR مطابقت داشته باشد.

payment.nip.info.account=برای استفاده از NIP به یک حساب بانکی نیجریه‌ای یا یک کیف پول موبایلی مانند OPay یا PalmPay نیاز دارید.\n\nپرداخت‌ها با انتقال بانکی آنی NIP به شماره حساب ۱۰ رقمی گیرنده در بانک یا ارائه‌دهنده کیف پول او ارسال می‌شوند. ارز معامله NGN است.
payment.nip.info.buyer=لطفاً پرداخت را فقط به شماره حساب و بانک یا کیف پول درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که در بررسی نام انتقال نمایش داده می‌شود با نام صاحب حساب فروشنده مطابقت دارد.
