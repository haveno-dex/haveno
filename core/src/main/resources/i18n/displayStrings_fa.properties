payment.ukraineCard.info.account=برای استفاده از انتقال کارت به کارت به یک کارت بانکی اوکراینی (برای مثال PrivatBank یا Monobank) نیاز دارید که بتواند انتقال دریافت کند.\n\nپرداخت‌ها به شماره کارت گیرنده ارسال می‌شوند. ارز معامله UAH است.
