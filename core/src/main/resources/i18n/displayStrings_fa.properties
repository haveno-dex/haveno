# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=معامله XMR در Haveno مستلزم درک الزام زیر است.\n\nاگر XMR می‌فروشید، باید بتوانید در صورت مناقشه اطلاعات زیر را به واسط یا داور ارائه دهید:\n- کلید تراکنش (Tx Key، Tx Secret Key یا Tx Private Key)\n- شناسه تراکنش (Tx ID یا Tx Hash)\n- آدرس مقصد (آدرس گیرنده)\n\nبرای جزئیات محل یافتن این اطلاعات در کیف پول‌های محبوب Monero به ویکی مراجعه کنید [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nارائه نکردن داده‌های تراکنش موردنیاز به باخت در مناقشه منجر می‌شود.\n\nهمچنین توجه داشته باشید که Haveno اکنون تأیید خودکار تراکنش‌های XMR را برای سریع‌تر شدن معاملات ارائه می‌دهد، اما باید آن را در تنظیمات فعال کنید.\n\nبرای اطلاعات بیشتر درباره قابلیت تأیید خودکار به ویکی مراجعه کنید: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


