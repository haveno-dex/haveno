payment.pix.info.account=لطفاً حتماً کلید Pix انتخابی خود را وارد کنید. چهار نوع کلید وجود دارد: CPF (شماره ثبت اشخاص حقیقی) یا CNPJ (شماره ثبت ملی اشخاص حقوقی)، آدرس ایمیل، شماره تلفن یا یک کلید تصادفی تولیدشده توسط سیستم به نام شناسه یکتای جهانی (UUID). برای هر حساب Pix باید از کلید متفاوتی استفاده شود. افراد می‌توانند برای هر حساب خود تا پنج کلید ایجاد کنند.\n\nهنگام معامله در Haveno، خریداران XMR باید از کلید Pix خود به عنوان توضیح پرداخت استفاده کنند تا فروشنده XMR به‌راحتی تشخیص دهد پرداخت از طرف آن‌هاست.
payment.pix.info.buyer=لطفاً پرداخت را فقط به کلید Pix ارائه‌شده در حساب Haveno فروشنده XMR ارسال کنید.\n\nلطفاً از کلید Pix خود به عنوان مرجع پرداخت استفاده کنید تا فروشنده XMR به‌راحتی تشخیص دهد پرداخت از طرف شماست.
payment.pix.info.seller=لطفاً بررسی کنید که توضیح پرداخت دریافتی با کلید Pix ارائه‌شده در حساب Haveno خریدار XMR مطابقت دارد.
payment.pix.key=کلید Pix (CPF، CNPJ، ایمیل، شماره تلفن یا UUID)
payment.monese.info.account=Monese یک اپلیکیشن بانکی برای کاربران GBP، EUR و RON* است. Monese به کاربران امکان می‌دهد فوری و رایگان به هر ارز پشتیبانی‌شده به حساب‌های Monese دیگر پول ارسال کنند.\n\n*برای باز کردن حساب RON در Monese باید در رومانی زندگی کنید یا تابعیت رومانی داشته باشید.\n\nهنگام تنظیم حساب Monese خود در Haveno، لطفاً حتماً نام و شماره تلفنی را وارد کنید که با حساب Monese شما مطابقت دارد. این کار تضمین می‌کند که وجوه ارسالی از حساب درست نمایش داده شوند و وجوه دریافتی به حساب شما واریز شوند.
payment.monese.info.buyer=لطفاً پرداخت را فقط به شماره تلفنی که فروشنده XMR در حساب Haveno خود ارائه کرده ارسال کنید. لطفاً توضیح پرداخت را خالی بگذارید.
payment.monese.info.seller=فروشندگان XMR باید انتظار دریافت پرداخت از شماره تلفن / نام نمایش‌داده‌شده در حساب Haveno خریدار XMR را داشته باشند.
payment.satispay.info.account=برای استفاده از Satispay به یک حساب بانکی (IBAN) در ایتالیا و ثبت‌نام در این سرویس نیاز دارید.\n\nمحدودیت‌های حساب Satispay به‌صورت فردی تعیین می‌شوند. اگر می‌خواهید مبالغ بیشتری معامله کنید، باید برای افزایش محدودیت با پشتیبانی Satispay تماس بگیرید. کاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.satispay.info.buyer=لطفاً پرداخت را فقط به شماره تلفن همراه فروشنده XMR که در Haveno ارائه شده ارسال کنید.\n\nمحدودیت‌های حساب Satispay به‌صورت فردی تعیین می‌شوند. اگر می‌خواهید مبالغ بیشتری معامله کنید، باید برای افزایش محدودیت با پشتیبانی Satispay تماس بگیرید. کاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.satispay.info.seller=لطفاً مطمئن شوید که پرداخت از شماره تلفن همراه / نام خریدار XMR که در Haveno ارائه شده دریافت می‌شود.\n\nمحدودیت‌های حساب Satispay به‌صورت فردی تعیین می‌شوند. اگر می‌خواهید مبالغ بیشتری معامله کنید، باید برای افزایش محدودیت با پشتیبانی Satispay تماس بگیرید. کاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.tikkie.info.account=برای استفاده از Tikkie به یک حساب بانکی (IBAN) در هلند و ثبت‌نام در این سرویس نیاز دارید.\n\nوقتی درخواست پرداخت Tikkie را برای یک فرد ارسال می‌کنید، می‌توانید حداکثر €750 در هر درخواست Tikkie دریافت کنید. حداکثر مبلغی که می‌توانید در ۲۴ ساعت درخواست کنید €2,500 برای هر حساب Tikkie است.\n\nهر بانک ممکن است در چارچوب این محدودیت‌ها، محدودیت‌های خاص خود را برای مشتریانش تعیین کند.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.tikkie.info.buyer=لطفاً در چت معامله‌گران از فروشنده XMR یک لینک پرداخت درخواست کنید. وقتی فروشنده XMR لینک پرداختی با مبلغ درست معامله برای شما فرستاد، پرداخت را انجام دهید.\n\nوقتی فروشنده XMR درخواست پرداخت Tikkie می‌کند، حداکثر می‌تواند €750 در هر درخواست Tikkie دریافت کند. اگر معامله بیش از این مبلغ باشد، فروشنده XMR باید چند درخواست ارسال کند تا به مبلغ معامله برسد. حداکثر مبلغ قابل درخواست در روز €2,500 است.\n\nهر بانک ممکن است در چارچوب این محدودیت‌ها، محدودیت‌های خاص خود را برای مشتریانش تعیین کند.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.tikkie.info.seller=لطفاً در چت معامله‌گران یک لینک پرداخت برای خریدار XMR ارسال کنید. وقتی خریدار XMR پرداخت را برای شما فرستاد، لطفاً بررسی کنید که اطلاعات IBAN او با اطلاعاتی که در Haveno دارد مطابقت دارد.\n\nوقتی فروشنده XMR درخواست پرداخت Tikkie می‌کند، حداکثر می‌تواند €750 در هر درخواست Tikkie دریافت کند. اگر معامله بیش از این مبلغ باشد، فروشنده XMR باید چند درخواست ارسال کند تا به مبلغ معامله برسد. حداکثر مبلغ قابل درخواست در روز €2,500 است.\n\nهر بانک ممکن است در چارچوب این محدودیت‌ها، محدودیت‌های خاص خود را برای مشتریانش تعیین کند.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.verse.info.account=Verse یک روش پرداخت چندارزی است که می‌تواند به EUR، SEK، HUF، DKK و PLN پرداخت ارسال و دریافت کند.\n\nهنگام تنظیم حساب Verse خود در Haveno، لطفاً حتماً نام کاربری‌ای را وارد کنید که با نام کاربری حساب Verse شما مطابقت دارد. این کار تضمین می‌کند که وجوه ارسالی از حساب درست نمایش داده شوند و وجوه دریافتی به حساب شما واریز شوند.\n\nکاربران Verse برای مجموع پرداخت‌های ارسالی از حساب پرداخت یا دریافتی به آن، به €10,000 در سال (یا معادل آن به ارز خارجی) محدود هستند. Verse می‌تواند این محدودیت را در صورت درخواست افزایش دهد.
payment.verse.info.buyer=لطفاً پرداخت را فقط به نام کاربری‌ای که فروشنده XMR در حساب Haveno خود ارائه کرده ارسال کنید. لطفاً توضیح پرداخت را خالی بگذارید.\n\nکاربران Verse برای مجموع پرداخت‌های ارسالی از حساب پرداخت یا دریافتی به آن، به €10,000 در سال (یا معادل آن به ارز خارجی) محدود هستند. Verse می‌تواند این محدودیت را در صورت درخواست افزایش دهد.
payment.verse.info.seller=فروشندگان XMR باید انتظار دریافت پرداخت از نام کاربری نمایش‌داده‌شده در حساب Haveno خریدار XMR را داشته باشند.\n\nکاربران Verse برای مجموع پرداخت‌های ارسالی از حساب پرداخت یا دریافتی به آن، به €10,000 در سال (یا معادل آن به ارز خارجی) محدود هستند. Verse می‌تواند این محدودیت را در صورت درخواست افزایش دهد.
payment.achTransfer.info.account=هنگام افزودن ACH به عنوان روش پرداخت در Haveno، کاربران باید از هزینه ارسال و دریافت انتقال ACH آگاه باشند.
payment.achTransfer.info.buyer=لطفاً مطمئن شوید که از هزینه ارسال انتقال ACH آگاه هستید.\n\nهنگام پرداخت، فقط به اطلاعات پرداخت ارائه‌شده در حساب فروشنده XMR و با انتقال ACH ارسال کنید.
payment.achTransfer.info.seller=لطفاً مطمئن شوید که از هزینه دریافت انتقال ACH آگاه هستید.\n\nهنگام دریافت پرداخت، لطفاً بررسی کنید که از حساب خریدار XMR و به‌صورت انتقال ACH دریافت شده باشد.
payment.domesticWire.info.account=هنگام افزودن حواله داخلی به عنوان روش پرداخت در Haveno، کاربران باید از هزینه ارسال و دریافت حواله آگاه باشند.
payment.domesticWire.info.buyer=لطفاً مطمئن شوید که از هزینه ارسال حواله آگاه هستید.\n\nهنگام پرداخت، فقط به اطلاعات پرداخت ارائه‌شده در حساب فروشنده XMR ارسال کنید.
payment.domesticWire.info.seller=لطفاً مطمئن شوید که از هزینه دریافت حواله آگاه هستید.\n\nهنگام دریافت پرداخت، لطفاً بررسی کنید که از حساب خریدار XMR دریافت شده باشد.
payment.strike.info.account=لطفاً حتماً نام کاربری Strike خود را وارد کنید.\n\nدر Haveno، Strike فقط برای پرداخت فیات به فیات استفاده می‌شود.\n\nلطفاً از محدودیت‌های Strike آگاه باشید:\n\nکاربرانی که فقط با ایمیل، نام و شماره تلفن ثبت‌نام کرده‌اند محدودیت‌های زیر را دارند:\n\n● حداکثر $100 در هر واریز\n● حداکثر $1,000 مجموع واریز در هفته\n● حداکثر $100 در هر پرداخت\n\nکاربران می‌توانند با ارائه اطلاعات بیشتر به Strike محدودیت خود را افزایش دهند. این کاربران محدودیت‌های زیر را دارند:\n\n● حداکثر $1,000 در هر واریز\n● حداکثر $1,000 مجموع واریز در هفته\n● حداکثر $1,000 در هر پرداخت\n\nاگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.strike.info.buyer=لطفاً پرداخت را فقط به نام کاربری Strike فروشنده XMR که در Haveno ارائه شده ارسال کنید.\n\nحداکثر اندازه معامله $1,000 در هر پرداخت است.\n\nاگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.strike.info.seller=لطفاً مطمئن شوید که پرداخت از نام کاربری Strike خریدار XMR که در Haveno ارائه شده دریافت می‌شود.\n\nحداکثر اندازه معامله $1,000 در هر پرداخت است.\n\nاگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.transferwiseUsd.info.account=به دلیل مقررات بانکی آمریکا، ارسال و دریافت پرداخت‌های USD محدودیت‌های بیشتری نسبت به اکثر ارزهای دیگر دارد. به همین دلیل USD به روش پرداخت Wise در Haveno اضافه نشد.\n\nروش پرداخت Wise-USD به کاربران Haveno امکان معامله با USD را می‌دهد.\n\nهر کسی که حساب Wise دارد می‌تواند Wise-USD را به عنوان روش پرداخت در Haveno اضافه کند. این کار به او امکان خرید و فروش XMR با USD را می‌دهد.\n\nهنگام معامله در Haveno، خریداران XMR نباید هیچ مرجعی در بابت پرداخت وارد کنند. اگر بابت پرداخت الزامی است، فقط باید نام کامل صاحب حساب Wise-USD را وارد کنند.
payment.transferwiseUsd.info.buyer=لطفاً پرداخت را فقط به آدرس ایمیل حساب Wise-USD فروشنده XMR در Haveno ارسال کنید.
payment.transferwiseUsd.info.seller=لطفاً بررسی کنید که پرداخت دریافتی با نام حساب Wise-USD خریدار XMR در Haveno مطابقت دارد.
payment.usPostalMoneyOrder.info=معامله با US Postal Money Order (USPMO) در Haveno مستلزم درک موارد زیر است:\n\n- خریداران XMR باید نام فروشنده XMR را در هر دو فیلد پرداخت‌کننده و دریافت‌کننده بنویسند و پیش از ارسال، عکسی با وضوح بالا از USPMO و پاکت همراه با مدرک پیگیری بگیرند.\n- خریداران XMR باید USPMO را با تأیید تحویل برای فروشنده XMR ارسال کنند.\n\nدر صورت نیاز به میانجی‌گری یا مناقشه معامله، باید عکس‌ها را همراه با شماره سریال USPMO، شماره اداره پست و مبلغ دلاری برای واسط یا مأمور بازپرداخت Haveno ارسال کنید تا بتوانند جزئیات را در وب‌سایت اداره پست آمریکا بررسی کنند.\n\nارائه نکردن اطلاعات موردنیاز به داور به باخت در پرونده مناقشه منجر می‌شود.\n\nدر همه پرونده‌های مناقشه، فرستنده USPMO ۱۰۰٪ مسئول ارائه شواهد/مدرک به داور است.\n\nاگر این الزامات را درک نمی‌کنید، با USPMO در Haveno معامله نکنید.
payment.payByMail.info=معامله با Pay by Mail در Haveno مستلزم درک موارد زیر است:\n\n● خریدار XMR باید پول نقد را در یک کیسه پول ضد دستکاری بسته‌بندی کند.\n● خریدار XMR باید از فرآیند بسته‌بندی پول، با آدرس و شماره پیگیری که از قبل روی بسته چسبانده شده، فیلم یا عکس با وضوح بالا بگیرد.\n● خریدار XMR باید بسته پول را با تأیید تحویل و بیمه مناسب برای فروشنده XMR ارسال کند.\n● فروشنده XMR باید از باز کردن بسته فیلم بگیرد و مطمئن شود شماره پیگیری ارائه‌شده توسط فرستنده در ویدیو دیده می‌شود.\n● سازنده پیشنهاد باید هرگونه شرایط خاص را در فیلد 'اطلاعات تکمیلی' حساب پرداخت ذکر کند.\n● پذیرنده پیشنهاد با پذیرش پیشنهاد، شرایط سازنده پیشنهاد را می‌پذیرد.\n\nمعاملات Pay by Mail مسئولیت رفتار صادقانه را کاملاً بر عهده هر دو طرف می‌گذارند.\n\n● معاملات Pay by Mail نسبت به سایر معاملات سنتی اقدامات قابل تأیید کمتری دارند. این موضوع رسیدگی به مناقشه را بسیار دشوارتر می‌کند.\n● سعی کنید مناقشه‌ها را مستقیماً با همتای خود از طریق چت معامله‌گران حل کنید. این امیدوارکننده‌ترین راه حل هر مناقشه Pay by Mail است.\n● داوران می‌توانند پرونده شما را بررسی کرده و پیشنهادی بدهند، اما کمک آن‌ها تضمین‌شده نیست.\n● داوران بر اساس شواهد ارائه‌شده تصمیم می‌گیرند. بنابراین لطفاً فرآیندهای بالا را دنبال و مستند کنید تا در صورت مناقشه شواهد داشته باشید.\n● درخواست بازپرداخت وجوه ازدست‌رفته در معاملات Pay by Mail از Haveno پذیرفته نخواهد شد.\n\nاگر این الزامات را درک نمی‌کنید، با Pay by Mail در Haveno معامله نکنید.

payment.payByMail.contact=اطلاعات تماس
payment.payByMail.contact.prompt=نام یا نام مستعاری که پاکت باید به نام آن ارسال شود
payment.payByMail.extraInfo.prompt=لطفاً در پیشنهادهای خود ذکر کنید: \n\nکشوری که در آن هستید (مثلاً فرانسه)؛ \nکشورها / مناطقی که از آن‌ها معامله می‌پذیرید (مثلاً فرانسه، اتحادیه اروپا یا هر کشور اروپایی)؛ \nهرگونه شرایط خاص؛ \nهر جزئیات دیگر.
payment.tradingRestrictions=لطفاً شرایط سازنده را مرور کنید.\nاگر الزامات را برآورده نمی‌کنید، این معامله را نپذیرید.
payment.cashAtAtm.info=برداشت نقدی بدون کارت: برداشت از خودپرداز بدون کارت با استفاده از کد\n\nبرای استفاده از این روش پرداخت:\n\n۱. یک حساب پرداخت برداشت نقدی بدون کارت ایجاد کنید و بانک‌ها، مناطق یا سایر شرایط موردپذیرش خود را که همراه پیشنهاد نمایش داده می‌شود ذکر کنید.\n\n۲. با این حساب پرداخت یک پیشنهاد ایجاد کنید یا بپذیرید.\n\n۳. وقتی پیشنهاد پذیرفته شد، با همتای خود چت کنید تا زمان انجام پرداخت را هماهنگ کرده و جزئیات پرداخت را به اشتراک بگذارید.\n\nاگر مقدار معامله بیش از محدودیت برداشت نقدی است، معامله‌گران باید آن را به چند تراکنش تقسیم کنند.\n\nمعاملات نقدی خودپرداز باید مضربی از ۱۰ باشند. توصیه می‌شود از پیشنهادهای بازه‌ای استفاده کنید تا مقدار XMR بتواند با قیمت دقیق تنظیم شود.\n\nاگر نتوانید تراکنش را طبق قرارداد معامله انجام دهید، ممکن است بخشی (یا همه) سپرده اطمینان خود را از دست بدهید.
payment.cashAtAtm.extraInfo.prompt=لطفاً در پیشنهادهای خود ذکر کنید: \n\nبانک‌ها / مکان‌های موردپذیرش شما؛ \nهرگونه شرایط خاص؛ \nهر جزئیات دیگر.
