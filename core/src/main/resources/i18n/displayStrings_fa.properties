payment.sbp.info.account=لطفاً مطمئن شوید شماره تلفن متصل به حساب بانکی خود را برای انتقال‌های SBP (پرداخت سریع) وارد می‌کنید.
payment.sbp.info.buyer=لطفاً پرداخت را از طریق SBP فقط به شماره تلفن درج‌شده در حساب Haveno فروشنده XMR ارسال کنید.
