payment.account.amazonGiftCard.addCountryInfo={0}\nحساب کارت هدیه Amazon فعلی شما ({1}) کشوری مشخص نکرده است.\nلطفاً کشور کارت هدیه Amazon خود را وارد کنید تا داده‌های حساب شما به‌روز شود.\nاین کار بر وضعیت سن حساب شما تأثیری ندارد.
payment.amazonGiftCard.upgrade.headLine=به‌روزرسانی حساب کارت هدیه Amazon
payment.swift.info.account=راهنمای اصلی استفاده از SWIFT در Haveno را با دقت مرور کنید:\n\n- همه فیلدها را کامل و دقیق پر کنید \n- خریدار باید پرداخت را به ارز مشخص‌شده توسط سازنده پیشنهاد ارسال کند \n- خریدار باید از مدل کارمزد مشترک (SHA) استفاده کند \n- خریدار و فروشنده ممکن است کارمزد بپردازند، پس بهتر است از قبل جدول کارمزد بانک خود را بررسی کنند \n\nSWIFT پیچیده‌تر از سایر روش‌های پرداخت است، پس لطفاً راهنمای کامل را در ویکی مرور کنید [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=برای خرید Monero با SWIFT باید:\n\n- پرداخت را به ارز مشخص‌شده توسط سازنده پیشنهاد ارسال کنید \n- برای ارسال پرداخت از مدل کارمزد مشترک (SHA) استفاده کنید\n\nلطفاً راهنمای بیشتر را در ویکی مرور کنید تا از جریمه جلوگیری شود و معاملات بدون مشکل انجام شوند [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=فرستندگان SWIFT باید برای ارسال پرداخت از مدل کارمزد مشترک (SHA) استفاده کنند.\n\nاگر پرداخت SWIFT دریافت کردید که از SHA استفاده نکرده، یک تیکت میانجی‌گری باز کنید.\n\nلطفاً راهنمای بیشتر را در ویکی مرور کنید تا از جریمه جلوگیری شود و معاملات بدون مشکل انجام شوند [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=لطفاً حتماً موارد زیر را وارد کنید:\n\n● نام کامل صاحب حساب\n● شماره حساب\n● شماره IFSC\n\nاین اطلاعات باید با حساب بانکی‌ای که برای ارسال / دریافت پرداخت استفاده می‌کنید مطابقت داشته باشد.\n\nتوجه داشته باشید که حداکثر Rs. 200,000 در هر تراکنش قابل ارسال است. اگر بیش از این مبلغ معامله می‌کنید، به چند تراکنش نیاز خواهد بود. همچنین توجه داشته باشید که حداکثر Rs. 1,000,000 در روز قابل ارسال است.\n\nبرخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.imps.info.buyer=لطفاً پرداخت را فقط به اطلاعات حسابی که در Haveno ارائه شده ارسال کنید.\n\nحداکثر اندازه معامله Rs. 200,000 در هر تراکنش است.\n\nاگر معامله شما بیش از Rs. 200,000 است، باید چند انتقال انجام دهید. همچنین توجه داشته باشید که حداکثر Rs. 1,000,000 در روز قابل ارسال است.\n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.imps.info.seller=اگر قصد دارید بیش از Rs. 200,000 در هر معامله دریافت کنید، انتظار داشته باشید که خریدار چند انتقال انجام دهد. همچنین توجه داشته باشید که حداکثر Rs. 1,000,000 در روز قابل ارسال است.\n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.neft.info.account=لطفاً حتماً موارد زیر را وارد کنید:\n\n● نام کامل صاحب حساب\n● شماره حساب\n● شماره IFSC\n\nاین اطلاعات باید با حساب بانکی‌ای که برای ارسال / دریافت پرداخت استفاده می‌کنید مطابقت داشته باشد.\n\nتوجه داشته باشید که حداکثر Rs. 50,000 در هر تراکنش قابل ارسال است. اگر بیش از این مبلغ معامله می‌کنید، به چند تراکنش نیاز خواهد بود.\n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.neft.info.buyer=لطفاً پرداخت را فقط به اطلاعات حسابی که در Haveno ارائه شده ارسال کنید.\n\nحداکثر اندازه معامله Rs. 50,000 در هر تراکنش است.\n\nاگر معامله شما بیش از Rs. 50,000 است، باید چند انتقال انجام دهید.\n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.neft.info.seller=اگر قصد دارید بیش از Rs. 50,000 در هر معامله دریافت کنید، انتظار داشته باشید که خریدار چند انتقال انجام دهد.\n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.paytm.info.account=لطفاً حتماً ایمیل یا شماره تلفنی را وارد کنید که با ایمیل یا شماره تلفن حساب PayTM شما مطابقت دارد. \n\nوقتی کاربران حساب PayTM را بدون KYC ایجاد می‌کنند، محدودیت‌های زیر را دارند: \n\n● حداکثر Rs. 5,000 در هر تراکنش قابل ارسال است.\n● حداکثر Rs. 10,000 می‌تواند در کیف پول PayTM هر فرد نگهداری شود.\n\nاگر قصد دارید در هر معامله بیش از 5,000 معامله کنید، باید KYC را در PayTM کامل کنید. با KYC، کاربران محدودیت‌های زیر را دارند:\n\n● حداکثر Rs. 100,000 در هر تراکنش قابل ارسال است.\n● حداکثر Rs. 100,000 می‌تواند در کیف پول PayTM هر فرد نگهداری شود.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. معاملات بالاتر از محدودیت‌های حساب PayTM احتمالاً باید در بیش از یک روز انجام شوند یا لغو شوند.
payment.paytm.info.buyer=لطفاً پرداخت را فقط به آدرس ایمیل یا شماره تلفن ارائه‌شده ارسال کنید.\n\nاگر قصد دارید در هر معامله بیش از Rs. 5,000 معامله کنید، باید KYC را در PayTM کامل کنید.\n\nبدون KYC، Rs. 5,000 در هر تراکنش قابل ارسال است.\n\nبا KYC، کاربران می‌توانند Rs. 100,000 در هر تراکنش ارسال کنند.
payment.paytm.info.seller=اگر قصد دارید در هر معامله بیش از Rs. 5,000 معامله کنید، باید KYC را در PayTM کامل کنید. با KYC، کاربران محدودیت‌های زیر را دارند:\n\n● حداکثر Rs. 100,000 در هر تراکنش قابل ارسال است.\n● حداکثر Rs. 100,000 می‌تواند در کیف پول PayTM شما نگهداری شود.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. چون حداکثر Rs. 100,000 می‌تواند در کیف پول PayTM شما نگهداری شود، لطفاً روپیه‌های خود را به‌طور منظم خارج کنید.
payment.rtgs.info.account=RTGS برای پرداخت معاملات بزرگ Rs. 200,000 یا بیشتر است.\n\nهنگام تنظیم حساب پرداخت RTGS خود، لطفاً حتماً موارد زیر را وارد کنید:\n\n● نام کامل صاحب حساب\n● شماره حساب\n● شماره IFSC\n\nاین اطلاعات باید با حساب بانکی‌ای که برای ارسال / دریافت پرداخت استفاده می‌کنید مطابقت داشته باشد.\n\nتوجه داشته باشید که حداقل مقدار معامله Rs. 200,000 در هر تراکنش است. اگر کمتر از این مبلغ معامله می‌کنید، یا معامله لغو می‌شود یا هر دو معامله‌گر باید بر سر روش پرداخت دیگری (مثلاً IMPS یا UPI) توافق کنند.
payment.rtgs.info.buyer=لطفاً پرداخت را فقط به اطلاعات حسابی که در Haveno ارائه شده ارسال کنید.\n\nتوجه داشته باشید که حداقل مقدار معامله Rs. 200,000 در هر تراکنش است. اگر کمتر از این مبلغ معامله می‌کنید، یا معامله لغو می‌شود یا هر دو معامله‌گر باید بر سر روش پرداخت دیگری (مثلاً IMPS یا UPI) توافق کنند.
payment.rtgs.info.seller=توجه داشته باشید که حداقل مقدار معامله Rs. 200,000 در هر تراکنش است. اگر کمتر از این مبلغ معامله می‌کنید، یا معامله لغو می‌شود یا هر دو معامله‌گر باید بر سر روش پرداخت دیگری (مثلاً IMPS یا UPI) توافق کنند.
payment.upi.info.account=لطفاً حتماً آدرس پرداخت مجازی (VPA) خود را که شناسه UPI نیز نامیده می‌شود وارد کنید. قالب آن شبیه یک شناسه ایمیل است: با علامت «@» در وسط. برای مثال، شناسه UPI شما می‌تواند «receiver's_name@bank_name» یا «phone_number@bank_name» باشد. \n\nبرای UPI حداکثر Rs. 100,000 در هر تراکنش قابل ارسال است. \n\nاگر قصد دارید در هر معامله بیش از Rs. 100,000 معامله کنید، احتمالاً معاملات باید در چند انتقال انجام شوند. \n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.upi.info.buyer=لطفاً پرداخت را فقط به VPA / شناسه UPI ارائه‌شده در Haveno ارسال کنید. \n\nحداکثر اندازه معامله Rs. 100,000 در هر تراکنش است. \n\nاگر معامله شما بیش از Rs. 100,000 است، باید چند انتقال انجام دهید. \n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.upi.info.seller=اگر قصد دارید بیش از Rs. 100,000 در هر معامله دریافت کنید، انتظار داشته باشید که خریدار چند انتقال انجام دهد. \n\nتوجه داشته باشید که برخی بانک‌ها محدودیت‌های متفاوتی برای مشتریان خود دارند.
payment.celpay.info.account=لطفاً حتماً ایمیلی را وارد کنید که حساب Celsius شما با آن ثبت شده است. این کار تضمین می‌کند که وجوه ارسالی از حساب درست نمایش داده شوند و وجوه دریافتی به حساب شما واریز شوند.\n\nکاربران CelPay در ۲۴ ساعت به ارسال $2,500 (یا معادل آن به ارز/رمزارز دیگر) محدود هستند.\n\nمعاملات بالاتر از محدودیت‌های حساب CelPay احتمالاً باید در بیش از یک روز انجام شوند یا لغو شوند.\n\nCelPay از چند استیبل‌کوین پشتیبانی می‌کند:\n\n● استیبل‌کوین‌های USD؛ DAI، TrueUSD، USDC، ZUSD، BUSD، GUSD، PAX، USDT (ERC20)\n● استیبل‌کوین‌های CAD؛ TrueCAD\n● استیبل‌کوین‌های GBP؛ TrueGBP\n● استیبل‌کوین‌های HKD؛ TrueHKD\n● استیبل‌کوین‌های AUD؛ TrueAUD\n\nخریداران XMR می‌توانند هر استیبل‌کوین با ارز مطابق را به فروشنده XMR ارسال کنند.
payment.celpay.info.buyer=لطفاً پرداخت را فقط با ارسال لینک پرداخت به آدرس ایمیلی که فروشنده XMR ارائه کرده انجام دهید.\n\nCelPay در ۲۴ ساعت به ارسال $2,500 (یا معادل آن به ارز/رمزارز دیگر) محدود است.\n\nمعاملات بالاتر از محدودیت‌های حساب CelPay احتمالاً باید در بیش از یک روز انجام شوند یا لغو شوند.\n\nCelPay از چند استیبل‌کوین پشتیبانی می‌کند:\n\n● استیبل‌کوین‌های USD؛ DAI، TrueUSD، USDC، ZUSD، BUSD، GUSD، PAX، USDT (ERC20)\n● استیبل‌کوین‌های CAD؛ TrueCAD\n● استیبل‌کوین‌های GBP؛ TrueGBP\n● استیبل‌کوین‌های HKD؛ TrueHKD\n● استیبل‌کوین‌های AUD؛ TrueAUD\n\nخریداران XMR می‌توانند هر استیبل‌کوین با ارز مطابق را به فروشنده XMR ارسال کنند.
payment.celpay.info.seller=فروشندگان XMR باید انتظار دریافت پرداخت از طریق یک لینک پرداخت امن را داشته باشند. لطفاً مطمئن شوید که لینک پرداخت ایمیلی شامل آدرس ایمیل ارائه‌شده توسط خریدار XMR است.\n\nکاربران CelPay در ۲۴ ساعت به ارسال $2,500 (یا معادل آن به ارز/رمزارز دیگر) محدود هستند.\n\nمعاملات بالاتر از محدودیت‌های حساب CelPay احتمالاً باید در بیش از یک روز انجام شوند یا لغو شوند.\n\nCelPay از چند استیبل‌کوین پشتیبانی می‌کند:\n\n● استیبل‌کوین‌های USD؛ DAI، TrueUSD، USDC، ZUSD، BUSD، GUSD، PAX، USDT (ERC20)\n● استیبل‌کوین‌های CAD؛ TrueCAD\n● استیبل‌کوین‌های GBP؛ TrueGBP\n● استیبل‌کوین‌های HKD؛ TrueHKD\n● استیبل‌کوین‌های AUD؛ TrueAUD\n\nفروشندگان XMR باید انتظار دریافت هر استیبل‌کوین با ارز مطابق را از خریدار XMR داشته باشند. خریدار XMR می‌تواند هر استیبل‌کوین با ارز مطابق را ارسال کند.
payment.celpay.supportedCurrenciesForReceiver=ارزهای پشتیبانی‌شده (توجه: همه ارزهای زیر استیبل‌کوین‌های پشتیبانی‌شده در اپلیکیشن Celsius هستند. معاملات برای استیبل‌کوین است، نه فیات.)
payment.nequi.info.account=لطفاً حتماً شماره تلفنی را وارد کنید که به حساب Nequi شما متصل است.\n\nوقتی کاربران حساب Nequi ایجاد می‌کنند، محدودیت پرداخت روی حداکثر حدود 7,000,000 COP در ماه تنظیم می‌شود.\n\nاگر قصد دارید در هر معامله بیش از 7,000,000 COP معامله کنید، باید KYC را در Bancolombia کامل کنید و کارمزدی حدود 15,000 COP بپردازید. پس از آن همه تراکنش‌ها مشمول 0.4٪ مالیات می‌شوند. لطفاً از آخرین مالیات‌ها آگاه باشید.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.nequi.info.buyer=لطفاً پرداخت را فقط به شماره تلفن ارائه‌شده در حساب Haveno فروشنده XMR ارسال کنید.\n\nوقتی کاربران حساب Nequi ایجاد می‌کنند، محدودیت پرداخت روی حداکثر حدود 7,000,000 COP در ماه تنظیم می‌شود.\n\nاگر قصد دارید در هر معامله بیش از 7,000,000 COP معامله کنید، باید KYC را در Bancolombia کامل کنید و کارمزدی حدود 15,000 COP بپردازید. پس از آن همه تراکنش‌ها مشمول 0.4٪ مالیات می‌شوند. لطفاً از آخرین مالیات‌ها آگاه باشید.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.nequi.info.seller=لطفاً بررسی کنید که پرداخت دریافتی با شماره تلفن ارائه‌شده در حساب Haveno خریدار XMR مطابقت دارد.\n\nوقتی کاربران حساب Nequi ایجاد می‌کنند، محدودیت پرداخت روی حداکثر حدود 7,000,000 COP در ماه تنظیم می‌شود.\n\nاگر قصد دارید در هر معامله بیش از 7,000,000 COP معامله کنید، باید KYC را در Bancolombia کامل کنید و کارمزدی حدود 15,000 COP بپردازید. پس از آن همه تراکنش‌ها مشمول 0.4٪ مالیات می‌شوند. لطفاً از آخرین مالیات‌ها آگاه باشید.\n\nکاربران باید به محدودیت‌های حساب نیز توجه کنند. اگر بیش از محدودیت‌های بالا معامله کنید، ممکن است معامله شما لغو شود و جریمه‌ای در کار باشد.
payment.mpesa.info.account=لطفاً مطمئن شوید شماره تلفنی را وارد می‌کنید که در حساب M-Pesa شما ثبت شده است.
payment.mpesa.info.buyer=لطفاً پرداخت را فقط با M-Pesa و به شماره تلفن درج‌شده در حساب Haveno فروشنده XMR ارسال کنید.
