portfolio.pending.failedTrade.missingDepositTx=یک تراکنش واریز مفقود است.\n\nاین تراکنش برای تکمیل معامله لازم است. لطفاً اطمینان حاصل کنید که کیف پول شما به‌طور کامل با بلاک‌چین مونرو همگام‌سازی شده است.\n\nمی‌توانید این معامله را به بخش «معاملات ناموفق» منتقل کنید تا غیرفعال شود.
portfolio.pending.failedTrade.errorMsgSet=در اجرای پروتکل معامله خطایی رخ داد.\n\nخطا: {0}\n\nممکن است این خطا حیاتی نباشد و معامله به‌طور عادی کامل شود. اگر مطمئن نیستید، یک تیکت میانجی‌گری باز کنید تا از واسط‌های Haveno راهنمایی بگیرید. \n\nاگر خطا حیاتی بوده و معامله قابل تکمیل نیست، ممکن است کارمزد معامله خود را از دست داده باشید. برای بازپرداخت کارمزد معامله ازدست‌رفته اینجا درخواست دهید: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=قرارداد معامله تنظیم نشده است.\n\nمعامله قابل تکمیل نیست و ممکن است کارمزد معامله خود را از دست داده باشید. در این صورت می‌توانید برای بازپرداخت کارمزد معامله ازدست‌رفته اینجا درخواست دهید: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.info.popup=پروتکل معامله با مشکلاتی روبرو شد.\n\n{0}
portfolio.pending.failedTrade.txChainInvalid.moveToFailed=پروتکل معامله با مشکل جدی روبرو شد.\n\n{0}\n\nمی‌خواهید معامله را به معاملات ناموفق منتقل کنید؟\n\nاز صفحه معاملات ناموفق نمی‌توانید میانجی‌گری یا داوری باز کنید، اما هر زمان می‌توانید یک معامله ناموفق را به صفحه معاملات باز بازگردانید.
portfolio.pending.failedTrade.txChainValid.moveToFailed=پروتکل معامله با مشکلاتی روبرو شد.\n\n{0}\n\nتراکنش‌های معامله منتشر شده و وجوه قفل هستند. فقط اگر کاملاً مطمئن هستید معامله را به معاملات ناموفق منتقل کنید. این کار ممکن است راه‌های حل مشکل را از بین ببرد.\n\nمی‌خواهید معامله را به معاملات ناموفق منتقل کنید؟\n\nاز صفحه معاملات ناموفق نمی‌توانید میانجی‌گری یا داوری باز کنید، اما هر زمان می‌توانید یک معامله ناموفق را به صفحه معاملات باز بازگردانید.
