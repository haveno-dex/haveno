payment.mir.info.account=برای استفاده از انتقال با کارت Mir به یک کارت بانکی روسی نیاز دارید که بتواند انتقال کارت به کارت دریافت کند.\n\nپرداخت‌ها به شماره کارت گیرنده ارسال می‌شوند. ارز معامله RUB است.
