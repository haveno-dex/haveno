account.seed.backup.title=پشتیبان‌گیری از کلمات انگیزه کیف پول خود
account.seed.info=لطفاً همه‌ی کلمات انگیزه کیف پول و تاریخ را یادداشت کنید. شما هر زمان که با کلمات انگیزه و تاریخ آنها را وارد کنید، می‌توانید کیف پول خود را بازیابی کنید.\n\nشما باید کلمات انگیزه را روی یک ورق کاغذ یادداشت کنید. آنها را در کامپیوتر ذخیره نکنید.\n\nلطفاً توجه داشته باشید که کلمات انگیزه جایگزینی برای یک فایل پشتیبان نمی‌باشند.\nشما باید یک نسخه پشتیبان از کل دایرکتوری برنامه از صفحه \"حساب/پشتیبان\" ایجاد کنید تا وضعیت و داده‌های برنامه را بازیابی کنید.
account.seed.backup.warning=لطفاً توجه داشته باشید که کلمات انگیزه جایگزینی برای یک فایل پشتیبان نمی‌باشند.\nشما باید یک نسخه پشتیبان از کل دایرکتوری برنامه از صفحه "حساب/پشتیبان" ایجاد کنید تا وضعیت و داده‌های برنامه را بازیابی کنید.
account.seed.warn.noPw.msg=شما یک رمز عبور کیف پول تنظیم نکرده اید که از نمایش کلمات رمز خصوصی محافظت کند.\n\nآیا می خواهید کلمات رمز خصوصی نشان داده شود؟
account.seed.warn.noPw.yes=بلی، و دوباره از من نپرس
account.seed.enterPw=وارد کردن رمز عبور به منظور مشاهده ی کلمات رمز خصوصی
account.seed.restore.info=لطفاً پیش از بازیابی از کلمات seed، یک نسخه پشتیبان تهیه کنید. بازیابی، کیف پول فعلی شما را جایگزین می‌کند و نسخه پشتیبان را بازیابی نمی‌کند. برای بازگرداندن وضعیت قبلی برنامه، از نسخه پشتیبان دایرکتوری داده‌های برنامه استفاده کنید.\n\nپس از بازیابی، برنامه به‌طور خودکار خاموش می‌شود. وقتی دوباره آن را اجرا کنید، کیف پول از ارتفاع بازیابی با شبکه Monero همگام‌سازی می‌شود که ممکن است کمی طول بکشد.
account.seed.restore.ok=بسیار خب، Haveno را بازیابی و خاموش نمایید.


