account.menu.walletInfo.path.info=اگر کلمات seed را در کیف پول دیگری (مانند Electrum) وارد می‌کنید، باید مسیر را تعیین کنید. این کار فقط باید در موارد اضطراری انجام شود که دسترسی به کیف پول و پوشه داده‌های Haveno را از دست داده‌اید.\nتوجه داشته باشید که خرج کردن وجوه از کیف پولی غیر از Haveno می‌تواند ساختار داده‌های داخلی Haveno مرتبط با کیف پول را به هم بریزد و به معاملات ناموفق منجر شود.\n\nهرگز از کیف پولی غیر از Haveno BSQ ارسال نکنید، چون احتمالاً به تراکنش نامعتبر BSQ و از دست رفتن BSQ شما منجر می‌شود.

