payment.raast.info.account=برای استفاده از Raast / Easypaisa / JazzCash به یک حساب بانکی پاکستانی یا کیف پول موبایلی نیاز دارید که بتواند انتقال آنی دریافت کند.\n\nپرداخت‌ها به شناسه Raast گیرنده (شماره موبایل ثبت‌شده)، شماره موبایل کیف پول یا IBAN پاکستانی ارسال می‌شوند. ارز معامله PKR است.
payment.raast.info.buyer=لطفاً پرداخت را فقط به شماره موبایل یا IBAN و بانک یا کیف پول درج‌شده در حساب فروشنده XMR ارسال کنید و پیش از تأیید، مطمئن شوید نام گیرنده‌ای که اپلیکیشن شما نمایش می‌دهد با نام صاحب حساب فروشنده مطابقت دارد.
