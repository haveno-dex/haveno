payment.zelle.info=Zelle è un servizio di trasferimento di denaro che funziona meglio *tramite* un'altra banca.\n\n1. Controlla in questa pagina se (e come) la tua banca funziona con Zelle: [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. Fai attenzione ai tuoi limiti di trasferimento: i limiti di invio variano da banca a banca, e spesso le banche prevedono limiti separati giornalieri, settimanali e mensili.\n\n3. Se la tua banca non funziona con Zelle, puoi comunque usarlo tramite l'app mobile Zelle, ma i limiti di trasferimento saranno molto più bassi.\n\n4. Il nome indicato nel tuo account Haveno DEVE corrispondere al nome sul tuo account Zelle/bancario. \n\nSe non riesci a completare una transazione Zelle come indicato nel contratto dello scambio, potresti perdere una parte (o tutto) del tuo deposito di sicurezza.\n\nPer via del rischio di storno leggermente più alto di Zelle, si consiglia ai venditori di contattare gli acquirenti non firmati via email o SMS per verificare che l'acquirente possieda davvero l'account Zelle indicato in Haveno.
payment.fasterPayments.newRequirements.info=Alcune banche hanno iniziato a verificare il nome completo del destinatario per i trasferimenti di Faster Payments (UK). Il tuo attuale account Faster Payments non specifica un nome completo.\n\nTi consigliamo di ricreare il tuo account Faster Payments in Haveno per fornire ai futuri acquirenti {0} un nome completo.\n\nQuando si ricrea l'account, assicurarsi di copiare il codice di ordinamento preciso, il numero di account e i valori salt della verifica dell'età dal vecchio account al nuovo account. Ciò garantirà il mantenimento dell'età del tuo account esistente e lo stato della firma.\n 
payment.fasterPayments.ukSortCode=Sort code UK
payment.moneyGram.info=Con MoneyGram, l'acquirente XMR deve inviare via email al venditore XMR il numero di autorizzazione e una foto della ricevuta. La ricevuta deve mostrare chiaramente nome completo, paese e stato del venditore e l'importo. L'email del venditore verrà mostrata all'acquirente durante lo scambio.
payment.westernUnion.info=Con Western Union, l'acquirente XMR deve inviare via email al venditore XMR l'MTCN (numero di tracciamento) e una foto della ricevuta. La ricevuta deve mostrare chiaramente nome completo, città e paese del venditore e l'importo. L'email del venditore verrà mostrata all'acquirente durante lo scambio.
payment.halCash.info=Quando utilizza HalCash, l'acquirente XMR deve inviare al venditore XMR il codice HalCash tramite un messaggio di testo dal proprio telefono cellulare.\n\nAssicurati di non superare l'importo massimo che la tua banca ti consente di inviare con HalCash. L'importo minimo per prelievo è di 10 EURO, l'importo massimo è di 600 EURO. Per prelievi ripetuti è di 3000 EURO per destinatario al giorno e 6000 EURO per destintario al mese. Verifica i limiti con la tua banca per accertarti che utilizzino gli stessi limiti indicati qui.\n\nL'importo del prelievo deve essere un multiplo di 10 EURO in quanto non è possibile prelevare altri importi da un bancomat. L'interfaccia utente nella schermata di creazione offerta e accettazione offerta modificherà l'importo XMR in modo che l'importo in EURO sia corretto. Non è possibile utilizzare il prezzo di mercato poiché l'importo in EURO cambierebbe al variare dei prezzi.\n\nIn caso di controversia, l'acquirente XMR deve fornire la prova di aver inviato gli EURO.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Tieni presente che tutti i bonifici bancari comportano un certo rischio di storno. Per ridurre questo rischio, Haveno imposta limiti per scambio in base al livello stimato di rischio di storno del metodo di pagamento usato.\n\nPer questo metodo di pagamento, il tuo limite per scambio in acquisto e in vendita è {2}.\n\nQuesto limite riguarda solo la dimensione del singolo scambio: puoi fare tutti gli scambi che vuoi.\n\nMaggiori dettagli sul wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Per limitare il rischio di storno, Haveno imposta limiti per scambio per questo tipo di account di pagamento in base a 2 fattori:\n\n1. Rischio di storno generale del metodo di pagamento\n2. Stato di firma dell'account\n\nQuesto account di pagamento non è ancora firmato, quindi può acquistare al massimo {0} per scambio. Dopo la firma, i limiti di acquisto aumentano così:\n\n● Prima della firma, e per 30 giorni dopo la firma, il tuo limite di acquisto per scambio sarà {0}\n● 30 giorni dopo la firma, il tuo limite di acquisto per scambio sarà {1}\n● 60 giorni dopo la firma, il tuo limite di acquisto per scambio sarà {2}\n\nI limiti di vendita non dipendono dalla firma dell'account. Puoi vendere subito {2} in un singolo scambio.\n\nQuesti limiti riguardano solo la dimensione del singolo scambio: puoi fare tutti gli scambi che vuoi. \n\nMaggiori dettagli sul wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].

payment.cashDeposit.info=Conferma che la tua banca ti consente di inviare depositi in contanti su conti di altre persone. Ad esempio, Bank of America e Wells Fargo non consentono più tali depositi.

payment.revolut.info=Revolut richiede il 'Nome utente' come ID account, non più il numero di telefono o l'email come in passato.
payment.account.revolut.addUserNameInfo={0}\nIl tuo account Revolut esistente ({1}) non ha un 'Nome utente'.\nInserisci il tuo 'Nome utente' Revolut per aggiornare i dati dell'account.\nQuesto non influirà sullo stato di firma dell'età del tuo account.
payment.revolut.addUserNameInfo.headLine=Aggiorna account Revolut

payment.cashapp.info=Si prega di notare che Cash App ha un rischio di chargeback più elevato rispetto alla maggior parte dei bonifici bancari.
payment.venmo.info=Si prega di notare che Venmo ha un rischio di chargeback più elevato rispetto alla maggior parte dei bonifici bancari.
payment.paypal.info=Si prega di notare che PayPal ha un rischio di chargeback più elevato rispetto alla maggior parte dei bonifici bancari.

