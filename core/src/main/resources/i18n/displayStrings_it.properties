account.seed.restore.info=Fai un backup prima di ripristinare dalle parole del seed. Il ripristino sostituisce il portafoglio attuale. Non ripristina un backup. Per ripristinare uno stato precedente dell'applicazione, usa un backup della directory dei dati dell'applicazione.\n\nDopo il ripristino, l'applicazione si chiude automaticamente. Al riavvio, il portafoglio si risincronizza con la rete Monero dall'altezza di ripristino, il che può richiedere del tempo.
