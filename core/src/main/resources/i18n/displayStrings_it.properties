payment.amazonGiftCard.upgrade.headLine=Aggiorna account Amazon Gift Card
payment.swift.info.account=Leggi con attenzione le linee guida principali per usare SWIFT su Haveno:\n\n- compila tutti i campi in modo completo e accurato \n- l'acquirente deve inviare il pagamento nella valuta indicata dal maker dell'offerta \n- l'acquirente deve usare l'opzione commissioni condivise (SHA) \n- acquirente e venditore potrebbero sostenere commissioni, quindi dovrebbero controllare prima le tariffe della propria banca \n\nSWIFT è più complesso di altri metodi di pagamento, quindi prenditi un momento per leggere la guida completa sul wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.buyer=Per comprare monero con SWIFT, devi:\n\n- inviare il pagamento nella valuta indicata dal maker dell'offerta \n- usare l'opzione commissioni condivise (SHA) per inviare il pagamento\n\nLeggi le ulteriori indicazioni sul wiki per evitare penali e garantire scambi senza intoppi [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.swift.info.seller=Chi invia con SWIFT è tenuto a usare l'opzione commissioni condivise (SHA).\n\nSe ricevi un pagamento SWIFT che non usa SHA, apri un ticket di mediazione.\n\nLeggi le ulteriori indicazioni sul wiki per evitare penali e garantire scambi senza intoppi [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].
payment.imps.info.account=Assicurati di includere:\n\n● Nome completo del titolare del conto\n● Numero di conto\n● Codice IFSC\n\nQuesti dati devono corrispondere al conto bancario che userai per inviare / ricevere i pagamenti.\n\nTieni presente che si possono inviare al massimo Rs. 200.000 per transazione. Se scambi importi superiori serviranno più transazioni. Tieni presente però che il limite massimo giornaliero è di Rs. 1.000.000.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.imps.info.buyer=Invia il pagamento solo ai dati del conto forniti in Haveno.\n\nLa dimensione massima dello scambio è Rs. 200.000 per transazione.\n\nSe il tuo scambio supera Rs. 200.000 dovrai fare più bonifici. Tieni presente però che il limite massimo giornaliero è di Rs. 1.000.000.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.imps.info.seller=Se intendi ricevere più di Rs. 200.000 per scambio, aspettati che l'acquirente debba fare più bonifici. Tieni presente però che il limite massimo giornaliero è di Rs. 1.000.000.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.neft.info.account=Assicurati di includere:\n\n● Nome completo del titolare del conto\n● Numero di conto\n● Codice IFSC\n\nQuesti dati devono corrispondere al conto bancario che userai per inviare / ricevere i pagamenti.\n\nTieni presente che si possono inviare al massimo Rs. 50.000 per transazione. Se scambi importi superiori serviranno più transazioni.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.neft.info.buyer=Invia il pagamento solo ai dati del conto forniti in Haveno.\n\nLa dimensione massima dello scambio è Rs. 50.000 per transazione.\n\nSe il tuo scambio supera Rs. 50.000 dovrai fare più bonifici.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.neft.info.seller=Se intendi ricevere più di Rs. 50.000 per scambio, aspettati che l'acquirente debba fare più bonifici.\n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.paytm.info.account=Assicurati di includere l'email o il numero di telefono corrispondenti a quelli del tuo account PayTM. \n\nGli utenti che aprono un account PayTM senza KYC hanno questi limiti: \n\n● Massimo Rs. 5.000 inviabili per transazione.\n● Massimo Rs. 10.000 detenibili nel portafoglio PayTM.\n\nSe intendi scambiare più di 5.000 per scambio dovrai completare il KYC con PayTM. Con il KYC i limiti sono:\n\n● Massimo Rs. 100.000 inviabili per transazione.\n● Massimo Rs. 100.000 detenibili nel portafoglio PayTM.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Gli scambi oltre i limiti dell'account PayTM probabilmente dovranno svolgersi in più di un giorno, oppure essere annullati.
payment.paytm.info.buyer=Invia il pagamento solo all'indirizzo email o al numero di telefono forniti.\n\nSe intendi scambiare più di Rs. 5.000 per scambio dovrai completare il KYC con PayTM.\n\nSenza KYC si possono inviare Rs. 5.000 per transazione.\n\nCon il KYC si possono inviare Rs. 100.000 per transazione.
payment.paytm.info.seller=Se intendi scambiare più di Rs. 5.000 per scambio dovrai completare il KYC con PayTM. Con il KYC i limiti sono:\n\n● Massimo Rs. 100.000 inviabili per transazione.\n● Massimo Rs. 100.000 detenibili nel tuo portafoglio PayTM.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Poiché nel tuo portafoglio PayTM puoi detenere al massimo Rs. 100.000, assicurati di trasferire regolarmente le tue rupie.
payment.rtgs.info.account=RTGS è per pagamenti di scambi di importo elevato, da Rs. 200.000 in su.\n\nQuando configuri il tuo account di pagamento RTGS assicurati di includere:\n\n● Nome completo del titolare del conto\n● Numero di conto\n● Codice IFSC\n\nQuesti dati devono corrispondere al conto bancario che userai per inviare / ricevere i pagamenti.\n\nTieni presente che l'importo minimo per transazione è di Rs. 200.000. Se scambi un importo inferiore, lo scambio verrà annullato oppure entrambi i trader dovranno accordarsi su un altro metodo di pagamento (es. IMPS o UPI).
payment.rtgs.info.buyer=Invia il pagamento solo ai dati del conto forniti in Haveno.\n\nTieni presente che l'importo minimo per transazione è di Rs. 200.000. Se scambi un importo inferiore, lo scambio verrà annullato oppure entrambi i trader dovranno accordarsi su un altro metodo di pagamento (es. IMPS o UPI).
payment.rtgs.info.seller=Tieni presente che l'importo minimo per transazione è di Rs. 200.000. Se scambi un importo inferiore, lo scambio verrà annullato oppure entrambi i trader dovranno accordarsi su un altro metodo di pagamento (es. IMPS o UPI).
payment.upi.info.account=Assicurati di includere il tuo Virtual Payment Address (VPA), detto anche UPI ID. Il formato è simile a un indirizzo email, con il simbolo “@” al centro. Ad esempio, il tuo UPI ID potrebbe essere “nome_destinatario@nome_banca” o “numero_telefono@nome_banca”. \n\nCon UPI il limite massimo è di Rs. 100.000 per transazione. \n\nSe intendi scambiare più di Rs. 100.000 per scambio, probabilmente serviranno più bonifici. \n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.upi.info.buyer=Invia il pagamento solo al VPA / UPI ID fornito in Haveno. \n\nLa dimensione massima dello scambio è Rs. 100.000 per transazione. \n\nSe il tuo scambio supera Rs. 100.000 dovrai fare più bonifici. \n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.upi.info.seller=Se intendi ricevere più di Rs. 100.000 per scambio, aspettati che l'acquirente debba fare più bonifici. \n\nAlcune banche hanno limiti diversi per i propri clienti.
payment.celpay.info.account=Assicurati di includere l'email con cui è registrato il tuo account Celsius. Così, quando invii fondi risulteranno dall'account corretto e quando li ricevi verranno accreditati sul tuo account.\n\nGli utenti CelPay possono inviare al massimo $2.500 (o equivalente in altra valuta/crypto) in 24 ore.\n\nGli scambi oltre i limiti dell'account CelPay probabilmente dovranno svolgersi in più di un giorno, oppure essere annullati.\n\nCelPay supporta diverse stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nGli acquirenti XMR possono inviare al venditore XMR qualsiasi stablecoin nella valuta corrispondente.
payment.celpay.info.buyer=Invia il pagamento solo all'indirizzo email fornito dal venditore XMR, tramite un link di pagamento.\n\nCelPay consente di inviare al massimo $2.500 (o equivalente in altra valuta/crypto) in 24 ore.\n\nGli scambi oltre i limiti dell'account CelPay probabilmente dovranno svolgersi in più di un giorno, oppure essere annullati.\n\nCelPay supporta diverse stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nGli acquirenti XMR possono inviare al venditore XMR qualsiasi stablecoin nella valuta corrispondente.
payment.celpay.info.seller=I venditori XMR riceveranno il pagamento tramite un link di pagamento sicuro. Assicurati che il link di pagamento via email contenga l'indirizzo email fornito dall'acquirente XMR.\n\nGli utenti CelPay possono inviare al massimo $2.500 (o equivalente in altra valuta/crypto) in 24 ore.\n\nGli scambi oltre i limiti dell'account CelPay probabilmente dovranno svolgersi in più di un giorno, oppure essere annullati.\n\nCelPay supporta diverse stablecoin:\n\n● Stablecoin USD; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● Stablecoin CAD; TrueCAD\n● Stablecoin GBP; TrueGBP\n● Stablecoin HKD; TrueHKD\n● Stablecoin AUD; TrueAUD\n\nI venditori XMR riceveranno dall'acquirente XMR una stablecoin nella valuta corrispondente. L'acquirente XMR può inviare qualsiasi stablecoin nella valuta corrispondente.
payment.celpay.supportedCurrenciesForReceiver=Valute supportate (nota: tutte le valute qui sotto sono stablecoin supportate nell'app Celsius. Gli scambi sono in stablecoin, non in fiat.)
payment.nequi.info.account=Assicurati di includere il numero di telefono associato al tuo account Nequi.\n\nQuando si apre un account Nequi, il limite di pagamento è di circa 7.000.000 COP inviabili al mese.\n\nSe intendi scambiare più di 7.000.000 COP per scambio dovrai completare il KYC con Bancolombia e pagare una commissione di circa 15.000 COP. Dopodiché tutte le transazioni saranno soggette a una tassa dello 0,4%. Assicurati di conoscere le tasse più recenti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.nequi.info.buyer=Invia il pagamento solo al numero di telefono indicato nell'account Haveno del venditore XMR.\n\nQuando si apre un account Nequi, il limite di pagamento è di circa 7.000.000 COP inviabili al mese.\n\nSe intendi scambiare più di 7.000.000 COP per scambio dovrai completare il KYC con Bancolombia e pagare una commissione di circa 15.000 COP. Dopodiché tutte le transazioni saranno soggette a una tassa dello 0,4%. Assicurati di conoscere le tasse più recenti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.nequi.info.seller=Controlla che il pagamento ricevuto corrisponda al numero di telefono indicato nell'account Haveno dell'acquirente XMR.\n\nQuando si apre un account Nequi, il limite di pagamento è di circa 7.000.000 COP inviabili al mese.\n\nSe intendi scambiare più di 7.000.000 COP per scambio dovrai completare il KYC con Bancolombia e pagare una commissione di circa 15.000 COP. Dopodiché tutte le transazioni saranno soggette a una tassa dello 0,4%. Assicurati di conoscere le tasse più recenti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.mpesa.info.account=Assicurati di includere il numero di telefono registrato con il tuo account M-Pesa.
payment.mpesa.info.buyer=Invia il pagamento tramite M-Pesa solo al numero di telefono indicato nell'account Haveno del venditore XMR.
payment.mpesa.info.seller=Verifica che il pagamento M-Pesa ricevuto corrisponda al numero di telefono indicato nell'account Haveno dell'acquirente XMR.
payment.mercadoPago.info.account=Assicurati di includere l'email o il numero di telefono registrati con il tuo account Mercado Pago.
payment.mercadoPago.info.buyer=Invia il pagamento tramite Mercado Pago solo all'email o al numero di telefono indicati nell'account Haveno del venditore XMR.
payment.mercadoPago.info.seller=Verifica che il pagamento Mercado Pago ricevuto corrisponda all'email o al numero di telefono indicati nell'account Haveno dell'acquirente XMR.
payment.gcash.info.account=Assicurati di includere il numero di telefono registrato con il tuo account GCash.
payment.gcash.info.buyer=Invia il pagamento tramite GCash solo al numero di telefono indicato nell'account Haveno del venditore XMR.
payment.gcash.info.seller=Verifica che il pagamento GCash ricevuto corrisponda al numero di telefono indicato nell'account Haveno dell'acquirente XMR.
payment.momo.info.account=Assicurati di includere il numero di telefono registrato con il tuo account MoMo.
payment.momo.info.buyer=Invia il pagamento tramite MoMo solo al numero di telefono indicato nell'account Haveno del venditore XMR.
payment.momo.info.seller=Verifica che il pagamento MoMo ricevuto corrisponda al numero di telefono indicato nell'account Haveno dell'acquirente XMR.
payment.spei.info.account=Assicurati di includere la CLABE (numero di conto interbancario a 18 cifre) associata al tuo conto bancario per i bonifici SPEI.
payment.spei.info.buyer=Invia il pagamento tramite SPEI solo alla CLABE indicata nell'account Haveno del venditore XMR.
payment.spei.info.seller=Verifica che il pagamento SPEI ricevuto corrisponda alla CLABE indicata nell'account Haveno dell'acquirente XMR.
payment.bizum.info.account=Per usare Bizum devi avere un conto bancario (IBAN) in Spagna ed essere registrato al servizio.\n\nBizum può essere usato per scambi tra €0,50 e €1.000.\n\nL'importo massimo che puoi inviare/ricevere con Bizum è di €2.000 al giorno.\n\nGli utenti Bizum possono fare al massimo 150 operazioni al mese.\n\nOgni banca può però stabilire i propri limiti, entro quelli indicati, per i propri clienti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.bizum.info.buyer=Invia il pagamento solo al numero di cellulare del venditore XMR indicato in Haveno.\n\nLa dimensione massima dello scambio è €1.000 per pagamento. L'importo massimo che puoi inviare con Bizum è di €2.000 al giorno.\n\nSe scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.bizum.info.seller=Assicurati che il pagamento arrivi dal numero di cellulare dell'acquirente XMR indicato in Haveno.\n\nLa dimensione massima dello scambio è €1.000 per pagamento. L'importo massimo che puoi ricevere con Bizum è di €2.000 al giorno.\n\nSe scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.

payment.blik.info.account=Per usare BLIK ti serve un conto bancario in Polonia con un'app di mobile banking che supporti BLIK.\n\nL'acquirente XMR paga generando un codice BLIK e inviandolo al venditore XMR tramite la chat dello scambio, quindi entrambi i trader devono essere online per completare il pagamento.
payment.blik.info.buyer=Per pagare, genera un codice BLIK nella tua app di mobile banking e invialo al venditore XMR tramite la chat dello scambio.\n\nI codici BLIK sono validi solo per 2 minuti, quindi assicurati che il venditore risponda nella chat dello scambio prima di generare il codice.
payment.blik.info.seller=L'acquirente XMR ti invierà un codice BLIK tramite la chat dello scambio.\n\nI codici BLIK sono validi solo per 2 minuti, quindi usa il codice per incassare il pagamento subito dopo averlo ricevuto.

payment.vippsMobilePay.info.account=Per usare Vipps MobilePay ti serve un account registrato con il tuo numero di cellulare in Norvegia, Danimarca o Finlandia.\n\nI pagamenti non possono essere inviati tra paesi diversi, quindi entrambi i trader devono avere un account nello stesso paese. La valuta dello scambio è determinata dal paese del tuo account.
payment.vippsMobilePay.info.buyer=Invia il pagamento solo al numero di cellulare indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.vippsMobilePay.info.seller=Verifica che il pagamento ricevuto nella tua app Vipps o MobilePay corrisponda al numero di cellulare e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.twint.info.account=Per usare TWINT ti serve un account registrato con il tuo numero di cellulare in Svizzera.\n\nI pagamenti TWINT possono essere inviati solo tra account TWINT svizzeri, quindi entrambi i trader devono usare TWINT. La valuta dello scambio è CHF.
payment.twint.info.buyer=Invia il pagamento solo al numero di cellulare indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.twint.info.seller=Verifica che il pagamento ricevuto nella tua app TWINT corrisponda al numero di cellulare e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.nip.info.account=Per usare NIP ti serve un conto bancario nigeriano o un wallet di mobile money come OPay o PalmPay.\n\nI pagamenti vengono inviati tramite bonifico istantaneo NIP al numero di conto a 10 cifre del destinatario presso la sua banca o il suo fornitore di wallet. La valuta dello scambio è NGN.
payment.nip.info.buyer=Invia il pagamento solo al numero di conto e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dal controllo del nome del bonifico corrisponda al nome dell'intestatario dell'account del venditore.
payment.nip.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o del wallet corrisponda al numero di conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.pagoMovil.info.account=Per usare Pago Móvil ti serve un conto bancario venezuelano con Pago Móvil abilitato, registrato con il tuo numero di cellulare, la tua cédula e la tua banca.\n\nI pagamenti vengono inviati tramite bonifico interbancario al numero di cellulare, alla cédula e alla banca indicati. La valuta dello scambio è VES.
payment.pagoMovil.info.buyer=Invia il pagamento solo al numero di cellulare, alla cédula e alla banca indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua banca corrisponda al nome dell'intestatario dell'account del venditore.
payment.pagoMovil.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria corrisponda al numero di cellulare, alla cédula e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.qris.info.account=Per usare QRIS / BI-FAST ti serve un conto bancario indonesiano o un e-wallet che possa ricevere bonifici istantanei.\n\nI pagamenti vengono inviati tramite bonifico istantaneo BI-FAST al numero di conto del destinatario presso la sua banca o il suo e-wallet, oppure scansionando il codice QRIS del destinatario. La valuta dello scambio è IDR.
payment.qris.info.buyer=Invia il pagamento solo al numero di conto e alla banca o all'e-wallet indicati nell'account del venditore XMR, oppure a un codice QRIS che il venditore condivide con te nella chat dello scambio, e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.qris.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o dell'e-wallet corrisponda al numero di conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.papara.info.account=Per usare Papara / FAST ti serve un account Papara o un conto bancario turco che possa ricevere bonifici istantanei.\n\nI pagamenti vengono inviati al numero Papara, all'IBAN turco o al numero di cellulare FAST Easy Address (Kolay Adres) del destinatario. La valuta dello scambio è TRY.
payment.papara.info.buyer=Invia il pagamento solo al numero di conto o all'IBAN e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.papara.info.seller=Verifica che il pagamento ricevuto nella tua app Papara o bancaria corrisponda ai dati del conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.raast.info.account=Per usare Raast / Easypaisa / JazzCash ti serve un conto bancario o un wallet mobile pakistano che possa ricevere bonifici istantanei.\n\nI pagamenti vengono inviati al Raast ID (numero di cellulare registrato), al numero di cellulare del wallet o all'IBAN pakistano del destinatario. La valuta dello scambio è PKR.
payment.raast.info.buyer=Invia il pagamento solo al numero di cellulare o all'IBAN e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.raast.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o del wallet corrisponda ai dati del conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.paynow.info.account=Per usare PayNow / FAST ti serve un conto bancario o un e-wallet di Singapore che possa ricevere bonifici istantanei.\n\nI pagamenti vengono inviati al proxy PayNow del destinatario: un numero di cellulare registrato o un NRIC/FIN. La valuta dello scambio è SGD.
payment.paynow.info.buyer=Invia il pagamento solo al numero di cellulare o al NRIC/FIN e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.paynow.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o del wallet corrisponda ai dati del conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.wero.info.account=Per usare Wero ti serve l'app Wero o l'app di una banca aderente con il tuo numero di cellulare registrato in Germania, Francia o Belgio.\n\nI pagamenti vengono inviati al numero di cellulare registrato del destinatario, inserito in formato internazionale (es. +49). La valuta dello scambio è EUR.
payment.wero.info.buyer=Invia il pagamento solo al numero di cellulare indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.wero.info.seller=Verifica che il pagamento ricevuto nella tua app Wero o bancaria corrisponda al numero di cellulare e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.fps.info.account=Per usare FPS (Faster Payment System) ti serve un conto bancario di Hong Kong o un e-wallet come AlipayHK o WeChat Pay HK.\n\nI pagamenti vengono inviati al proxy FPS del destinatario: un numero di cellulare registrato, un FPS ID o un indirizzo email. La valuta dello scambio è HKD.
payment.fps.info.buyer=Invia il pagamento solo al numero di cellulare, all'FPS ID o all'email e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.fps.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o del wallet corrisponda ai dati del conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.duitnow.info.account=Per usare DuitNow ti serve un conto bancario malese o un e-wallet come Touch 'n Go, GrabPay o Boost.\n\nI pagamenti vengono inviati al proxy DuitNow del destinatario: un numero di cellulare registrato o un NRIC. La valuta dello scambio è MYR.
payment.duitnow.info.buyer=Invia il pagamento solo al numero di cellulare o al NRIC e alla banca o al wallet indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app corrisponda al nome dell'intestatario dell'account del venditore.
payment.duitnow.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria o del wallet corrisponda ai dati del conto e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.mbway.info.account=Per usare MB WAY ti serve l'app MB WAY attivata con il tuo numero di cellulare portoghese.\n\nI pagamenti vengono inviati al numero di cellulare registrato del destinatario. La valuta dello scambio è EUR.
payment.mbway.info.buyer=Invia il pagamento solo al numero di cellulare indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.mbway.info.seller=Verifica che il pagamento ricevuto nella tua app MB WAY corrisponda al numero di cellulare e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.paypay.accountId=Numero di cellulare o PayPay ID
payment.paypay.info.account=Per usare PayPay ti serve un account PayPay registrato in Giappone.\n\nI pagamenti PayPay possono essere inviati solo tra utenti PayPay, quindi entrambi i trader devono usare PayPay. I pagamenti vengono inviati al numero di cellulare registrato o al PayPay ID del destinatario. La valuta dello scambio è JPY.
payment.paypay.info.buyer=Invia il pagamento solo al numero di cellulare o al PayPay ID indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.paypay.info.seller=Verifica che il pagamento ricevuto nella tua app PayPay corrisponda al numero di cellulare o al PayPay ID e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.sbp.info.account=Assicurati di includere il numero di telefono collegato al tuo conto bancario per i bonifici SBP (Faster Payments).
payment.sbp.info.buyer=Invia il pagamento tramite SBP solo al numero di telefono indicato nell'account Haveno del venditore XMR.
payment.sbp.info.seller=Verifica che il pagamento SBP ricevuto corrisponda al numero di telefono indicato nell'account Haveno dell'acquirente XMR.

payment.mir.info.account=Per usare il trasferimento su carta Mir ti serve una carta bancaria russa che possa ricevere trasferimenti da carta a carta.\n\nI pagamenti vengono inviati al numero di carta del destinatario. La valuta dello scambio è RUB.
payment.mir.info.buyer=Invia il pagamento solo al numero di carta indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app bancaria corrisponda al nome dell'intestatario dell'account del venditore.
payment.mir.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria corrisponda al numero di carta e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.yoomoney.info.account=Per usare YooMoney ti serve un wallet YooMoney registrato in Russia.\n\nI pagamenti vengono inviati al numero di wallet del destinatario. La valuta dello scambio è RUB.
payment.yoomoney.info.buyer=Invia il pagamento solo al numero di wallet indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.yoomoney.info.seller=Verifica che il pagamento ricevuto nel tuo wallet YooMoney corrisponda al numero di wallet e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.ukraineCard.info.account=Per usare il trasferimento da carta a carta ti serve una carta bancaria ucraina (es. PrivatBank o Monobank) che possa ricevere trasferimenti.\n\nI pagamenti vengono inviati al numero di carta del destinatario. La valuta dello scambio è UAH.
payment.ukraineCard.info.buyer=Invia il pagamento solo al numero di carta indicato nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato dalla tua app bancaria corrisponda al nome dell'intestatario dell'account del venditore.
payment.ukraineCard.info.seller=Verifica che il pagamento ricevuto nella tua app bancaria corrisponda al numero di carta e al nome dell'intestatario indicati nell'account dell'acquirente XMR.

payment.kaspi.accountId=Numero di cellulare o numero di carta
payment.kaspi.info.account=Per usare Kaspi ti serve un account Kaspi registrato in Kazakistan.\n\nI pagamenti vengono inviati al numero di cellulare registrato o al numero della carta Kaspi Gold del destinatario. La valuta dello scambio è KZT.
payment.kaspi.info.buyer=Invia il pagamento solo al numero di cellulare o al numero di carta indicati nell'account del venditore XMR e, prima di confermare, verifica che il nome del destinatario mostrato nell'app corrisponda al nome dell'intestatario dell'account del venditore.
payment.kaspi.info.seller=Verifica che il pagamento ricevuto nella tua app Kaspi corrisponda al numero di cellulare o al numero di carta e al nome dell'intestatario indicati nell'account dell'acquirente XMR.
payment.pix.info.account=Assicurati di includere la tua chiave Pix. Esistono quattro tipi di chiave: CPF (registro delle persone fisiche) o CNPJ (registro nazionale delle persone giuridiche), indirizzo email, numero di telefono o una chiave casuale generata dal sistema, detta identificatore univoco universale (UUID). Per ogni account Pix che possiedi va usata una chiave diversa. Ogni persona può creare fino a cinque chiavi per ciascun account.\n\nQuando scambiano su Haveno, gli acquirenti XMR dovrebbero usare la propria chiave Pix come causale, così che il venditore XMR possa facilmente riconoscere che il pagamento arriva da loro.
payment.pix.info.buyer=Invia il pagamento solo alla chiave Pix indicata nell'account Haveno del venditore XMR.\n\nUsa la tua chiave Pix come causale, così che il venditore XMR possa facilmente riconoscere che il pagamento arriva da te.
payment.pix.info.seller=Controlla che la causale del pagamento ricevuto corrisponda alla chiave Pix indicata nell'account Haveno dell'acquirente XMR.
payment.pix.key=Chiave Pix (CPF, CNPJ, email, numero di telefono o UUID)
payment.monese.info.account=Monese è un'app bancaria per utenti di GBP, EUR e RON*. Monese permette di inviare denaro ad altri account Monese istantaneamente e gratis in qualsiasi valuta supportata.\n\n*Per aprire un conto in RON su Monese, devi vivere in Romania o avere la cittadinanza rumena.\n\nQuando configuri il tuo account Monese in Haveno, assicurati di includere il nome e il numero di telefono corrispondenti al tuo account Monese. Così, quando invii fondi risulteranno dall'account corretto e quando li ricevi verranno accreditati sul tuo account.
payment.monese.info.buyer=Invia il pagamento solo al numero di telefono indicato dal venditore XMR nel suo account Haveno. Lascia vuota la causale.
payment.monese.info.seller=I venditori XMR riceveranno il pagamento dal numero di telefono / nome mostrati nell'account Haveno dell'acquirente XMR.
payment.satispay.info.account=Per usare Satispay devi avere un conto bancario (IBAN) in Italia ed essere registrato al servizio.\n\nI limiti dell'account Satispay sono impostati individualmente. Se vuoi scambiare importi maggiori dovrai contattare il supporto Satispay per aumentare i tuoi limiti. Gli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.satispay.info.buyer=Invia il pagamento solo al numero di cellulare del venditore XMR indicato in Haveno.\n\nI limiti dell'account Satispay sono impostati individualmente. Se vuoi scambiare importi maggiori dovrai contattare il supporto Satispay per aumentare i tuoi limiti. Gli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.satispay.info.seller=Assicurati che il pagamento arrivi dal numero di cellulare / nome dell'acquirente XMR indicati in Haveno.\n\nI limiti dell'account Satispay sono impostati individualmente. Se vuoi scambiare importi maggiori dovrai contattare il supporto Satispay per aumentare i tuoi limiti. Gli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.tikkie.info.account=Per usare Tikkie devi avere un conto bancario (IBAN) nei Paesi Bassi ed essere registrato al servizio.\n\nQuando invii una richiesta di pagamento Tikkie a un privato puoi chiedere al massimo €750 per richiesta. L'importo massimo che puoi richiedere in 24 ore è €2.500 per account Tikkie.\n\nOgni banca può però stabilire i propri limiti, entro quelli indicati, per i propri clienti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.tikkie.info.buyer=Richiedi un link di pagamento al venditore XMR nella chat dello scambio. Quando il venditore XMR ti ha inviato un link di pagamento con l'importo corretto dello scambio, procedi al pagamento.\n\nQuando il venditore XMR richiede un pagamento Tikkie, può chiedere al massimo €750 per richiesta. Se lo scambio supera quell'importo, il venditore XMR dovrà inviare più richieste fino a raggiungere l'importo dello scambio. Il massimo richiedibile in un giorno è €2.500.\n\nOgni banca può però stabilire i propri limiti, entro quelli indicati, per i propri clienti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.tikkie.info.seller=Invia un link di pagamento all'acquirente XMR nella chat dello scambio. Quando l'acquirente XMR ti ha inviato il pagamento, controlla che i dati del suo IBAN corrispondano a quelli che ha in Haveno.\n\nQuando il venditore XMR richiede un pagamento Tikkie, può chiedere al massimo €750 per richiesta. Se lo scambio supera quell'importo, il venditore XMR dovrà inviare più richieste fino a raggiungere l'importo dello scambio. Il massimo richiedibile in un giorno è €2.500.\n\nOgni banca può però stabilire i propri limiti, entro quelli indicati, per i propri clienti.\n\nGli utenti devono inoltre tenere conto dei limiti dell'account. Se scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.verse.info.account=Verse è un metodo di pagamento multivaluta che può inviare e ricevere pagamenti in EUR, SEK, HUF, DKK, PLN.\n\nQuando configuri il tuo account Verse in Haveno, assicurati di includere il nome utente corrispondente a quello del tuo account Verse. Così, quando invii fondi risulteranno dall'account corretto e quando li ricevi verranno accreditati sul tuo account.\n\nGli utenti Verse possono inviare o ricevere al massimo €10.000 all'anno (o l'equivalente in valuta estera) come totale dei pagamenti effettuati o ricevuti sul proprio account. Verse può aumentare questo limite su richiesta.
payment.verse.info.buyer=Invia il pagamento solo al nome utente indicato dal venditore XMR nel suo account Haveno. Lascia vuota la causale.\n\nGli utenti Verse possono inviare o ricevere al massimo €10.000 all'anno (o l'equivalente in valuta estera) come totale dei pagamenti effettuati o ricevuti sul proprio account. Verse può aumentare questo limite su richiesta.
payment.verse.info.seller=I venditori XMR riceveranno il pagamento dal nome utente mostrato nell'account Haveno dell'acquirente XMR.\n\nGli utenti Verse possono inviare o ricevere al massimo €10.000 all'anno (o l'equivalente in valuta estera) come totale dei pagamenti effettuati o ricevuti sul proprio account. Verse può aumentare questo limite su richiesta.
payment.achTransfer.info.account=Quando aggiungi ACH come metodo di pagamento in Haveno, assicurati di sapere quanto costa inviare e ricevere un bonifico ACH.
payment.achTransfer.info.buyer=Assicurati di sapere quanto ti costa inviare un bonifico ACH.\n\nQuando paghi, invia solo ai dati di pagamento indicati nell'account del venditore XMR tramite bonifico ACH.
payment.achTransfer.info.seller=Assicurati di sapere quanto ti costa ricevere un bonifico ACH.\n\nQuando ricevi il pagamento, controlla che arrivi dall'account dell'acquirente XMR come bonifico ACH.
payment.domesticWire.info.account=Quando aggiungi il bonifico nazionale come metodo di pagamento in Haveno, assicurati di sapere quanto costa inviare e ricevere un bonifico.
payment.domesticWire.info.buyer=Assicurati di sapere quanto ti costa inviare un bonifico.\n\nQuando paghi, invia solo ai dati di pagamento indicati nell'account del venditore XMR.
payment.domesticWire.info.seller=Assicurati di sapere quanto ti costa ricevere un bonifico.\n\nQuando ricevi il pagamento, controlla che arrivi dall'account dell'acquirente XMR.
payment.strike.info.account=Assicurati di includere il tuo nome utente Strike.\n\nIn Haveno, Strike è usato solo per pagamenti da fiat a fiat.\n\nAssicurati di conoscere i limiti di Strike:\n\nGli utenti registrati solo con email, nome e numero di telefono hanno questi limiti:\n\n● $100 massimo per deposito\n● $1.000 massimo di depositi totali a settimana\n● $100 massimo per pagamento\n\nGli utenti possono aumentare i limiti fornendo a Strike più informazioni. Questi utenti hanno i seguenti limiti:\n\n● $1.000 massimo per deposito\n● $1.000 massimo di depositi totali a settimana\n● $1.000 massimo per pagamento\n\nSe scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.strike.info.buyer=Invia il pagamento solo al nome utente Strike del venditore XMR indicato in Haveno.\n\nLa dimensione massima dello scambio è $1.000 per pagamento.\n\nSe scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.strike.info.seller=Assicurati che il pagamento arrivi dal nome utente Strike dell'acquirente XMR indicato in Haveno.\n\nLa dimensione massima dello scambio è $1.000 per pagamento.\n\nSe scambi oltre i limiti indicati, lo scambio potrebbe essere annullato e potrebbe esserci una penale.
payment.transferwiseUsd.info.account=A causa della normativa bancaria statunitense, inviare e ricevere pagamenti in USD ha più restrizioni rispetto alla maggior parte delle altre valute. Per questo motivo l'USD non è stato aggiunto al metodo di pagamento Wise di Haveno.\n\nIl metodo di pagamento Wise-USD permette agli utenti Haveno di scambiare in USD.\n\nChiunque abbia un account Wise può aggiungere Wise-USD come metodo di pagamento in Haveno. Questo gli permetterà di comprare e vendere XMR con USD.\n\nQuando scambiano su Haveno, gli acquirenti XMR non dovrebbero usare alcuna causale. Se la causale è obbligatoria, dovrebbero usare solo il nome completo del titolare dell'account Wise-USD.
payment.transferwiseUsd.info.buyer=Invia il pagamento solo all'indirizzo email indicato nell'account Wise-USD Haveno del venditore XMR.
payment.transferwiseUsd.info.seller=Controlla che il pagamento ricevuto corrisponda al nome dell'account Wise-USD dell'acquirente XMR in Haveno.
payment.usPostalMoneyOrder.info=Per scambiare con Vaglia Postali USA (USPMO) su Haveno devi comprendere quanto segue:\n\n- Gli acquirenti XMR devono scrivere il nome del venditore XMR sia nel campo del pagatore che in quello del beneficiario e scattare una foto ad alta risoluzione dell'USPMO e della busta con la prova di tracciamento prima dell'invio.\n- Gli acquirenti XMR devono inviare l'USPMO al venditore XMR con conferma di consegna.\n\nSe fosse necessaria una mediazione, o in caso di disputa sullo scambio, dovrai inviare le foto al mediatore o all'agente di rimborso di Haveno, insieme al numero di serie dell'USPMO, al numero dell'ufficio postale e all'importo in dollari, così che possano verificare i dettagli sul sito delle poste statunitensi.\n\nSe non fornisci le informazioni richieste all'arbitro, perderai la disputa.\n\nIn tutti i casi di disputa, chi invia l'USPMO ha il 100% dell'onere di fornire prove all'arbitro.\n\nSe non comprendi questi requisiti, non scambiare con USPMO su Haveno.
payment.payByMail.info=Per scambiare con Pay by Mail su Haveno devi comprendere quanto segue:\n\n● L'acquirente XMR dovrebbe confezionare il contante in una busta di sicurezza antimanomissione.\n● L'acquirente XMR dovrebbe filmare o fotografare ad alta risoluzione il confezionamento del contante, con indirizzo e numero di tracciamento già applicati sul pacco.\n● L'acquirente XMR dovrebbe spedire il pacco con il contante al venditore XMR con conferma di consegna e un'assicurazione adeguata.\n● Il venditore XMR dovrebbe filmare l'apertura del pacco, assicurandosi che il numero di tracciamento fornito dal mittente sia visibile nel video.\n● Il maker dell'offerta deve indicare eventuali termini o condizioni particolari nel campo 'Informazioni aggiuntive' dell'account di pagamento.\n● Il taker dell'offerta accetta i termini e le condizioni del maker accettando l'offerta.\n\nGli scambi Pay by Mail mettono l'onere di agire onestamente su entrambi i peer.\n\n● Gli scambi Pay by Mail hanno meno azioni verificabili rispetto ad altri scambi tradizionali. Questo rende molto più difficile gestire le dispute.\n● Prova a risolvere le dispute direttamente con il tuo peer usando la chat dello scambio. È la strada più promettente per risolvere qualsiasi disputa Pay by Mail.\n● Gli arbitri possono esaminare il tuo caso e dare un suggerimento, ma NON è garantito che possano aiutare.\n● Gli arbitri decideranno in base alle prove fornite. Segui e documenta quindi le procedure sopra descritte per avere prove in caso di disputa.\n● Le richieste a Haveno di rimborso per fondi persi in scambi Pay by Mail NON verranno prese in considerazione.\n\nSe non comprendi questi requisiti, non scambiare con Pay by Mail su Haveno.

payment.payByMail.contact=Informazioni di contatto
payment.payByMail.contact.prompt=Nome o pseudonimo a cui indirizzare la busta
payment.payByMail.extraInfo.prompt=Indica nelle tue offerte: \n\nIl paese in cui ti trovi (es. Francia); \nI paesi / le regioni da cui accetti scambi (es. Francia, UE o qualsiasi paese europeo); \nEventuali termini/condizioni particolari; \nQualsiasi altro dettaglio.
payment.tradingRestrictions=Leggi i termini e le condizioni del maker.\nSe non soddisfi i requisiti, non accettare questo scambio.
payment.cashAtAtm.info=Contanti senza carta: prelievo al bancomat tramite codice, senza carta\n\nPer usare questo metodo di pagamento:\n\n1. Crea un account di pagamento Contanti senza carta, indicando le banche, le regioni o altre condizioni accettate da mostrare con l'offerta.\n\n2. Crea o accetta un'offerta con l'account di pagamento.\n\n3. Quando l'offerta viene accettata, usa la chat con il tuo peer per concordare quando completare il pagamento e condividere i dettagli di pagamento.\n\nSe l'importo dello scambio supera il limite di prelievo in contanti, i trader dovrebbero dividerlo in più transazioni.\n\nGli scambi in contanti al bancomat devono essere multipli di 10. Si consiglia di usare offerte con un intervallo di importi, così che l'importo in XMR possa adattarsi al prezzo esatto.\n\nSe non riesci a completare la transazione come indicato nel contratto dello scambio, potresti perdere una parte (o tutto) del tuo deposito di sicurezza.
payment.cashAtAtm.extraInfo.prompt=Indica nelle tue offerte: \n\nLe banche / località accettate; \nEventuali termini/condizioni particolari; \nQualsiasi altro dettaglio.
