account.menu.walletInfo.path.info=Se importi le parole del seme in un altro portafoglio (come Electrum), dovrai definire il percorso. Fallo solo in caso di emergenza, se perdi l'accesso al portafoglio Haveno e alla directory dei dati.\nTieni presente che spendere fondi da un portafoglio non Haveno può corrompere le strutture dati interne di Haveno associate ai dati del portafoglio, causando scambi falliti.\n\nNon inviare MAI BSQ da un portafoglio non Haveno: probabilmente produrrebbe una transazione BSQ non valida e la perdita dei tuoi BSQ.

