portfolio.pending.mediationResult.popup.info=The mediator has suggested the following payout:\nYou receive: {0}\nYour trading peer receives: {1}\n\nYou can accept or reject this suggested payout.\n\nBy accepting, you sign the proposed payout transaction. If your trading peer also accepts and signs, the payout will be completed, and the trade will be closed.\n\nIf one or both of you reject the suggestion, you will have to wait until {2} (block {3}) to open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nThe arbitrator may charge a small fee (fee maximum: the trader's security deposit) as compensation for their work. Both traders agreeing to the mediator's suggestion is the happy path—requesting arbitration is meant for exceptional circumstances, such as if a trader is sure the mediator did not make a fair payout suggestion (or if the other peer is unresponsive).\n\nMore details about the new arbitration model: [HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.selfAccepted.lockTimeOver=You have accepted the mediator's suggested payout but it seems that your trading peer has not accepted it.\n\nOnce the lock time is over on {0} (block {1}), you can open a second-round dispute with an arbitrator who will investigate the case again and do a payout based on their findings.\n\nYou can find more details about the arbitration model at:[HYPERLINK:https://docs.haveno.exchange/trading-rules.html#arbitration]
portfolio.pending.mediationResult.popup.openArbitration=Rifiuta e richiedi l'arbitrato
portfolio.pending.mediationResult.popup.alreadyAccepted=Hai già accettato

portfolio.pending.failedTrade.missingDepositTx=Manca una transazione di deposito.\n\nQuesta transazione è necessaria per completare lo scambio. Assicurati che il tuo portafoglio sia completamente sincronizzato con la blockchain di Monero.\n\nPuoi spostare questo scambio nella sezione "Scambi Falliti" per disattivarlo.
portfolio.pending.failedTrade.errorMsgSet=Si è verificato un errore durante l'esecuzione del protocollo di scambio.\n\nErrore: {0}\n\nPotrebbe non essere un errore critico e lo scambio potrebbe completarsi normalmente. Se non sei sicuro, apri un ticket di mediazione per ricevere consigli dai mediatori Haveno. \n\nSe l'errore era critico e lo scambio non può essere completato, potresti aver perso la commissione di scambio. Richiedi un rimborso delle commissioni di scambio perse qui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.missingContract=Il contratto dello scambio non è impostato.\n\nLo scambio non può essere completato e potresti aver perso la commissione di scambio. In tal caso, puoi richiedere un rimborso delle commissioni di scambio perse qui: [HYPERLINK:https://github.com/haveno-dex/haveno/issues]
portfolio.pending.failedTrade.info.popup=Il protocollo di scambio ha riscontrato alcuni problemi.\n\n{0}
portfolio.pending.failedTrade.txChainInvalid.moveToFailed=Il protocollo di scambio ha riscontrato un problema grave.\n\n{0}\n\nVuoi spostare lo scambio tra gli scambi falliti?\n\nDalla vista degli scambi falliti non puoi aprire mediazione o arbitrato, ma puoi riportare uno scambio fallito tra gli scambi aperti in qualsiasi momento.
portfolio.pending.failedTrade.txChainValid.moveToFailed=Il protocollo di scambio ha riscontrato alcuni problemi.\n\n{0}\n\nLe transazioni dello scambio sono state pubblicate e i fondi sono bloccati. Sposta lo scambio tra gli scambi falliti solo se sei davvero sicuro. Potrebbe precludere alcune opzioni per risolvere il problema.\n\nVuoi spostare lo scambio tra gli scambi falliti?\n\nDalla vista degli scambi falliti non puoi aprire mediazione o arbitrato, ma puoi riportare uno scambio fallito tra gli scambi aperti in qualsiasi momento.
portfolio.pending.failedTrade.moveTradeToFailedIcon.tooltip=Sposta lo scambio tra gli scambi falliti
portfolio.pending.failedTrade.warningIcon.tooltip=Clicca per aprire i dettagli sui problemi di questo scambio
