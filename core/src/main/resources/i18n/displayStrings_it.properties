# suppress inspection "UnusedProperty"
account.crypto.popup.xmr.msg=Per scambiare XMR su Haveno devi comprendere il seguente requisito.\n\nSe vendi XMR, in caso di disputa devi essere in grado di fornire a un mediatore o a un arbitro le seguenti informazioni:\n- la chiave della transazione (Tx Key, Tx Secret Key o Tx Private Key)\n- l'ID della transazione (Tx ID o Tx Hash)\n- l'indirizzo di destinazione (indirizzo del destinatario)\n\nConsulta il wiki per sapere dove trovare queste informazioni nei portafogli Monero più diffusi [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\nSe non fornisci i dati della transazione richiesti, perderai le dispute.\n\nNota inoltre che Haveno offre ora la conferma automatica delle transazioni XMR per rendere gli scambi più rapidi, ma devi attivarla nelle Impostazioni.\n\nConsulta il wiki per maggiori informazioni sulla conferma automatica: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


