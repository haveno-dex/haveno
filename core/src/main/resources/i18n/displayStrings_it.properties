payment.shared.extraInfo.prompt.paymentAccount=Definisci eventuali termini, condizioni o dettagli speciali che desideri vengano visualizzati con le tue offerte per questo account di pagamento (gli utenti vedranno queste informazioni prima di accettare le offerte).
payment.shared.extraInfo.prompt.offer=Definisci eventuali termini, condizioni o dettagli speciali che desideri mostrare con la tua offerta.
payment.shared.extraInfo.noDeposit=Dettagli di contatto e termini dell'offerta
payment.f2f.info=Gli scambi 'Faccia a faccia' hanno regole diverse e comportano rischi diversi rispetto alle transazioni online.\n\nLe differenze principali sono:\n● I peer di scambio devono scambiarsi informazioni su luogo e ora dell'incontro usando i contatti forniti.\n● I peer di scambio devono portare i propri laptop e confermare 'pagamento inviato' e 'pagamento ricevuto' sul luogo dell'incontro.\n● Se un maker ha 'termini e condizioni' particolari, deve indicarli nel campo 'Informazioni aggiuntive' dell'account.\n● Accettando un'offerta, il taker accetta i 'termini e condizioni' indicati dal maker.\n● In caso di disputa l'arbitro non può essere di grande aiuto, perché di solito è difficile ottenere prove inalterabili di quanto accaduto all'incontro. In questi casi i fondi XMR potrebbero restare bloccati a tempo indeterminato o finché i peer di scambio non trovano un accordo.\n\nPer essere sicuro di comprendere appieno le differenze degli scambi 'Faccia a faccia', leggi le istruzioni e i consigli su: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
