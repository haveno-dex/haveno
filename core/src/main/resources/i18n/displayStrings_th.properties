payment.zelle.info=Zelle เป็นบริการโอนเงินที่ทำงานได้ดีที่สุด *ผ่าน* ธนาคารอื่น\n\n1. ตรวจสอบหน้านี้เพื่อดูว่าธนาคารของคุณรองรับ Zelle หรือไม่ (และอย่างไร): [HYPERLINK:https://www.zellepay.com/get-started]\n\n2. ให้ความสนใจเป็นพิเศษกับขีดจำกัดการโอนของคุณ ขีดจำกัดการส่งแตกต่างกันไปตามธนาคาร และธนาคารมักกำหนดขีดจำกัดรายวัน รายสัปดาห์ และรายเดือนแยกกัน\n\n3. หากธนาคารของคุณไม่รองรับ Zelle คุณยังสามารถใช้ผ่านแอป Zelle บนมือถือได้ แต่ขีดจำกัดการโอนจะต่ำกว่ามาก\n\n4. ชื่อที่ระบุในบัญชี Haveno ของคุณต้องตรงกับชื่อในบัญชี Zelle/ธนาคารของคุณ \n\nหากคุณไม่สามารถทำธุรกรรม Zelle ให้เสร็จสิ้นตามที่ระบุในสัญญาการซื้อขาย คุณอาจสูญเสียเงินประกันบางส่วน (หรือทั้งหมด)\n\nเนื่องจาก Zelle มีความเสี่ยงต่อการเรียกเงินคืนค่อนข้างสูง ผู้ขายจึงควรติดต่อผู้ซื้อที่ยังไม่ได้ลงนามทางอีเมลหรือ SMS เพื่อตรวจสอบว่าผู้ซื้อเป็นเจ้าของบัญชี Zelle ที่ระบุใน Haveno จริง
payment.fasterPayments.newRequirements.info=ธนาคารบางแห่งเริ่มตรวจสอบชื่อเต็มของผู้รับสำหรับการโอนผ่าน Faster Payments แล้ว บัญชี Faster Payments ปัจจุบันของคุณไม่ได้ระบุชื่อเต็ม\n\nโปรดพิจารณาสร้างบัญชี Faster Payments ใหม่ใน Haveno เพื่อให้ผู้ซื้อ {0} ในอนาคตเห็นชื่อเต็มของคุณ\n\nเมื่อสร้างบัญชีใหม่ โปรดคัดลอกค่า sort code, หมายเลขบัญชี และ salt สำหรับตรวจสอบอายุบัญชีจากบัญชีเก่ามายังบัญชีใหม่ให้ถูกต้องทุกประการ เพื่อรักษาอายุบัญชีและสถานะการลงนามเดิมของคุณไว้
payment.fasterPayments.ukSortCode=UK sort code
payment.moneyGram.info=เมื่อใช้ MoneyGram ผู้ซื้อ XMR ต้องส่งหมายเลขอนุมัติ (Authorisation number) และรูปถ่ายใบเสร็จทางอีเมลให้ผู้ขาย XMR ใบเสร็จต้องแสดงชื่อเต็ม ประเทศ และรัฐของผู้ขาย รวมถึงจำนวนเงินอย่างชัดเจน อีเมลของผู้ขายจะแสดงให้ผู้ซื้อเห็นระหว่างกระบวนการซื้อขาย
payment.westernUnion.info=เมื่อใช้ Western Union ผู้ซื้อ XMR ต้องส่ง MTCN (หมายเลขติดตาม) และรูปถ่ายใบเสร็จทางอีเมลให้ผู้ขาย XMR ใบเสร็จต้องแสดงชื่อเต็ม เมือง และประเทศของผู้ขาย รวมถึงจำนวนเงินอย่างชัดเจน อีเมลของผู้ขายจะแสดงให้ผู้ซื้อเห็นระหว่างกระบวนการซื้อขาย
payment.halCash.info=เมื่อมีการใช้งาน HalCash ผู้ซื้อ XMR จำเป็นต้องส่งรหัส Halcash ให้กับผู้ขายทางข้อความโทรศัพท์มือถือ\n\nโปรดตรวจสอบว่าไม่เกินจำนวนเงินสูงสุดที่ธนาคารของคุณอนุญาตให้คุณส่งด้วย HalCash จำนวนเงินขั้นต่ำในการเบิกถอนคือ 10 EUR และสูงสุดในจำนวนเงิน 600 EUR สำหรับการถอนซ้ำเป็น 3000 EUR ต่อผู้รับและต่อวัน และ 6000 EUR ต่อผู้รับและต่อเดือน โปรดตรวจสอบข้อจำกัดจากทางธนาคารคุณเพื่อให้มั่นใจได้ว่าทางธนาคารได้มีการใช้มาตรฐานข้อกำหนดเดียวกันกับดังที่ระบุไว้ ณ ที่นี่\n\nจำนวนเงินที่ถอนจะต้องเป็นจำนวนเงินหลาย 10 EUR เนื่องจากคุณไม่สามารถถอนเงินอื่น ๆ ออกจากตู้เอทีเอ็มได้ UI ในหน้าจอสร้างข้อเสนอและรับข้อเสนอจะปรับจำนวนเงิน XMR เพื่อให้จำนวนเงิน EUR ถูกต้อง คุณไม่สามารถใช้ราคาตลาดเป็นจำนวนเงิน EUR ซึ่งจะเปลี่ยนแปลงไปตามราคาที่มีการปรับเปลี่ยน\n\nในกรณีที่มีข้อพิพาทผู้ซื้อ XMR ต้องแสดงหลักฐานว่าได้ส่ง EUR แล้ว
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=โปรดทราบว่าการโอนเงินผ่านธนาคารทุกรูปแบบมีความเสี่ยงต่อการเรียกเงินคืนอยู่บ้าง เพื่อลดความเสี่ยงนี้ Haveno จึงกำหนดขีดจำกัดต่อการซื้อขายตามระดับความเสี่ยงโดยประมาณของวิธีการชำระเงินที่ใช้\n\nสำหรับวิธีการชำระเงินนี้ ขีดจำกัดต่อการซื้อขายของคุณสำหรับการซื้อและขายคือ {2}\n\nขีดจำกัดนี้ใช้กับขนาดของการซื้อขายแต่ละครั้งเท่านั้น คุณสามารถทำการซื้อขายได้มากเท่าที่ต้องการ\n\nดูรายละเอียดเพิ่มเติมที่ wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits]
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=เพื่อจำกัดความเสี่ยงจากการเรียกเงินคืน Haveno กำหนดขีดจำกัดต่อการซื้อขายสำหรับบัญชีการชำระเงินประเภทนี้ตาม 2 ปัจจัยต่อไปนี้:\n\n1. ความเสี่ยงทั่วไปต่อการเรียกเงินคืนของวิธีการชำระเงิน\n2. สถานะการลงนามบัญชี\n\nบัญชีการชำระเงินนี้ยังไม่ได้ลงนาม จึงจำกัดการซื้อไว้ที่ {0} ต่อการซื้อขาย หลังจากลงนามแล้ว ขีดจำกัดการซื้อจะเพิ่มขึ้นดังนี้:\n\n● ก่อนลงนาม และ 30 วันหลังลงนาม ขีดจำกัดการซื้อต่อการซื้อขายของคุณคือ {0}\n● 30 วันหลังลงนาม ขีดจำกัดการซื้อต่อการซื้อขายของคุณคือ {1}\n● 60 วันหลังลงนาม ขีดจำกัดการซื้อต่อการซื้อขายของคุณคือ {2}\n\nขีดจำกัดการขายไม่ได้รับผลกระทบจากการลงนามบัญชี คุณสามารถขาย {2} ในการซื้อขายครั้งเดียวได้ทันที\n\nขีดจำกัดเหล่านี้ใช้กับขนาดของการซื้อขายแต่ละครั้งเท่านั้น คุณสามารถทำการซื้อขายได้มากเท่าที่ต้องการ \n\nดูรายละเอียดเพิ่มเติมที่ wiki [HYPERLINK:https://docs.haveno.exchange/overview/account-limits]

payment.cashDeposit.info=โปรดยืนยันว่าธนาคารของคุณได้อนุมัติให้คุณสามารถส่งเงินสดให้กับบัญชีบุคคลอื่นได้ ตัวอย่างเช่น บางธนาคารที่ไม่ได้มีการบริการถ่ายโอนเงินสดอย่าง Bank of America และ Wells Fargo

