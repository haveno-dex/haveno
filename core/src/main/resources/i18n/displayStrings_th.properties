payment.paytm.info.account=โปรดระบุอีเมลหรือหมายเลขโทรศัพท์ที่ตรงกับอีเมลหรือหมายเลขโทรศัพท์ในบัญชี PayTM ของคุณ \n\nเมื่อผู้ใช้ตั้งค่าบัญชี PayTM โดยไม่ทำ KYC จะถูกจำกัดดังนี้: \n\n● ส่งได้สูงสุด Rs. 5,000 ต่อธุรกรรม\n● เก็บใน wallet ของ PayTM ได้สูงสุด Rs. 10,000\n\nหากคุณตั้งใจจะซื้อขายเกิน 5,000 ต่อการซื้อขาย คุณจะต้องทำ KYC กับ PayTM ผู้ใช้ที่ทำ KYC แล้วจะถูกจำกัดดังนี้:\n\n● ส่งได้สูงสุด Rs. 100,000 ต่อธุรกรรม\n● เก็บใน wallet ของ PayTM ได้สูงสุด Rs. 100,000\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย การซื้อขายที่เกินขีดจำกัดบัญชี PayTM อาจต้องใช้เวลามากกว่าหนึ่งวัน หรือถูกยกเลิก
payment.paytm.info.buyer=โปรดส่งการชำระเงินไปยังที่อยู่อีเมลหรือหมายเลขโทรศัพท์ที่ระบุเท่านั้น\n\nหากคุณตั้งใจจะซื้อขายเกิน Rs. 5,000 ต่อการซื้อขาย คุณจะต้องทำ KYC กับ PayTM\n\nหากไม่ทำ KYC จะส่งได้ Rs. 5,000 ต่อธุรกรรม\n\nผู้ใช้ที่ทำ KYC แล้วจะส่งได้ Rs. 100,000 ต่อธุรกรรม
payment.paytm.info.seller=หากคุณตั้งใจจะซื้อขายเกิน Rs. 5,000 ต่อการซื้อขาย คุณจะต้องทำ KYC กับ PayTM ผู้ใช้ที่ทำ KYC แล้วจะถูกจำกัดดังนี้:\n\n● ส่งได้สูงสุด Rs. 100,000 ต่อธุรกรรม\n● เก็บใน wallet ของ PayTM ได้สูงสุด Rs. 100,000\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย เนื่องจากเก็บใน wallet ของ PayTM ได้สูงสุด Rs. 100,000 โปรดโอนรูปีของคุณออกเป็นประจำ
payment.rtgs.info.account=RTGS ใช้สำหรับการชำระเงินของการซื้อขายขนาดใหญ่ตั้งแต่ Rs. 200,000 ขึ้นไป\n\nเมื่อตั้งค่าบัญชีการชำระเงิน RTGS โปรดระบุข้อมูลต่อไปนี้ของคุณ:\n\n● ชื่อเต็มของเจ้าของบัญชี\n● หมายเลขบัญชี\n● หมายเลข IFSC\n\nข้อมูลเหล่านี้ต้องตรงกับบัญชีธนาคารที่คุณจะใช้ส่ง / รับการชำระเงิน\n\nโปรดทราบว่ามีจำนวนซื้อขายขั้นต่ำ Rs. 200,000 ต่อธุรกรรม หากคุณซื้อขายต่ำกว่าจำนวนนี้ การซื้อขายอาจถูกยกเลิก หรือผู้ซื้อขายทั้งสองฝ่ายต้องตกลงใช้วิธีการชำระเงินอื่น (เช่น IMPS หรือ UPI)
payment.rtgs.info.buyer=โปรดส่งการชำระเงินไปยังรายละเอียดบัญชีที่ระบุใน Haveno เท่านั้น\n\nโปรดทราบว่ามีจำนวนซื้อขายขั้นต่ำ Rs. 200,000 ต่อธุรกรรม หากคุณซื้อขายต่ำกว่าจำนวนนี้ การซื้อขายอาจถูกยกเลิก หรือผู้ซื้อขายทั้งสองฝ่ายต้องตกลงใช้วิธีการชำระเงินอื่น (เช่น IMPS หรือ UPI)
payment.rtgs.info.seller=โปรดทราบว่ามีจำนวนซื้อขายขั้นต่ำ Rs. 200,000 ต่อธุรกรรม หากคุณซื้อขายต่ำกว่าจำนวนนี้ การซื้อขายอาจถูกยกเลิก หรือผู้ซื้อขายทั้งสองฝ่ายต้องตกลงใช้วิธีการชำระเงินอื่น (เช่น IMPS หรือ UPI)
payment.upi.info.account=โปรดระบุ Virtual Payment Address (VPA) หรือที่เรียกว่า UPI ID ของคุณ รูปแบบจะคล้ายกับอีเมล: มีเครื่องหมาย “@” อยู่ตรงกลาง ตัวอย่างเช่น UPI ID ของคุณอาจเป็น “receiver's_name@bank_name” หรือ “phone_number@bank_name” \n\nสำหรับ UPI มีขีดจำกัดการส่งสูงสุด Rs. 100,000 ต่อธุรกรรม \n\nหากคุณตั้งใจจะซื้อขายเกิน Rs. 100,000 ต่อการซื้อขาย มีแนวโน้มว่าจะต้องโอนหลายครั้ง \n\nโปรดทราบว่าธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
payment.upi.info.buyer=โปรดส่งการชำระเงินไปยัง VPA / UPI ID ที่ระบุใน Haveno เท่านั้น \n\nขนาดการซื้อขายสูงสุดคือ Rs. 100,000 ต่อธุรกรรม \n\nหากการซื้อขายของคุณเกิน Rs. 100,000 คุณจะต้องโอนหลายครั้ง \n\nโปรดทราบว่าธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
payment.upi.info.seller=หากคุณตั้งใจจะรับเงินเกิน Rs. 100,000 ต่อการซื้อขาย ผู้ซื้อจะต้องโอนหลายครั้ง \n\nโปรดทราบว่าธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
payment.celpay.info.account=โปรดระบุอีเมลที่ลงทะเบียนกับบัญชี Celsius ของคุณ เพื่อให้เมื่อคุณส่งเงิน เงินจะแสดงว่ามาจากบัญชีที่ถูกต้อง และเมื่อคุณรับเงิน เงินจะเข้าบัญชีของคุณ\n\nผู้ใช้ CelPay ถูกจำกัดการส่งที่ $2,500 (หรือเทียบเท่าในสกุลเงิน/คริปโตอื่น) ภายใน 24 ชั่วโมง\n\nการซื้อขายที่เกินขีดจำกัดบัญชี CelPay อาจต้องใช้เวลามากกว่าหนึ่งวัน หรือถูกยกเลิก\n\nCelPay รองรับ stablecoin หลายสกุล:\n\n● USD Stablecoins; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● CAD Stablecoins; TrueCAD\n● GBP Stablecoins; TrueGBP\n● HKD Stablecoins; TrueHKD\n● AUD Stablecoins; TrueAUD\n\nผู้ซื้อ XMR สามารถส่ง stablecoin สกุลใดก็ได้ที่ตรงกับสกุลเงินให้ผู้ขาย XMR
payment.celpay.info.buyer=โปรดส่งการชำระเงินไปยังที่อยู่อีเมลที่ผู้ขาย XMR ระบุเท่านั้น โดยส่งเป็นลิงก์ชำระเงิน\n\nCelPay ถูกจำกัดการส่งที่ $2,500 (หรือเทียบเท่าในสกุลเงิน/คริปโตอื่น) ภายใน 24 ชั่วโมง\n\nการซื้อขายที่เกินขีดจำกัดบัญชี CelPay อาจต้องใช้เวลามากกว่าหนึ่งวัน หรือถูกยกเลิก\n\nCelPay รองรับ stablecoin หลายสกุล:\n\n● USD Stablecoins; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● CAD Stablecoins; TrueCAD\n● GBP Stablecoins; TrueGBP\n● HKD Stablecoins; TrueHKD\n● AUD Stablecoins; TrueAUD\n\nผู้ซื้อ XMR สามารถส่ง stablecoin สกุลใดก็ได้ที่ตรงกับสกุลเงินให้ผู้ขาย XMR
payment.celpay.info.seller=ผู้ขาย XMR จะได้รับการชำระเงินผ่านลิงก์ชำระเงินที่ปลอดภัย โปรดตรวจสอบว่าลิงก์ชำระเงินทางอีเมลมีที่อยู่อีเมลที่ผู้ซื้อ XMR ระบุไว้\n\nผู้ใช้ CelPay ถูกจำกัดการส่งที่ $2,500 (หรือเทียบเท่าในสกุลเงิน/คริปโตอื่น) ภายใน 24 ชั่วโมง\n\nการซื้อขายที่เกินขีดจำกัดบัญชี CelPay อาจต้องใช้เวลามากกว่าหนึ่งวัน หรือถูกยกเลิก\n\nCelPay รองรับ stablecoin หลายสกุล:\n\n● USD Stablecoins; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n● CAD Stablecoins; TrueCAD\n● GBP Stablecoins; TrueGBP\n● HKD Stablecoins; TrueHKD\n● AUD Stablecoins; TrueAUD\n\nผู้ขาย XMR จะได้รับ stablecoin สกุลใดก็ได้ที่ตรงกับสกุลเงินจากผู้ซื้อ XMR ผู้ซื้อ XMR สามารถส่ง stablecoin สกุลใดก็ได้ที่ตรงกับสกุลเงิน
payment.celpay.supportedCurrenciesForReceiver=สกุลเงินที่รองรับ (โปรดทราบ: สกุลเงินทั้งหมดด้านล่างเป็น stablecoin ที่รองรับในแอป Celsius การซื้อขายเป็น stablecoin ไม่ใช่เงินตรา)
payment.nequi.info.account=โปรดระบุหมายเลขโทรศัพท์ที่เชื่อมกับบัญชี Nequi ของคุณ\n\nเมื่อผู้ใช้ตั้งค่าบัญชี Nequi ขีดจำกัดการชำระเงินจะถูกกำหนดไว้ที่สูงสุดประมาณ 7,000,000 COP ต่อเดือน\n\nหากคุณตั้งใจจะซื้อขายเกิน 7,000,000 COP ต่อการซื้อขาย คุณจะต้องทำ KYC กับ Bancolombia และชำระค่าธรรมเนียมประมาณ 15,000 COP หลังจากนั้นทุกธุรกรรมจะถูกเก็บภาษี 0.4% โปรดตรวจสอบภาษีล่าสุดด้วยตนเอง\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
