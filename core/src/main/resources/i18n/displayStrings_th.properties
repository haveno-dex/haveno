account.crypto.popup.xmr.msg=การซื้อขาย XMR บน Haveno กำหนดให้คุณต้องเข้าใจข้อกำหนดต่อไปนี้\n\nหากขาย XMR คุณต้องสามารถให้ข้อมูลต่อไปนี้แก่ผู้ไกล่เกลี่ยได้ในกรณีที่มีข้อพิพาท:\n- คีย์ธุรกรรม (Tx Key, Tx Secret Key หรือ Tx Private Key)\n- ID ธุรกรรม (Tx ID หรือ Tx Hash)\n- ที่อยู่ปลายทาง (ที่อยู่ของผู้รับ)\n\nดูรายละเอียดวิธีค้นหาข้อมูลนี้ใน wallet ของ Monero ยอดนิยมได้ที่ wiki [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments]\nหากไม่สามารถให้ข้อมูลธุรกรรมที่จำเป็นได้ คุณจะแพ้ข้อพิพาท\n\nโปรดทราบด้วยว่าขณะนี้ Haveno มีการยืนยันธุรกรรม XMR อัตโนมัติเพื่อให้การซื้อขายเร็วขึ้น แต่คุณต้องเปิดใช้งานในการตั้งค่า\n\nดูข้อมูลเพิ่มเติมเกี่ยวกับการยืนยันอัตโนมัติได้ที่ wiki: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades]


