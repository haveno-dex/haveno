payment.bizum.info.account=ในการใช้ Bizum คุณต้องมีบัญชีธนาคาร (IBAN) ในสเปนและลงทะเบียนใช้บริการแล้ว\n\nBizum ใช้สำหรับการซื้อขายระหว่าง €0.50 ถึง €1,000\n\nจำนวนธุรกรรมสูงสุดที่คุณส่ง/รับผ่าน Bizum ได้คือ €2,000 ต่อวัน\n\nผู้ใช้ Bizum ทำรายการได้สูงสุด 150 รายการต่อเดือน\n\nอย่างไรก็ตาม ธนาคารแต่ละแห่งอาจกำหนดขีดจำกัดของตนเองสำหรับลูกค้าภายในขีดจำกัดข้างต้น\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.bizum.info.buyer=โปรดส่งการชำระเงินไปยังหมายเลขโทรศัพท์มือถือของผู้ขาย XMR ตามที่ระบุใน Haveno เท่านั้น\n\nขนาดการซื้อขายสูงสุดคือ €1,000 ต่อการชำระเงิน จำนวนธุรกรรมสูงสุดที่คุณส่งผ่าน Bizum ได้คือ €2,000 ต่อวัน\n\nหากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.bizum.info.seller=โปรดตรวจสอบว่าการชำระเงินของคุณมาจากหมายเลขโทรศัพท์มือถือของผู้ซื้อ XMR ตามที่ระบุใน Haveno\n\nขนาดการซื้อขายสูงสุดคือ €1,000 ต่อการชำระเงิน จำนวนธุรกรรมสูงสุดที่คุณรับผ่าน Bizum ได้คือ €2,000 ต่อวัน\n\nหากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ

payment.blik.info.account=หากต้องการใช้ BLIK คุณต้องมีบัญชีธนาคารในโปแลนด์พร้อมแอปธนาคารบนมือถือที่รองรับ BLIK\n\nผู้ซื้อ XMR ชำระเงินโดยสร้างรหัส BLIK แล้วส่งให้ผู้ขาย XMR ผ่านแชทการซื้อขาย ดังนั้นผู้ซื้อขายทั้งสองฝ่ายต้องออนไลน์เพื่อให้การชำระเงินเสร็จสมบูรณ์
payment.blik.info.buyer=ในการชำระเงิน ให้สร้างรหัส BLIK ในแอปธนาคารบนมือถือของคุณ แล้วส่งให้ผู้ขาย XMR ผ่านแชทการซื้อขาย\n\nรหัส BLIK ใช้ได้เพียง 2 นาที ดังนั้นโปรดตรวจสอบว่าผู้ขายตอบกลับในแชทการซื้อขายก่อนสร้างรหัส
payment.blik.info.seller=ผู้ซื้อ XMR จะส่งรหัส BLIK ให้คุณผ่านแชทการซื้อขาย\n\nรหัส BLIK ใช้ได้เพียง 2 นาที ดังนั้นโปรดใช้รหัสเพื่อรับเงินทันทีหลังจากได้รับ

payment.vippsMobilePay.info.account=หากต้องการใช้ Vipps MobilePay คุณต้องมีบัญชีที่ลงทะเบียนด้วยหมายเลขมือถือในนอร์เวย์ เดนมาร์ก หรือฟินแลนด์\n\nไม่สามารถส่งการชำระเงินข้ามประเทศได้ ดังนั้นผู้ซื้อขายทั้งสองฝ่ายต้องมีบัญชีในประเทศเดียวกัน สกุลเงินที่ใช้ซื้อขายจะกำหนดตามประเทศของบัญชีคุณ
