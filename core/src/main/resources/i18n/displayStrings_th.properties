payment.shared.extraInfo.prompt.paymentAccount=กำหนดคำศัพท์ เงื่อนไข หรือรายละเอียดพิเศษใดๆ ที่คุณต้องการให้แสดงพร้อมข้อเสนอของคุณสำหรับบัญชีการชำระเงินนี้ (ผู้ใช้จะเห็นข้อมูลนี้ก่อนที่จะยอมรับข้อเสนอ)
payment.shared.extraInfo.prompt.offer=กำหนดเงื่อนไขพิเศษ ข้อกำหนด หรือรายละเอียดใด ๆ ที่คุณต้องการแสดงพร้อมกับข้อเสนอของคุณ
payment.shared.extraInfo.noDeposit=รายละเอียดการติดต่อและเงื่อนไขข้อเสนอ
payment.f2f.info=การซื้อขายแบบ 'เห็นหน้ากัน' มีกฎและความเสี่ยงที่แตกต่างจากธุรกรรมออนไลน์\n\nความแตกต่างหลักคือ:\n● คู่ค้าต้องแลกเปลี่ยนข้อมูลสถานที่และเวลานัดพบผ่านช่องทางติดต่อที่ให้ไว้\n● คู่ค้าต้องนำแล็ปท็อปมาด้วย และทำการยืนยัน 'ชำระเงินแล้ว' และ 'ได้รับการชำระเงินแล้ว' ณ สถานที่นัดพบ\n● หากผู้สร้างมี 'เงื่อนไข' พิเศษ ต้องระบุไว้ในช่อง 'ข้อมูลเพิ่มเติม' ของบัญชี\n● เมื่อรับข้อเสนอ ผู้รับถือว่ายอมรับ 'เงื่อนไข' ที่ผู้สร้างระบุไว้\n● ในกรณีที่มีข้อพิพาท ผู้ไกล่เกลี่ยไม่สามารถช่วยเหลือได้มากนัก เนื่องจากมักหาหลักฐานที่ปลอมแปลงไม่ได้ของสิ่งที่เกิดขึ้น ณ ที่นัดพบได้ยาก ในกรณีเช่นนี้ เงิน XMR อาจถูกล็อกไว้อย่างไม่มีกำหนด หรือจนกว่าคู่ค้าจะตกลงกันได้\n\nเพื่อให้แน่ใจว่าคุณเข้าใจความแตกต่างของการซื้อขายแบบ 'เห็นหน้ากัน' อย่างถ่องแท้ โปรดอ่านคำแนะนำและข้อเสนอแนะที่: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
