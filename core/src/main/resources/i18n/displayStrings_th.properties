payment.pix.info.account=โปรดระบุ Pix Key ที่คุณเลือก คีย์มีสี่ประเภท: CPF (ทะเบียนบุคคลธรรมดา) หรือ CNPJ (ทะเบียนนิติบุคคลแห่งชาติ), ที่อยู่อีเมล, หมายเลขโทรศัพท์ หรือคีย์สุ่มที่ระบบสร้างขึ้นซึ่งเรียกว่า UUID แต่ละบัญชี Pix ที่คุณมีต้องใช้คีย์ที่ต่างกัน บุคคลธรรมดาสร้างคีย์ได้สูงสุดห้าคีย์ต่อบัญชีที่ตนเป็นเจ้าของ\n\nเมื่อซื้อขายบน Haveno ผู้ซื้อ XMR ควรใช้ Pix Key ของตนเป็นคำอธิบายการชำระเงิน เพื่อให้ผู้ขาย XMR ระบุได้ง่ายว่าการชำระเงินมาจากตน
payment.pix.info.buyer=โปรดส่งการชำระเงินไปยัง Pix Key ที่ระบุในบัญชี Haveno ของผู้ขาย XMR เท่านั้น\n\nโปรดใช้ Pix Key ของคุณเป็นข้อความอ้างอิงการชำระเงิน เพื่อให้ผู้ขาย XMR ระบุได้ง่ายว่าการชำระเงินมาจากคุณ
