payment.pix.key=Pix Key (CPF, CNPJ, อีเมล, หมายเลขโทรศัพท์ หรือ UUID)
payment.monese.info.account=Monese เป็นแอปธนาคารสำหรับผู้ใช้ GBP, EUR และ RON* Monese ให้ผู้ใช้ส่งเงินไปยังบัญชี Monese อื่นได้ทันทีและฟรีในทุกสกุลเงินที่รองรับ\n\n*ในการเปิดบัญชี RON ใน Monese คุณต้องอาศัยอยู่ในโรมาเนียหรือมีสัญชาติโรมาเนีย\n\nเมื่อตั้งค่าบัญชี Monese ใน Haveno โปรดระบุชื่อและหมายเลขโทรศัพท์ที่ตรงกับบัญชี Monese ของคุณ เพื่อให้เมื่อคุณส่งเงิน เงินจะแสดงว่ามาจากบัญชีที่ถูกต้อง และเมื่อคุณรับเงิน เงินจะเข้าบัญชีของคุณ
payment.monese.info.buyer=โปรดส่งการชำระเงินไปยังหมายเลขโทรศัพท์ที่ผู้ขาย XMR ระบุในบัญชี Haveno เท่านั้น โปรดเว้นคำอธิบายการชำระเงินว่างไว้
payment.monese.info.seller=ผู้ขาย XMR จะได้รับการชำระเงินจากหมายเลขโทรศัพท์ / ชื่อที่แสดงในบัญชี Haveno ของผู้ซื้อ XMR
payment.satispay.info.account=ในการใช้ Satispay คุณต้องมีบัญชีธนาคาร (IBAN) ในอิตาลีและลงทะเบียนใช้บริการแล้ว\n\nขีดจำกัดบัญชี Satispay ถูกกำหนดเป็นรายบุคคล หากต้องการซื้อขายจำนวนมากขึ้น คุณต้องติดต่อฝ่ายสนับสนุน Satispay เพื่อเพิ่มขีดจำกัด ผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.satispay.info.buyer=โปรดส่งการชำระเงินไปยังหมายเลขโทรศัพท์มือถือของผู้ขาย XMR ตามที่ระบุใน Haveno เท่านั้น\n\nขีดจำกัดบัญชี Satispay ถูกกำหนดเป็นรายบุคคล หากต้องการซื้อขายจำนวนมากขึ้น คุณต้องติดต่อฝ่ายสนับสนุน Satispay เพื่อเพิ่มขีดจำกัด ผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.satispay.info.seller=โปรดตรวจสอบว่าการชำระเงินของคุณมาจากหมายเลขโทรศัพท์มือถือ / ชื่อของผู้ซื้อ XMR ตามที่ระบุใน Haveno\n\nขีดจำกัดบัญชี Satispay ถูกกำหนดเป็นรายบุคคล หากต้องการซื้อขายจำนวนมากขึ้น คุณต้องติดต่อฝ่ายสนับสนุน Satispay เพื่อเพิ่มขีดจำกัด ผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.tikkie.info.account=ในการใช้ Tikkie คุณต้องมีบัญชีธนาคาร (IBAN) ในเนเธอร์แลนด์และลงทะเบียนใช้บริการแล้ว\n\nเมื่อคุณส่งคำขอชำระเงิน Tikkie ถึงบุคคล คุณขอรับได้สูงสุด €750 ต่อคำขอ Tikkie จำนวนสูงสุดที่ขอได้ภายใน 24 ชั่วโมงคือ €2,500 ต่อบัญชี Tikkie\n\nอย่างไรก็ตาม ธนาคารแต่ละแห่งอาจกำหนดขีดจำกัดของตนเองสำหรับลูกค้าภายในขีดจำกัดเหล่านี้\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.tikkie.info.buyer=โปรดขอลิงก์ชำระเงินจากผู้ขาย XMR ในแชทผู้ซื้อขาย เมื่อผู้ขาย XMR ส่งลิงก์ชำระเงินที่ตรงกับจำนวนเงินของการซื้อขายให้คุณแล้ว จึงดำเนินการชำระเงิน\n\nเมื่อผู้ขาย XMR ขอชำระเงินผ่าน Tikkie จำนวนสูงสุดที่ขอรับได้คือ €750 ต่อคำขอ Tikkie หากการซื้อขายเกินจำนวนนี้ ผู้ขาย XMR จะต้องส่งหลายคำขอให้ครบตามจำนวนของการซื้อขาย จำนวนสูงสุดที่ขอได้ต่อวันคือ €2,500\n\nอย่างไรก็ตาม ธนาคารแต่ละแห่งอาจกำหนดขีดจำกัดของตนเองสำหรับลูกค้าภายในขีดจำกัดเหล่านี้\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.tikkie.info.seller=โปรดส่งลิงก์ชำระเงินให้ผู้ซื้อ XMR ในแชทผู้ซื้อขาย เมื่อผู้ซื้อ XMR ชำระเงินให้คุณแล้ว โปรดตรวจสอบว่ารายละเอียด IBAN ของพวกเขาตรงกับข้อมูลที่มีใน Haveno\n\nเมื่อผู้ขาย XMR ขอชำระเงินผ่าน Tikkie จำนวนสูงสุดที่ขอรับได้คือ €750 ต่อคำขอ Tikkie หากการซื้อขายเกินจำนวนนี้ ผู้ขาย XMR จะต้องส่งหลายคำขอให้ครบตามจำนวนของการซื้อขาย จำนวนสูงสุดที่ขอได้ต่อวันคือ €2,500\n\nอย่างไรก็ตาม ธนาคารแต่ละแห่งอาจกำหนดขีดจำกัดของตนเองสำหรับลูกค้าภายในขีดจำกัดเหล่านี้\n\nผู้ใช้ควรทราบขีดจำกัดของบัญชีด้วย หากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.verse.info.account=Verse เป็นวิธีการชำระเงินหลายสกุลเงินที่ส่งและรับการชำระเงินได้ใน EUR, SEK, HUF, DKK, PLN\n\nเมื่อตั้งค่าบัญชี Verse ใน Haveno โปรดระบุชื่อผู้ใช้ที่ตรงกับชื่อผู้ใช้ในบัญชี Verse ของคุณ เพื่อให้เมื่อคุณส่งเงิน เงินจะแสดงว่ามาจากบัญชีที่ถูกต้อง และเมื่อคุณรับเงิน เงินจะเข้าบัญชีของคุณ\n\nผู้ใช้ Verse ถูกจำกัดการส่งหรือรับที่ €10,000 ต่อปี (หรือเทียบเท่าในสกุลเงินต่างประเทศ) สำหรับยอดสะสมของการชำระเงินที่ส่งจากหรือรับเข้าบัญชีการชำระเงิน Verse สามารถเพิ่มขีดจำกัดนี้ให้ได้เมื่อร้องขอ
payment.verse.info.buyer=โปรดส่งการชำระเงินไปยังชื่อผู้ใช้ที่ผู้ขาย XMR ระบุในบัญชี Haveno เท่านั้น โปรดเว้นคำอธิบายการชำระเงินว่างไว้\n\nผู้ใช้ Verse ถูกจำกัดการส่งหรือรับที่ €10,000 ต่อปี (หรือเทียบเท่าในสกุลเงินต่างประเทศ) สำหรับยอดสะสมของการชำระเงินที่ส่งจากหรือรับเข้าบัญชีการชำระเงิน Verse สามารถเพิ่มขีดจำกัดนี้ให้ได้เมื่อร้องขอ
payment.verse.info.seller=ผู้ขาย XMR จะได้รับการชำระเงินจากชื่อผู้ใช้ที่แสดงในบัญชี Haveno ของผู้ซื้อ XMR\n\nผู้ใช้ Verse ถูกจำกัดการส่งหรือรับที่ €10,000 ต่อปี (หรือเทียบเท่าในสกุลเงินต่างประเทศ) สำหรับยอดสะสมของการชำระเงินที่ส่งจากหรือรับเข้าบัญชีการชำระเงิน Verse สามารถเพิ่มขีดจำกัดนี้ให้ได้เมื่อร้องขอ
payment.achTransfer.info.account=เมื่อเพิ่ม ACH เป็นวิธีการชำระเงินใน Haveno ผู้ใช้ควรทราบค่าใช้จ่ายในการส่งและรับการโอนผ่าน ACH
payment.achTransfer.info.buyer=โปรดตรวจสอบให้แน่ใจว่าคุณทราบค่าใช้จ่ายในการส่งการโอนผ่าน ACH\n\nเมื่อชำระเงิน ให้ส่งไปยังรายละเอียดการชำระเงินที่ระบุในบัญชีของผู้ขาย XMR เท่านั้นโดยใช้การโอนผ่าน ACH
payment.achTransfer.info.seller=โปรดตรวจสอบให้แน่ใจว่าคุณทราบค่าใช้จ่ายในการรับการโอนผ่าน ACH\n\nเมื่อรับการชำระเงิน โปรดตรวจสอบว่ามาจากบัญชีของผู้ซื้อ XMR ในรูปแบบการโอนผ่าน ACH
payment.domesticWire.info.account=เมื่อเพิ่มการโอนเงินในประเทศเป็นวิธีการชำระเงินใน Haveno ผู้ใช้ควรทราบค่าใช้จ่ายในการส่งและรับการโอนเงิน
payment.domesticWire.info.buyer=โปรดตรวจสอบให้แน่ใจว่าคุณทราบค่าใช้จ่ายในการส่งการโอนเงิน\n\nเมื่อชำระเงิน ให้ส่งไปยังรายละเอียดการชำระเงินที่ระบุในบัญชีของผู้ขาย XMR เท่านั้น
payment.domesticWire.info.seller=โปรดตรวจสอบให้แน่ใจว่าคุณทราบค่าใช้จ่ายในการรับการโอนเงิน\n\nเมื่อรับการชำระเงิน โปรดตรวจสอบว่ามาจากบัญชีของผู้ซื้อ XMR
payment.strike.info.account=โปรดระบุชื่อผู้ใช้ Strike ของคุณ\n\nใน Haveno Strike ใช้สำหรับการชำระเงินระหว่างเงินตราด้วยกันเท่านั้น\n\nโปรดตรวจสอบให้แน่ใจว่าคุณทราบขีดจำกัดของ Strike:\n\nผู้ใช้ที่ลงทะเบียนด้วยอีเมล ชื่อ และหมายเลขโทรศัพท์เท่านั้นมีขีดจำกัดดังนี้:\n\n● สูงสุด $100 ต่อการฝาก\n● ยอดฝากรวมสูงสุด $1,000 ต่อสัปดาห์\n● สูงสุด $100 ต่อการชำระเงิน\n\nผู้ใช้สามารถเพิ่มขีดจำกัดได้โดยให้ข้อมูลเพิ่มเติมแก่ Strike ผู้ใช้เหล่านี้มีขีดจำกัดดังนี้:\n\n● สูงสุด $1,000 ต่อการฝาก\n● ยอดฝากรวมสูงสุด $1,000 ต่อสัปดาห์\n● สูงสุด $1,000 ต่อการชำระเงิน\n\nหากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.strike.info.buyer=โปรดส่งการชำระเงินไปยังชื่อผู้ใช้ Strike ของผู้ขาย XMR ตามที่ระบุใน Haveno เท่านั้น\n\nขนาดการซื้อขายสูงสุดคือ $1,000 ต่อการชำระเงิน\n\nหากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.strike.info.seller=โปรดตรวจสอบว่าการชำระเงินของคุณมาจากชื่อผู้ใช้ Strike ของผู้ซื้อ XMR ตามที่ระบุใน Haveno\n\nขนาดการซื้อขายสูงสุดคือ $1,000 ต่อการชำระเงิน\n\nหากคุณซื้อขายเกินขีดจำกัดข้างต้น การซื้อขายอาจถูกยกเลิกและอาจมีบทลงโทษ
payment.transferwiseUsd.info.account=เนื่องจากกฎระเบียบธนาคารของสหรัฐฯ การส่งและรับการชำระเงินเป็น USD มีข้อจำกัดมากกว่าสกุลเงินอื่นส่วนใหญ่ ด้วยเหตุนี้ USD จึงไม่ถูกเพิ่มในวิธีการชำระเงิน Wise ของ Haveno\n\nวิธีการชำระเงิน Wise-USD ช่วยให้ผู้ใช้ Haveno ซื้อขายเป็น USD ได้\n\nทุกคนที่มีบัญชี Wise สามารถเพิ่ม Wise-USD เป็นวิธีการชำระเงินใน Haveno ได้ ซึ่งจะทำให้ซื้อและขาย XMR ด้วย USD ได้\n\nเมื่อซื้อขายบน Haveno ผู้ซื้อ XMR ไม่ควรใส่ข้อความอ้างอิงหรือเหตุผลในการชำระเงินใดๆ หากจำเป็นต้องระบุเหตุผลในการชำระเงิน ให้ใช้เฉพาะชื่อเต็มของเจ้าของบัญชี Wise-USD เท่านั้น
payment.transferwiseUsd.info.buyer=โปรดส่งการชำระเงินไปยังที่อยู่อีเมลในบัญชี Wise-USD บน Haveno ของผู้ขาย XMR เท่านั้น
payment.transferwiseUsd.info.seller=โปรดตรวจสอบว่าการชำระเงินที่ได้รับตรงกับชื่อบัญชี Wise-USD ของผู้ซื้อ XMR ใน Haveno
payment.usPostalMoneyOrder.info=การซื้อขายด้วย US Postal Money Order (USPMO) บน Haveno กำหนดให้คุณต้องเข้าใจสิ่งต่อไปนี้:\n\n- ผู้ซื้อ XMR ต้องเขียนชื่อผู้ขาย XMR ทั้งในช่องผู้จ่ายและผู้รับเงิน และถ่ายรูปความละเอียดสูงของ USPMO และซองจดหมายพร้อมหลักฐานการติดตามก่อนส่ง\n- ผู้ซื้อ XMR ต้องส่ง USPMO ให้ผู้ขาย XMR พร้อมการยืนยันการจัดส่ง\n\nในกรณีที่ต้องไกล่เกลี่ยหรือมีข้อพิพาทในการซื้อขาย คุณจะต้องส่งรูปถ่ายให้ผู้ไกล่เกลี่ยของ Haveno พร้อมหมายเลขซีเรียลของ USPMO หมายเลขที่ทำการไปรษณีย์ และจำนวนเงินดอลลาร์ เพื่อให้ตรวจสอบรายละเอียดบนเว็บไซต์ US Post Office ได้\n\nหากไม่สามารถให้ข้อมูลที่จำเป็นแก่ผู้ไกล่เกลี่ยได้ คุณจะแพ้ข้อพิพาท\n\nในทุกกรณีข้อพิพาท ผู้ส่ง USPMO เป็นผู้รับผิดชอบ 100% ในการแสดงหลักฐาน/ข้อพิสูจน์ต่อผู้ไกล่เกลี่ย\n\nหากคุณไม่เข้าใจข้อกำหนดเหล่านี้ อย่าซื้อขายด้วย USPMO บน Haveno
payment.payByMail.info=การซื้อขายด้วย Pay by Mail บน Haveno กำหนดให้คุณต้องเข้าใจสิ่งต่อไปนี้:\n\n● ผู้ซื้อ XMR ควรบรรจุเงินสดในถุงใส่เงินแบบป้องกันการเปิดแกะ\n● ผู้ซื้อ XMR ควรถ่ายวิดีโอหรือรูปถ่ายความละเอียดสูงของขั้นตอนการบรรจุเงินสด โดยติดที่อยู่และหมายเลขติดตามบนพัสดุแล้ว\n● ผู้ซื้อ XMR ควรส่งพัสดุเงินสดให้ผู้ขาย XMR พร้อมการยืนยันการจัดส่งและประกันที่เหมาะสม\n● ผู้ขาย XMR ควรถ่ายวิดีโอขณะเปิดพัสดุ โดยให้เห็นหมายเลขติดตามที่ผู้ส่งระบุอย่างชัดเจนในวิดีโอ\n● ผู้สร้างข้อเสนอต้องระบุเงื่อนไขพิเศษใดๆ ในช่อง 'ข้อมูลเพิ่มเติม' ของบัญชีการชำระเงิน\n● ผู้รับข้อเสนอถือว่ายอมรับเงื่อนไขของผู้สร้างข้อเสนอเมื่อรับข้อเสนอ\n\nการซื้อขายด้วย Pay by Mail ขึ้นอยู่กับความซื่อสัตย์ของทั้งสองฝ่ายโดยตรง\n\n● การซื้อขายด้วย Pay by Mail มีขั้นตอนที่ตรวจสอบได้น้อยกว่าการซื้อขายแบบดั้งเดิมอื่นๆ ทำให้การจัดการข้อพิพาทยากขึ้นมาก\n● พยายามแก้ไขข้อพิพาทโดยตรงกับคู่ค้าผ่านแชทผู้ซื้อขาย นี่คือทางที่มีโอกาสมากที่สุดในการแก้ไขข้อพิพาท Pay by Mail\n● ผู้ไกล่เกลี่ยสามารถพิจารณากรณีของคุณและให้คำแนะนำได้ แต่ไม่รับประกันว่าจะช่วยได้\n● ผู้ไกล่เกลี่ยจะตัดสินตามหลักฐานที่ได้รับ ดังนั้นโปรดปฏิบัติตามและบันทึกขั้นตอนข้างต้นไว้เป็นหลักฐานในกรณีที่มีข้อพิพาท\n● คำขอเงินคืนสำหรับเงินที่สูญเสียจากการซื้อขายด้วย Pay By Mail จะไม่ได้รับการพิจารณาจาก Haveno\n\nหากคุณไม่เข้าใจข้อกำหนดเหล่านี้ อย่าซื้อขายด้วย Pay by Mail บน Haveno

payment.payByMail.contact=ข้อมูลติดต่อ
payment.payByMail.contact.prompt=ชื่อหรือนามแฝงที่จะจ่าหน้าซองถึง
payment.payByMail.extraInfo.prompt=โปรดระบุในข้อเสนอของคุณ: \n\nประเทศที่คุณอยู่ (เช่น ฝรั่งเศส); \nประเทศ / ภูมิภาคที่คุณยอมรับการซื้อขายด้วย (เช่น ฝรั่งเศส, EU หรือประเทศใดก็ได้ในยุโรป); \nเงื่อนไขพิเศษใดๆ; \nรายละเอียดอื่นๆ
payment.tradingRestrictions=โปรดอ่านเงื่อนไขของผู้สร้าง\nหากคุณไม่ตรงตามข้อกำหนด อย่ารับการซื้อขายนี้
payment.cashAtAtm.info=เงินสดไร้บัตร: ถอนเงินสดที่ตู้ ATM โดยไม่ใช้บัตรด้วยรหัส\n\nวิธีใช้วิธีการชำระเงินนี้:\n\n1. สร้างบัญชีการชำระเงินแบบเงินสดไร้บัตร โดยระบุธนาคาร ภูมิภาค หรือเงื่อนไขอื่นที่คุณยอมรับเพื่อแสดงพร้อมข้อเสนอ\n\n2. สร้างหรือรับข้อเสนอด้วยบัญชีการชำระเงินนี้\n\n3. เมื่อข้อเสนอถูกรับ ให้แชทกับคู่ค้าเพื่อนัดเวลาชำระเงินและแบ่งปันรายละเอียดการชำระเงิน\n\nหากจำนวนซื้อขายเกินขีดจำกัดการถอนเงินสด ผู้ซื้อขายควรแบ่งเป็นหลายธุรกรรม\n\nการซื้อขายเงินสดผ่าน ATM ต้องเป็นจำนวนที่หารด้วย 10 ลงตัว แนะนำให้ใช้ข้อเสนอแบบช่วง เพื่อให้จำนวน XMR ปรับให้ตรงกับราคาได้พอดี\n\nหากคุณไม่สามารถทำธุรกรรมให้เสร็จสิ้นตามที่ระบุในสัญญาการซื้อขาย คุณอาจสูญเสียเงินประกันบางส่วน (หรือทั้งหมด)
payment.cashAtAtm.extraInfo.prompt=โปรดระบุในข้อเสนอของคุณ: \n\nธนาคาร / สถานที่ที่คุณยอมรับ; \nเงื่อนไขพิเศษใดๆ; \nรายละเอียดอื่นๆ
payment.f2f.contact=ข้อมูลติดต่อ
payment.f2f.contact.prompt=คุณต้องการให้คู่ค้าติดต่อคุณอย่างไร (ที่อยู่อีเมล, หมายเลขโทรศัพท์,...)
payment.f2f.city=เมืองสำหรับการประชุมแบบเห็นหน้ากัน
payment.f2f.city.prompt=ชื่อเมืองจะแสดงพร้อมกับข้อเสนอ
