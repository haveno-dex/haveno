payment.swift.info.account=โปรดอ่านแนวทางหลักในการใช้ SWIFT บน Haveno อย่างละเอียด:\n\n- กรอกทุกช่องให้ครบถ้วนและถูกต้อง \n- ผู้ซื้อต้องส่งการชำระเงินในสกุลเงินที่ผู้สร้างข้อเสนอระบุ \n- ผู้ซื้อต้องใช้รูปแบบแบ่งค่าธรรมเนียม (SHA) \n- ผู้ซื้อและผู้ขายอาจถูกเรียกเก็บค่าธรรมเนียม จึงควรตรวจสอบตารางค่าธรรมเนียมของธนาคารล่วงหน้า \n\nSWIFT ซับซ้อนกว่าวิธีการชำระเงินอื่น โปรดสละเวลาอ่านคำแนะนำฉบับเต็มที่ wiki [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT]
payment.swift.info.buyer=ในการซื้อ monero ด้วย SWIFT คุณต้อง:\n\n- ส่งการชำระเงินในสกุลเงินที่ผู้สร้างข้อเสนอระบุ \n- ใช้รูปแบบแบ่งค่าธรรมเนียม (SHA) ในการส่งการชำระเงิน\n\nโปรดอ่านคำแนะนำเพิ่มเติมที่ wiki เพื่อหลีกเลี่ยงบทลงโทษและให้การซื้อขายราบรื่น [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT]
payment.swift.info.seller=ผู้ส่ง SWIFT ต้องใช้รูปแบบแบ่งค่าธรรมเนียม (SHA) ในการส่งการชำระเงิน\n\nหากคุณได้รับการชำระเงิน SWIFT ที่ไม่ได้ใช้ SHA ให้เปิดคำขอไกล่เกลี่ย\n\nโปรดอ่านคำแนะนำเพิ่มเติมที่ wiki เพื่อหลีกเลี่ยงบทลงโทษและให้การซื้อขายราบรื่น [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT]
payment.imps.info.account=โปรดระบุข้อมูลต่อไปนี้ของคุณ:\n\n● ชื่อเต็มของเจ้าของบัญชี\n● หมายเลขบัญชี\n● หมายเลข IFSC\n\nข้อมูลเหล่านี้ต้องตรงกับบัญชีธนาคารที่คุณจะใช้ส่ง / รับการชำระเงิน\n\nโปรดทราบว่าส่งได้สูงสุด Rs. 200,000 ต่อธุรกรรม หากคุณซื้อขายเกินจำนวนนี้จะต้องทำหลายธุรกรรม อย่างไรก็ตาม โปรดทราบว่ามีขีดจำกัดการส่งสูงสุด Rs. 1,000,000 ต่อวัน\n\nธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
payment.imps.info.buyer=โปรดส่งการชำระเงินไปยังรายละเอียดบัญชีที่ระบุใน Haveno เท่านั้น\n\nขนาดการซื้อขายสูงสุดคือ Rs. 200,000 ต่อธุรกรรม\n\nหากการซื้อขายของคุณเกิน Rs. 200,000 คุณจะต้องโอนหลายครั้ง อย่างไรก็ตาม โปรดทราบว่ามีขีดจำกัดการส่งสูงสุด Rs. 1,000,000 ต่อวัน\n\nโปรดทราบว่าธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
payment.imps.info.seller=หากคุณตั้งใจจะรับเงินเกิน Rs. 200,000 ต่อการซื้อขาย ผู้ซื้อจะต้องโอนหลายครั้ง อย่างไรก็ตาม โปรดทราบว่ามีขีดจำกัดการส่งสูงสุด Rs. 1,000,000 ต่อวัน\n\nโปรดทราบว่าธนาคารบางแห่งอาจกำหนดขีดจำกัดสำหรับลูกค้าแตกต่างกัน
