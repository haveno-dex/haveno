popup.warning.tradeLimitDueAccountAgeRestriction.buyer=จำนวนที่อนุญาตให้ซื้อขายถูกจำกัดไว้ที่ {0} เนื่องจากข้อจำกัดด้านความปลอดภัยตามเกณฑ์ต่อไปนี้:\n- บัญชีของคุณยังไม่ได้รับการลงนามโดยผู้ไกล่เกลี่ยหรือคู่ค้า\n- เวลานับตั้งแต่ลงนามบัญชีของคุณยังไม่ถึง 30 วัน\n- วิธีการชำระเงินของข้อเสนอนี้ถือว่ามีความเสี่ยงต่อการเรียกเงินคืนจากธนาคาร\n\n{1}
