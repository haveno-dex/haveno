payment.account.amazonGiftCard.addCountryInfo={0}\nบัญชี Amazon Gift Card ที่มีอยู่ของคุณ ({1}) ไม่ได้ระบุประเทศ\nโปรดป้อนประเทศของ Amazon Gift Card ของคุณเพื่ออัปเดตข้อมูลบัญชี\nการดำเนินการนี้จะไม่ส่งผลต่อสถานะอายุบัญชีของคุณ
