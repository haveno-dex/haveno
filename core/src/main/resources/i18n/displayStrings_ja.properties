payment.payByMail.extraInfo.prompt=オファーに次を記載してください: \n\nお住まいの国（例: フランス）; \n取引を受け付ける国 / 地域（例: フランス、EU、またはヨーロッパのどの国でも）; \n特別な条件; \nその他の詳細。
payment.tradingRestrictions=メイカーの取引条件を確認してください。\n条件を満たさない場合は、このトレードを受け入れないでください。
payment.cashAtAtm.info=カードレス現金: コードを使ってATMでカードなしで引き出し\n\nこの支払い方法を使用するには:\n\n1. カードレス現金の支払いアカウントを作成し、利用可能な銀行、地域、その他の条件をオファーに表示されるよう記載します。\n\n2. その支払いアカウントでオファーを作成または受け入れます。\n\n3. オファーが受け入れられたら、相手とチャットして支払いを完了する時間を調整し、支払い情報を共有します。\n\n取引額が現金引き出しの上限を超える場合は、複数回のトランザクションに分けてください。\n\nATMでの現金取引は10の倍数である必要があります。XMRの金額を正確な価格に合わせて調整できるよう、範囲オファーの使用をおすすめします。\n\nトレード契約で指定されたとおりにトランザクションを完了できない場合、セキュリティデポジットの一部（または全部）を失う可能性があります。
payment.cashAtAtm.extraInfo.prompt=オファーに次を記載してください: \n\n利用可能な銀行 / 場所; \n特別な条件; \nその他の詳細。
