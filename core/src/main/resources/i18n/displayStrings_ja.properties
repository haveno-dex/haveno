payment.amazonGiftCard.upgrade=Amazonギフトカードの支払い方法では国を指定する必要があります。
payment.account.amazonGiftCard.addCountryInfo={0}\n既存のAmazonギフトカードアカウント（{1}）には国が指定されていません。\nアカウントデータを更新するため、Amazonギフトカードの国を入力してください。\nこれはアカウント年齢のステータスに影響しません。
payment.amazonGiftCard.upgrade.headLine=Amazonギフトカードアカウントを更新
payment.swift.info.account=HavenoでSWIFTを使用するための基本ガイドラインをよくご確認ください:\n\n- すべての項目を正確かつ完全に入力してください \n- 買い手はオファーメイカーが指定した通貨で送金する必要があります \n- 買い手は手数料分担モデル（SHA）を使用する必要があります \n- 買い手と売り手の双方に手数料がかかる場合があるため、事前に銀行の手数料表を確認してください \n\nSWIFTは他の支払い方法より複雑なため、wikiの詳しいガイド [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT] をご確認ください。
payment.swift.info.buyer=SWIFTでMoneroを買うには、次が必要です:\n\n- オファーメイカーが指定した通貨で送金する \n- 手数料分担モデル（SHA）を使用して送金する\n\nペナルティを避けてスムーズに取引するために、wikiの詳しいガイド [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT] をご確認ください。
payment.swift.info.seller=SWIFTの送金者は、手数料分担モデル（SHA）を使用して送金する必要があります。\n\nSHAを使用していないSWIFT送金を受け取った場合は、調停チケットを開いてください。\n\nペナルティを避けてスムーズに取引するために、wikiの詳しいガイド [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT] をご確認ください。
payment.imps.info.account=次の情報を必ず含めてください:\n\n● アカウント所有者の氏名\n● 口座番号\n● IFSC番号\n\nこれらの情報は、送金・受け取りに使用する銀行口座と一致している必要があります。\n\n1回のトランザクションで送金できる上限はRs. 200,000です。この金額を超えて取引する場合は、複数回のトランザクションが必要です。ただし、1日に送金できる上限はRs. 1,000,000です。\n\n銀行によっては顧客ごとに異なる上限を設けています。
payment.imps.info.buyer=Havenoで提供された口座情報にのみ送金してください。\n\n1回のトランザクションの取引上限はRs. 200,000です。\n\n取引額がRs. 200,000を超える場合は、複数回に分けて送金する必要があります。ただし、1日に送金できる上限はRs. 1,000,000です。\n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.imps.info.seller=1回の取引でRs. 200,000を超える金額を受け取る場合は、買い手が複数回に分けて送金することを想定してください。ただし、1日に送金できる上限はRs. 1,000,000です。\n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.neft.info.account=次の情報を必ず含めてください:\n\n● アカウント所有者の氏名\n● 口座番号\n● IFSC番号\n\nこれらの情報は、送金・受け取りに使用する銀行口座と一致している必要があります。\n\n1回のトランザクションで送金できる上限はRs. 50,000です。この金額を超えて取引する場合は、複数回のトランザクションが必要です。\n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.neft.info.buyer=Havenoで提供された口座情報にのみ送金してください。\n\n1回のトランザクションの取引上限はRs. 50,000です。\n\n取引額がRs. 50,000を超える場合は、複数回に分けて送金する必要があります。\n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.neft.info.seller=1回の取引でRs. 50,000を超える金額を受け取る場合は、買い手が複数回に分けて送金することを想定してください。\n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.paytm.info.account=PayTMアカウントのメールアドレスまたは電話番号と一致するメールアドレスまたは電話番号を必ず含めてください。 \n\nKYCなしでPayTMアカウントを設定した場合、次の上限があります: \n\n● 1回のトランザクションで送金できるのは最大Rs. 5,000\n● PayTMウォレットに保有できるのは最大Rs. 10,000\n\n1回の取引で5,000を超える金額を取引する場合は、PayTMでKYCを完了する必要があります。KYC済みのユーザーの上限は次のとおりです:\n\n● 1回のトランザクションで送金できるのは最大Rs. 100,000\n● PayTMウォレットに保有できるのは最大Rs. 100,000\n\nアカウントの上限にもご注意ください。PayTMアカウントの上限を超える取引は、複数日にわたって行うか、キャンセルされる可能性があります。
payment.paytm.info.buyer=提供されたメールアドレスまたは電話番号にのみ送金してください。\n\n1回の取引でRs. 5,000を超える金額を取引する場合は、PayTMでKYCを完了する必要があります。\n\nKYCなしの場合、1回のトランザクションで送金できるのはRs. 5,000です。\n\nKYC済みのユーザーは、1回のトランザクションでRs. 100,000を送金できます。
payment.paytm.info.seller=1回の取引でRs. 5,000を超える金額を取引する場合は、PayTMでKYCを完了する必要があります。KYC済みのユーザーの上限は次のとおりです:\n\n● 1回のトランザクションで送金できるのは最大Rs. 100,000\n● PayTMウォレットに保有できるのは最大Rs. 100,000\n\nアカウントの上限にもご注意ください。PayTMウォレットに保有できるのは最大Rs. 100,000のため、定期的にルピーを引き出してください。
payment.rtgs.info.account=RTGSはRs. 200,000以上の大口取引の支払い用です。\n\nRTGSの支払いアカウントを設定する際は、次の情報を必ず含めてください:\n\n● アカウント所有者の氏名\n● 口座番号\n● IFSC番号\n\nこれらの情報は、送金・受け取りに使用する銀行口座と一致している必要があります。\n\n1回のトランザクションで送金できる最低取引額はRs. 200,000です。この金額未満で取引する場合は、取引がキャンセルされるか、両方のトレーダーが別の支払い方法（IMPSやUPIなど）に合意する必要があります。
payment.rtgs.info.buyer=Havenoで提供された口座情報にのみ送金してください。\n\n1回のトランザクションで送金できる最低取引額はRs. 200,000です。この金額未満で取引する場合は、取引がキャンセルされるか、両方のトレーダーが別の支払い方法（IMPSやUPIなど）に合意する必要があります。
payment.rtgs.info.seller=1回のトランザクションで送金できる最低取引額はRs. 200,000です。この金額未満で取引する場合は、取引がキャンセルされるか、両方のトレーダーが別の支払い方法（IMPSやUPIなど）に合意する必要があります。
payment.upi.info.account=UPI IDとも呼ばれる仮想支払いアドレス（VPA）を必ず含めてください。形式はメールIDのように、中央に「@」記号が入ります。例えば、UPI IDは「受取人名@銀行名」や「電話番号@銀行名」のようになります。 \n\nUPIでは1回のトランザクションで送金できる上限はRs. 100,000です。 \n\n1回の取引でRs. 100,000を超える金額を取引する場合は、複数回に分けて送金することになる可能性があります。 \n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.upi.info.buyer=Havenoで提供されたVPA / UPI IDにのみ送金してください。 \n\n1回のトランザクションの取引上限はRs. 100,000です。 \n\n取引額がRs. 100,000を超える場合は、複数回に分けて送金する必要があります。 \n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.upi.info.seller=1回の取引でRs. 100,000を超える金額を受け取る場合は、買い手が複数回に分けて送金することを想定してください。 \n\n銀行によっては顧客ごとに異なる上限を設けていますのでご注意ください。
payment.celpay.info.account=Celsiusアカウントに登録しているメールアドレスを必ず含めてください。これにより、送金時には正しいアカウントから送られたと表示され、受け取り時にはあなたのアカウントに入金されます。\n\nCelPayユーザーは24時間に$2,500（または他の通貨・暗号通貨の相当額）までしか送金できません。\n\nCelPayアカウントの上限を超える取引は、複数日にわたって行うか、キャンセルされる可能性があります。\n\nCelPayは複数のステーブルコインに対応しています:\n\n● USDステーブルコイン; DAI、TrueUSD、USDC、ZUSD、BUSD、GUSD、PAX、USDT (ERC20)\n● CADステーブルコイン; TrueCAD\n● GBPステーブルコイン; TrueGBP\n● HKDステーブルコイン; TrueHKD\n● AUDステーブルコイン; TrueAUD\n\nXMRの買い手は、通貨が一致する任意のステーブルコインをXMRの売り手に送ることができます。
payment.celpay.info.buyer=XMRの売り手が支払いリンクで提供したメールアドレスにのみ送金してください。\n\nCelPayは24時間に$2,500（または他の通貨・暗号通貨の相当額）までしか送金できません。\n\nCelPayアカウントの上限を超える取引は、複数日にわたって行うか、キャンセルされる可能性があります。\n\nCelPayは複数のステーブルコインに対応しています:\n\n● USDステーブルコイン; DAI、TrueUSD、USDC、ZUSD、BUSD、GUSD、PAX、USDT (ERC20)\n● CADステーブルコイン; TrueCAD\n● GBPステーブルコイン; TrueGBP\n● HKDステーブルコイン; TrueHKD\n● AUDステーブルコイン; TrueAUD\n\nXMRの買い手は、通貨が一致する任意のステーブルコインをXMRの売り手に送ることができます。
payment.celpay.info.seller=XMRの売り手は、安全な支払いリンクを通じて支払いを受け取ることになります。メールの支払いリンクに、XMRの買い手が提供したメールアドレスが含まれていることを必ず確認してください。\n\nCelPayユーザーは24時間に$2,500（または他の通貨・暗号通貨の相当額）までしか送金できません。\n\nCelPayアカウントの上限を超える取引は、複数日にわたって行うか、キャンセルされる可能性があります。\n\nCelPayは複数のステーブルコインに対応しています:\n\n● USDステーブルコイン; DAI、TrueUSD、USDC、ZUSD、BUSD、GUSD、PAX、USDT (ERC20)\n● CADステーブルコイン; TrueCAD\n● GBPステーブルコイン; TrueGBP\n● HKDステーブルコイン; TrueHKD\n● AUDステーブルコイン; TrueAUD\n\nXMRの売り手は、通貨が一致する任意のステーブルコインをXMRの買い手から受け取ることになります。XMRの買い手は、通貨が一致する任意のステーブルコインを送ることができます。
payment.celpay.supportedCurrenciesForReceiver=対応通貨（注: 以下の通貨はすべてCelsiusアプリ内で対応しているステーブルコインです。取引は法定通貨ではなくステーブルコインで行われます。）
payment.nequi.info.account=Nequiアカウントに関連付けられた電話番号を必ず含めてください。\n\nNequiアカウントを設定した際の送金上限は、月あたり最大約7,000,000 COPです。\n\n1回の取引で7,000,000 COPを超える金額を取引する場合は、BancolombiaでKYCを完了し、約15,000 COPの手数料を支払う必要があります。その後、すべてのトランザクションに0.4%の税金がかかります。最新の税制を必ずご確認ください。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.nequi.info.buyer=XMRの売り手のHavenoアカウントに記載された電話番号にのみ送金してください。\n\nNequiアカウントを設定した際の送金上限は、月あたり最大約7,000,000 COPです。\n\n1回の取引で7,000,000 COPを超える金額を取引する場合は、BancolombiaでKYCを完了し、約15,000 COPの手数料を支払う必要があります。その後、すべてのトランザクションに0.4%の税金がかかります。最新の税制を必ずご確認ください。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.nequi.info.seller=受け取った支払いが、XMRの買い手のHavenoアカウントに記載された電話番号と一致することを確認してください。\n\nNequiアカウントを設定した際の送金上限は、月あたり最大約7,000,000 COPです。\n\n1回の取引で7,000,000 COPを超える金額を取引する場合は、BancolombiaでKYCを完了し、約15,000 COPの手数料を支払う必要があります。その後、すべてのトランザクションに0.4%の税金がかかります。最新の税制を必ずご確認ください。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.mpesa.info.account=M-Pesaアカウントに登録されている電話番号を必ず入力してください。
payment.mpesa.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載された電話番号宛てにのみ、M-Pesaで送金してください。
payment.mpesa.info.seller=受け取ったM-Pesaの支払いが、XMRの買い手のHavenoアカウントに記載された電話番号と一致することを確認してください。
payment.mercadoPago.info.account=Mercado Pagoアカウントに登録されているメールアドレスまたは電話番号を必ず入力してください。
payment.mercadoPago.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載されたメールアドレスまたは電話番号宛てにのみ、Mercado Pagoで送金してください。
payment.mercadoPago.info.seller=受け取ったMercado Pagoの支払いが、XMRの買い手のHavenoアカウントに記載されたメールアドレスまたは電話番号と一致することを確認してください。
payment.gcash.info.account=GCashアカウントに登録されている電話番号を必ず入力してください。
payment.gcash.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載された電話番号宛てにのみ、GCashで送金してください。
payment.gcash.info.seller=受け取ったGCashの支払いが、XMRの買い手のHavenoアカウントに記載された電話番号と一致することを確認してください。
payment.momo.info.account=MoMoアカウントに登録されている電話番号を必ず入力してください。
payment.momo.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載された電話番号宛てにのみ、MoMoで送金してください。
payment.momo.info.seller=受け取ったMoMoの支払いが、XMRの買い手のHavenoアカウントに記載された電話番号と一致することを確認してください。
payment.spei.info.account=SPEI送金用に銀行口座に登録されているCLABE（18桁の銀行間口座番号）を必ず入力してください。
payment.spei.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載されたCLABE宛てにのみ、SPEIで送金してください。
payment.spei.info.seller=受け取ったSPEIの支払いが、XMRの買い手のHavenoアカウントに記載されたCLABEと一致することを確認してください。
payment.bizum.info.account=Bizumを使用するには、スペインの銀行口座（IBAN）とサービスへの登録が必要です。\n\nBizumは€0.50から€1,000までの取引に使用できます。\n\nBizumで1日に送受信できる上限は€2,000です。\n\nBizumユーザーは月あたり最大150回の操作が可能です。\n\nただし、各銀行は上記の範囲内で顧客ごとに独自の上限を設けている場合があります。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.bizum.info.buyer=Havenoで提供されたXMRの売り手の携帯電話番号にのみ送金してください。\n\n1回の支払いの取引上限は€1,000です。Bizumで1日に送金できる上限は€2,000です。\n\n上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.bizum.info.seller=Havenoで提供されたXMRの買い手の携帯電話番号から支払いが届いていることを確認してください。\n\n1回の支払いの取引上限は€1,000です。Bizumで1日に受け取れる上限は€2,000です。\n\n上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。

payment.blik.info.account=BLIKを使用するには、BLIKに対応したモバイルバンキングアプリを備えたポーランドの銀行口座が必要です。\n\nXMRの買い手はBLIKコードを生成し、取引者チャットでXMRの売り手に送ることで支払います。そのため、支払いを完了するには両方の取引者がオンラインである必要があります。
payment.blik.info.buyer=支払うには、モバイルバンキングアプリでBLIKコードを生成し、取引者チャットでXMRの売り手に送ってください。\n\nBLIKコードの有効期限は2分間のため、コードを生成する前に、売り手が取引者チャットで応答していることを確認してください。
payment.blik.info.seller=XMRの買い手が取引者チャットでBLIKコードを送ってきます。\n\nBLIKコードの有効期限は2分間のため、送られたらすぐにコードを使って支払いを受け取ってください。

payment.vippsMobilePay.info.account=Vipps MobilePayを使用するには、ノルウェー、デンマークまたはフィンランドの携帯電話番号で登録したアカウントが必要です。\n\n国をまたいで支払いを送ることはできないため、両方の取引者が同じ国のアカウントを持っている必要があります。取引通貨はアカウントの国によって決まります。
payment.vippsMobilePay.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.vippsMobilePay.info.seller=VippsまたはMobilePayアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号および名義と一致することを確認してください。

payment.twint.info.account=TWINTを使用するには、スイスの携帯電話番号で登録したアカウントが必要です。\n\nTWINTの支払いはスイスのTWINTアカウント間でのみ送ることができるため、両方の取引者がTWINTを使用する必要があります。取引通貨はCHFです。
payment.twint.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.twint.info.seller=TWINTアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号および名義と一致することを確認してください。

payment.nip.info.account=NIPを使用するには、ナイジェリアの銀行口座、またはOPayやPalmPayなどのモバイルマネーウォレットが必要です。\n\n支払いは、受取人の銀行またはウォレット事業者における10桁の口座番号宛てに、NIP即時銀行振込で送られます。取引通貨はNGNです。
payment.nip.info.buyer=支払いは、XMRの売り手のアカウントに記載された口座番号と銀行またはウォレット宛てにのみ送金し、送金を確定する前に、振込時の名義照会で表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.nip.info.seller=銀行またはウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座番号および名義と一致することを確認してください。

payment.pagoMovil.info.account=Pago Móvilを使用するには、Pago Móvilが有効で、携帯電話番号、cédulaおよび銀行が登録されたベネズエラの銀行口座が必要です。\n\n支払いは、指定された携帯電話番号、cédulaおよび銀行宛てに銀行間振込で送られます。取引通貨はVESです。
payment.pagoMovil.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号、cédulaおよび銀行宛てにのみ送金し、送金を確定する前に、銀行に表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.pagoMovil.info.seller=銀行アプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号、cédulaおよび名義と一致することを確認してください。

payment.qris.info.account=QRIS / BI-FASTを使用するには、即時振込を受け取れるインドネシアの銀行口座または電子ウォレットが必要です。\n\n支払いは、受取人の銀行または電子ウォレットの口座番号宛てにBI-FAST即時振込で送るか、受取人のQRISコードをスキャンして送ります。取引通貨はIDRです。
payment.qris.info.buyer=支払いは、XMRの売り手のアカウントに記載された口座番号と銀行または電子ウォレット宛て、あるいは売り手が取引者チャットで共有したQRISコード宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.qris.info.seller=銀行または電子ウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座番号および名義と一致することを確認してください。

payment.papara.info.account=Papara / FASTを使用するには、Paparaアカウント、または即時振込を受け取れるトルコの銀行口座が必要です。\n\n支払いは、受取人のPapara番号、トルコのIBAN、またはFAST Easy Address（Kolay Adres）の携帯電話番号宛てに送られます。取引通貨はTRYです。
payment.papara.info.buyer=支払いは、XMRの売り手のアカウントに記載された口座番号またはIBANと銀行またはウォレット宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.papara.info.seller=Paparaまたは銀行のアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座情報および名義と一致することを確認してください。

payment.raast.info.account=Raast / Easypaisa / JazzCashを使用するには、即時振込を受け取れるパキスタンの銀行口座またはモバイルウォレットが必要です。\n\n支払いは、受取人のRaast ID（登録済みの携帯電話番号）、ウォレットの携帯電話番号、またはパキスタンのIBAN宛てに送られます。取引通貨はPKRです。
payment.raast.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号またはIBANと銀行またはウォレット宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.raast.info.seller=銀行またはウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座情報および名義と一致することを確認してください。

payment.paynow.info.account=PayNow / FASTを使用するには、即時振込を受け取れるシンガポールの銀行口座または電子ウォレットが必要です。\n\n支払いは、受取人のPayNowプロキシ（登録済みの携帯電話番号またはNRIC/FIN）宛てに送られます。取引通貨はSGDです。
payment.paynow.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号またはNRIC/FINと銀行またはウォレット宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.paynow.info.seller=銀行またはウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座情報および名義と一致することを確認してください。

payment.wero.info.account=Weroを使用するには、ドイツ、フランスまたはベルギーの携帯電話番号を登録したWeroアプリ、または参加銀行のアプリが必要です。\n\n支払いは、受取人の登録済み携帯電話番号宛てに送られます。番号は国際形式（例: +49）で入力します。取引通貨はEURです。
payment.wero.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.wero.info.seller=Weroまたは銀行のアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号および名義と一致することを確認してください。

payment.fps.info.account=FPS（Faster Payment System）を使用するには、香港の銀行口座、またはAlipayHKやWeChat Pay HKなどの電子ウォレットが必要です。\n\n支払いは、受取人のFPSプロキシ（登録済みの携帯電話番号、FPS IDまたはメールアドレス）宛てに送られます。取引通貨はHKDです。
payment.fps.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号、FPS IDまたはメールアドレスと銀行またはウォレット宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.fps.info.seller=銀行またはウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座情報および名義と一致することを確認してください。

payment.duitnow.info.account=DuitNowを使用するには、マレーシアの銀行口座、またはTouch 'n Go、GrabPay、Boostなどの電子ウォレットが必要です。\n\n支払いは、受取人のDuitNowプロキシ（登録済みの携帯電話番号またはNRIC）宛てに送られます。取引通貨はMYRです。
payment.duitnow.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号またはNRICと銀行またはウォレット宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.duitnow.info.seller=銀行またはウォレットのアプリで受け取った支払いが、XMRの買い手のアカウントに記載された口座情報および名義と一致することを確認してください。

payment.mbway.info.account=MB WAYを使用するには、ポルトガルの携帯電話番号で有効化したMB WAYアプリが必要です。\n\n支払いは、受取人の登録済み携帯電話番号宛てに送られます。取引通貨はEURです。
payment.mbway.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.mbway.info.seller=MB WAYアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号および名義と一致することを確認してください。

payment.paypay.accountId=携帯電話番号またはPayPay ID
payment.paypay.info.account=PayPayを使用するには、日本で登録したPayPayアカウントが必要です。\n\nPayPayの支払いはPayPayユーザー間でのみ送ることができるため、両方の取引者がPayPayを使用する必要があります。支払いは、受取人の登録済み携帯電話番号またはPayPay ID宛てに送られます。取引通貨はJPYです。
payment.paypay.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号またはPayPay ID宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.paypay.info.seller=PayPayアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号またはPayPay IDおよび名義と一致することを確認してください。

payment.sbp.info.account=SBP（Faster Payments）送金用に銀行口座に紐づけられている電話番号を必ず入力してください。
payment.sbp.info.buyer=支払いは、XMRの売り手のHavenoアカウントに記載された電話番号宛てにのみ、SBPで送金してください。
payment.sbp.info.seller=受け取ったSBPの支払いが、XMRの買い手のHavenoアカウントに記載された電話番号と一致することを確認してください。

payment.mir.info.account=Mirカード送金を使用するには、カード間送金を受け取れるロシアの銀行カードが必要です。\n\n支払いは、受取人のカード番号宛てに送られます。取引通貨はRUBです。
payment.mir.info.buyer=支払いは、XMRの売り手のアカウントに記載されたカード番号宛てにのみ送金し、送金を確定する前に、銀行アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.mir.info.seller=銀行アプリで受け取った支払いが、XMRの買い手のアカウントに記載されたカード番号および名義と一致することを確認してください。

payment.yoomoney.info.account=YooMoneyを使用するには、ロシアで登録したYooMoneyウォレットが必要です。\n\n支払いは、受取人のウォレット番号宛てに送られます。取引通貨はRUBです。
payment.yoomoney.info.buyer=支払いは、XMRの売り手のアカウントに記載されたウォレット番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.yoomoney.info.seller=YooMoneyウォレットで受け取った支払いが、XMRの買い手のアカウントに記載されたウォレット番号および名義と一致することを確認してください。

payment.ukraineCard.info.account=カード間送金を使用するには、送金を受け取れるウクライナの銀行カード（PrivatBankやMonobankなど）が必要です。\n\n支払いは、受取人のカード番号宛てに送られます。取引通貨はUAHです。
payment.ukraineCard.info.buyer=支払いは、XMRの売り手のアカウントに記載されたカード番号宛てにのみ送金し、送金を確定する前に、銀行アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.ukraineCard.info.seller=銀行アプリで受け取った支払いが、XMRの買い手のアカウントに記載されたカード番号および名義と一致することを確認してください。

payment.kaspi.accountId=携帯電話番号またはカード番号
payment.kaspi.info.account=Kaspiを使用するには、カザフスタンで登録したKaspiアカウントが必要です。\n\n支払いは、受取人の登録済み携帯電話番号またはKaspi Goldのカード番号宛てに送られます。取引通貨はKZTです。
payment.kaspi.info.buyer=支払いは、XMRの売り手のアカウントに記載された携帯電話番号またはカード番号宛てにのみ送金し、送金を確定する前に、アプリに表示される受取人名が売り手のアカウント名義と一致することを確認してください。
payment.kaspi.info.seller=Kaspiアプリで受け取った支払いが、XMRの買い手のアカウントに記載された携帯電話番号またはカード番号および名義と一致することを確認してください。
payment.pix.info.account=選択したPixキーを必ず含めてください。キーには4種類あります: CPF（個人納税者番号）またはCNPJ（法人登録番号）、メールアドレス、電話番号、またはシステムが生成するUUID（汎用一意識別子）と呼ばれるランダムなキーです。Pixアカウントごとに異なるキーを使用する必要があります。個人は所有する各アカウントにつき最大5つのキーを作成できます。\n\nHavenoで取引する際、XMRの買い手は支払いの説明欄にPixキーを記入し、XMRの売り手が自分からの支払いだと識別しやすくしてください。
payment.pix.info.buyer=XMRの売り手のHavenoアカウントに記載されたPixキーにのみ送金してください。\n\nXMRの売り手があなたからの支払いだと識別しやすいように、支払いの参照欄にはあなたのPixキーを使用してください。
payment.pix.info.seller=受け取った支払いの説明が、XMRの買い手のHavenoアカウントに記載されたPixキーと一致することを確認してください。
payment.pix.key=Pixキー（CPF、CNPJ、メール、電話番号またはUUID）
payment.monese.info.account=MoneseはGBP、EUR、RON*のユーザー向けの銀行アプリです。Moneseでは、対応通貨であれば他のMoneseアカウントに即時かつ無料で送金できます。\n\n*MoneseでRONアカウントを開設するには、ルーマニアに居住しているか、ルーマニア国籍を持っている必要があります。\n\nHavenoでMoneseアカウントを設定する際は、Moneseアカウントと一致する名前と電話番号を必ず含めてください。これにより、送金時には正しいアカウントから送られたと表示され、受け取り時にはあなたのアカウントに入金されます。
payment.monese.info.buyer=XMRの売り手のHavenoアカウントに記載された電話番号にのみ送金してください。支払いの説明欄は空欄のままにしてください。
payment.monese.info.seller=XMRの売り手は、XMRの買い手のHavenoアカウントに表示されている電話番号 / 名前から支払いを受け取ることになります。
payment.satispay.info.account=Satispayを使用するには、イタリアの銀行口座（IBAN）とサービスへの登録が必要です。\n\nSatispayアカウントの上限は個別に設定されます。より大きな金額を取引したい場合は、Satispayのサポートに連絡して上限を引き上げる必要があります。アカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.satispay.info.buyer=Havenoで提供されたXMRの売り手の携帯電話番号にのみ送金してください。\n\nSatispayアカウントの上限は個別に設定されます。より大きな金額を取引したい場合は、Satispayのサポートに連絡して上限を引き上げる必要があります。アカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.satispay.info.seller=Havenoで提供されたXMRの買い手の携帯電話番号 / 名前から支払いが届いていることを確認してください。\n\nSatispayアカウントの上限は個別に設定されます。より大きな金額を取引したい場合は、Satispayのサポートに連絡して上限を引き上げる必要があります。アカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.tikkie.info.account=Tikkieを使用するには、オランダの銀行口座（IBAN）とサービスへの登録が必要です。\n\n個人にTikkieの支払いリクエストを送る場合、1回のリクエストで受け取れるのは最大€750です。24時間以内にリクエストできる上限は、Tikkieアカウントごとに€2,500です。\n\nただし、各銀行はこの範囲内で顧客ごとに独自の上限を設けている場合があります。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.tikkie.info.buyer=トレーダーチャットでXMRの売り手に支払いリンクをリクエストしてください。XMRの売り手から取引額と一致する支払いリンクが届いたら、支払いに進んでください。\n\nXMRの売り手がTikkieの支払いをリクエストする場合、1回のリクエストで受け取れるのは最大€750です。取引額がそれを超える場合、XMRの売り手は取引額に達するまで複数回リクエストを送る必要があります。1日にリクエストできる上限は€2,500です。\n\nただし、各銀行はこの範囲内で顧客ごとに独自の上限を設けている場合があります。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.tikkie.info.seller=トレーダーチャットでXMRの買い手に支払いリンクを送ってください。XMRの買い手から支払いが届いたら、そのIBANの情報がHavenoに登録されている情報と一致することを確認してください。\n\nXMRの売り手がTikkieの支払いをリクエストする場合、1回のリクエストで受け取れるのは最大€750です。取引額がそれを超える場合、XMRの売り手は取引額に達するまで複数回リクエストを送る必要があります。1日にリクエストできる上限は€2,500です。\n\nただし、各銀行はこの範囲内で顧客ごとに独自の上限を設けている場合があります。\n\nアカウントの上限にもご注意ください。上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.verse.info.account=Verseは、EUR、SEK、HUF、DKK、PLNで送受金できる複数通貨対応の支払い方法です。\n\nHavenoでVerseアカウントを設定する際は、Verseアカウントのユーザー名と一致するユーザー名を必ず含めてください。これにより、送金時には正しいアカウントから送られたと表示され、受け取り時にはあなたのアカウントに入金されます。\n\nVerseユーザーは、支払いアカウントからの送金と受け取りの累計で、年間€10,000（または外貨の相当額）までに制限されています。この上限はリクエストによりVerseが引き上げることができます。
payment.verse.info.buyer=XMRの売り手のHavenoアカウントに記載されたユーザー名にのみ送金してください。支払いの説明欄は空欄のままにしてください。\n\nVerseユーザーは、支払いアカウントからの送金と受け取りの累計で、年間€10,000（または外貨の相当額）までに制限されています。この上限はリクエストによりVerseが引き上げることができます。
payment.verse.info.seller=XMRの売り手は、XMRの買い手のHavenoアカウントに表示されているユーザー名から支払いを受け取ることになります。\n\nVerseユーザーは、支払いアカウントからの送金と受け取りの累計で、年間€10,000（または外貨の相当額）までに制限されています。この上限はリクエストによりVerseが引き上げることができます。
payment.achTransfer.info.account=HavenoでACHを支払い方法として追加する際は、ACH送金の送受信にかかる費用を事前に確認してください。
payment.achTransfer.info.buyer=ACH送金の送信にかかる費用を事前に確認してください。\n\n支払いの際は、XMRの売り手のアカウントに記載された支払い情報にのみACH送金で送金してください。
payment.achTransfer.info.seller=ACH送金の受け取りにかかる費用を事前に確認してください。\n\n支払いを受け取る際は、XMRの買い手のアカウントからACH送金で届いていることを確認してください。
payment.domesticWire.info.account=Havenoで国内電信送金を支払い方法として追加する際は、電信送金の送受信にかかる費用を事前に確認してください。
payment.domesticWire.info.buyer=電信送金の送信にかかる費用を事前に確認してください。\n\n支払いの際は、XMRの売り手のアカウントに記載された支払い情報にのみ送金してください。
payment.domesticWire.info.seller=電信送金の受け取りにかかる費用を事前に確認してください。\n\n支払いを受け取る際は、XMRの買い手のアカウントから届いていることを確認してください。
payment.strike.info.account=Strikeのユーザー名を必ず含めてください。\n\nHavenoでは、Strikeは法定通貨間の支払いにのみ使用されます。\n\nStrikeの上限を必ずご確認ください:\n\nメール、名前、電話番号のみで登録したユーザーの上限は次のとおりです:\n\n● 1回の入金につき最大$100\n● 週あたりの入金合計は最大$1,000\n● 1回の支払いにつき最大$100\n\nStrikeに追加情報を提供すると上限を引き上げられます。その場合の上限は次のとおりです:\n\n● 1回の入金につき最大$1,000\n● 週あたりの入金合計は最大$1,000\n● 1回の支払いにつき最大$1,000\n\n上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.strike.info.buyer=Havenoで提供されたXMRの売り手のStrikeユーザー名にのみ送金してください。\n\n1回の支払いの取引上限は$1,000です。\n\n上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.strike.info.seller=Havenoで提供されたXMRの買い手のStrikeユーザー名から支払いが届いていることを確認してください。\n\n1回の支払いの取引上限は$1,000です。\n\n上記の上限を超えて取引した場合、取引がキャンセルされ、ペナルティが課される可能性があります。
payment.transferwiseUsd.info.account=米国の銀行規制により、USDの送受金には他のほとんどの通貨よりも多くの制限があります。このため、USDはHavenoのWise支払い方法には追加されていません。\n\nWise-USD支払い方法を使うと、HavenoユーザーはUSDで取引できます。\n\nWise（旧TransferWise）アカウントを持っている人は誰でも、HavenoでWise-USDを支払い方法として追加できます。これによりUSDでXMRを売買できます。\n\nHavenoで取引する際、XMRの買い手は支払い理由の参照欄を使用しないでください。支払い理由が必須の場合は、Wise-USDアカウント所有者の氏名のみを使用してください。
payment.transferwiseUsd.info.buyer=XMRの売り手のHaveno Wise-USDアカウントに記載されたメールアドレスにのみ送金してください。
payment.transferwiseUsd.info.seller=受け取った支払いが、HavenoのWise-USDアカウントに記載されたXMRの買い手の名前と一致することを確認してください。

payment.usPostalMoneyOrder.info=Havenoでアメリカ合衆国郵便為替（USPMO）をトレードするには、以下を理解する必要があります：\n\n-送る前に、XMR買い手は必ずXMR売り手の名前を支払人そして支払先フィールド両方に書いて、追跡証明も含めるUSPMOそして封筒の高解像度写真を取る必要があります。\n-XMR買い手は必ず配達確認を利用してXMR売り手にUSPMOを送る必要があります。\n\n調停が必要になる場合、あるいはトレード係争が開始される場合、調停者や調停人がアメリカ合衆国郵便のサイトで詳細を確認できるように、取った写真、USPMOシリアル番号、郵便局番号、そしてドル金額を送る必要があります。\n\n調停者や調停人に必要な情報を提供しなければ、係争で不利な裁定を下されます。\n\n全ての係争には、調停者や調停人に証明を提供するのは100%USPMO送付者の責任です。\n\n以上の条件を理解しない場合、HavenoでUSPMOのトレードをしないで下さい。

payment.payByMail.info=Havenoを利用したPay by Mailでの取引には、以下を理解する必要があります：\n\
  ● XMRの買い手は現金を封がれた袋に入れる必要があります。\n\
  ● XMRの買い手は、送り先の住所とトラッキング番号が包装に貼られた状態で、現金の包装プロセスをビデオ撮影したり、高解像度の写真を撮影する必要があります。\n\
  ● XMRの買い手は、配達確認と適切な保険をつけて、現金のパッケージをXMRの売り手に送らなければなりません。\n\
  ● XMRの売り手は、パッケージを開封する様子をビデオに撮影し、送り手が提供したトラッキング番号がビデオで見えるようにする必要があります。\n\
  ● オファーの作成者は、支払いアカウントの「追加情報」フィールドに特別な条件を記述する必要があります。\n\
  ● オファーを受けることで、オファーの作成者の条件に同意するものとします。\n\
  \n\
  Pay by Mail取引は、正直に行動する責任を両者に完全に負わせます。\n\
  \n\
  ● 他の伝統的な取引に比べて、Pay by Mail取引には検証可能なアクションが少ないため、紛争の処理が難しくなります。\n\
  ● 紛争は直接取引者同士でトレーダーチャットを使用して解決しようとしてください。これがPay by Mail紛争を解決するための最も有望な方法です。\n\
  ● 仲裁人はあなたのケースを考慮し提案することができますが、彼らが助けることを保証するものではありません。\n\
  ● 仲裁人は彼らに提供された証拠に基づいて判断を下します。したがって、紛争の場合は上記のプロセスに従い、証拠を取ってください。\n\
  ● Pay By Mail取引によって失われた資金の払い戻しリクエストはHavenoでは考慮されません。\n\
  \n\
  これらの要件が理解できない場合は、HavenoでのPay by Mail取引を行わないでください。


