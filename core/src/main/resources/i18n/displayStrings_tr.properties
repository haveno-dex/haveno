payment.swift.info.account=Haveno'da SWIFT kullanımı için temel yönergeleri dikkatlice inceleyin:\n\
\n\
- tüm alanları eksiksiz ve doğru şekilde doldurun \n\
- alıcı, ödeme yapanın belirttiği para biriminde ödeme yapmalıdır \n\
- alıcı, paylaşılan ücret modeli (SHA) kullanarak ödeme yapmalıdır \n\
- alıcı ve satıcı ücretlerle karşılaşabilir, bu yüzden bankalarının ücret tarifelerini önceden kontrol etmelidirler \n\
\n\
SWIFT, diğer ödeme yöntemlerinden daha karmaşıktır, bu yüzden lütfen wiki'deki tam rehberi inceleyin [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].

payment.swift.info.buyer=SWIFT ile monero satın almak için şunları yapmalısınız:\n\
\n\
- ödeme yapanın belirttiği para biriminde ödeme yapın \n\
- ödeme göndermek için paylaşılan ücret modeli (SHA) kullanın\n\
\n\
Ceza almamak ve sorunsuz ticaretler yapmak için lütfen wiki'deki daha fazla rehberi inceleyin [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].

payment.swift.info.seller=SWIFT gönderenler, ödemeleri göndermek için paylaşılan ücret modeli (SHA) kullanmak zorundadır.\n\
\n\
SHA kullanmayan bir SWIFT ödemesi alırsanız, bir arabuluculuk bileti açın.\n\
\n\
Ceza almamak ve sorunsuz ticaretler yapmak için lütfen wiki'deki daha fazla rehberi inceleyin [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/SWIFT].

payment.imps.info.account=Lütfen şunları dahil ettiğinizden emin olun:\n\n\
  ● Hesap sahibi tam adı\n\
  ● Hesap numarası\n\
  ● IFSC numarası\n\n\
Bu detaylar, ödeme gönderip alacağınız banka hesabınızla eşleşmelidir.\n\n\
Bir işlemde gönderilebilecek maksimum miktarın Rs. 200.000 olduğunu unutmayın. Bu miktarın üzerindeki işlemler için birden fazla işlem gerekecektir. Ancak, günde maksimum Rs. 1.000.000 gönderilebileceğini unutmayın.\n\n\
Bazı bankaların müşterileri için farklı limitleri vardır.
payment.imps.info.buyer=Lütfen yalnızca Haveno'da sağlanan hesap bilgilerine ödeme gönderin.\n\n\
Maksimum ticaret boyutu işlem başına Rs. 200.000'dir.\n\n\
Ticaretiniz Rs. 200.000'den fazla ise birden fazla transfer yapmanız gerekecektir. Ancak, günde maksimum Rs. 1.000.000 gönderilebileceğini unutmayın.\n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.
payment.imps.info.seller=Bir ticarette Rs. 200.000'den fazla almayı planlıyorsanız, alıcının birden fazla transfer yapması gerektiğini beklemelisiniz. Ancak, günde maksimum Rs. 1.000.000 gönderilebileceğini unutmayın.\n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.

payment.neft.info.account=Lütfen şunları dahil ettiğinizden emin olun:\n\n\
  ● Hesap sahibi tam adı\n\
  ● Hesap numarası\n\
  ● IFSC numarası\n\n\
Bu detaylar, ödeme gönderip alacağınız banka hesabınızla eşleşmelidir.\n\n\
Bir işlemde gönderilebilecek maksimum miktarın Rs. 50.000 olduğunu unutmayın. Bu miktarın üzerindeki işlemler için birden fazla işlem gerekecektir.\n\n\
Bazı bankaların müşterileri için farklı limitleri vardır.
payment.neft.info.buyer=Lütfen yalnızca Haveno'da sağlanan hesap bilgilerine ödeme gönderin.\n\n\
Maksimum ticaret boyutu işlem başına Rs. 50.000'dir.\n\n\
Ticaretiniz Rs. 50.000'den fazla ise birden fazla transfer yapmanız gerekecektir.\n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.
payment.neft.info.seller=Bir ticarette Rs. 50.000'den fazla almayı planlıyorsanız, alıcının birden fazla transfer yapması gerektiğini beklemelisiniz.\n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.

payment.paytm.info.account=PayTM hesabınızdaki e-posta veya telefon numaranızla eşleşen e-posta veya telefon numaranızı girdiğinizden emin olun. \n\n\
KYC'siz bir PayTM hesabı kuran kullanıcılar şu sınırlamalara tabidir: \n\n\
  ● İşlem başına maksimum 5.000 Rs gönderilebilir.\n\
  ● Birinin PayTM cüzdanında maksimum 10.000 Rs tutulabilir.\n\n\
Ticaret başına 5.000 Rs üzeri bir miktar ticareti yapmak istiyorsanız, PayTM ile KYC işlemini tamamlamanız gerekecektir. KYC ile kullanıcılar şu sınırlamalara tabidir:\n\n\
  ● İşlem başına maksimum 100.000 Rs gönderilebilir.\n\
  ● Birinin PayTM cüzdanında maksimum 100.000 Rs tutulabilir.\n\n\
Kullanıcıların hesap limitlerinin de farkında olması gerekir. PayTM hesap limitlerinin üzerindeki ticaretler muhtemelen birden fazla günde gerçekleştirilmeli veya iptal edilmelidir.
payment.paytm.info.buyer=Lütfen yalnızca sağlanan e-posta adresine veya telefon numarasına ödeme gönderin.\n\n\
Ticaret başına 5.000 Rs üzeri bir miktar ticareti yapmak istiyorsanız, PayTM ile KYC işlemini tamamlamanız gerekecektir.\n\n\
KYC olmadan işlem başına 5.000 Rs gönderilebilir.\n\n\
KYC ile kullanıcılar işlem başına 100.000 Rs gönderebilir.
payment.paytm.info.seller=Ticaret başına 5.000 Rs üzeri bir miktar ticareti yapmak istiyorsanız, PayTM ile KYC işlemini tamamlamanız gerekecektir. KYC ile kullanıcılar şu sınırlamalara tabidir:\n\n\
  ● İşlem başına maksimum 100.000 Rs gönderilebilir.\n\
  ● PayTM cüzdanınızda maksimum 100.000 Rs tutulabilir.\n\n\
Kullanıcıların hesap limitlerinin de farkında olması gerekir. PayTM cüzdanınızda maksimum 100.000 Rs tutulabileceği için lütfen düzenli olarak rupee transferi yapın.

payment.rtgs.info.account=RTGS, Rs. 200.000 veya üzeri büyük işlemler için kullanılır.\n\n\
RTGS ödeme hesabınızı kurarken lütfen şunları dahil ettiğinizden emin olun:\n\n\
  ● Hesap sahibi tam adı\n\
  ● Hesap numarası\n\
  ● IFSC numarası\n\n\
Bu detaylar, ödeme gönderip alacağınız banka hesabınızla eşleşmelidir.\n\n\
İşlem başına gönderilebilecek minimum ticaret tutarının 200.000 Rs olduğunu unutmayın. Bu miktarın altındaki işlemler ya iptal edilir ya da her iki tüccarın başka bir ödeme yöntemi (örneğin IMPS veya UPI) üzerinde anlaşması gerekir.
payment.rtgs.info.buyer=Lütfen yalnızca Haveno'da sağlanan hesap bilgilerine ödeme gönderin.\n\n\
İşlem başına gönderilebilecek minimum ticaret tutarının 200.000 Rs olduğunu unutmayın. Bu miktarın altındaki işlemler ya iptal edilir ya da her iki tüccarın başka bir ödeme yöntemi (örneğin IMPS veya UPI) üzerinde anlaşması gerekir.
payment.rtgs.info.seller=İşlem başına gönderilebilecek minimum ticaret tutarının 200.000 Rs olduğunu unutmayın. Bu miktarın altındaki işlemler ya iptal edilir ya da her iki tüccarın başka bir ödeme yöntemi (örneğin IMPS veya UPI) üzerinde anlaşması gerekir.

payment.upi.info.account=Lütfen Sanal Ödeme Adresinizi (VPA) veya UPI ID'nizi eklediğinizden emin olun. Bu, ortasında “@” işareti bulunan bir e-posta kimliği gibi formatlanmıştır. Örneğin, UPI kimliğiniz “alıcı_adı@banka_adı” veya “telefon_numarası@banka_adı” olabilir. \n\n\
UPI için işlem başına gönderilebilecek maksimum limitin 100.000 Rs olduğunu unutmayın. \n\n\
Ticaret başına 100.000 Rs üzeri bir miktar ticareti yapmak istiyorsanız, işlemlerin muhtemelen birden fazla transferde gerçekleşeceğini unutmayın. \n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.
payment.upi.info.buyer=Lütfen yalnızca Haveno'da sağlanan VPA / UPI ID'ye ödeme gönderin. \n\n\
İşlem başına maksimum ticaret boyutu 100.000 Rs'dir. \n\n\
Ticaretiniz 100.000 Rs üzerinde ise birden fazla transfer yapmanız gerekecektir. \n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.
payment.upi.info.seller=Ticaret başına 100.000 Rs üzerinde almak istiyorsanız, alıcının birden fazla transfer yapmasını beklemelisiniz. \n\n\
Bazı bankaların müşterileri için farklı limitleri olduğunu unutmayın.

payment.celpay.info.account=Lütfen Celcius hesabınıza kayıtlı e-postayı eklediğinizden emin olun. \
  Bu, fon gönderdiğinizde doğru hesaptan görüneceğini ve fon aldığınızda hesabınıza kredilendirileceğini sağlar.\n\n\
CelPay kullanıcıları 24 saat içinde $2,500 (veya diğer para birimi/kripto eşdeğeri) gönderme ile sınırlıdır.\n\n\
CelPay hesap limitlerinin üzerindeki ticaretler muhtemelen birden fazla günde gerçekleştirilmeli veya iptal edilmelidir.\n\n\
CelPay, birden fazla stablecoin'i destekler:\n\n\
  ● USD Stablecoin'ler; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n\
  ● CAD Stablecoin'ler; TrueCAD\n\
  ● GBP Stablecoin'ler; TrueGBP\n\
  ● HKD Stablecoin'ler; TrueHKD\n\
  ● AUD Stablecoin'ler; TrueAUD\n\n\
XMR Alıcılar, XMR Satıcısına eşleşen herhangi bir para birimi stablecoin gönderebilir.
payment.celpay.info.buyer=Lütfen yalnızca XMR Satıcısı tarafından sağlanan e-posta adresine bir ödeme bağlantısı göndererek ödeme yapın.\n\n\
CelPay, 24 saat içinde $2,500 (veya diğer para birimi/kripto eşdeğeri) gönderme ile sınırlıdır.\n\n\
CelPay hesap limitlerinin üzerindeki ticaretler muhtemelen birden fazla günde gerçekleştirilmeli veya iptal edilmelidir.\n\n\
CelPay, birden fazla stablecoin'i destekler:\n\n\
  ● USD Stablecoin'ler; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n\
  ● CAD Stablecoin'ler; TrueCAD\n\
  ● GBP Stablecoin'ler; TrueGBP\n\
  ● HKD Stablecoin'ler; TrueHKD\n\
  ● AUD Stablecoin'ler; TrueAUD\n\n\
XMR Alıcılar, XMR Satıcısına eşleşen herhangi bir para birimi stablecoin gönderebilir.
payment.celpay.info.seller=XMR Satıcıları, güvenli bir ödeme bağlantısı aracılığıyla ödeme almayı beklemelidir. \
  Lütfen e-posta ödeme bağlantısının XMR Alıcısı tarafından sağlanan e-posta adresini içerdiğinden emin olun.\n\n\
CelPay kullanıcıları 24 saat içinde $2,500 (veya diğer para birimi/kripto eşdeğeri) gönderme ile sınırlıdır.\n\n\
CelPay hesap limitlerinin üzerindeki ticaretler muhtemelen birden fazla günde gerçekleştirilmeli veya iptal edilmelidir.\n\n\
CelPay, birden fazla stablecoin'i destekler:\n\n\
  ● USD Stablecoin'ler; DAI, TrueUSD, USDC, ZUSD, BUSD, GUSD, PAX, USDT (ERC20)\n\
  ● CAD Stablecoin'ler; TrueCAD\n\
  ● GBP Stablecoin'ler; TrueGBP\n\
  ● HKD Stablecoin'ler; TrueHKD\n\
  ● AUD Stablecoin'ler; TrueAUD\n\n\
