payment.celpay.supportedCurrenciesForReceiver=Desteklenen para birimleri (lütfen dikkat edin: aşağıdaki tüm para birimleri Celcius uygulaması içinde desteklenen stablecoin'lerdir. Ticaretler stablecoin'ler içindir, fiat değil.)

payment.nequi.info.account=Nequi hesabınızla ilişkilendirilen telefon numaranızı eklediğinizden emin olun.\n\n\
  Kullanıcılar bir Nequi hesabı kurduklarında, ödeme limitleri ayda maksimum ~ 7,000,000 COP olarak belirlenir.\n\n\
  Tek seferde 7,000,000 COP'dan fazla işlem yapmak istiyorsanız, Bancolombia ile KYC tamamlamanız ve yaklaşık 15,000 COP \
  tutarında bir ücret ödemeniz gerekecek. Bundan sonra, tüm işlemler %0,4 vergiye tabi olacaktır. Lütfen en son vergilerden haberdar olduğunuzdan emin olun.\n\n\
  Kullanıcılar ayrıca hesap limitlerinin farkında olmalıdır. Yukarıdaki limitleri aşarsanız, işleminiz iptal edilebilir ve ceza uygulanabilir.
payment.nequi.info.buyer=Lütfen ödemeyi yalnızca XMR Satıcısının Haveno hesabında belirtilen telefon numarasına gönderin.\n\n\
  Kullanıcılar bir Nequi hesabı kurduklarında, ödeme limitleri ayda maksimum ~ 7,000,000 COP olarak belirlenir.\n\n\
  Tek seferde 7,000,000 COP'dan fazla işlem yapmak istiyorsanız, Bancolombia ile KYC tamamlamanız ve yaklaşık 15,000 COP \
  tutarında bir ücret ödemeniz gerekecek. Bundan sonra, tüm işlemler %0,4 vergiye tabi olacaktır. Lütfen en son vergilerden haberdar olduğunuzdan emin olun.\n\n\
  Kullanıcılar ayrıca hesap limitlerinin farkında olmalıdır. Yukarıdaki limitleri aşarsanız, işleminiz iptal edilebilir ve ceza uygulanabilir.
