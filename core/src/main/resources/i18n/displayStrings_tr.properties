payment.tikkie.info.account=Tikkie kullanmak için Hollanda'da bir banka hesabına (IBAN) sahip olmanız ve hizmete kayıtlı olmanız gerekmektedir.\n\n\
Bir kişiye Tikkie ödeme talebi gönderdiğinizde, talep başına maksimum €750 talep edebilirsiniz.\n\n\
  Tikkie hesabı başına 24 saat içinde talep edebileceğiniz maksimum miktar €2,500'dır.\n\n\
  Ancak, her banka bu limitler dahilinde müşterileri için kendi limitlerini belirleyebilir.\n\n\
  Kullanıcılar ayrıca hesap limitlerinin farkında olmalıdır. Eğer yukarıdaki limitleri aşarsanız, işleminiz iptal edilebilir ve ceza uygulanabilir.
payment.tikkie.info.buyer=Lütfen işlem sohbetinde XMR Satıcısından bir ödeme bağlantısı talep edin. XMR Satıcısı size \
  işlemin doğru tutarına uygun bir ödeme bağlantısı gönderdikten sonra ödeme işlemine devam edin.\n\n\
  XMR Satıcısı bir Tikkie ödemesi talep ettiğinde, talep başına maksimum €750 talep edebilir. Eğer \
  işlem bu tutarın üzerindeyse, XMR Satıcısının işlem tutarını tamamlamak için birden fazla talepte bulunması gerekecektir. Bir günde \
  talep edebileceğiniz maksimum miktar €2,500'dır.\n\n\
  Ancak, her banka bu limitler dahilinde müşterileri için kendi limitlerini belirleyebilir.\n\n\
  Kullanıcılar ayrıca hesap limitlerinin farkında olmalıdır. Eğer yukarıdaki limitleri aşarsanız, işleminiz iptal edilebilir ve ceza uygulanabilir.
payment.tikkie.info.seller=Lütfen işlem sohbetinde XMR Alıcısına bir ödeme bağlantısı gönderin. XMR \
  Alıcısı size ödeme gönderdikten sonra, IBAN bilgilerinin Haveno'da belirtilen bilgilerle eşleştiğini kontrol edin.\n\n\
  XMR Satıcısı bir Tikkie ödemesi talep ettiğinde, talep başına maksimum €750 talep edebilir. Eğer \
  işlem bu tutarın üzerindeyse, XMR Satıcısının işlem tutarını tamamlamak için birden fazla talepte bulunması gerekecektir. Bir günde \
  talep edebileceğiniz maksimum miktar €2,500'dır.\n\n\
  Ancak, her banka bu limitler dahilinde müşterileri için kendi limitlerini belirleyebilir.\n\n\
  Kullanıcılar ayrıca hesap limitlerinin farkında olmalıdır. Eğer yukarıdaki limitleri aşarsanız, işleminiz iptal edilebilir ve ceza uygulanabilir.

payment.verse.info.account=Verse, EUR, SEK, HUF, DKK ve PLN cinsinden ödeme gönderebilen ve alabilen çoklu para birimi ödeme yöntemidir.\n\n\
  Haveno'da Verse hesabınızı kurarken, Verse hesabınızdaki kullanıcı adınızla eşleşen kullanıcı adınızı eklediğinizden emin olun. \
  Bu, para gönderdiğinizde doğru hesaptan geldiğini ve para aldığınızda hesabınıza kredi olarak işlendiğini \
  sağlayacaktır.\n\n\
  Verse kullanıcıları, ödeme hesaplarından yapılan veya ödeme hesaplarına alınan toplam ödemeler için yılda €10,000 \
  (veya eşdeğer yabancı para tutarı) gönderme veya alma ile sınırlıdır. Bu limit, Verse talep üzerine artırılabilir.
payment.verse.info.buyer=Lütfen ödemeyi yalnızca XMR Satıcısının Haveno hesabında sağladığı kullanıcı adına gönderin. \
  Lütfen ödeme açıklamasını boş bırakın.\n\n\
  Verse kullanıcıları, ödeme hesaplarından yapılan veya ödeme hesaplarına alınan toplam ödemeler için yılda €10,000 \
  (veya eşdeğer yabancı para tutarı) gönderme veya alma ile sınırlıdır. Bu limit, Verse talep üzerine artırılabilir.
payment.verse.info.seller=XMR Satıcıları, ödemenin XMR Alıcısının Haveno hesabında gösterilen kullanıcı adından gelmesini beklemelidir.\n\n\
