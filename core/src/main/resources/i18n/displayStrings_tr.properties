payment.f2f.info='Yüz Yüze' ticaretler farklı kurallara sahiptir ve çevrimiçi işlemlerden farklı riskler içerir.\n\n\
  Başlıca farklar şunlardır:\n\
  ● Ticaret eşleri, sağlanan iletişim bilgilerini kullanarak buluşma yeri ve zamanını paylaşmalıdır.\n\
  ● Ticaret eşleri, laptoplarını getirmeli ve ödeme gönderildi ve ödeme alındı onaylarını buluşma yerinde yapmalıdır.\n\
  ● Eğer yapıcı tarafın özel 'şart ve koşulları' varsa, bunları hesaplarındaki 'Ek bilgi' metin alanında belirtmelidir.\n\
  ● Bir teklifi kabul ederek, kabul eden taraf yapıcı tarafın belirtilen 'şart ve koşullarını' kabul eder.\n\
  ● Anlaşmazlık durumunda, arabulucu veya hakem genellikle buluşmada ne olduğunu kesin delillerle tespit etmek zor olduğu için pek \
  yardımcı olamaz. Bu tür durumlarda XMR fonları süresiz olarak veya ticaret eşleri anlaşmaya varana \
  kadar kilitlenebilir.\n\n\
  'Yüz Yüze' ticaretlerin farklarını tam olarak anladığınızdan emin olmak için lütfen şu adresteki talimatları \
  ve tavsiyeleri okuyun: [HYPERLINK:https://docs.haveno.exchange/overview/payment-methods/F2F]
