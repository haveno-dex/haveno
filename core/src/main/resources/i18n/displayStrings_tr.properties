account.crypto.popup.xmr.msg=Haveno'da XMR ticareti yapmak için aşağıdaki gereksinimi anlamanız gerekmektedir.\n\n\
XMR satıyorsanız, bir anlaşmazlık durumunda arabulucuya veya \
hakeme aşağıdaki bilgileri sağlayabilmeniz gerekmektedir:\n\
- İşlem anahtarı (Tx Anahtarı, Tx Gizli Anahtarı veya Tx Özel Anahtarı)\n\
- İşlem kimliği (Tx Kimliği veya Tx Hash)\n\
- Hedef adres (alıcının adresi)\n\n\
Popüler Monero cüzdanlarında bu bilgilerin nerede bulunacağını öğrenmek için wiki'yi inceleyin [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Proving_payments].\n\
Gerekli işlem verilerini sağlayamamak anlaşmazlıkları kaybetmenize yol açar.\n\n\
Ayrıca Haveno'nun artık XMR işlemlerini otomatik onaylama özelliği sunduğunu, ancak bu özelliği Ayarlar'dan etkinleştirmeniz gerektiğini unutmayın.\n\n\
Otomatik onaylama özelliği hakkında daha fazla bilgi için wiki'yi inceleyin: [HYPERLINK:https://haveno.exchange/wiki/Trading_Monero#Auto-confirming_trades].


