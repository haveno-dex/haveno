Lütfen cüzdanınızdaki mevcut çoklu imza işlemlerinden birini seçin ve \
başarısız ticarette kullanılan yatırma işlemi olarak işaretleyin.\n\n\
Doğru işlemi, ticaret detayları penceresini açarak (listeden ticaret kimliğine tıklayın) \
ve ticaret ücreti ödeme işlem çıktısını, çoklu imza yatırma işlemini (adres 3 ile başlar) \
gördüğünüz sonraki işleme kadar takip ederek bulabilirsiniz. Bu işlem kimliği burada sunulan listede görünmelidir. \
Doğru işlemi bulduğunuzda, burada o işlemi seçin ve devam edin.\n\n\
Bu rahatsızlık için özür dileriz, ancak bu hata durumu çok nadiren gerçekleşmelidir \
ve gelecekte bunu çözmek için daha iyi yollar bulmaya çalışacağız.
