tradeChat.rules=Bu işlemle ilgili olası sorunları çözmek için işlem ortağınızla iletişim kurabilirsiniz.\n\
  Sohbette yanıt vermek zorunlu değildir.\n\
  Bir trader aşağıdaki kurallardan herhangi birini ihlal ederse, uyuşmazlık açın ve durumu arabulucuya bildirin.\n\n\
  Sohbet kuralları:\n\
  \t● Bağlantı göndermeyin (zararlı yazılım riski). İşlem kimliğini ve bir blok gezgininin adını gönderebilirsiniz.\n\
  \t● Seed kelimelerinizi, özel anahtarlarınızı, şifrelerinizi veya diğer hassas bilgilerinizi göndermeyin!\n\
  \t● Haveno dışında işlem yapmaya teşvik etmeyin (güvenlik yok).\n\
  \t● Sosyal mühendislik dolandırıcılık girişimlerinde bulunmayın.\n\
  \t● Bir eş yanıt vermiyorsa ve sohbet yoluyla iletişim kurmak istemiyorsa, kararına saygı gösterin.\n\
  \t● Sohbeti işlemin kapsamı ile sınırlı tutun. Bu sohbet bir mesajlaşma uygulaması veya troll kutusu değildir.\n\
  \t● Sohbeti dostça ve saygılı tutun.


