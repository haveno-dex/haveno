  1. Bankanızın Zelle ile çalışıp çalışmadığını ve nasıl çalıştığını görmek için bu sayfayı kontrol edin: [HYPERLINK:https://www.zellepay.com/get-started]\n\n\
  2. Transfer limitlerinize özellikle dikkat edin—gönderme limitleri bankadan bankaya değişir ve bankalar genellikle ayrı günlük, haftalık ve aylık limitler belirler.\n\n\
  3. Bankanız Zelle ile çalışmıyorsa, Zelle mobil uygulaması aracılığıyla hala kullanabilirsiniz, ancak transfer limitleriniz çok daha düşük olacaktır.\n\n\
  4. Haveno hesabınızda belirtilen isim, Zelle/bank hesabınızdaki isimle EŞLEŞMELİDİR.\n\n\
  Ticaret sözleşmenizde belirtilen şekilde bir Zelle işlemini tamamlayamazsanız, güvenlik depozitonuzun bir kısmını (veya tamamını) kaybedebilirsiniz.\n\n\
  Zelle'in biraz daha yüksek geri ödeme riski nedeniyle, satıcılara, imzasız alıcılarla e-posta veya SMS yoluyla iletişime geçerek Haveno'da belirtilen \
  Zelle hesabına gerçekten sahip olduklarını doğrulamalarını öneririz.
payment.fasterPayments.newRequirements.info=Bazı bankalar, Faster Payments transferleri için alıcının tam adını \
doğrulamaya başladı. Mevcut Faster Payments hesabınız tam bir isim belirtmiyor.\n\n\
  Lütfen gelecekteki {0} alıcılarına tam bir isim sağlamak için Haveno'da Faster Payments hesabınızı yeniden oluşturmayı düşünün.\n\n\
  Hesabı yeniden oluşturduğunuzda, eski hesabınızdaki tam sort kodunu, hesap numarasını ve hesap yaşı doğrulama \
  tuzu değerlerini yeni hesabınıza kopyaladığınızdan emin olun. Bu, mevcut hesabınızın yaşı ve imzalama \
  durumunun korunmasını sağlayacaktır.
payment.fasterPayments.ukSortCode="Birleşik Krallık sort kodu"
payment.moneyGram.info=MoneyGram kullanırken XMR alıcısının, Yetkilendirme numarasını ve makbuzun bir fotoğrafını e-posta ile XMR satıcısına göndermesi gerekir. \
  Makbuz, satıcının tam adını, ülkesini, eyaletini ve miktarını açıkça göstermelidir. Satıcının e-postası ticaret sürecinde alıcıya gösterilecektir.
payment.westernUnion.info=Western Union kullanırken XMR alıcısının, MTCN (izleme numarası) ve makbuzun bir fotoğrafını e-posta ile XMR satıcısına göndermesi gerekir. \
  Makbuz, satıcının tam adını, şehri, ülkeyi ve miktarı açıkça göstermelidir. Satıcının e-postası ticaret sürecinde alıcıya gösterilecektir.
payment.halCash.info=HalCash kullanırken XMR alıcısının, HalCash kodunu mobil telefonundan bir kısa mesaj ile XMR satıcısına göndermesi gerekir.\n\n\
  Lütfen HalCash ile göndermenize izin verilen maksimum miktarı aşmadığınızdan emin olun. \
  Minimum çekim miktarı 10 EUR ve maksimum miktar 600 EUR'dur. Tekrarlanan çekimlerde, \
  alıcı başına günlük 3000 EUR ve aylık 6000 EUR'dur. Lütfen bu limitlerin bankanızın \
  burada belirtilenlerle aynı limitleri kullandığından emin olmak için çapraz kontrol yapın.\n\n\
  Çekim miktarı, ATM'den başka miktarlar çekemeyeceğiniz için 10 EUR'nun katları olmalıdır. \
  Teklif oluşturma ve teklif alma ekranında kullanıcı arayüzü, EUR miktarının doğru olması için XMR miktarını ayarlayacaktır. Piyasa \
  bazlı fiyat kullanamazsınız çünkü EUR miktarı değişen fiyatlarla değişir.\n\n\
  Bir anlaşmazlık durumunda, XMR alıcısının EUR gönderdiğine dair kanıt sunması gerekir.
# suppress inspection "UnusedMessageFormatParameter"
payment.limits.info=Lütfen tüm banka transferlerinin belirli bir miktarda geri ödeme riski taşıdığını unutmayın. Bu riski azaltmak için, \
  Haveno, kullanılan ödeme yönteminin tahmini geri ödeme riski seviyesine dayalı olarak işlem başına limitler belirler.\n\
  \n\
  Bu ödeme yöntemi için, satın alma ve satma işlemlerinde işlem başına limitiniz {2}.\n\
  \n\
  Bu limit yalnızca tek bir işlemin boyutuna uygulanır—istediğiniz kadar işlem yapabilirsiniz.\n\
  \n\
  Daha fazla ayrıntı için wiki sayfasına bakın [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
# suppress inspection "UnusedProperty"
payment.limits.info.withSigning=Geri ödeme riskini sınırlamak için, Haveno, bu ödeme hesabı türü için işlem başına limitler belirler \
  aşağıdaki 2 faktöre dayanır:\n\n\
  1. Ödeme yöntemi için genel geri ödeme riski\n\
  2. Hesap imzalama durumu\n\
  \n\
  Bu ödeme hesabı henüz imzalanmamış, bu nedenle işlem başına satın alma limiti {0} ile sınırlıdır. \
  İmzalamadan sonra, satın alma limitleri şu şekilde artacaktır:\n\
  \n\
  ● İmzalamadan önce ve imzalamadan sonraki 30 gün boyunca, işlem başına satın alma limitiniz {0} olacaktır\n\
  ● İmzalamadan 30 gün sonra, işlem başına satın alma limitiniz {1} olacaktır\n\
  ● İmzalamadan 60 gün sonra, işlem başına satın alma limitiniz {2} olacaktır\n\
  \n\
  Hesap imzalama, satış limitlerini etkilemez. Bir işlemde hemen {2} satabilirsiniz.\n\
  \n\
  Bu limitler yalnızca tek bir işlemin boyutuna uygulanır—istediğiniz kadar işlem yapabilirsiniz. \n\
  \n\
  Daha fazla ayrıntı için wiki sayfasına bakın [HYPERLINK:https://docs.haveno.exchange/overview/account-limits].
  
