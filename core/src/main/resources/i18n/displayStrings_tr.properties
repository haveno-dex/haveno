  Kabul ederseniz, önerilen ödeme işlemini imzalarsınız. \
  Ticaret ortağınız da kabul eder ve imzalarsa, ödeme tamamlanır ve ticaret kapanır.\n\n\
  Bir veya ikiniz de öneriyi reddederseniz, {2} tarihine kadar (blok {3}) \
  hakemle ikinci anlaşmazlık için beklemek zorundasınız. Hakem, tekrar inceleyip bulgularına göre ödeme yapacaktır.\n\n\
  Hakem, çalışmaları için küçük bir ücret (maksimum ücret: tüccarın güvenlik depozitosu) talep edebilir. \
  Her iki tüccarın da arabulucunun önerisini kabul etmesi mutlu yoldur - hakem talep etmek, \
  arabulucunun adil bir ödeme önerisi yapmadığından emin olunması durumunda istisnai durumlar içindir \
  (veya diğer taraf yanıt vermiyorsa).\n\n\
