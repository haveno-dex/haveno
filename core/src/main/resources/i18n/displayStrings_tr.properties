  Haveno'da işlem yaparken, XMR Alıcılarının Pix Anahtarlarını ödeme açıklaması olarak kullanmaları gerekir, böylece XMR Satıcılarının ödemenin kendilerinden geldiğini kolayca tanımlamaları sağlanır.
