  Bu, para gönderdiğinizde doğru hesaptan geldiğini ve para aldığınızda hesabınıza kredi olarak işlendiğini \
  sağlayacaktır.
payment.monese.info.buyer=Lütfen ödemeyi yalnızca XMR Satıcısının Haveno hesabında belirtilen telefon numarasına gönderin. Lütfen ödeme açıklamasını boş bırakın.
